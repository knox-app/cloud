<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Account</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-color: #eeeeee;
            --hover-bg: #f9f9f9;
            --input-border: #dddddd;
            --input-focus: #000000;
            --input-bg: #ffffff;
            --btn-bg: #111111;
            --btn-text: #ffffff;
            --btn-hover: #333333;
            --card-bg: #f9f9f9;
            --avatar-bg: #000000;
            --avatar-text: #ffffff;
            --link-color: #0066cc;
            --modal-overlay-bg: rgba(0, 0, 0, 0.4);
        }

        body.dark {
            --bg-color: #000000;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: #222222;
            --hover-bg: #111111;
            --input-border: #3a3a3a;
            --input-focus: #ffffff;
            --input-bg: #111111;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover: #e0e0e0;
            --card-bg: #111111;
            --avatar-bg: #ffffff;
            --avatar-text: #000000;
            --link-color: #3399ff;
            --modal-overlay-bg: rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container { 
            text-align: center; 
            max-width: 420px; 
            width: 90%; 
            padding: 30px 20px; 
        }
        
        h1 { font-size: 26px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }
        p.subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        
        /* Account List */
        .account-list { text-align: left; margin-bottom: 16px; }
        
        .account-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s ease;
        }

        .account-item:hover { 
            background: var(--hover-bg); 
            transform: translateY(-1px);
        }

        .avatar, .avatar-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            margin-right: 14px;
            flex-shrink: 0;
        }
        
        .avatar {
            background: var(--avatar-bg);
            color: var(--avatar-text);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
        }

        .avatar-img {
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .acc-info { flex-grow: 1; overflow: hidden; }
        .acc-name { 
            font-weight: 600; 
            font-size: 15px; 
            margin: 0 0 2px 0; 
            color: var(--text-primary); 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .acc-email { 
            font-size: 13px; 
            color: var(--text-secondary); 
            margin: 0; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toggle-manual {
            color: var(--link-color);
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
            cursor: pointer;
            font-weight: 500;
        }
        .toggle-manual:hover { text-decoration: underline; }

        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group label {
            position: absolute;
            top: -10px;
            left: 15px;
            background: var(--bg-color);
            padding: 0 5px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text-primary);
        }

        input:focus { border-color: var(--input-focus); }

        .btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover { background: var(--btn-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .hidden { display: none !important; }
        .error-message {
            color: #ff3b30;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 15px;
            text-align: left;
            display: none;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--modal-overlay-bg);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--bg-color);
            color: var(--text-primary);
            padding: 24px;
            border-radius: 20px;
            max-width: 380px;
            width: 85%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--input-border);
        }
        .modal-content h3 { margin-top: 0; font-size: 18px; margin-bottom: 10px; }
        .modal-content p { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }
    </style>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<div class="container">
    <!-- Screen 1: Account Chooser -->
    <div id="chooseScreen">
        <h1 id="screenTitle">Choose an account</h1>
        <p class="subtitle" id="screenSubtitle">Select an account to proceed with subscription options.</p>

        <!-- Saved Accounts List -->
        <div class="account-list" id="accountList"></div>

        <a class="toggle-manual" id="manualToggleBtn">+ Use another account</a>

        <!-- Manual Email Field (Hidden unless toggled or no accounts) -->
        <div id="manualInputContainer" class="hidden">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="manualEmailInput" placeholder="name@example.com" autocomplete="off">
            </div>
            <div id="emailError" class="error-message"></div>
            <button class="btn" id="continueManualBtn">Continue</button>
        </div>
    </div>

    <!-- Screen 2: OTP Verification for Kids Account -->
    <div id="otpScreen" class="hidden">
        <h1>Guardian Verification</h1>
        <p class="subtitle">An approval code has been sent to your Guardian Email (<span id="guardianMasked" style="font-weight: 600;"></span>).</p>

        <div class="input-group">
            <label>Enter 6-digit OTP</label>
            <input type="text" id="otpInput" placeholder="6-digit code" maxlength="6" autocomplete="off">
        </div>
        <div id="otpError" class="error-message"></div>

        <button class="btn" id="verifyOtpBtn">Verify & Proceed</button>
    </div>
</div>

<!-- Modal -->
<div id="customModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3 id="modalTitle">Notice</h3>
        <p id="modalMessage"></p>
        <button class="btn" id="modalOkBtn">OK</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        getDocs, 
        query, 
        where, 
        doc, 
        setDoc, 
        updateDoc, 
        getDoc,
        addDoc,
        serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 1. Primary DB (UARM & ASPX Keys)
    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        projectId: "question-metabase"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 2. Secondary DB (cloud-computer-4891a for Email collection)
    const mailFirebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
        measurementId: "G-QE17C33TMN"
    };
    const mailApp = initializeApp(mailFirebaseConfig, "mailApp");
    const mailDb = getFirestore(mailApp);

    emailjs.init("Yr9MutUoHOEONnFgn");

    const urlParams = new URLSearchParams(window.location.search);
    let session = urlParams.get('session');
    let planId = urlParams.get('type');
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;

    let targetUserData = null;
    let generatedOtp = null;

    // Theme Handling
    const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
    function applyTheme() {
        if (theme === "dark" || theme === "d" || mediaQuery.matches) {
            document.body.classList.add("dark");
        } else {
            document.body.classList.remove("dark");
        }
    }
    applyTheme();

    // Alert Modal Helper
    function showAlert(title, message, onOk = null) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalMessage').innerText = message;
        const modal = document.getElementById('customModal');
        modal.classList.remove('hidden');
        document.getElementById('modalOkBtn').onclick = () => {
            modal.classList.add('hidden');
            if (onOk) onOk();
        };
    }

    // Session Setup
    async function initSession() {
        if (!session) {
            session = Math.floor(1000000000 + Math.random() * 9000000000).toString();
            try {
                await setDoc(doc(db, "ASPX Keys", session), {
                    sessionId: session,
                    createdAt: new Date()
                });
            } catch (err) {
                console.error("Session init failed:", err);
            }
            window.history.replaceState({}, '', `?session=${session}&type=${planId || ''}${theme ? '&theme=' + theme : ''}`);
        }

        if (planId) {
            try {
                const planSnap = await getDoc(doc(db, "Plans & Subscriptions", planId));
                if (planSnap.exists() && planSnap.data().Name) {
                    document.getElementById('screenSubtitle').innerText = `Select an account for your ${planSnap.data().Name} plan.`;
                }
            } catch (err) {
                console.warn("Plan fetch error:", err);
            }
        }
    }
    initSession();

    // Load Local Accounts
    let localSaved = [];
    try {
        localSaved = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
    } catch (e) {
        localSaved = [];
    }

    const accountList = document.getElementById('accountList');
    const manualContainer = document.getElementById('manualInputContainer');

    function renderAccountList() {
        accountList.innerHTML = '';
        if (!Array.isArray(localSaved) || localSaved.length === 0) {
            manualContainer.classList.remove('hidden');
            document.getElementById('manualToggleBtn').classList.add('hidden');
            return;
        }

        localSaved.forEach(acc => {
            const email = acc.Email || acc.email || "";
            const name = acc.firstName || acc["First Name"] || email.split('@')[0];
            const photo = acc["Profile Picture"] || acc["Profile_Picture"] || null;
            const initial = name.charAt(0).toUpperCase();

            const item = document.createElement('div');
            item.className = 'account-item';

            const avatarHtml = photo 
                ? `<img src="${photo}" class="avatar-img" alt="${name}" onerror="this.outerHTML='<div class=\\'avatar\\'>${initial}</div>'" />` 
                : `<div class="avatar">${initial}</div>`;

            item.innerHTML = `
                ${avatarHtml}
                <div class="acc-info">
                    <p class="acc-name">${name}</p>
                    <p class="acc-email">${email}</p>
                </div>
            `;

            item.addEventListener('click', () => processAccountSelection(email));
            accountList.appendChild(item);
        });
    }

    renderAccountList();

    // Toggle Manual Email Input
    document.getElementById('manualToggleBtn').addEventListener('click', () => {
        manualContainer.classList.toggle('hidden');
    });

    document.getElementById('continueManualBtn').addEventListener('click', () => {
        const email = document.getElementById('manualEmailInput').value.trim();
        const err = document.getElementById('emailError');
        err.style.display = 'none';

        if (!email) {
            err.innerText = "Please enter an email address.";
            err.style.display = 'block';
            return;
        }
        processAccountSelection(email);
    });

    // Main Selection & Kids/Guardian Check
    async function processAccountSelection(email) {
        const btn = document.getElementById('continueManualBtn');
        btn.disabled = true;
        btn.innerText = "Verifying...";

        try {
            const q = query(collection(db, "UARM"), where("Email", "==", email));
            const snap = await getDocs(q);

            if (snap.empty) {
                showAlert("Account Not Found", "This email is not registered in our database.");
                btn.disabled = false;
                btn.innerText = "Continue";
                return;
            }

            targetUserData = snap.docs[0].data();

            // Check if this is a Kids Account (using "Guardian Email" from screenshot)
            const guardianEmail = targetUserData["Guardian Email"] || targetUserData["Guardian"] || targetUserData["guardian"];
            const isKids = targetUserData["Type"] === "kids" || targetUserData["Family"] === "commited" || Boolean(guardianEmail);

            if (isKids && guardianEmail) {
                // Kids Account -> Require Guardian OTP
                await sendGuardianOtp(guardianEmail, targetUserData);
            } else {
                // Adult / Personal Account -> Proceed directly
                await completeSessionRedirect();
            }

        } catch (err) {
            console.error("Account selection error:", err);
            showAlert("Error", "Could not verify account. Please try again.");
            btn.disabled = false;
            btn.innerText = "Continue";
        }
    }

    // Send OTP to Guardian
    async function sendGuardianOtp(guardianEmail, userData) {
        generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

        // Mask Guardian Email for UI
        const parts = guardianEmail.split('@');
        const masked = parts[0].substring(0, 3) + "••••" + parts[0].slice(-1);
        document.getElementById('guardianMasked').innerText = `${masked}@${parts[1]}`;

        const isPerplexity = guardianEmail.toLowerCase().endsWith("@perplexity.com");

        if (isPerplexity) {
            try {
                const hour = new Date().getHours();
                const greeting = hour < 12 ? "Morning" : (hour < 17 ? "Afternoon" : "Evening");
                const kidName = userData["First Name"] || userData["Email"] || "Kids Account";

                const emailBody = `Good ${greeting}, Here is your one time password ${generatedOtp} for ${kidName},  if you are not applied for this then Safly Ingnore this. A `;

                await addDoc(collection(mailDb, "Email"), {
                    subject: "Guardian Verification",
                    body: emailBody,
                    from: "systemplx.mail",
                    to: guardianEmail,
                    timestamp: serverTimestamp()
                });

                document.getElementById('chooseScreen').classList.add('hidden');
                document.getElementById('otpScreen').classList.remove('hidden');
            } catch (err) {
                console.error("Firestore Mailbox Error:", err);
                showAlert("Error", "Failed to transmit OTP to guardian mailbox.");
            }
        } else {
            try {
                await emailjs.send("service_63mnm5a", "template_qxz1wka", {
                    to_email: guardianEmail,
                    otp: generatedOtp,
                    user_name: userData["First Name"] || "User"
                });

                document.getElementById('chooseScreen').classList.add('hidden');
                document.getElementById('otpScreen').classList.remove('hidden');
            } catch (err) {
                console.error("EmailJS Error:", err);
                showAlert("Error", "Failed to send verification email to guardian.");
            }
        }
    }

    // Verify OTP Button
    document.getElementById('verifyOtpBtn').addEventListener('click', async () => {
        const entered = document.getElementById('otpInput').value.trim();
        const err = document.getElementById('otpError');
        err.style.display = 'none';

        if (entered !== generatedOtp) {
            err.innerText = "Invalid OTP code. Please try again.";
            err.style.display = 'block';
            return;
        }

        document.getElementById('verifyOtpBtn').disabled = true;
        document.getElementById('verifyOtpBtn').innerText = "Verified! Redirecting...";

        await completeSessionRedirect();
    });

    // Complete Session & Redirect to checkout.html
    async function completeSessionRedirect() {
        try {
            const updatePayload = {
                "Team Email": targetUserData["Email"],
                "updatedAt": new Date()
            };
            if (planId) {
                updatePayload["Plans"] = planId;
            }

            await updateDoc(doc(db, "ASPX Keys", session), updatePayload);

            localStorage.setItem('active_user', JSON.stringify(targetUserData));

            let redirectUrl = `checkout.html?session=${session}`;
            if (planId) redirectUrl += `&type=${planId}`;
            if (theme) redirectUrl += `&theme=${theme}`;
            
            window.location.href = redirectUrl;
        } catch (err) {
            console.error("Session update error:", err);
            showAlert("Error", "Failed to finalize session. Please retry.");
        }
    }
</script>
</body>
</html>
