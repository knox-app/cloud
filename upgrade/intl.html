<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Setup & Plan Activation</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1a1a1a;
            padding: 3rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            width: 90%;
            max-width: 450px;
            border: 1px solid #333;
        }
        .status { 
            margin-top: 25px; 
            font-size: 1.2rem; 
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { color: #ff5252; margin-top: 15px; font-size: 0.95rem; line-height: 1.4; display: block; }
        .success-icon { color: #4caf50; font-size: 4rem; margin-bottom: 10px; }
        .user-details { color: #aaa; font-size: 0.95rem; margin-top: 12px; line-height: 1.6; }
        .plan-highlight { color: #ffffff; font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <div id="ui-box">
            <div class="loader"></div>
            <div class="status" id="status-text">Verifying Session...</div>
        </div>
    </div>

    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- External Configuration Script -->
    <script src="https://knox-app.github.io/cloud/keys/xprtfb.js"></script>

    <script>
        const statusText = document.getElementById('status-text');
        const uiBox = document.getElementById('ui-box');

        const sleep = ms => new Promise(res => setTimeout(res, ms));

        async function processActivation() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session');
            let planId = urlParams.get('plan') || urlParams.get('type');

            if (!sessionId) {
                uiBox.innerHTML = '<span class="error">❌ Missing Session: No <b>session</b> ID found in URL.</span>';
                return;
            }

            try {
                // Initialize Firebase
                if (!firebase.apps.length) {
                    if (typeof firebaseConfig !== 'undefined') {
                        firebase.initializeApp(firebaseConfig);
                    } else {
                        throw new Error("firebaseConfig is not defined.");
                    }
                }

                const db = firebase.firestore();

                // STAGE 1: Fetch Session details from ASPX Keys
                statusText.innerText = "Retrieving Session Data...";
                await sleep(600);

                const sessionDoc = await db.collection("ASPX Keys").doc(sessionId).get();

                if (!sessionDoc.exists) {
                    uiBox.innerHTML = `<span class="error">❌ Session expired or not found.</span>`;
                    return;
                }

                const sessionData = sessionDoc.data();
                const userEmail = sessionData["Team Email"] || sessionData["Email"] || (sessionData.userData && sessionData.userData.Email);
                
                // If plan is not in the URL, retrieve it from session document
                if (!planId) {
                    planId = sessionData["Plans"] || sessionData["plan"] || sessionData["type"];
                }

                if (!userEmail) {
                    uiBox.innerHTML = `<span class="error">❌ No account email associated with this session.</span>`;
                    return;
                }

                // STAGE 2: Retrieve the Plan Name from Plans & Subscriptions
                let planName = planId || "Subscription";
                if (planId) {
                    statusText.innerText = "Fetching Plan Details...";
                    try {
                        const planDoc = await db.collection("Plans & Subscriptions").doc(planId).get();
                        if (planDoc.exists && planDoc.data().Name) {
                            planName = planDoc.data().Name;
                        }
                    } catch (err) {
                        console.warn("Could not retrieve plan name, using ID:", err);
                    }
                }

                // STAGE 3: Locate User by Email in UARM
                statusText.innerText = "Locating Account...";
                await sleep(600);

                let uarmQuery = await db.collection("UARM")
                    .where("Email", "==", userEmail)
                    .limit(1)
                    .get();

                if (uarmQuery.empty) {
                    // Fallback to lowercase email check
                    uarmQuery = await db.collection("UARM")
                        .where("email", "==", userEmail)
                        .limit(1)
                        .get();
                }

                if (uarmQuery.empty) {
                    uiBox.innerHTML = `<span class="error">❌ No active account found for <b>${userEmail}</b>.</span>`;
                    return;
                }

                const userDoc = uarmQuery.docs[0];
                const userDocRef = userDoc.ref;
                const userData = userDoc.data();
                const userName = userData["First Name"] 
                    ? `${userData["First Name"]} ${userData["Last Name"] || ''}`.trim() 
                    : userEmail.split('@')[0];

                // STAGE 4: Activate & Assign Plan
                statusText.innerText = `Activating ${planName}...`;
                await sleep(800);

                const updatePayload = {
                    "lastUpdated": new Date().toISOString()
                };

                if (planId) {
                    updatePayload["Plans"] = firebase.firestore.FieldValue.arrayUnion(planId);
                }

                await userDocRef.update(updatePayload);

                // STAGE 5: Finalizing Setup
                statusText.innerText = "Finalizing Account...";
                await sleep(600);

                // STAGE 6: Success Screen (Shows Plan Name instead of Plan ID)
                uiBox.innerHTML = `
                    <div class="success-icon">✓</div>
                    <div class="status" style="color: #4caf50;">Plan Activated!</div>
                    <p class="user-details">
                        Hello <b>${userName}</b>,<br>
                        the <span class="plan-highlight">${planName}</span> plan has been successfully activated for <b>${userEmail}</b>.
                    </p>
                `;

            } catch (error) {
                console.error("Firebase Error:", error);
                uiBox.innerHTML = `<span class="error">System Error: ${error.message}</span>`;
            }
        }

        window.onload = () => {
            setTimeout(processActivation, 300);
        };
    </script>
</body>
</html>
