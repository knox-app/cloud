<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Setup & Plan Activation</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1a1a1a;
            padding: 3rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            width: 90%;
            max-width: 450px;
            border: 1px solid #333;
        }
        .status { 
            margin-top: 25px; 
            font-size: 1.2rem; 
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { color: #ff5252; margin-top: 15px; font-size: 0.95rem; line-height: 1.4; }
        .success-icon { color: #4caf50; font-size: 4rem; margin-bottom: 10px; }
        .user-details { color: #aaa; font-size: 0.9rem; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="ui-box">
            <div class="loader"></div>
            <div class="status" id="status-text">Locating Account...</div>
        </div>
    </div>

    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Your Configuration Script -->
    <script src="https://knox-app.github.io/cloud/keys/xprtfb.js"></script>

    <script>
        const statusText = document.getElementById('status-text');
        const uiBox = document.getElementById('ui-box');

        const sleep = ms => new Promise(res => setTimeout(res, ms));

        async function processTransfer() {
            const urlParams = new URLSearchParams(window.location.search);
            const lotusId = urlParams.get('lotus');
            const planId = urlParams.get('plan');

            if (!lotusId || !planId) {
                uiBox.innerHTML = '<span class="error">❌ Missing Parameters: Please provide <b>lotus</b> and <b>plan</b> in the URL.</span>';
                return;
            }

            try {
                // Initialize Firebase if not already initialized
                if (!firebase.apps.length) {
                    if (typeof firebaseConfig !== 'undefined') {
                        firebase.initializeApp(firebaseConfig);
                    } else {
                        throw new Error("firebaseConfig not found in external script.");
                    }
                }

                const db = firebase.firestore();

                // STAGE 1: Finding user document by Lotus ID
                statusText.innerText = "Finding Account...";
                await sleep(800);

                const uarmQuery = await db.collection("UARM")
                    .where("Lotus", "==", lotusId)
                    .limit(1)
                    .get();

                if (uarmQuery.empty) {
                    uiBox.innerHTML = `<span class="error">❌ User not found with Lotus ID: <b>${lotusId}</b></span>`;
                    return;
                }

                const userDoc = uarmQuery.docs[0];
                const userDocRef = userDoc.ref;
                const userData = userDoc.data();
                const userName = userData["First Name"] ? `${userData["First Name"]} ${userData["Last Name"] || ''}`.trim() : "User";

                // STAGE 2: Activating & Assigning Plan
                statusText.innerText = "Activating Plan...";
                await sleep(1000);

                // Add planId to the Plans array without duplicates
                await userDocRef.update({
                    "Plans": firebase.firestore.FieldValue.arrayUnion(planId),
                    "lastUpdated": new Date().toISOString()
                });

                // STAGE 3: Finalizing Setup
                statusText.innerText = "Finalizing Account...";
                await sleep(1000);

                // STAGE 4: Completion Screen
                uiBox.innerHTML = `
                    <div class="success-icon">✓</div>
                    <div class="status" style="color: #4caf50;">Plan Activated!</div>
                    <p class="user-details">Hello <b>${userName}</b>, plan <b>${planId}</b> has been successfully added to your account.</p>
                `;

            } catch (error) {
                console.error("Firebase Error:", error);
                uiBox.innerHTML = `<span class="error">System Error: ${error.message}</span>`;
            }
        }

        // Run process on page load
        window.onload = () => {
            setTimeout(processTransfer, 500);
        };
    </script>
</body>
</html>
