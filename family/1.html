<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map from URL Parameters</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .content {
            padding: 20px;
        }

        /* Controls / Form */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-field {
            flex: 1;
            min-width: 140px;
        }

        .input-field label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }

        .input-field input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field input:focus {
            border-color: #2563eb;
        }

        button {
            align-self: flex-end;
            padding: 10px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            height: 42px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* Coordinates Display */
        .info-box {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            color: #3730a3;
        }

        /* Map frame */
        .map-container {
            width: 100%;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>Location Viewer</h1>
        <p>Reads <code>lat</code> and <code>lng</code> directly from URL query parameters</p>
    </div>

    <div class="content">
        <!-- Form to test and update coordinates directly -->
        <form id="coordForm" class="input-group" onsubmit="handleFormSubmit(event)">
            <div class="input-field">
                <label for="latInput">Latitude</label>
                <input type="number" step="any" id="latInput" placeholder="e.g. 40.7128" required>
            </div>
            <div class="input-field">
                <label for="lngInput">Longitude</label>
                <input type="number" step="any" id="lngInput" placeholder="e.g. -74.0060" required>
            </div>
            <button type="submit">Update Map</button>
        </form>

        <div class="info-box" id="infoBox">
            Loading coordinates...
        </div>

        <!-- Google Map Iframe -->
        <div class="map-container">
            <iframe id="mapFrame" src="" loading="lazy" allowfullscreen></iframe>
        </div>
    </div>
</div>

<script>
    // 1. Function to get coordinates from URL parameters
    function getCoordinatesFromURL() {
        const urlParams = new URLSearchParams(window.location.search);
        
        // Supports both ?lat=...&lng=... and ?latitude=...&longitude=...
        const lat = urlParams.get('lat') || urlParams.get('latitude');
        const lng = urlParams.get('lng') || urlParams.get('lon') || urlParams.get('longitude');

        return { lat, lng };
    }

    // 2. Function to update the Google Map and UI
    function loadMap(lat, lng) {
        // Fallback default coordinates (New York City) if not provided
        const defaultLat = "40.7128";
        const defaultLng = "-74.0060";

        const finalLat = (lat !== null && lat !== "") ? lat : defaultLat;
        const finalLng = (lng !== null && lng !== "") ? lng : defaultLng;

        // Update form inputs
        document.getElementById('latInput').value = finalLat;
        document.getElementById('lngInput').value = finalLng;

        // Update display info
        const infoBox = document.getElementById('infoBox');
        if (lat && lng) {
            infoBox.innerHTML = `📍 Showing Location: <b>Latitude:</b> ${finalLat}, <b>Longitude:</b> ${finalLng}`;
        } else {
            infoBox.innerHTML = `⚠️ No URL parameters found. Showing Default: <b>Lat:</b> ${finalLat}, <b>Lng:</b> ${finalLng} <br><small>Try adding: <code>?lat=48.8584&lng=2.2945</code> to the URL.</small>`;
        }

        // Set Google Maps embed URL
        const mapFrame = document.getElementById('mapFrame');
        mapFrame.src = `https://maps.google.com/maps?q=${finalLat},${finalLng}&hl=en&z=14&output=embed`;
    }

    // 3. Handle manual form submission and update browser URL without reloading
    function handleFormSubmit(event) {
        event.preventDefault();
        const lat = document.getElementById('latInput').value;
        const lng = document.getElementById('lngInput').value;

        // Update URL in browser address bar
        const newUrl = `${window.location.pathname}?lat=${lat}&lng=${lng}`;
        window.history.pushState({ path: newUrl }, '', newUrl);

        // Reload the map
        loadMap(lat, lng);
    }

    // 4. Initial load on page ready
    window.addEventListener('DOMContentLoaded', () => {
        const { lat, lng } = getCoordinatesFromURL();
        loadMap(lat, lng);
    });
</script>

</body>
</html>
