<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linkly - Redirecting...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b, #0f172a);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid #334155;
      padding: 2.5rem;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #818cf8;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
    }

    .timer-circle {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 1.5rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      border-radius: 50%;
      border: 4px solid #6366f1;
    }

    .timer-num {
      font-size: 2.5rem;
      font-weight: bold;
      color: #ffffff;
    }

    .task-status {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .target-desc {
      font-size: 0.9rem;
      color: #94a3b8;
      word-break: break-all;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background: #6366f1;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #4f46e5;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border-left-color: #6366f1;
      animation: spin 1s linear infinite;
      margin: 1rem auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-msg {
      color: #f87171;
      font-size: 1rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="logo">LINKLY</div>
    <div id="loader">
      <div class="spinner"></div>
      <p style="color: #94a3b8;">Verifying task link...</p>
    </div>

    <div id="content" style="display: none;">
      <h2 class="task-status" id="task-title">Preparing your link</h2>
      <p class="target-desc" id="target-name"></p>
      
      <div class="timer-circle">
        <span class="timer-num" id="countdown">--</span>
      </div>

      <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.5rem;">
        You will be redirected automatically when the task finishes.
      </p>

      <a id="direct-btn" href="#" class="btn" style="display: none;">Click Here to Proceed</a>
    </div>

    <div id="error" style="display: none;">
      <h3 class="error-msg" id="error-text">Link Not Found</h3>
      <p style="color: #94a3b8; margin-top: 0.5rem; font-size: 0.9rem;">
        This slug does not exist or may have been deleted.
      </p>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
      authDomain: "cloud-computer-4891a.firebaseapp.com",
      projectId: "cloud-computer-4891a",
      storageBucket: "cloud-computer-4891a.firebasestorage.app",
      messagingSenderId: "744203234287",
      appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
      measurementId: "G-QE17C33TMN"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const loader = document.getElementById('loader');
    const content = document.getElementById('content');
    const errorBox = document.getElementById('error');
    const countdownEl = document.getElementById('countdown');
    const targetNameEl = document.getElementById('target-name');
    const directBtn = document.getElementById('direct-btn');

    async function executeTask() {
      // Extract slug from URL hash (e.g., task.html#my-link)
      let slug = window.location.hash.substring(1).trim().toLowerCase();

      // Fallback check if user used query param (?slug=my-link)
      if (!slug) {
        const params = new URLSearchParams(window.location.search);
        slug = params.get('slug') ? params.get('slug').trim().toLowerCase() : '';
      }

      if (!slug) {
        showError('No alias slug specified in the URL hash (e.g., task.html#slug).');
        return;
      }

      try {
        const docRef = db.collection('aliases').doc(slug);
        const docSnap = await docRef.get();

        if (!docSnap.exists) {
          showError(`Alias "${slug}" was not found.`);
          return;
        }

        const data = docSnap.data();
        let timeLeft = typeof data.timer === 'number' ? data.timer : 3;
        const targetUrl = data.target;

        loader.style.display = 'none';
        content.style.display = 'block';
        targetNameEl.textContent = `Destination: ${data.name}`;
        countdownEl.textContent = timeLeft;
        directBtn.href = targetUrl;

        // If zero seconds, redirect immediately
        if (timeLeft <= 0) {
          window.location.href = targetUrl;
          return;
        }

        // Countdown Task Execution
        const interval = setInterval(() => {
          timeLeft--;
          countdownEl.textContent = timeLeft;

          if (timeLeft <= 0) {
            clearInterval(interval);
            directBtn.style.display = 'inline-block';
            window.location.href = targetUrl;
          }
        }, 1000);

      } catch (err) {
        console.error(err);
        showError('Failed to load link: ' + err.message);
      }
    }

    function showError(msg) {
      loader.style.display = 'none';
      content.style.display = 'none';
      errorBox.style.display = 'block';
      document.getElementById('error-text').textContent = msg;
    }

    window.addEventListener('DOMContentLoaded', executeTask);
  </script>
</body>
</html>
