<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linkly: Redirect accoding to Tasks</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    }

    body {
      background-color: #f3f6f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #334155;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 620px;
      border-radius: 20px;
      padding: 3.5rem 2.5rem;
      text-align: center;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      border: 1px solid #eef2f6;
      border-top: 3px solid #10b981;
      position: relative;
    }

    /* Outer concentric circle effect matching screenshot */
    .icon-wrapper {
      width: 100px;
      height: 100px;
      margin: 0 auto 1.5rem auto;
      border-radius: 50%;
      background: #f0fdf4;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 10px #f7fdf9, 0 0 0 18px #fafdfb;
      border: 1px solid #d1fae5;
    }

    .icon-wrapper svg {
      width: 42px;
      height: 42px;
      stroke: #10b981;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transform: rotate(-45deg);
    }

    /* Active badge pill */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #10b981;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    /* Headings */
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 1rem;
      letter-spacing: -0.3px;
    }

    .divider {
      width: 38px;
      height: 3px;
      background-color: #10b981;
      border-radius: 2px;
      margin: 0 auto 1.75rem auto;
    }

    /* Subtext */
    .description {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #64748b;
    }

    .description strong {
      color: #334155;
    }

    .description a {
      color: #10b981;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
      cursor: pointer;
    }

    .description a:hover {
      text-decoration: underline;
    }

    /* Redirecting Status Indicator */
    .status-msg {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #059669;
      font-weight: 500;
    }

    /* Bottom Branding */
    .footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .footer span {
      color: #64748b;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Icon with subtle concentric rings -->
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
      </svg>
    </div>

    <!-- Active Badge -->
    <div>
      <div class="badge" id="status-badge">
        <div class="badge-dot"></div>
        <span id="badge-text">ACTIVE</span>
      </div>
    </div>

    <!-- Main Title -->
    <h1 id="title">Linkly: Redirect accoding to Tasks</h1>

    <!-- Green Accent Line -->
    <div class="divider"></div>

    <!-- Body Info Text -->
    <p class="description">
      <strong>This Page</strong> is configured for link redirection.<br>
      If you arrived here by mistake, you can <a href="javascript:history.back()">go back</a>.
    </p>

    <!-- Invisible status text that updates upon redirect -->
    <div class="status-msg" id="status-msg">Redirecting you to your destination...</div>
  </div>

  <!-- Bottom Powered By -->
  <div class="footer">
    Powerd By <span>ASPXx</span>
  </div>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
      authDomain: "cloud-computer-4891a.firebaseapp.com",
      projectId: "cloud-computer-4891a",
      storageBucket: "cloud-computer-4891a.firebasestorage.app",
      messagingSenderId: "744203234287",
      appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
      measurementId: "G-QE17C33TMN"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const statusBadge = document.getElementById('status-badge');
    const badgeText = document.getElementById('badge-text');
    const statusMsg = document.getElementById('status-msg');

    async function executeRedirect() {
      // 1. Get slug from Hash (#slug) or fallback to search (?slug=...)
      let slug = window.location.hash.substring(1).trim().toLowerCase();
      if (!slug) {
        const params = new URLSearchParams(window.location.search);
        slug = params.get('slug') ? params.get('slug').trim().toLowerCase() : '';
      }

      if (!slug) {
        setInactive('No link slug was provided.');
        return;
      }

      try {
        const docRef = db.collection('aliases').doc(slug);
        const docSnap = await docRef.get();

        if (!docSnap.exists) {
          setInactive(`Alias "#${slug}" not found.`);
          return;
        }

        const data = docSnap.data();
        const targetUrl = data.target;

        // Clean direct redirection without countdown timer
        statusMsg.textContent = `Redirecting to ${data.name || 'destination'}...`;

        setTimeout(() => {
          window.location.href = targetUrl;
        }, 800); // 800ms natural delay to view the card before redirect

      } catch (err) {
        console.error(err);
        setInactive('Unable to load redirect link.');
      }
    }

    function setInactive(message) {
      statusBadge.style.backgroundColor = '#ef4444';
      badgeText.textContent = 'INACTIVE';
      statusMsg.style.color = '#ef4444';
      statusMsg.textContent = message;
    }

    window.addEventListener('DOMContentLoaded', executeRedirect);
  </script>
</body>
</html>
