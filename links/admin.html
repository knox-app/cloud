<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linkly - Admin Panel</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      color: #818cf8;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    input {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #475569;
    }

    .btn-secondary:hover {
      background-color: #334155;
    }

    .btn-danger {
      background-color: var(--danger);
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }

    .btn-sm {
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    td {
      font-size: 0.95rem;
      word-break: break-all;
    }

    .slug-badge {
      background: #312e81;
      color: #a5b4fc;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Linkly Dashboard</h1>
      <p>Create and manage dynamic redirect alias links</p>
    </header>

    <!-- Create/Edit Form -->
    <div class="card">
      <h2 id="form-title" style="margin-bottom: 1rem; font-size: 1.25rem;">Create New Alias</h2>
      <form id="alias-form">
        <input type="hidden" id="edit-id" />
        <div class="form-grid">
          <div class="form-group">
            <label for="name">Alias Name</label>
            <input type="text" id="name" placeholder="e.g., My Portfolio" required />
          </div>
          <div class="form-group">
            <label for="slug">Slug (URL Hash)</label>
            <input type="text" id="slug" placeholder="e.g., portfolio" required />
          </div>
          <div class="form-group">
            <label for="target">Redirect URL</label>
            <input type="url" id="target" placeholder="https://example.com" required />
          </div>
          <div class="form-group">
            <label for="timer">Task Wait Time (Seconds)</label>
            <input type="number" id="timer" value="3" min="0" max="60" required />
          </div>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button type="submit" class="btn" id="save-btn">Save Alias</button>
          <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none;">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Active Aliases Table -->
    <div class="card">
      <h2 style="margin-bottom: 1rem; font-size: 1.25rem;">Existing Aliases</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Slug / Path</th>
              <th>Redirects To</th>
              <th>Wait</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="alias-list">
            <tr>
              <td colspan="5" style="text-align: center; color: var(--text-muted);">Loading links...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
      authDomain: "cloud-computer-4891a.firebaseapp.com",
      projectId: "cloud-computer-4891a",
      storageBucket: "cloud-computer-4891a.firebasestorage.app",
      messagingSenderId: "744203234287",
      appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
      measurementId: "G-QE17C33TMN"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const form = document.getElementById('alias-form');
    const formTitle = document.getElementById('form-title');
    const cancelBtn = document.getElementById('cancel-btn');
    const aliasList = document.getElementById('alias-list');

    // Clean and normalize slug
    function sanitizeSlug(slug) {
      return slug.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '-');
    }

    // Save or Update Alias
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const editId = document.getElementById('edit-id').value;
      const name = document.getElementById('name').value.trim();
      const slug = sanitizeSlug(document.getElementById('slug').value);
      const target = document.getElementById('target').value.trim();
      const timer = parseInt(document.getElementById('timer').value, 10) || 0;

      try {
        if (editId) {
          // If slug changed, delete old doc and make a new one
          if (editId !== slug) {
            await db.collection('aliases').doc(editId).delete();
          }
        }

        await db.collection('aliases').doc(slug).set({
          name: name,
          slug: slug,
          target: target,
          timer: timer,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert('Alias saved successfully!');
        resetForm();
      } catch (err) {
        console.error(err);
        alert('Error saving alias: ' + err.message);
      }
    });

    // Real-time listener for aliases
    db.collection('aliases').onSnapshot((snapshot) => {
      aliasList.innerHTML = '';
      if (snapshot.empty) {
        aliasList.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No aliases found. Create your first one above!</td></tr>`;
        return;
      }

      snapshot.forEach((doc) => {
        const data = doc.data();
        const baseTaskUrl = window.location.href.replace(/admin\.html.*$/, 'task.html');
        const taskUrl = `${baseTaskUrl}#${data.slug}`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${data.name}</strong></td>
          <td><span class="slug-badge">#${data.slug}</span></td>
          <td><a href="${data.target}" target="_blank" style="color: #60a5fa;">${data.target}</a></td>
          <td>${data.timer}s</td>
          <td>
            <div class="actions">
              <button class="btn btn-sm" onclick="copyUrl('${taskUrl}')">Copy Link</button>
              <button class="btn btn-secondary btn-sm" onclick="editAlias('${doc.id}', '${escape(data.name)}', '${data.target}', ${data.timer})">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteAlias('${doc.id}')">Delete</button>
            </div>
          </td>
        `;
        aliasList.appendChild(tr);
      });
    });

    function editAlias(slug, escapedName, target, timer) {
      document.getElementById('edit-id').value = slug;
      document.getElementById('name').value = unescape(escapedName);
      document.getElementById('slug').value = slug;
      document.getElementById('target').value = target;
      document.getElementById('timer').value = timer;

      formTitle.textContent = `Edit Alias: #${slug}`;
      cancelBtn.style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    cancelBtn.addEventListener('click', resetForm);

    function resetForm() {
      form.reset();
      document.getElementById('edit-id').value = '';
      document.getElementById('timer').value = '3';
      formTitle.textContent = 'Create New Alias';
      cancelBtn.style.display = 'none';
    }

    async function deleteAlias(slug) {
      if (confirm(`Are you sure you want to delete alias "#${slug}"?`)) {
        await db.collection('aliases').doc(slug).delete();
      }
    }

    function copyUrl(url) {
      navigator.clipboard.writeText(url).then(() => {
        alert('Copied link: ' + url);
      });
    }
  </script>
</body>
</html>
