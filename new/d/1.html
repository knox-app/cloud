<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PerplexTea</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f7f7f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 400px;
      border: 1px solid #e5e5e0;
    }

    .login-card h2 {
      font-family: 'Georgia', serif;
      font-size: 28px;
      margin-bottom: 8px;
      color: #1a1a1a;
      text-align: center;
    }

    .login-card p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #da7756;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #da7756;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #c46243;
    }

    .error-msg {
      color: #d93025;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
      display: none;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>PerplexTea</h2>
    <p id="sub-title">Enter your details to get started</p>

    <!-- Step 1: Mobile or Email -->
    <div id="step-1">
      <div class="form-group">
        <label for="identifier">Email or Phone Number</label>
        <input type="text" id="identifier" placeholder="e.g. tapasya@perplexity.com or 8005811475">
      </div>
      <button class="btn" onclick="verifyIdentifier()">Continue</button>
    </div>

    <!-- Step 2: Password -->
    <div id="step-2" class="hidden">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">
      </div>
      <button class="btn" onclick="verifyPassword()">Sign In</button>
    </div>

    <div id="error-msg" class="error-msg"></div>
  </div>

  <script>
    // Database Mock (Matching Firebase Screenshot data)
    const validUser = {
      email: "tapasya@perplexity.com",
      phone: "8005811475",
      password: "Tapasya@2010",
      firstName: "Tapasya"
    };

    // Auto-login check
    window.onload = function() {
      if (localStorage.getItem('isLoggedIn') === 'true') {
        window.location.href = '2.html';
      }
    };

    function showError(message) {
      const errDiv = document.getElementById('error-msg');
      errDiv.innerText = message;
      errDiv.style.display = 'block';
    }

    function hideError() {
      const errDiv = document.getElementById('error-msg');
      errDiv.style.display = 'none';
    }

    function verifyIdentifier() {
      const input = document.getElementById('identifier').value.trim();
      hideError();

      if (input === validUser.email || input === validUser.phone) {
        document.getElementById('step-1').classList.add('hidden');
        document.getElementById('step-2').classList.remove('hidden');
        document.getElementById('sub-title').innerText = "Enter password for " + input;
      } else {
        showError("Email or Mobile Number not found!");
      }
    }

    function verifyPassword() {
      const passInput = document.getElementById('password').value;
      hideError();

      if (passInput === validUser.password) {
        // Save session
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('firstName', validUser.firstName);
        
        // Redirect to 2.html
        window.location.href = '2.html';
      } else {
        showError("Incorrect password. Please try again.");
      }
    }
  </script>
</body>
</html>
