<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PerplexTea</title>

  <!-- Firebase v9 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #131314; color: #e3e3e3; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-card { background: #1e1f20; padding: 2.5rem; border-radius: 16px; border: 1px solid #2e2f31; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .logo-title { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; font-size: 1.5rem; font-weight: 600; color: #8ab4f8; }
    .logo-title svg { fill: #8ab4f8; width: 32px; height: 32px; }
    h2 { font-size: 1.25rem; font-weight: 500; margin-bottom: 0.5rem; color: #f1f3f4; }
    p { font-size: 0.875rem; color: #9aa0a6; margin-bottom: 1.5rem; }
    .input-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.75rem; color: #9aa0a6; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; padding: 12px 14px; background: #131314; border: 1px solid #3c4043; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; transition: border 0.2s; }
    input:focus { border-color: #8ab4f8; }
    .btn { width: 100%; padding: 12px; background: #8ab4f8; color: #131314; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    .btn:hover { background: #aecbfa; }
    .btn:disabled { background: #3c4043; color: #80868b; cursor: not-allowed; }
    .error-msg { color: #f28b82; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-title">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      PerplexTea
    </div>
    
    <!-- STEP 1: EMAIL OR PHONE -->
    <div id="step-1">
      <h2>Sign in</h2>
      <p>Enter your Email or Mobile Number</p>
      <div class="input-group">
        <label>Email or Phone</label>
        <input type="text" id="identifierInput" placeholder="e.g. tapasya@perplexity.com or 8005811475">
      </div>
      <button class="btn" id="nextBtn" onclick="handleCheckIdentifier()">Next</button>
      <div id="error-1" class="error-msg">Account not found. Please check and try again.</div>
    </div>

    <!-- STEP 2: PASSWORD -->
    <div id="step-2" class="hidden">
      <h2>Welcome back</h2>
      <p id="user-display-id"></p>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="Enter password">
      </div>
      <button class="btn" onclick="handleLogin()">Login</button>
      <div id="error-2" class="error-msg">Incorrect password. Please try again.</div>
    </div>
  </div>

  <script>
    // Initialize Firebase directly with provided configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "question-metabase",
      storageBucket: "question-metabase.firebasestorage.app",
      messagingSenderId: "770698198753",
      appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
      measurementId: "G-6ZP1FPMKSJ"
    };

    // Initialize Firebase App & Firestore
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // Check Auto Login
    if (localStorage.getItem("isLoggedIn") === "true") {
      window.location.href = "2.html";
    }

    let foundUserData = null;

    async function fetchAccount(identifier) {
      try {
        // Query by Email
        let snapshot = await db.collection("UARM").where("Email", "==", identifier).get();
        
        // Query by Phone Number if Email not found
        if (snapshot.empty) {
          snapshot = await db.collection("UARM").where("Phone Number", "==", identifier).get();
        }

        if (!snapshot.empty) {
          return snapshot.docs[0].data();
        }
      } catch (err) {
        console.error("Firestore error querying UARM collection:", err);
      }
      return null;
    }

    async function handleCheckIdentifier() {
      const idVal = document.getElementById("identifierInput").value.trim();
      const err = document.getElementById("error-1");
      const nextBtn = document.getElementById("nextBtn");
      
      err.style.display = "none";
      if (!idVal) return;

      nextBtn.innerText = "Searching...";
      nextBtn.disabled = true;

      foundUserData = await fetchAccount(idVal);

      nextBtn.innerText = "Next";
      nextBtn.disabled = false;

      if (foundUserData) {
        document.getElementById("step-1").classList.add("hidden");
        document.getElementById("step-2").classList.remove("hidden");
        document.getElementById("user-display-id").innerText = foundUserData.Email || foundUserData["Phone Number"] || idVal;
      } else {
        err.style.display = "block";
      }
    }

    function handleLogin() {
      const passVal = document.getElementById("passwordInput").value;
      const err = document.getElementById("error-2");

      if (foundUserData && foundUserData.Password === passVal) {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("userData", JSON.stringify(foundUserData));
        window.location.href = "2.html";
      } else {
        err.style.display = "block";
      }
    }
  </script>
</body>
</html>
