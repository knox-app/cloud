<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - PerplexTea</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #131314; color: #e3e3e3; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid #2e2f31; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .badge-kids { display: flex; align-items: center; gap: 6px; background: rgba(234, 67, 53, 0.15); color: #f28b82; border: 1px solid rgba(234, 67, 53, 0.3); padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; }
    .badge-kids svg { fill: #f28b82; width: 16px; height: 16px; }

    .profile-container { position: relative; cursor: pointer; }
    .profile-dp { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #8ab4f8; }

    /* Dropdown Popover */
    .profile-modal { position: absolute; top: 50px; right: 0; background: #1e1f20; border: 1px solid #3c4043; border-radius: 12px; width: 200px; display: none; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 100; overflow: hidden; }
    .profile-modal.active { display: flex; }
    .modal-item { padding: 12px 16px; font-size: 0.9rem; color: #e3e3e3; display: flex; align-items: center; gap: 10px; border: none; background: transparent; text-align: left; width: 100%; cursor: pointer; transition: background 0.2s; }
    .modal-item:hover { background: #2e2f31; }
    .modal-item.logout { color: #f28b82; border-top: 1px solid #2e2f31; }

    /* Main Container */
    main { max-width: 768px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
    .greeting-title { font-size: 2.2rem; font-weight: 500; margin-bottom: 2rem; background: linear-gradient(90deg, #4285f4, #d93025, #fbbc04, #34a853); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .prompt-box { width: 100%; background: #1e1f20; border: 1px solid #3c4043; border-radius: 24px; padding: 12px 20px; display: flex; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,0.3); transition: border-color 0.2s; }
    .prompt-box:focus-within { border-color: #8ab4f8; }
    .prompt-box input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 1.05rem; }
    .submit-btn { background: #8ab4f8; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .submit-btn svg { fill: #131314; width: 20px; height: 20px; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <span style="font-weight: 600; font-size: 1.1rem; color: #8ab4f8;">PerplexTea</span>
      <div id="kidsBadge" class="badge-kids" style="display: none;">
        <!-- Guardian SVG Icon -->
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8Messz"/></svg>
        Kids Account
      </div>
    </div>

    <div class="profile-container" onclick="toggleProfileMenu()">
      <img id="userDp" class="profile-dp" src="https://via.placeholder.com/40" alt="DP">
      
      <div id="profileModal" class="profile-modal">
        <button class="modal-item">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg> Accounts
        </button>
        <button class="modal-item">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg> Settings
        </button>
        <button class="modal-item">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg> Language
        </button>
        <button class="modal-item">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg> Learn More
        </button>
        <button class="modal-item logout" onclick="logout()">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg> Logout
        </button>
      </div>
    </div>
  </header>

  <main>
    <div id="greetingText" class="greeting-title">Tea With PerplexTea</div>

    <div class="prompt-box">
      <input type="text" id="promptInput" placeholder="Ask anything..." onkeypress="handleKeyPress(event)">
      <button class="submit-btn" onclick="submitPrompt()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </main>

  <div></div>

  <script>
    if (localStorage.getItem("isLoggedIn") !== "true") {
      window.location.href = "1.html";
    }

    const userData = JSON.parse(localStorage.getItem("userData") || "{}");

    // DP setup
    if (userData["Profile Picture"]) {
      document.getElementById("userDp").src = userData["Profile Picture"];
    }

    // Kids badge dynamic check
    if (userData.type === "kids" || userData.Guardian) {
      document.getElementById("kidsBadge").style.display = "flex";
    }

    // Dynamic Greetings Rotation Logic
    const firstName = userData["First Name"] || "User";
    const hours = new Date().getHours();
    
    let timeGreeting = "Afternoon";
    if (hours < 12) timeGreeting = "Morning";
    else if (hours >= 22 || hours < 5) timeGreeting = "Night Owl";

    const greetingOptions = [
      "Tea With PerplexTea",
      `${timeGreeting}, ${firstName}`,
      `Lets GOOOO ${firstName}`
    ];
    
    // Pick dynamic option based on current second
    const chosenGreeting = greetingOptions[Math.floor(Math.random() * greetingOptions.length)];
    document.getElementById("greetingText").innerText = chosenGreeting;

    function toggleProfileMenu() {
      document.getElementById("profileModal").classList.toggle("active");
    }

    function logout() {
      localStorage.clear();
      window.location.href = "1.html";
    }

    function submitPrompt() {
      const text = document.getElementById("promptInput").value.trim();
      if (text) {
        const userEmail = userData.Email || "default_user";
        window.location.href = `3.html?prompt=${encodeURIComponent(text)}&email=${encodeURIComponent(userEmail)}`;
      }
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") submitPrompt();
    }
  </script>
</body>
</html>
