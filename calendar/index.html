<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung Calendar</title>
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg-main: #000000;
            --bg-surface: #121316;
            --bg-card: #1c1d22;
            --bg-pill: #26282e;
            --border-color: #24252a;
            --border-highlight: #ffffff;
            --text-main: #ffffff;
            --text-muted: #8b8e98;
            --sunday-red: #ea5455;
            --event-green: #155724;
            --event-green-text: #d4edda;
            --time-indicator: #ff5252;
            --sidebar-width: 64px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Samsung One", Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            overflow: hidden;
            user-select: none;
        }

        /* ================= SIDEBAR (RAIL) ================= */
        aside.sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-main);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            z-index: 10;
            flex-shrink: 0;
        }

        .side-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            position: relative;
        }

        .side-btn:hover {
            background-color: #1f2025;
            color: #fff;
        }

        .side-btn.active {
            background-color: #2c2d35;
            color: #ffffff;
        }

        .side-btn.bottom {
            margin-top: auto;
            margin-bottom: 8px;
        }

        .side-divider {
            width: 32px;
            height: 1px;
            background: var(--border-color);
            margin: 8px 0 16px 0;
        }

        /* ================= MAIN CONTAINER ================= */
        main.app-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* ================= TOP BAR ================= */
        header.top-bar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .title-display {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-action-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .icon-action-btn:hover {
            background-color: #25262c;
        }

        .today-badge-btn {
            border: 1.5px solid #ffffff;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            padding: 2px 7px;
            color: #fff;
            background: transparent;
            cursor: pointer;
        }

        .user-pill {
            font-size: 12px;
            background: var(--bg-pill);
            padding: 6px 14px;
            border-radius: 20px;
            color: #bbb;
            max-width: 170px;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            cursor: pointer;
        }
        .user-pill:hover { color: #fff; background: #333; }

        /* ================= VIEWS CONTAINER ================= */
        .views-viewport {
            flex: 1;
            position: relative;
            overflow: auto;
            background-color: var(--bg-main);
        }

        /* VIEW: MONTH */
        .month-view-grid {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .month-header-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            padding: 10px 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .month-header-row span:last-child { color: var(--sunday-red); }

        .month-days-matrix {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: 1fr;
        }

        .month-day-cell {
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            min-height: 80px;
        }

        .month-day-cell:nth-child(7n) { border-right: none; }
        .month-day-cell.other-month { opacity: 0.35; }

        .cell-date-num {
            font-size: 14px;
            font-weight: 600;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .month-day-cell.is-sunday .cell-date-num { color: var(--sunday-red); }

        .month-day-cell.selected .cell-date-num {
            border: 2px solid #ffffff;
            border-radius: 8px;
        }

        .event-tag {
            background-color: #123d1d;
            color: #bbf7d0;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 4px;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            border-left: 3px solid #22c55e;
        }

        /* VIEW: WEEK */
        .week-view-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .week-top-columns {
            display: grid;
            grid-template-columns: 60px repeat(7, 1fr);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .week-col-head {
            padding: 8px 0;
            border-right: 1px solid var(--border-color);
        }
        .week-col-head .day-name { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .week-col-head .day-number {
            font-size: 15px;
            font-weight: 700;
            margin-top: 2px;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .week-col-head.selected .day-number {
            border: 2px solid #ffffff;
        }
        .week-col-head.sunday .day-number, .week-col-head.sunday .day-name {
            color: var(--sunday-red);
        }

        .week-scroll-area {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .time-row {
            display: grid;
            grid-template-columns: 60px repeat(7, 1fr);
            height: 60px;
            border-bottom: 1px solid #1c1d22;
        }

        .time-label {
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
            padding-right: 12px;
            transform: translateY(-8px);
        }

        .time-slot-cell {
            border-right: 1px solid #1a1a20;
            position: relative;
        }

        /* Red current time indicator line */
        .current-time-marker {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--time-indicator);
            z-index: 5;
            pointer-events: none;
        }
        .current-time-marker::before {
            content: '';
            position: absolute;
            left: 54px;
            top: -4px;
            width: 10px;
            height: 10px;
            background: var(--time-indicator);
            transform: rotate(45deg);
        }

        /* VIEW: DAY */
        .day-view-layout {
            display: flex;
            height: 100%;
        }

        .day-timeline {
            flex: 2;
            overflow-y: auto;
            position: relative;
            border-right: 1px solid var(--border-color);
        }

        .day-header-title {
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .day-detail-panel {
            flex: 1.2;
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 15px;
            padding: 24px;
        }

        /* VIEW: SCHEDULE */
        .schedule-list-view {
            padding: 24px;
            max-width: 900px;
            margin: 0 auto;
            overflow-y: auto;
            height: 100%;
        }

        .schedule-group {
            margin-bottom: 24px;
        }

        .schedule-date-header {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .schedule-card {
            background-color: var(--bg-surface);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 8px;
            border-left: 4px solid #22c55e;
            cursor: pointer;
            transition: background 0.2s;
        }
        .schedule-card:hover {
            background-color: #1a1b22;
        }

        .schedule-card .title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
        }
        .schedule-card .sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* VIEW: YEAR */
        .year-view-matrix {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 24px;
            height: 100%;
            overflow-y: auto;
        }

        .year-month-card {
            background: var(--bg-surface);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .year-month-card:hover {
            transform: scale(1.02);
            background: #191b22;
        }
        .year-month-title {
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            margin-bottom: 8px;
        }
        .year-grid-mini {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            font-size: 9px;
            text-align: center;
            row-gap: 4px;
            color: var(--text-muted);
        }

        /* ================= BOTTOM BAR (INPUT) ================= */
        .bottom-action-bar {
            height: 72px;
            background: var(--bg-main);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            gap: 12px;
            flex-shrink: 0;
        }

        .pill-input-box {
            flex: 1;
            max-width: 820px;
            background: var(--bg-pill);
            height: 48px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            transition: background 0.2s;
        }
        .pill-input-box:hover { background: #2f323a; }

        .add-floating-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #26282e;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: transform 0.15s ease, background-color 0.2s;
        }
        .add-floating-circle:hover {
            background-color: #3b3e47;
            transform: scale(1.05);
        }

        /* ================= MODAL ================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay.open { display: flex; }

        .samsung-modal {
            width: 90%;
            max-width: 440px;
            background: #18191e;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #2d2f38;
            box-shadow: 0 16px 36px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-row {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .s-input, .s-select {
            background: #23252d;
            border: 1px solid #333642;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .s-input:focus, .s-select:focus {
            border-color: #fff;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .s-btn {
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .s-btn-cancel { background: transparent; color: var(--text-muted); }
        .s-btn-save { background: #ffffff; color: #000000; }
    </style>
</head>
<body>

    <!-- LEFT SAMSUNG NAVIGATION RAIL -->
    <aside class="sidebar">
        <div class="side-btn" id="btnToggleSide" title="Menu">
            <span class="material-symbols-outlined">menu</span>
        </div>
        <div class="side-divider"></div>

        <div class="side-btn" data-view="year" title="Year View">
            <span class="material-symbols-outlined">calendar_apps</span>
        </div>
        <div class="side-btn active" data-view="month" title="Month View">
            <span class="material-symbols-outlined">calendar_month</span>
        </div>
        <div class="side-btn" data-view="week" title="Week View">
            <span class="material-symbols-outlined">calendar_view_week</span>
        </div>
        <div class="side-btn" data-view="day" title="Day View">
            <span class="material-symbols-outlined">calendar_today</span>
        </div>
        <div class="side-btn" data-view="schedule" title="Schedule">
            <span class="material-symbols-outlined">format_list_bulleted</span>
        </div>

        <div class="side-btn bottom" title="Reminders">
            <span class="material-symbols-outlined">notifications</span>
        </div>
        <div class="side-btn bottom" id="logoutBtn" title="Logout">
            <span class="material-symbols-outlined">logout</span>
        </div>
    </aside>

    <!-- MAIN BODY -->
    <main class="app-body">
        <!-- TOP APP BAR -->
        <header class="top-bar">
            <div class="title-display" id="appHeaderTitle">OCT</div>
            
            <div class="header-actions">
                <button class="icon-action-btn" id="prevPeriodBtn">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <button class="icon-action-btn" id="nextPeriodBtn">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>
                <button class="icon-action-btn" id="searchBtn" title="Search">
                    <span class="material-symbols-outlined">search</span>
                </button>
                <button class="today-badge-btn" id="jumpTodayBtn">22</button>
                <div class="user-pill" id="userPillDisplay">User</div>
            </div>
        </header>

        <!-- VIEWS VIEWPORT -->
        <div class="views-viewport" id="viewport">
            <!-- Dynamic Content Injected Here -->
        </div>

        <!-- BOTTOM PILL ACTION BAR -->
        <footer class="bottom-action-bar">
            <div class="pill-input-box" id="bottomPillTrigger">
                <span id="pillLabelText">Add event on 22 Oct</span>
            </div>
            <button class="add-floating-circle" id="floatingAddBtn">
                <span class="material-symbols-outlined">add</span>
            </button>
        </footer>
    </main>

    <!-- CREATE EVENT MODAL -->
    <div class="modal-overlay" id="createEventModal">
        <div class="samsung-modal">
            <div class="modal-title">New Schedule</div>
            
            <div class="form-row">
                <label>Title</label>
                <input type="text" class="s-input" id="modalEventName" placeholder="Meeting / Task / Note" />
            </div>

            <div class="form-row">
                <label>Date & Time</label>
                <input type="datetime-local" class="s-input" id="modalDateTime" />
            </div>

            <div class="form-row">
                <label>Duration</label>
                <select class="s-select" id="modalDuration">
                    <option value="30 Minutes">30 Minutes</option>
                    <option value="1 Hour" selected>1 Hour</option>
                    <option value="2 Hours">2 Hours</option>
                    <option value="3 Hours">3 Hours</option>
                    <option value="All Day">All Day</option>
                </select>
            </div>

            <div class="form-row">
                <label>Category Type</label>
                <select class="s-select" id="modalType">
                    <option value="Schedule">Schedule</option>
                    <option value="Meeting">Meeting</option>
                    <option value="Task">Task</option>
                    <option value="Personal">Personal</option>
                </select>
            </div>

            <div class="modal-actions">
                <button class="s-btn s-btn-cancel" id="modalCancelBtn">Cancel</button>
                <button class="s-btn s-btn-save" id="modalSaveBtn">Save</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE MODULE & APPLICATION LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            query, 
            where, 
            onSnapshot, 
            addDoc, 
            deleteDoc, 
            doc, 
            Timestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        /* ================= AUTHENTICATION CHECK ================= */
        const activeUserRaw = localStorage.getItem('active_user');
        if (!activeUserRaw) {
            window.location.href = '1.html';
        }
        const activeUser = JSON.parse(activeUserRaw || '{}');
        const userEmail = activeUser["Email"] || activeUser.email || "";

        document.getElementById('userPillDisplay').innerText = userEmail || "User";
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm("Sign out of Calendar?")) {
                localStorage.removeItem('active_user');
                window.location.href = '1.html';
            }
        });

        /* ================= FIREBASE SETUP ================= */
        const firebaseConfig = {
            apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
            authDomain: "question-metabase.firebaseapp.com",
            databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "question-metabase",
            storageBucket: "question-metabase.firebasestorage.app",
            messagingSenderId: "770698198753",
            appId: "1:770698198753:web:59ae49d78b6013bab5c1a0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        /* ================= STATE ================= */
        let currentView = 'month'; // 'month' | 'week' | 'day' | 'schedule' | 'year'
        let currentDate = new Date(); // live selected / reference date
        let eventsList = [];

        // Preloaded Festivities matching your screenshot
        const indianHolidays2026 = [
            { date: "2026-10-02", name: "Mahatma Gandhi Jayanti" },
            { date: "2026-10-11", name: "First Day of Sharad Navratri" },
            { date: "2026-10-17", name: "First Day of Durga Puja" },
            { date: "2026-10-18", name: "Maha Saptami" },
            { date: "2026-10-19", name: "Maha Ashtami" },
            { date: "2026-10-20", name: "Dussehra" },
            { date: "2026-10-26", name: "Maharishi Valmiki Jayanti" },
            { date: "2026-10-29", name: "Karaka Chaturthi" },
            { date: "2026-11-08", name: "Diwali/Deepavali" }
        ];

        /* ================= FIRESTORE SYNC (`data.sheet`) ================= */
        function initFirestoreListener() {
            if (!userEmail) return;

            // Schema matches Screenshot 2: Date_Time (Timestamp), Duration, Email, Name, Type
            const q = query(collection(db, "data.sheet"), where("Email", "==", userEmail));
            
            onSnapshot(q, (snapshot) => {
                eventsList = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    let jsDate = null;
                    if (data.Date_Time && data.Date_Time.toDate) {
                        jsDate = data.Date_Time.toDate();
                    } else if (data.Date_Time) {
                        jsDate = new Date(data.Date_Time);
                    }

                    eventsList.push({
                        id: docSnap.id,
                        name: data.Name || "Untitled",
                        dateTime: jsDate,
                        duration: data.Duration || "1 Hour",
                        type: data.Type || "Schedule",
                        email: data.Email
                    });
                });
                renderCurrentView();
            }, (error) => {
                console.error("Firestore error:", error);
            });
        }
        initFirestoreListener();

        /* ================= RENDER LOGIC ================= */
        const viewport = document.getElementById('viewport');
        const headerTitle = document.getElementById('appHeaderTitle');
        const pillLabel = document.getElementById('pillLabelText');
        const jumpTodayBtn = document.getElementById('jumpTodayBtn');

        const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEPT", "OCT", "NOV", "DEC"];
        const fullMonthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

        function updateHeader() {
            jumpTodayBtn.innerText = new Date().getDate();
            const monthStr = monthNames[currentDate.getMonth()];
            const yearStr = currentDate.getFullYear();
            
            if (currentView === 'year') {
                headerTitle.innerText = `${yearStr}`;
            } else {
                headerTitle.innerText = `${monthStr}`;
            }

            pillLabel.innerText = `Add event on ${currentDate.getDate()} ${monthStr.charAt(0) + monthStr.slice(1).toLowerCase()}`;
        }

        function renderCurrentView() {
            updateHeader();
            if (currentView === 'month') renderMonthView();
            else if (currentView === 'week') renderWeekView();
            else if (currentView === 'day') renderDayView();
            else if (currentView === 'schedule') renderScheduleView();
            else if (currentView === 'year') renderYearView();
        }

        /* ---------------- 1. MONTH VIEW ---------------- */
        function renderMonthView() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const firstDayIndex = new Date(year, month, 1).getDay(); // 0 is Sunday
            // Adjust to start on Monday: 0->6, 1->0, 2->1 ...
            const startCol = (firstDayIndex + 6) % 7; 
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevMonthDays = new Date(year, month, 0).getDate();

            let html = `
                <div class="month-view-grid">
                    <div class="month-header-row">
                        <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
                    </div>
                    <div class="month-days-matrix">
            `;

            // Previous month fill
            for (let i = startCol - 1; i >= 0; i--) {
                const dayNum = prevMonthDays - i;
                html += `<div class="month-day-cell other-month"><span class="cell-date-num">${dayNum}</span></div>`;
            }

            // Current month days
            for (let d = 1; d <= totalDays; d++) {
                const dateObj = new Date(year, month, d);
                const isSun = dateObj.getDay() === 0;
                const isSelected = d === currentDate.getDate();
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

                // Gather events
                const dayHolidays = indianHolidays2026.filter(h => h.date === dateKey);
                const dayEvents = eventsList.filter(e => {
                    if (!e.dateTime) return false;
                    return e.dateTime.getFullYear() === year && e.dateTime.getMonth() === month && e.dateTime.getDate() === d;
                });

                html += `
                    <div class="month-day-cell ${isSun ? 'is-sunday' : ''} ${isSelected ? 'selected' : ''}" data-day="${d}">
                        <span class="cell-date-num">${d}</span>
                        ${dayHolidays.map(h => `<div class="event-tag" title="${h.name}">${h.name}</div>`).join('')}
                        ${dayEvents.map(ev => `<div class="event-tag" style="background:#1e3a8a; border-left:3px solid #60a5fa; color:#dbeafe;" title="${ev.name}">${ev.name}</div>`).join('')}
                    </div>
                `;
            }

            html += `</div></div>`;
            viewport.innerHTML = html;

            viewport.querySelectorAll('.month-day-cell[data-day]').forEach(cell => {
                cell.addEventListener('click', () => {
                    const pickedDay = parseInt(cell.getAttribute('data-day'));
                    currentDate.setDate(pickedDay);
                    renderCurrentView();
                });
            });
        }

        /* ---------------- 2. WEEK VIEW ---------------- */
        function renderWeekView() {
            const temp = new Date(currentDate);
            const dayOfWeek = (temp.getDay() + 6) % 7; // Monday = 0
            temp.setDate(temp.getDate() - dayOfWeek); // Start at Monday

            const weekDates = [];
            for (let i = 0; i < 7; i++) {
                weekDates.push(new Date(temp));
                temp.setDate(temp.getDate() + 1);
            }

            let topHtml = `<div class="week-top-columns"><div class="week-col-head"></div>`;
            const dayLabels = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];

            weekDates.forEach((d, idx) => {
                const isSunday = d.getDay() === 0;
                const isSelected = d.getDate() === currentDate.getDate() && d.getMonth() === currentDate.getMonth();
                topHtml += `
                    <div class="week-col-head ${isSunday ? 'sunday' : ''} ${isSelected ? 'selected' : ''}">
                        <div class="day-name">${dayLabels[idx]}</div>
                        <div class="day-number">${d.getDate()}</div>
                    </div>
                `;
            });
            topHtml += `</div>`;

            let timeRowsHtml = '';
            for (let hour = 0; hour < 24; hour++) {
                const hourFormatted = hour === 0 ? '12 AM' : hour < 12 ? `${hour} AM` : hour === 12 ? '12 PM' : `${hour - 12} PM`;
                timeRowsHtml += `
                    <div class="time-row">
                        <div class="time-label">${hourFormatted}</div>
                        ${weekDates.map(() => `<div class="time-slot-cell"></div>`).join('')}
                    </div>
                `;
            }

            viewport.innerHTML = `
                <div class="week-view-container">
                    ${topHtml}
                    <div class="week-scroll-area" id="weekScroll">
                        <div id="timeIndicator" class="current-time-marker"></div>
                        ${timeRowsHtml}
                    </div>
                </div>
            `;

            positionLiveIndicator('weekScroll');
        }

        /* ---------------- 3. DAY VIEW ---------------- */
        function renderDayView() {
            const dayString = `${currentDate.getDate()} ${fullMonthNames[currentDate.getMonth()]}, ${dayNames[currentDate.getDay()]}`;
            
            // Events for this day
            const selectedEvents = eventsList.filter(e => {
                return e.dateTime && 
                       e.dateTime.getDate() === currentDate.getDate() && 
                       e.dateTime.getMonth() === currentDate.getMonth() && 
                       e.dateTime.getFullYear() === currentDate.getFullYear();
            });

            let timeSlots = '';
            for (let h = 5; h <= 23; h++) {
                const hLabel = h <= 12 ? `${h} ${h === 12 ? 'PM' : 'AM'}` : `${h - 12} PM`;
                timeSlots += `
                    <div class="time-row" style="grid-template-columns: 80px 1fr;">
                        <div class="time-label">${hLabel}</div>
                        <div class="time-slot-cell"></div>
                    </div>
                `;
            }

            viewport.innerHTML = `
                <div class="day-view-layout">
                    <div class="day-timeline" id="dayScroll">
                        <div class="day-header-title">
                            <span class="cell-date-num" style="border: 2px solid #fff;">${currentDate.getDate()}</span>
                            <span>${dayNames[currentDate.getDay()]}</span>
                        </div>
                        <div id="timeIndicator" class="current-time-marker"></div>
                        ${timeSlots}
                    </div>
                    <div class="day-detail-panel">
                        ${selectedEvents.length === 0 ? '<span>No event selected</span>' : `
                            <div style="width:100%;">
                                <h3 style="margin-bottom:12px;color:#fff;">Events Today</h3>
                                ${selectedEvents.map(ev => `
                                    <div class="schedule-card" style="margin-bottom:8px;">
                                        <div>
                                            <div class="title">${ev.name}</div>
                                            <div class="sub">${ev.type} &bull; ${ev.duration}</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;

            positionLiveIndicator('dayScroll');
        }

        /* ---------------- 4. SCHEDULE VIEW ---------------- */
        function renderScheduleView() {
            let html = `<div class="schedule-list-view"><h2 style="margin-bottom:20px;">Schedule</h2>`;
            
            // Group holidays + events
            const allItems = [
                ...indianHolidays2026.map(h => ({ name: h.name, date: new Date(h.date), type: "Holiday", duration: "All day" })),
                ...eventsList.map(e => ({ name: e.name, date: e.dateTime, type: e.type, duration: e.duration, id: e.id }))
            ].filter(item => item.date).sort((a,b) => a.date - b.date);

            if (allItems.length === 0) {
                html += `<div style="text-align:center;color:#666;margin-top:60px;">No events &bull; Enjoy your day!</div>`;
            } else {
                let lastDateKey = "";
                allItems.forEach(item => {
                    const dateKey = `${item.date.getDate()} ${monthNames[item.date.getMonth()]}`;
                    if (dateKey !== lastDateKey) {
                        html += `<div class="schedule-date-header">${dayNames[item.date.getDay()]}, ${dateKey}</div>`;
                        lastDateKey = dateKey;
                    }
                    html += `
                        <div class="schedule-card">
                            <span class="material-symbols-outlined" style="color:#22c55e;">event</span>
                            <div style="flex:1;">
                                <div class="title">${item.name}</div>
                                <div class="sub">${item.duration} &bull; ${item.type}</div>
                            </div>
                            ${item.id ? `<button data-id="${item.id}" class="delete-btn icon-action-btn" title="Delete"><span class="material-symbols-outlined" style="color:#e57373;">delete</span></button>` : ''}
                        </div>
                    `;
                });
            }

            html += `</div>`;
            viewport.innerHTML = html;

            viewport.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const docId = btn.getAttribute('data-id');
                    if (confirm("Delete this event?")) {
                        await deleteDoc(doc(db, "data.sheet", docId));
                    }
                });
            });
        }

        /* ---------------- 5. YEAR VIEW ---------------- */
        function renderYearView() {
            const year = currentDate.getFullYear();
            let html = `<div class="year-view-matrix">`;

            for (let m = 0; m < 12; m++) {
                html += `
                    <div class="year-month-card" data-month="${m}">
                        <div class="year-month-title">${monthNames[m]}</div>
                        <div class="year-grid-mini">
                            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span style="color:var(--sunday-red)">S</span>
                `;

                const firstDay = (new Date(year, m, 1).getDay() + 6) % 7;
                const total = new Date(year, m + 1, 0).getDate();

                for (let b = 0; b < firstDay; b++) html += `<span></span>`;
                for (let day = 1; day <= total; day++) {
                    const isSun = (firstDay + day - 1) % 7 === 6;
                    html += `<span style="${isSun ? 'color:var(--sunday-red)' : ''}">${day}</span>`;
                }

                html += `</div></div>`;
            }

            html += `</div>`;
            viewport.innerHTML = html;

            viewport.querySelectorAll('.year-month-card').forEach(card => {
                card.addEventListener('click', () => {
                    currentDate.setMonth(parseInt(card.getAttribute('data-month')));
                    switchView('month');
                });
            });
        }

        /* ================= REAL-TIME RED TIMELINE BAR ================= */
        function positionLiveIndicator(scrollContainerId) {
            const indicator = document.getElementById('timeIndicator');
            const container = document.getElementById(scrollContainerId);
            if (!indicator || !container) return;

            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();

            // Each hour corresponds to 60px height in week view
            const topOffset = (hours * 60) + minutes;
            indicator.style.top = `${topOffset}px`;
            
            // Auto scroll close to current time on load
            container.scrollTop = Math.max(0, topOffset - 120);
        }

        /* ================= VIEW NAVIGATION ================= */
        function switchView(viewName) {
            currentView = viewName;
            document.querySelectorAll('.side-btn[data-view]').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-view') === viewName);
            });
            renderCurrentView();
        }

        document.querySelectorAll('.side-btn[data-view]').forEach(btn => {
            btn.addEventListener('click', () => {
                switchView(btn.getAttribute('data-view'));
            });
        });

        // Navigation Chevron Controls
        document.getElementById('prevPeriodBtn').addEventListener('click', () => {
            if (currentView === 'year') currentDate.setFullYear(currentDate.getFullYear() - 1);
            else if (currentView === 'month') currentDate.setMonth(currentDate.getMonth() - 1);
            else if (currentView === 'week') currentDate.setDate(currentDate.getDate() - 7);
            else if (currentView === 'day') currentDate.setDate(currentDate.getDate() - 1);
            renderCurrentView();
        });

        document.getElementById('nextPeriodBtn').addEventListener('click', () => {
            if (currentView === 'year') currentDate.setFullYear(currentDate.getFullYear() + 1);
            else if (currentView === 'month') currentDate.setMonth(currentDate.getMonth() + 1);
            else if (currentView === 'week') currentDate.setDate(currentDate.getDate() + 7);
            else if (currentView === 'day') currentDate.setDate(currentDate.getDate() + 1);
            renderCurrentView();
        });

        document.getElementById('jumpTodayBtn').addEventListener('click', () => {
            currentDate = new Date();
            renderCurrentView();
        });

        /* ================= ADD EVENT MODAL ================= */
        const modal = document.getElementById('createEventModal');
        const pillTrigger = document.getElementById('bottomPillTrigger');
        const floatingAdd = document.getElementById('floatingAddBtn');
        const modalCancel = document.getElementById('modalCancelBtn');
        const modalSave = document.getElementById('modalSaveBtn');

        function openModal() {
            const dtInput = document.getElementById('modalDateTime');
            // ISO format without timezone offset for local input
            const localIso = new Date(currentDate.getTime() - currentDate.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
            dtInput.value = localIso;
            modal.classList.add('open');
        }

        pillTrigger.addEventListener('click', openModal);
        floatingAdd.addEventListener('click', openModal);
        modalCancel.addEventListener('click', () => modal.classList.remove('open'));

        modalSave.addEventListener('click', async () => {
            const name = document.getElementById('modalEventName').value.trim();
            const dtVal = document.getElementById('modalDateTime').value;
            const duration = document.getElementById('modalDuration').value;
            const type = document.getElementById('modalType').value;

            if (!name) return alert("Please enter an event name");
            if (!dtVal) return alert("Please specify the date and time");

            modalSave.innerText = "Saving...";

            try {
                // Exactly matches Firestore Schema shown in Screenshot 2
                await addDoc(collection(db, "data.sheet"), {
                    Name: name,
                    Date_Time: Timestamp.fromDate(new Date(dtVal)),
                    Duration: duration,
                    Type: type,
                    Email: userEmail
                });

                document.getElementById('modalEventName').value = "";
                modal.classList.remove('open');
            } catch (err) {
                console.error("Error creating document:", err);
                alert("Failed to save event to database.");
            } finally {
                modalSave.innerText = "Save";
            }
        });

        // Initialize display
        renderCurrentView();
    </script>
</body>
</html>
