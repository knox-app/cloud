<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Samsung Calendar</title>
    <style>
        :root {
            --bg-canvas: #000000;
            --bg-surface: #121212;
            --bg-card: #1c1c1e;
            --bg-elevated: #28282a;
            --border-subtle: #232326;
            --border-strong: #38383a;
            --text-primary: #ffffff;
            --text-secondary: #909095;
            --text-muted: #55555a;
            --accent-green: #30d158;
            --accent-badge: #1a3324;
            --accent-badge-text: #62d88d;
            --accent-coral: #e07a5f;
            --accent-coral-glow: rgba(224, 122, 95, 0.35);
            --timeline-indicator: #ff7966;
            --active-squircle: #2c2c2e;
            --sidebar-width: 68px;
            --zoom-scale: 1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* ================= SAMSUNG LEFT RAIL (DESKTOP/TABLET) ================= */
        .sidebar-rail {
            width: var(--sidebar-width);
            height: 100%;
            background-color: var(--bg-canvas);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            z-index: 50;
        }

        .samsung-icon-btn {
            background: none;
            border: none;
            color: #8c8c92;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 14px;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
        }

        .samsung-icon-btn:hover {
            color: #ffffff;
            background-color: var(--bg-card);
        }

        /* Exactly matches Image 1 squircle highlighted background */
        .samsung-icon-btn.active {
            color: #ffffff;
            background-color: var(--active-squircle);
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
        }

        .samsung-icon-btn svg {
            width: 25px;
            height: 25px;
        }

        .rail-spacer {
            flex: 1;
        }

        /* ================= MAIN WORKSPACE ================= */
        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* Top Navigation Header */
        .top-navbar {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background-color: var(--bg-canvas);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 40;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title-wrap {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .nav-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-icon-btn:hover {
            color: var(--text-primary);
            background: var(--bg-card);
        }

        .today-chip {
            border: 1.5px solid var(--text-secondary);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            min-width: 30px;
            height: 26px;
            padding: 0 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Google-style Profile Avatar Button */
        .profile-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #3a3a3e;
            padding: 2px;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2b2b2e;
            transition: transform 0.15s ease, border-color 0.2s;
        }

        .profile-btn:hover {
            transform: scale(1.05);
            border-color: #ffffff;
        }

        .profile-btn img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-initial {
            font-weight: 700;
            font-size: 14px;
            color: #ffffff;
        }

        /* ================= ZOOMABLE CALENDAR VIEWPORT ================= */
        .viewport-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .viewport-container {
            height: 100%;
            width: 100%;
            overflow-y: auto;
            position: relative;
            transform-origin: top center;
            transition: transform 0.2s ease-out;
            scrollbar-width: thin;
            scrollbar-color: var(--bg-elevated) transparent;
        }

        /* Floating Zoom In & Out Pill Controls */
        .zoom-controls {
            position: absolute;
            top: 14px;
            right: 18px;
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-strong);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 2px 6px;
            z-index: 35;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }

        .zoom-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            font-weight: 600;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .zoom-btn:hover {
            color: #ffffff;
        }

        .zoom-level-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            min-width: 38px;
            text-align: center;
        }

        /* ================= 1. MONTH VIEW ================= */
        .month-view {
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

        .weekdays-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            padding: 10px 0;
            border-bottom: 1px solid var(--border-subtle);
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .weekdays-header div:last-child {
            color: #ff453a;
        }

        .month-days-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(95px, 1fr);
        }

        .month-cell {
            border-right: 1px solid var(--border-subtle);
            border-bottom: 1px solid var(--border-subtle);
            padding: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
        }

        .month-cell:nth-child(7n) {
            border-right: none;
        }

        .month-cell.inactive .date-number {
            color: var(--text-muted);
        }

        .month-cell.selected {
            outline: 2px solid #ffffff;
            outline-offset: -2px;
            border-radius: 8px;
        }

        .date-number {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .is-sunday .date-number {
            color: #ff453a;
        }

        .is-today .date-number {
            background-color: #ffffff;
            color: #000000;
            font-weight: 700;
        }

        .event-badge {
            background-color: var(--accent-badge);
            color: var(--accent-badge-text);
            font-size: 11px;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ================= 2. WEEK VIEW ================= */
        .week-view {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .hourly-grid {
            display: grid;
            grid-template-columns: 50px repeat(7, 1fr);
            position: relative;
        }

        .hour-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: right;
            padding-right: 8px;
            height: 60px;
            transform: translateY(-7px);
        }

        .hour-slot {
            height: 60px;
            border-top: 1px solid var(--border-subtle);
            border-right: 1px solid var(--border-subtle);
            position: relative;
        }

        .hour-slot:nth-child(8n) {
            border-right: none;
        }

        .time-now-line {
            position: absolute;
            left: 50px;
            right: 0;
            height: 2px;
            background-color: var(--timeline-indicator);
            z-index: 10;
        }

        /* ================= 3. DAY VIEW ================= */
        .day-view-container {
            display: flex;
            height: 100%;
            width: 100%;
        }

        .day-timeline {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .day-details-panel {
            width: 360px;
            background-color: var(--bg-card);
            margin: 16px;
            border-radius: 18px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .day-event-block {
            position: absolute;
            left: 64px;
            right: 16px;
            background: var(--accent-badge);
            color: var(--accent-badge-text);
            border-left: 3px solid var(--accent-green);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            z-index: 5;
        }

        /* ================= 4. SCHEDULE / TIMELINE ================= */
        .schedule-view {
            padding: 20px 24px 100px;
            max-width: 740px;
            margin: 0 auto;
        }

        .schedule-group {
            margin-bottom: 24px;
        }

        .schedule-group-header {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .schedule-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .schedule-color-bar {
            width: 4px;
            height: 38px;
            background: var(--accent-green);
            border-radius: 2px;
        }

        /* ================= FLOATING ACTION BAR ================= */
        .bottom-action-bar {
            position: absolute;
            bottom: 18px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 40;
        }

        .quick-input-capsule {
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: 30px;
            padding: 0 16px;
            height: 48px;
            display: flex;
            align-items: center;
            width: 250px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
        }

        .quick-input-capsule input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            width: 100%;
        }

        .fab-btn {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-strong);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.7);
            transition: transform 0.15s ease;
        }

        .fab-btn:active {
            transform: scale(0.92);
        }

        .fab-btn svg {
            width: 24px;
            height: 24px;
        }

        /* ================= MOBILE BOTTOM NAVIGATION BAR ================= */
        .mobile-bottom-nav {
            display: none;
            height: 64px;
            background-color: var(--bg-canvas);
            border-top: 1px solid var(--border-subtle);
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 50;
            align-items: center;
            justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* ================= GOOGLE PROFILE POPUP CARD ================= */
        .profile-popover-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 100;
            display: none;
        }

        .profile-popover-overlay.active {
            display: block;
        }

        .google-account-card {
            position: absolute;
            top: 68px;
            right: 18px;
            width: 340px;
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.8);
            z-index: 101;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.94) translateY(-10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .card-avatar-large {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #2b2b2e;
            border: 2px solid #4a4a50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .card-avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-user-name {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-user-email {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .account-type-badge {
            background-color: var(--bg-elevated);
            color: #d1d1d6;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 18px;
            border: 1px solid var(--border-strong);
        }

        .popover-menu-list {
            width: 100%;
            border-top: 1px solid var(--border-subtle);
            padding-top: 8px;
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .popover-item {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .popover-item:hover {
            background: var(--bg-elevated);
        }

        .popover-item svg {
            width: 20px;
            height: 20px;
            stroke-width: 2;
            color: var(--text-secondary);
        }

        /* ================= IMAGE 2 BOTTOM SHEET (CREATE PROJECT / SCHEDULE) ================= */
        .sheet-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: flex-end; /* Bottom sheet on mobile */
            justify-content: center;
            z-index: 120;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            backdrop-filter: blur(5px);
        }

        .sheet-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .samsung-bottom-sheet {
            background: #141416;
            border-top: 1px solid var(--border-strong);
            width: 100%;
            max-width: 520px;
            border-radius: 28px 28px 0 0; /* Matches Image 2 */
            padding: 14px 22px 28px;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
        }

        .sheet-backdrop.active .samsung-bottom-sheet {
            transform: translateY(0);
        }

        .sheet-drag-pill {
            width: 44px;
            height: 5px;
            background-color: #3e3e42;
            border-radius: 3px;
            margin: 0 auto 16px;
        }

        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .sheet-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .sheet-close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
        }

        .sheet-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #d1d1d6;
            margin-bottom: 8px;
            text-align: left;
        }

        /* Image 2 focus border styling */
        .sheet-input {
            width: 100%;
            background-color: var(--bg-canvas);
            border: 1.5px solid var(--border-strong);
            color: var(--text-primary);
            padding: 15px 16px;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            margin-bottom: 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .sheet-input:focus {
            border-color: var(--accent-coral);
            box-shadow: 0 0 0 2px var(--accent-coral-glow);
        }

        .sheet-textarea {
            width: 100%;
            background-color: var(--bg-canvas);
            border: 1.5px solid var(--border-strong);
            color: var(--text-primary);
            padding: 15px 16px;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            height: 90px;
            resize: none;
            margin-bottom: 22px;
            transition: border-color 0.2s;
        }

        .sheet-textarea:focus {
            border-color: var(--accent-coral);
            box-shadow: 0 0 0 2px var(--accent-coral-glow);
        }

        /* Full width rounded button from Image 2 */
        .sheet-submit-btn {
            width: 100%;
            background-color: #2c2c30;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .sheet-submit-btn:hover {
            background-color: #3a3a40;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .sidebar-rail {
                display: none;
            }

            .mobile-bottom-nav {
                display: flex;
            }

            .bottom-action-bar {
                bottom: 80px;
                right: 18px;
            }

            .quick-input-capsule {
                display: none;
            }

            .day-details-panel {
                display: none;
            }

            .google-account-card {
                right: 10px;
                left: 10px;
                width: auto;
            }
        }
    </style>
</head>
<body>

    <!-- ================= 1. SAMSUNG DESKTOP / TABLET RAIL ================= -->
    <aside class="sidebar-rail">
        <!-- 1: Month / Calendar View -->
        <button class="samsung-icon-btn active" data-view="month" title="Month">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3.5" y="4.5" width="17" height="16" rx="3.5" stroke-width="2"/>
                <line x1="8" y1="2" x2="8" y2="5" stroke-width="2" stroke-linecap="round"/>
                <line x1="16" y1="2" x2="16" y2="5" stroke-width="2" stroke-linecap="round"/>
                <line x1="6.5" y1="9.5" x2="17.5" y2="9.5" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </button>

        <!-- 2: Week / Grid View -->
        <button class="samsung-icon-btn" data-view="week" title="Week">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3.5" y="4.5" width="17" height="15" rx="3" stroke-width="2"/>
                <line x1="3.5" y1="9" x2="20.5" y2="9" stroke-width="2"/>
                <line x1="8.5" y1="4.5" x2="8.5" y2="19.5" stroke-width="2"/>
            </svg>
        </button>

        <!-- 3: Day / Split View -->
        <button class="samsung-icon-btn" data-view="day" title="Day">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <rect x="3.5" y="4.5" width="17" height="15" rx="3" stroke-width="2"/>
                <line x1="3.5" y1="10" x2="20.5" y2="10" stroke-width="2"/>
                <line x1="11" y1="10" x2="11" y2="19.5" stroke-width="2"/>
            </svg>
        </button>

        <!-- 4: Clock / Time Timeline -->
        <button class="samsung-icon-btn" data-view="timeline" title="Time Schedule">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" stroke-width="2"/>
                <polyline points="12 7 12 12 15 15" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>

        <!-- 5: Agenda / List View -->
        <button class="samsung-icon-btn" data-view="schedule" title="Agenda List">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <line x1="5" y1="6" x2="19" y2="6" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="5" y1="10.5" x2="19" y2="10.5" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="5" y1="15" x2="19" y2="15" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="5" y1="19.5" x2="19" y2="19.5" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </button>

        <div class="rail-spacer"></div>
    </aside>

    <!-- ================= 2. MAIN APPLICATION STAGE ================= -->
    <main class="main-stage">
        <!-- Top Navbar -->
        <header class="top-navbar">

    <!-- ================= 6. FIREBASE & APPLICATION LOGIC ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            Timestamp, 
            query, 
            where,
            deleteDoc,
            doc
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Provided Firebase Firestore Database Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
            authDomain: "cloud-computer-4891a.firebaseapp.com",
            projectId: "cloud-computer-4891a",
            storageBucket: "cloud-computer-4891a.firebasestorage.app",
            messagingSenderId: "744203234287",
            appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
            measurementId: "G-QE17C33TMN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Retrieve Active User from Login System
        let activeUser = null;
        try {
            const stored = localStorage.getItem('active_user');
            if (stored) activeUser = JSON.parse(stored);
        } catch (e) {
            console.error("Local user parsing failed:", e);
        }

        if (!activeUser || !activeUser.Email) {
            window.location.href = "1.html?continue=" + encodeURIComponent(window.location.href);
        }

        // Setup User Info & Google Popup
        const userName = activeUser["First Name"] || (activeUser.Email ? activeUser.Email.split('@')[0] : "User");
        const userEmail = activeUser.Email || "";
        const userAvatar = activeUser.Profile_Picture || activeUser["Profile Picture"] || null;

        document.getElementById('cardUserName').innerText = userName;
        document.getElementById('cardUserEmail').innerText = userEmail;

        if (userAvatar) {
            const topNavImg = document.getElementById('topNavAvatar');
            topNavImg.src = userAvatar;
            topNavImg.style.display = 'block';
            document.getElementById('topNavInitial').style.display = 'none';

            const cardImg = document.getElementById('cardAvatarImg');
            cardImg.src = userAvatar;
            cardImg.style.display = 'block';
            document.getElementById('cardAvatarInitial').style.display = 'none';
        } else {
            const initial = userName.charAt(0).toUpperCase();
            document.getElementById('topNavInitial').innerText = initial;
            document.getElementById('cardAvatarInitial').innerText = initial;
        }

        // Toggle Google Profile Popover
        const profileBtn = document.getElementById('profileToggleBtn');
        const profileOverlay = document.getElementById('profileOverlay');

        profileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            profileOverlay.classList.toggle('active');
        });

        profileOverlay.addEventListener('click', (e) => {
            if (e.target === profileOverlay) profileOverlay.classList.remove('active');
        });

        document.getElementById('switchAccountBtn').addEventListener('click', () => {
            window.location.href = "3.html"; // Switch account chooser page
        });

        document.getElementById('settingsBtn').addEventListener('click', () => {
            alert(`Calendar Settings\n\nConnected Database: cloud-computer-4891a\nAccount: ${userEmail}\nTheme: Dark AMOLED`);
            profileOverlay.classList.remove('active');
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm(`Sign out from ${userEmail}?`)) {
                localStorage.removeItem('active_user');
                window.location.href = "1.html";
            }
        });

        // ================= ZOOM IN & ZOOM OUT SYSTEM =================
        let currentZoom = 1;
        const minZoom = 0.75;
        const maxZoom = 1.6;
        const viewportContainer = document.getElementById('calendarViewport');
        const zoomLevelDisplay = document.getElementById('zoomLevelDisplay');

        function setZoom(scale) {
            currentZoom = Math.min(Math.max(scale, minZoom), maxZoom);
            document.documentElement.style.setProperty('--zoom-scale', currentZoom);
            viewportContainer.style.transform = `scale(${currentZoom})`;
            zoomLevelDisplay.innerText = Math.round(currentZoom * 100) + '%';
        }

        document.getElementById('zoomInBtn').addEventListener('click', () => setZoom(currentZoom + 0.15));
        document.getElementById('zoomOutBtn').addEventListener('click', () => setZoom(currentZoom - 0.15));

        // Touch Pinch-to-Zoom Gesture Support
        let initialDistance = 0;
        let initialZoom = 1;
        const zoomWrapper = document.getElementById('zoomWrapper');

        zoomWrapper.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                initialZoom = currentZoom;
            }
        }, { passive: true });

        zoomWrapper.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialDistance > 0) {
                const newDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                const factor = newDist / initialDistance;
                setZoom(initialZoom * factor);
            }
        }, { passive: true });

        // Wheel Zoom Support (Ctrl + Wheel)
        zoomWrapper.addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.08 : -0.08;
                setZoom(currentZoom + delta);
            }
        }, { passive: false });

        // ================= CALENDAR STATE & FIRESTORE SYNC =================
        let currentDate = new Date();
        let selectedDate = new Date();
        let currentView = 'month';
        let firestoreEvents = [];

        // Realtime Firestore synchronization on 'data.sheet'
        const eventsRef = collection(db, "data.sheet");
        const userQuery = query(eventsRef, where("Email", "==", userEmail));

        onSnapshot(userQuery, (snapshot) => {
            firestoreEvents = [];
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                let dateObj = null;

                if (data.Date_Time && typeof data.Date_Time.toDate === 'function') {
                    dateObj = data.Date_Time.toDate();
                } else if (data.Date_Time) {
                    dateObj = new Date(data.Date_Time);
                }

                firestoreEvents.push({
                    id: docSnap.id,
                    name: data.Name || "Untitled Project",
                    duration: data.Duration || "1 Hour",
                    type: data.Type || "Schedule",
                    email: data.Email,
                    date: dateObj || new Date()
                });
            });
            renderActiveView();
        });

        // Navigation
        document.getElementById('prevPeriodBtn').addEventListener('click', () => changePeriod(-1));
        document.getElementById('nextPeriodBtn').addEventListener('click', () => changePeriod(1));

        function changePeriod(delta) {
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() + delta);
            } else if (currentView === 'week') {
                currentDate.setDate(currentDate.getDate() + (delta * 7));
            } else if (currentView === 'day' || currentView === 'timeline') {
                currentDate.setDate(currentDate.getDate() + delta);
                selectedDate = new Date(currentDate);
            }
            renderActiveView();
        }

        document.getElementById('goTodayBtn').addEventListener('click', () => {
            currentDate = new Date();
            selectedDate = new Date();
            renderActiveView();
        });

        // Icon Buttons View Switching (Desktop Rail + Mobile Bottom Bar)
        const allNavButtons = document.querySelectorAll('.samsung-icon-btn');
        allNavButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const view = btn.dataset.view;
                if (!view) return;
                currentView = view;
                allNavButtons.forEach(b => {
                    if (b.dataset.view === view) b.classList.add('active');
                    else b.classList.remove('active');
                });
                renderActiveView();
            });
        });

        // Update Header Labels
        const headerMonth = document.getElementById('displayHeaderMonth');
        const headerYear = document.getElementById('displayHeaderYear');

        function updateHeaderLabels() {
            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEPT", "OCT", "NOV", "DEC"];
            headerMonth.innerText = months[currentDate.getMonth()];
            headerYear.innerText = currentDate.getFullYear();
            document.getElementById('goTodayBtn').innerText = new Date().getDate();
            document.getElementById('quickEventInput').placeholder = `Add project on ${selectedDate.getDate()} ${months[selectedDate.getMonth()]}`;
        }

        // Master Renderer
        function renderActiveView() {
            updateHeaderLabels();
            viewportContainer.innerHTML = "";

            if (currentView === 'month') renderMonthView();
            else if (currentView === 'week') renderWeekView();
            else if (currentView === 'day') renderDayView();
            else if (currentView === 'timeline') renderTimelineView();
            else if (currentView === 'schedule') renderScheduleView();
        }

        /* --- 1. Month View --- */
        function renderMonthView() {
            const container = document.createElement('div');
            container.className = 'month-view';

            const weekdays = document.createElement('div');
            weekdays.className = 'weekdays-header';
            weekdays.innerHTML = `<div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>`;
            container.appendChild(weekdays);

            const grid = document.createElement('div');
            grid.className = 'month-days-grid';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const prevMonthDays = new Date(year, month, 0).getDate();

            for (let i = 0; i < 35; i++) {
                const cell = document.createElement('div');
                cell.className = 'month-cell';

                let dayNumber, cellDate;
                if (i < firstDayIndex) {
                    dayNumber = prevMonthDays - firstDayIndex + i + 1;
                    cellDate = new Date(year, month - 1, dayNumber);
                    cell.classList.add('inactive');
                } else if (i < firstDayIndex + daysInMonth) {
                    dayNumber = i - firstDayIndex + 1;
                    cellDate = new Date(year, month, dayNumber);
                } else {
                    dayNumber = i - (firstDayIndex + daysInMonth) + 1;
                    cellDate = new Date(year, month + 1, dayNumber);
                    cell.classList.add('inactive');
                }

                if (i % 7 === 6) cell.classList.add('is-sunday');
                if (isSameDay(cellDate, new Date())) cell.classList.add('is-today');
                if (isSameDay(cellDate, selectedDate)) cell.classList.add('selected');

                const numEl = document.createElement('div');
                numEl.className = 'date-number';
                numEl.innerText = dayNumber;
                cell.appendChild(numEl);

                // Live Firestore events
                const dayEvents = firestoreEvents.filter(ev => isSameDay(ev.date, cellDate));
                dayEvents.forEach(ev => {
                    const badge = document.createElement('div');
                    badge.className = 'event-badge';
                    badge.innerText = ev.name;
                    badge.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteEventPrompt(ev);
                    });
                    cell.appendChild(badge);
                });

                cell.addEventListener('click', () => {
                    selectedDate = cellDate;
                    renderMonthView();
                });

                grid.appendChild(cell);
            }

            container.appendChild(grid);
            viewportContainer.appendChild(container);
        }

        /* --- 2. Week View --- */
        function renderWeekView() {
            const container = document.createElement('div');
            container.className = 'week-view';

            const startOfWeek = new Date(currentDate);
            const dayOfWeek = (startOfWeek.getDay() + 6) % 7;
            startOfWeek.setDate(startOfWeek.getDate() - dayOfWeek);

            const headerRow = document.createElement('div');
            headerRow.className = 'weekdays-header';
            headerRow.style.gridTemplateColumns = '50px repeat(7, 1fr)';
            headerRow.innerHTML = '<div></div>';

            const daysLetters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
            for (let d = 0; d < 7; d++) {
                const dayDate = new Date(startOfWeek);
                dayDate.setDate(dayDate.getDate() + d);
                const col = document.createElement('div');
                col.innerHTML = `<div>${daysLetters[d]}</div><div style="font-size:12px; font-weight:700;">${dayDate.getDate()}</div>`;
                if (d === 6) col.style.color = '#ff453a';
                headerRow.appendChild(col);
            }
            container.appendChild(headerRow);

            const grid = document.createElement('div');
            grid.className = 'hourly-grid';

            for (let hour = 0; hour < 24; hour++) {
                const label = document.createElement('div');
                label.className = 'hour-label';
                label.innerText = hour === 0 ? '12 AM' : hour < 12 ? `${hour} AM` : hour === 12 ? '12 PM' : `${hour - 12} PM`;
                grid.appendChild(label);

                for (let d = 0; d < 7; d++) {
                    const slot = document.createElement('div');
                    slot.className = 'hour-slot';
                    grid.appendChild(slot);
                }
            }

            container.appendChild(grid);
            viewportContainer.appendChild(container);
        }

        /* --- 3. Day View --- */
        function renderDayView() {
            const container = document.createElement('div');
            container.className = 'day-view-container';

            const timeline = document.createElement('div');
            timeline.className = 'day-timeline';

            for (let hour = 0; hour < 24; hour++) {
                const row = document.createElement('div');
                row.style.display = 'flex';
                row.style.height = '60px';
                row.style.borderBottom = '1px solid var(--border-subtle)';

                const label = document.createElement('div');
                label.className = 'hour-label';
                label.style.width = '60px';
                label.innerText = hour === 0 ? '12 AM' : hour < 12 ? `${hour} AM` : hour === 12 ? '12 PM' : `${hour - 12} PM`;
                row.appendChild(label);

                const slot = document.createElement('div');
                slot.style.flex = '1';
                slot.style.position = 'relative';
                row.appendChild(slot);

                timeline.appendChild(row);
            }

            const dayEvents = firestoreEvents.filter(ev => isSameDay(ev.date, selectedDate));
            dayEvents.forEach(ev => {
                const block = document.createElement('div');
                block.className = 'day-event-block';
                const startMins = ev.date.getHours() * 60 + ev.date.getMinutes();
                block.style.top = `${startMins}px`;
                block.style.height = '50px';
                block.innerHTML = `<strong>${ev.name}</strong> · ${ev.duration}`;
                block.addEventListener('click', () => deleteEventPrompt(ev));
                timeline.appendChild(block);
            });

            container.appendChild(timeline);

            const panel = document.createElement('div');
            panel.className = 'day-details-panel';
            if (dayEvents.length === 0) {
                panel.innerHTML = `<div style="font-size: 18px; font-weight:600; color:var(--text-secondary); margin-bottom: 6px;">No event selected</div><div style="font-size: 13px; color:var(--text-muted);">Tap + below to create projects</div>`;
            } else {
                panel.innerHTML = `<h3 style="margin-bottom:12px; color:var(--accent-green);">${dayEvents.length} Project(s)</h3>` + 
                    dayEvents.map(e => `<div style="background:var(--bg-canvas); border-radius:12px; padding:12px; margin-bottom:8px; width:100%; text-align:left;"><div style="font-weight:600;">${e.name}</div><div style="font-size:12px; color:var(--text-secondary);">${e.duration} · ${e.type}</div></div>`).join('');
            }
            container.appendChild(panel);

            viewportContainer.appendChild(container);
        }

        /* --- 4. Timeline / Clock View --- */
        function renderTimelineView() {
            renderDayView();
        }

        /* --- 5. Schedule / Agenda View --- */
        function renderScheduleView() {
            const container = document.createElement('div');
            container.className = 'schedule-view';

            if (firestoreEvents.length === 0) {
                container.innerHTML = `<div style="text-align: center; margin-top: 100px;"><h3 style="font-weight: 500; font-size: 18px; margin-bottom: 6px;">No projects</h3><p style="color: var(--text-secondary); font-size: 14px;">Enjoy your day!</p></div>`;
                viewportContainer.appendChild(container);
                return;
            }

            const grouped = {};
            firestoreEvents.sort((a,b) => a.date - b.date).forEach(ev => {
                const key = ev.date.toDateString();
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(ev);
            });

            for (const [dateStr, list] of Object.entries(grouped)) {
                const group = document.createElement('div');
                group.className = 'schedule-group';

                const groupHeader = document.createElement('div');
                groupHeader.className = 'schedule-group-header';
                groupHeader.innerText = dateStr;
                group.appendChild(groupHeader);

                list.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'schedule-card';
                    card.innerHTML = `
                        <div class="schedule-color-bar"></div>
                        <div style="flex:1;">
                            <div style="font-size:15px; font-weight:600;">${item.name}</div>
                            <div style="font-size:13px; color:var(--text-secondary);">${item.date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} · ${item.duration} · ${item.type}</div>
                        </div>
                    `;
                    card.addEventListener('click', () => deleteEventPrompt(item));
                    group.appendChild(card);
                });

                container.appendChild(group);
            }

            viewportContainer.appendChild(container);
        }

        // ================= BOTTOM SHEET CREATE FLOW (IMAGE 2) =================
        const sheetBackdrop = document.getElementById('sheetBackdrop');
        const openSheetBtn = document.getElementById('openAddSheetBtn');
        const closeSheetBtn = document.getElementById('closeSheetBtn');
        const createForm = document.getElementById('createProjectForm');

        openSheetBtn.addEventListener('click', () => {
            const pad = (n) => String(n).padStart(2, '0');
            document.getElementById('projectDateTime').value = `${selectedDate.getFullYear()}-${pad(selectedDate.getMonth() + 1)}-${pad(selectedDate.getDate())}T10:00`;
            sheetBackdrop.classList.add('active');
        });

        closeSheetBtn.addEventListener('click', () => {
            sheetBackdrop.classList.remove('active');
        });

        sheetBackdrop.addEventListener('click', (e) => {
            if (e.target === sheetBackdrop) sheetBackdrop.classList.remove('active');
        });

        createForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('projectNameInput').value.trim();
            const desc = document.getElementById('projectDescInput').value.trim();
            const dt = document.getElementById('projectDateTime').value;
            const duration = document.getElementById('projectDuration').value;

            if (!name || !dt) return;

            const btn = document.getElementById('submitProjectBtn');
            btn.innerText = "Creating...";

            try {
                // Exact Firestore Schema
                await addDoc(collection(db, "data.sheet"), {
                    Name: name,
                    Description: desc || "",
                    Date_Time: Timestamp.fromDate(new Date(dt)),
                    Duration: duration,
                    Type: "Schedule",
                    Email: userEmail
                });

                createForm.reset();
                sheetBackdrop.classList.remove('active');
            } catch (err) {
                console.error("Firestore save error:", err);
                alert("Error saving project to Cloud Firestore.");
            } finally {
                btn.innerText = "Create project";
            }
        });

        // Quick input enter
        document.getElementById('quickEventInput').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const text = e.target.value.trim();
                if (!text) return;
                try {
                    await addDoc(collection(db, "data.sheet"), {
                        Name: text,
                        Date_Time: Timestamp.fromDate(selectedDate),
                        Duration: "1 Hour",
                        Type: "Schedule",
                        Email: userEmail
                    });
                    e.target.value = '';
                } catch (err) {
                    console.error("Quick add error", err);
                }
            }
        });

        function deleteEventPrompt(item) {
            if (confirm(`Project: ${item.name}\nDuration: ${item.duration}\nTime: ${item.date.toLocaleString()}\n\nDelete this item from Firestore?`)) {
                deleteDoc(doc(db, "data.sheet", item.id)).catch(err => console.error("Delete failed:", err));
            }
        }

        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        renderActiveView();
    </script>
</body>
</html>
