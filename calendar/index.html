<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Samsung Calendar</title>
    <style>
        :root {
            --bg-canvas: #000000;
            --bg-surface: #121212;
            --bg-card: #1c1c1e;
            --bg-elevated: #2c2c2e;
            --border-subtle: #242426;
            --border-strong: #38383a;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-muted: #545458;
            --accent-green: #30d158;
            --accent-mint: #34c759;
            --accent-red: #ff453a;
            --accent-badge: #1f3b2b;
            --accent-badge-text: #62d88d;
            --accent-birthday-badge: #382436;
            --accent-birthday-text: #f48fb1;
            --timeline-indicator: #ff7966;
            --sidebar-width: 64px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Tablet/Desktop Sidebar Rail */
        .sidebar-rail {
            width: var(--sidebar-width);
            height: 100%;
            background-color: var(--bg-canvas);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 0;
            z-index: 50;
        }

        .rail-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .rail-btn:hover {
            color: var(--text-primary);
            background-color: var(--bg-card);
        }

        .rail-btn.active {
            color: var(--text-primary);
            background-color: var(--bg-elevated);
        }

        .rail-btn svg {
            width: 22px;
            height: 22px;
            stroke-width: 2;
        }

        .rail-spacer { flex: 1; }

        /* Main Workspace Stage */
        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* Top Header Navbar */
        .top-navbar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background-color: var(--bg-canvas);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 45;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title-wrap {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .nav-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .nav-icon-btn:hover {
            color: var(--text-primary);
            background: var(--bg-card);
        }

        .today-chip {
            border: 1px solid var(--text-secondary);
            color: var(--text-primary);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            min-width: 28px;
            height: 24px;
            padding: 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Viewport Container with Smooth Swipe/Pinch Canvas */
        .viewport-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            touch-action: pan-y;
            transition: transform 0.22s ease-out, opacity 0.2s ease-out;
            scrollbar-width: thin;
            scrollbar-color: var(--bg-elevated) transparent;
        }

        /* 1. Month View */
        .month-view {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .weekdays-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            padding: 8px 0;
            border-bottom: 1px solid var(--border-subtle);
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .weekdays-header div:last-child {
            color: var(--accent-red);
        }

        .month-days-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: 1fr;
        }

        .month-cell {
            border-right: 1px solid var(--border-subtle);
            border-bottom: 1px solid var(--border-subtle);
            padding: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .month-cell:nth-child(7n) { border-right: none; }
        .month-cell.inactive { color: var(--text-muted); }
        .month-cell.inactive .date-number { color: var(--text-muted); }

        .month-cell.selected {
            outline: 2px solid #ffffff;
            outline-offset: -2px;
            border-radius: 8px;
        }

        .date-number {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .is-sunday .date-number { color: var(--accent-red); }
        .is-today .date-number {
            background-color: #ffffff;
            color: #000000;
            font-weight: 700;
        }

        .event-badge {
            background-color: var(--accent-badge);
            color: var(--accent-badge-text);
            font-size: 11px;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .event-badge.birthday-badge {
            background-color: var(--accent-birthday-badge);
            color: var(--accent-birthday-text);
            border-left: 2px solid #f06292;
        }

        /* 2. Week View */
        .week-view {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .week-grid-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .hourly-grid {
            display: grid;
            grid-template-columns: 50px repeat(7, 1fr);
            position: relative;
        }

        .hour-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: right;
            padding-right: 8px;
            height: 60px;
            transform: translateY(-7px);
        }

        .hour-slot {
            height: 60px;
            border-top: 1px solid var(--border-subtle);
            border-right: 1px solid var(--border-subtle);
            position: relative;
        }

        .hour-slot:nth-child(8n) { border-right: none; }

        .time-now-line {
            position: absolute;
            left: 50px;
            right: 0;
            height: 2px;
            background-color: var(--timeline-indicator);
            z-index: 10;
            pointer-events: none;
        }

        .time-now-line::before {
            content: "";
            position: absolute;
            left: -5px;
            top: -4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--timeline-indicator);
        }

        /* 3. Day View */
        .day-view-container {
            display: flex;
            height: 100%;
            width: 100%;
        }

        .day-timeline {
            flex: 1;
            overflow-y: auto;
            border-right: 1px solid var(--border-subtle);
            position: relative;
        }

        .day-details-panel {
            width: 380px;
            background-color: var(--bg-card);
            margin: 16px;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .day-event-block {
            position: absolute;
            left: 60px;
            right: 12px;
            background: var(--accent-badge);
            color: var(--accent-badge-text);
            border-left: 3px solid var(--accent-green);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            z-index: 5;
        }

        .day-event-block.birthday {
            background: var(--accent-birthday-badge);
            color: var(--accent-birthday-text);
            border-left-color: #f06292;
        }

        /* 4. Schedule View */
        .schedule-view {
            padding: 20px 24px 80px;
            max-width: 760px;
            margin: 0 auto;
        }

        .schedule-group { margin-bottom: 24px; }
        .schedule-group-header {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .schedule-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .schedule-card:hover { background: var(--bg-elevated); }
        .schedule-color-bar {
            width: 4px;
            height: 38px;
            background: var(--accent-green);
            border-radius: 2px;
        }
        .schedule-color-bar.birthday-bar { background: #f06292; }

        .schedule-content { flex: 1; }
        .schedule-event-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .schedule-event-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* 5. Year View with Pinch-to-Open effect */
        .year-view-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            padding: 24px;
            overflow-y: auto;
        }

        .year-month-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 12px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.4, 1), background 0.2s ease;
        }

        .year-month-card:active {
            transform: scale(0.96);
        }

        .year-month-name {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .mini-calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            font-size: 9px;
            text-align: center;
            color: var(--text-secondary);
        }

        .mini-calendar .sun { color: var(--accent-red); }

        /* Floating Controls & Quick Input Bar */
        .bottom-action-bar {
            position: absolute;
            bottom: 16px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 40;
        }

        .quick-input-capsule {
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: 30px;
            padding: 0 16px;
            height: 48px;
            display: flex;
            align-items: center;
            width: 260px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
        }

        .quick-input-capsule input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            width: 100%;
        }

        .fab-btn {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-strong);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.7);
            transition: transform 0.15s ease;
        }

        .fab-btn:active { transform: scale(0.92); }
        .fab-btn svg { width: 24px; height: 24px; }

        /* Modal Sheet */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-sheet {
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            width: 90%;
            max-width: 440px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.8);
        }

        .modal-sheet h2 { font-size: 18px; margin-bottom: 16px; }
        .form-field { margin-bottom: 14px; text-align: left; }
        .form-field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
        .form-field input, .form-field select {
            width: 100%;
            background: var(--bg-canvas);
            border: 1px solid var(--border-strong);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-ghost {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--text-primary);
            color: #000000;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ===== BIRTHDAY / EVENT DETAILS POPUP CARD (MATCHING SCREENSHOT) ===== */
        .event-detail-popup-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 120;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            backdrop-filter: blur(8px);
        }

        .event-detail-popup-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .event-detail-card {
            background: #ffffff;
            color: #1a1a1a;
            width: 90%;
            max-width: 410px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            position: relative;
            transform: translateY(20px) scale(0.96);
            transition: transform 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        .event-detail-popup-overlay.active .event-detail-card {
            transform: translateY(0) scale(1);
        }

        .event-detail-header-art {
            width: 100%;
            height: 220px;
            background-color: #ffdbe9;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            position: relative;
        }

        .header-floating-btns {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .circle-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: background 0.15s ease;
        }

        .circle-icon-btn:hover { background: rgba(0, 0, 0, 0.6); }

        .event-detail-body {
            background: #ffffff;
            border-top-left-radius: 26px;
            border-top-right-radius: 26px;
            margin-top: -24px;
            position: relative;
            padding: 26px 24px 30px;
        }

        .event-title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .event-color-square {
            width: 16px;
            height: 16px;
            background-color: #58cc02;
            border-radius: 4px;
        }

        .event-detail-title {
            font-size: 24px;
            font-weight: 700;
            color: #111111;
        }

        .event-detail-date-sub {
            font-size: 15px;
            color: #555555;
            margin-left: 28px;
            margin-bottom: 26px;
            font-weight: 500;
        }

        .event-detail-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
            color: #222222;
            font-size: 15px;
            font-weight: 500;
        }

        .event-detail-row svg {
            width: 22px;
            height: 22px;
            color: #444444;
            flex-shrink: 0;
        }

        .event-detail-subtext {
            display: block;
            font-size: 13px;
            color: #777777;
            font-weight: 400;
        }

        /* Mobile Bottom Nav */
        .mobile-bottom-nav {
            display: none;
            height: 58px;
            background-color: var(--bg-canvas);
            border-top: 1px solid var(--border-subtle);
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 50;
        }

        @media (max-width: 768px) {
            .sidebar-rail { display: none; }
            .mobile-bottom-nav {
                display: flex;
                align-items: center;
                justify-content: space-around;
            }
            .bottom-action-bar { bottom: 72px; right: 16px; }
            .quick-input-capsule { display: none; }
            .day-details-panel { display: none; }
            .year-view-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- Left Sidebar Rail for Tablet/Desktop -->
    <aside class="sidebar-rail">
        <button class="rail-btn" id="menuToggleBtn" title="Menu">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <button class="rail-btn" data-view="year" title="Year">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </button>
        <button class="rail-btn active" data-view="month" title="Month">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5z M4 9h16 M9 4v16"></path></svg>
        </button>
        <button class="rail-btn" data-view="week" title="Week">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18m-9-4v8m-7 4h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </button>
        <button class="rail-btn" data-view="day" title="Day">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </button>
        <button class="rail-btn" data-view="schedule" title="Schedule">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
        </button>
        <div class="rail-spacer"></div>
        <button class="rail-btn" id="logoutBtn" title="Account / Sign Out">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
    </aside>

    <!-- Main Workspace -->
    <main class="main-stage">
        <!-- Top Bar -->
        <header class="top-navbar">
            <div class="nav-left">
                <div class="header-title-wrap">
                    <span class="header-title" id="displayHeaderMonth">OCT</span>
                    <span class="header-subtitle" id="displayHeaderYear">2026</span>
                </div>
            </div>

            <div class="nav-right">
                <button class="nav-icon-btn" id="prevPeriodBtn" title="Previous">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <button class="nav-icon-btn" id="nextPeriodBtn" title="Next">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
                <div class="today-chip" id="goTodayBtn" title="Today">22</div>
            </div>
        </header>

        <!-- Dynamic Gesture-Enabled Viewport -->
        <section class="viewport-container" id="calendarViewport"></section>

        <!-- Quick Input Capsule + Action FAB -->
        <div class="bottom-action-bar">
            <div class="quick-input-capsule">
                <input type="text" id="quickEventInput" placeholder="Add event on 22 Oct" />
            </div>
            <button class="fab-btn" id="openAddModalBtn" title="Add Event">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
            </button>
        </div>

        <!-- Mobile Bottom Navigation Bar -->
        <nav class="mobile-bottom-nav">

    <!-- Firebase SDK v10 Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            Timestamp, 
            query, 
            where, 
            deleteDoc, 
            doc 
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Provided Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
            authDomain: "cloud-computer-4891a.firebaseapp.com",
            projectId: "cloud-computer-4891a",
            storageBucket: "cloud-computer-4891a.firebasestorage.app",
            messagingSenderId: "744203234287",
            appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
            measurementId: "G-QE17C33TMN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Verification with your Authentication System
        let activeUser = null;
        try {
            const stored = localStorage.getItem('active_user');
            if (stored) activeUser = JSON.parse(stored);
        } catch (e) {
            console.error("Local storage error:", e);
        }

        if (!activeUser || !activeUser.Email) {
            window.location.href = "1.html?continue=" + encodeURIComponent(window.location.href);
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm(`Logged in as ${activeUser.Email}. Sign out?`)) {
                localStorage.removeItem('active_user');
                window.location.href = "1.html";
            }
        });

        // App State
        let currentDate = new Date();
        let selectedDate = new Date();
        let currentView = 'month'; // 'year' | 'month' | 'week' | 'day' | 'schedule'
        let firestoreEvents = [];
        let activeSelectedEvent = null;

        // Birthday Banner image URL provided
        const BIRTHDAY_BANNER_URL = "https://i.ibb.co/rGPwqryk/cd578f3c97c943f2448bc5847fef22a70df0bdf06da9dd7b10500ffd2d8ccbae.png";

        // Parse user Date of Birth from UARM document (e.g., "1/03/2000" or "04/03/2009")
        let userBirthdayParsed = null;
        const rawDOB = activeUser["Date of Birth"] || activeUser["Date_of_Birth"] || activeUser["DOB"];
        if (rawDOB) {
            const parts = rawDOB.split(/[\/\-\.]/);
            if (parts.length === 3) {
                // DD/MM/YYYY
                const day = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1;
                const year = parseInt(parts[2], 10);
                userBirthdayParsed = { day, month, birthYear: year };
            }
        }

        // Initialize Today Chip
        const todayChip = document.getElementById('goTodayBtn');
        todayChip.innerText = new Date().getDate();
        todayChip.addEventListener('click', () => {
            currentDate = new Date();
            selectedDate = new Date();
            renderActiveView();
        });

        // Realtime Firestore Listener
        const eventsRef = collection(db, "data.sheet");
        const userEventsQuery = query(eventsRef, where("Email", "==", activeUser.Email));

        onSnapshot(userEventsQuery, (snapshot) => {
            firestoreEvents = [];
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                let dateObj = null;

                if (data.Date_Time && typeof data.Date_Time.toDate === 'function') {
                    dateObj = data.Date_Time.toDate();
                } else if (data.Date_Time) {
                    dateObj = new Date(data.Date_Time);
                }

                firestoreEvents.push({
                    id: docSnap.id,
                    name: data.Name || "Untitled Schedule",
                    duration: data.Duration || "1 Hour",
                    type: data.Type || "Schedule",
                    email: data.Email,
                    date: dateObj || new Date()
                });
            });

            // If user has a registered Date of Birth in their UARM profile, automatically inject their birthday
            if (userBirthdayParsed) {
                const bdayDateThisYear = new Date(currentDate.getFullYear(), userBirthdayParsed.month, userBirthdayParsed.day, 9, 0);
                firestoreEvents.push({
                    id: 'uarm_profile_birthday',
                    name: `Happy birthday! ${activeUser["First Name"] || ""}`.trim(),
                    duration: "All Day",
                    type: "Birthday",
                    email: activeUser.Email,
                    date: bdayDateThisYear,
                    isProfileBirthday: true,
                    birthYear: userBirthdayParsed.birthYear
                });
            }

            renderActiveView();
        }, (err) => {
            console.error("Firestore error:", err);
        });

        // Period navigation
        document.getElementById('prevPeriodBtn').addEventListener('click', () => changePeriod(-1));
        document.getElementById('nextPeriodBtn').addEventListener('click', () => changePeriod(1));

        function changePeriod(delta) {
            if (currentView === 'year') {
                currentDate.setFullYear(currentDate.getFullYear() + delta);
            } else if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() + delta);
            } else if (currentView === 'week') {
                currentDate.setDate(currentDate.getDate() + (delta * 7));
            } else if (currentView === 'day') {
                currentDate.setDate(currentDate.getDate() + delta);
                selectedDate = new Date(currentDate);
            }
            renderActiveView();
        }

        // View switching
        const viewButtons = document.querySelectorAll('[data-view]');
        viewButtons.forEach(btn => {
            btn.addEventListener('click', () => setView(btn.dataset.view));
        });

        function setView(viewName) {
            currentView = viewName;
            viewButtons.forEach(b => {
                if (b.dataset.view === viewName) b.classList.add('active');
                else b.classList.remove('active');
            });
            renderActiveView();
        }

        // Header Labels
        const viewport = document.getElementById('calendarViewport');
        const headerMonth = document.getElementById('displayHeaderMonth');
        const headerYear = document.getElementById('displayHeaderYear');

        function updateHeaderLabels() {
            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEPT", "OCT", "NOV", "DEC"];
            headerMonth.innerText = months[currentDate.getMonth()];
            headerYear.innerText = currentDate.getFullYear();
            document.getElementById('quickEventInput').placeholder = `Add event on ${selectedDate.getDate()} ${months[selectedDate.getMonth()]}`;
        }

        function renderActiveView() {
            updateHeaderLabels();
            viewport.innerHTML = "";

            switch (currentView) {
                case 'month': renderMonthView(); break;
                case 'week': renderWeekView(); break;
                case 'day': renderDayView(); break;
                case 'schedule': renderScheduleView(); break;
                case 'year': renderYearView(); break;
            }
        }

        /* 1. Month View */
        function renderMonthView() {
            const container = document.createElement('div');
            container.className = 'month-view';

            const weekdays = document.createElement('div');
            weekdays.className = 'weekdays-header';
            weekdays.innerHTML = `<div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>`;
            container.appendChild(weekdays);

            const grid = document.createElement('div');
            grid.className = 'month-days-grid';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const prevMonthDays = new Date(year, month, 0).getDate();

            for (let i = 0; i < 35; i++) {
                const cell = document.createElement('div');
                cell.className = 'month-cell';

                let dayNumber, cellDate;

                if (i < firstDayIndex) {
                    dayNumber = prevMonthDays - firstDayIndex + i + 1;
                    cellDate = new Date(year, month - 1, dayNumber);
                    cell.classList.add('inactive');
                } else if (i < firstDayIndex + daysInMonth) {
                    dayNumber = i - firstDayIndex + 1;
                    cellDate = new Date(year, month, dayNumber);
                } else {
                    dayNumber = i - (firstDayIndex + daysInMonth) + 1;
                    cellDate = new Date(year, month + 1, dayNumber);
                    cell.classList.add('inactive');
                }

                if (i % 7 === 6) cell.classList.add('is-sunday');
                if (isSameDay(cellDate, new Date())) cell.classList.add('is-today');
                if (isSameDay(cellDate, selectedDate)) cell.classList.add('selected');

                const numEl = document.createElement('div');
                numEl.className = 'date-number';
                numEl.innerText = dayNumber;
                cell.appendChild(numEl);

                // Add event badges
                const dayEvents = firestoreEvents.filter(ev => isSameDay(ev.date, cellDate));
                dayEvents.forEach(ev => {
                    const badge = document.createElement('div');
                    const isBday = ev.type === "Birthday" || ev.isProfileBirthday;
                    badge.className = `event-badge ${isBday ? 'birthday-badge' : ''}`;
                    badge.innerText = isBday ? `🎂 ${ev.name}` : ev.name;
                    badge.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openDetailPopup(ev);
                    });
                    cell.appendChild(badge);
                });

                cell.addEventListener('click', () => {
                    selectedDate = cellDate;
                    renderMonthView();
                });

                grid.appendChild(cell);
            }

            container.appendChild(grid);
            viewport.appendChild(container);
        }

        /* 2. Week View */
        function renderWeekView() {
            const container = document.createElement('div');
            container.className = 'week-view';

            const startOfWeek = new Date(currentDate);
            const dayOfWeek = (startOfWeek.getDay() + 6) % 7;
            startOfWeek.setDate(startOfWeek.getDate() - dayOfWeek);

            const headerRow = document.createElement('div');
            headerRow.className = 'weekdays-header';
            headerRow.style.gridTemplateColumns = '50px repeat(7, 1fr)';
            headerRow.innerHTML = '<div></div>';

            const daysLetters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
            for (let d = 0; d < 7; d++) {
                const dayDate = new Date(startOfWeek);
                dayDate.setDate(dayDate.getDate() + d);
                const col = document.createElement('div');
                col.innerHTML = `<div>${daysLetters[d]}</div><div style="font-size:12px; font-weight:700;">${dayDate.getDate()}</div>`;
                if (d === 6) col.style.color = 'var(--accent-red)';
                headerRow.appendChild(col);
            }
            container.appendChild(headerRow);

            const gridContainer = document.createElement('div');
            gridContainer.className = 'week-grid-container';

            const grid = document.createElement('div');
            grid.className = 'hourly-grid';

            for (let hour = 0; hour < 24; hour++) {
                const label = document.createElement('div');
                label.className = 'hour-label';
                label.innerText = hour === 0 ? '12 AM' : hour < 12 ? `${hour} AM` : hour === 12 ? '12 PM' : `${hour - 12} PM`;
                grid.appendChild(label);

                for (let d = 0; d < 7; d++) {
                    const slot = document.createElement('div');
                    slot.className = 'hour-slot';
                    grid.appendChild(slot);
                }
            }

            // Real-time coral line
            const now = new Date();
            const minutesFromMidnight = now.getHours() * 60 + now.getMinutes();
            const line = document.createElement('div');
            line.className = 'time-now-line';
            line.style.top = `${minutesFromMidnight}px`;
            grid.appendChild(line);

            gridContainer.appendChild(grid);
            container.appendChild(gridContainer);
            viewport.appendChild(container);
            gridContainer.scrollTop = Math.max(0, minutesFromMidnight - 120);
        }

        /* 3. Day View */
        function renderDayView() {
            const container = document.createElement('div');
            container.className = 'day-view-container';

            const timeline = document.createElement('div');
            timeline.className = 'day-timeline';

            for (let hour = 0; hour < 24; hour++) {
                const row = document.createElement('div');
                row.style.display = 'flex';
                row.style.height = '60px';
                row.style.borderBottom = '1px solid var(--border-subtle)';

                const label = document.createElement('div');
                label.className = 'hour-label';
                label.style.width = '60px';
                label.innerText = hour === 0 ? '12 AM' : hour < 12 ? `${hour} AM` : hour === 12 ? '12 PM' : `${hour - 12} PM`;
                row.appendChild(label);

                const slot = document.createElement('div');
                slot.style.flex = '1';
                row.appendChild(slot);
                timeline.appendChild(row);
            }

            const dayEvents = firestoreEvents.filter(ev => isSameDay(ev.date, selectedDate));
            dayEvents.forEach(ev => {
                const block = document.createElement('div');
                const isBday = ev.type === "Birthday" || ev.isProfileBirthday;
                block.className = `day-event-block ${isBday ? 'birthday' : ''}`;
                const startMins = ev.date.getHours() * 60 + ev.date.getMinutes();
                block.style.top = `${startMins}px`;
                block.style.height = '50px';
                block.innerHTML = `<strong>${isBday ? '🎂 ' : ''}${ev.name}</strong> · ${ev.duration}`;
                block.addEventListener('click', () => openDetailPopup(ev));
                timeline.appendChild(block);
            });

            container.appendChild(timeline);

            const detailsPanel = document.createElement('div');
            detailsPanel.className = 'day-details-panel';
            if (dayEvents.length === 0) {
                detailsPanel.innerHTML = `
                    <div style="font-size: 18px; font-weight:600; color:var(--text-secondary); margin-bottom: 8px;">No event selected</div>
                    <div style="font-size: 13px; color:var(--text-muted);">Tap + below to create a schedule or birthday</div>
                `;
            } else {
                detailsPanel.innerHTML = `
                    <h3 style="font-size:16px; margin-bottom:12px; color:var(--accent-green);">${dayEvents.length} Event(s) Today</h3>
                    ${dayEvents.map(e => `
                        <div style="background:var(--bg-canvas); border-radius:10px; padding:12px; margin-bottom:8px; width:100%; text-align:left; cursor:pointer;" onclick="window.triggerPopup('${e.id}')">
                            <div style="font-weight:600; font-size:14px;">${e.name}</div>
                            <div style="font-size:12px; color:var(--text-secondary);">${e.duration} · ${e.type}</div>
                        </div>
                    `).join('')}
                `;
            }
            container.appendChild(detailsPanel);
            viewport.appendChild(container);
        }

        /* 4. Schedule View */
        function renderScheduleView() {
            const container = document.createElement('div');
            container.className = 'schedule-view';

            if (firestoreEvents.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; margin-top: 100px;">
                        <h3 style="font-weight: 500; font-size: 18px; margin-bottom: 6px;">No events</h3>
                        <p style="color: var(--text-secondary); font-size: 14px;">Enjoy your day!</p>
                    </div>
                `;
                viewport.appendChild(container);
                return;
            }

            const grouped = {};
            firestoreEvents.sort((a,b) => a.date - b.date).forEach(ev => {
                const key = ev.date.toDateString();
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(ev);
            });

            for (const [dateStr, list] of Object.entries(grouped)) {
                const group = document.createElement('div');
                group.className = 'schedule-group';

                const groupHeader = document.createElement('div');
                groupHeader.className = 'schedule-group-header';
                groupHeader.innerText = dateStr;
                group.appendChild(groupHeader);

                list.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'schedule-card';
                    const isBday = item.type === "Birthday" || item.isProfileBirthday;
                    card.innerHTML = `
                        <div class="schedule-color-bar ${isBday ? 'birthday-bar' : ''}"></div>
                        <div class="schedule-content">
                            <div class="schedule-event-title">${isBday ? '🎂 ' : ''}${item.name}</div>
                            <div class="schedule-event-meta">${item.date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} · ${item.duration} · ${item.type}</div>
                        </div>
                    `;
                    card.addEventListener('click', () => openDetailPopup(item));
                    group.appendChild(card);
                });

                container.appendChild(group);
            }

            viewport.appendChild(container);
        }

        /* 5. Year View with Pinch-to-Open Month */
        function renderYearView() {
            const container = document.createElement('div');
            container.className = 'year-view-grid';

            const year = currentDate.getFullYear();
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sept", "Oct", "Nov", "Dec"];

            months.forEach((mName, mIdx) => {
                const card = document.createElement('div');
                card.className = 'year-month-card';

                const title = document.createElement('div');
                title.className = 'year-month-name';
                title.innerText = mName;
                card.appendChild(title);

                const mini = document.createElement('div');
                mini.className = 'mini-calendar';
                mini.innerHTML = `<div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div class="sun">S</div>`;

                const firstDay = (new Date(year, mIdx, 1).getDay() + 6) % 7;
                const daysTotal = new Date(year, mIdx + 1, 0).getDate();

                for (let k = 0; k < firstDay; k++) mini.innerHTML += `<div></div>`;
                for (let day = 1; day <= daysTotal; day++) {
                    const isSun = ((firstDay + day - 1) % 7 === 6);
                    mini.innerHTML += `<div class="${isSun ? 'sun' : ''}">${day}</div>`;
                }

                card.appendChild(mini);

                // Clicking or tapping month opens it
                card.addEventListener('click', () => {
                    currentDate.setMonth(mIdx);
                    setView('month');
                });

                container.appendChild(card);
            });

            viewport.appendChild(container);
        }

        // ================= POPUP CARD DISPLAY LOGIC =================
        const detailPopup = document.getElementById('detailPopupOverlay');
        const detailHeaderArt = document.getElementById('detailHeaderArt');
        const detailTitle = document.getElementById('detailTitleText');
        const detailDateSub = document.getElementById('detailDateSub');
        const detailCategoryLabel = document.getElementById('detailCategoryLabel');
        const detailEmailSubtext = document.getElementById('detailEmailSubtext');
        const detailColorSquare = document.getElementById('detailColorSquare');
        const closeDetailBtn = document.getElementById('closeDetailPopupBtn');
        const deleteDetailBtn = document.getElementById('deleteDetailEventBtn');

        function openDetailPopup(eventItem) {
            activeSelectedEvent = eventItem;
            const isBday = eventItem.type === "Birthday" || eventItem.isProfileBirthday;

            // Set Header Art
            if (isBday) {
                detailHeaderArt.style.backgroundImage = `url('${BIRTHDAY_BANNER_URL}')`;
                detailHeaderArt.style.display = "block";
                detailColorSquare.style.backgroundColor = "#58cc02";
                detailCategoryLabel.innerText = "Birthdays";
            } else {
                // Non-birthday uses clean dark/accent banner
                detailHeaderArt.style.backgroundImage = "none";
                detailHeaderArt.style.backgroundColor = "#242426";
                detailColorSquare.style.backgroundColor = "#30d158";
                detailCategoryLabel.innerText = eventItem.type || "Schedule";
            }

            detailTitle.innerText = eventItem.name;

            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const yearStr = eventItem.birthYear ? eventItem.birthYear : eventItem.date.getFullYear();
            detailDateSub.innerText = `${eventItem.date.getDate()} ${months[eventItem.date.getMonth()]} ${yearStr}`;

            detailEmailSubtext.innerText = eventItem.email || activeUser.Email;
            detailPopup.classList.add('active');
        }

        closeDetailBtn.addEventListener('click', () => {
            detailPopup.classList.remove('active');
        });

        detailPopup.addEventListener('click', (e) => {
            if (e.target === detailPopup) detailPopup.classList.remove('active');
        });

        // Delete Event from Firestore
        deleteDetailBtn.addEventListener('click', async () => {
            if (!activeSelectedEvent) return;
            if (activeSelectedEvent.isProfileBirthday) {
                alert("This birthday is automatically loaded from your profile account.");
                detailPopup.classList.remove('active');
                return;
            }

            if (confirm(`Delete "${activeSelectedEvent.name}"?`)) {
                try {
                    await deleteDoc(doc(db, "data.sheet", activeSelectedEvent.id));
                    detailPopup.classList.remove('active');
                } catch (err) {
                    console.error("Delete failed:", err);
                }
            }
        });

        window.triggerPopup = (id) => {
            const ev = firestoreEvents.find(e => e.id === id);
            if (ev) openDetailPopup(ev);
        };

        // ================= SMART GESTURE CONTROLS =================
        // Pinch-to-zoom (Year <-> Month <-> Week <-> Day) & Swipe left/right
        let touchStartX = 0;
        let touchStartY = 0;
        let initialPinchDist = 0;
        let isPinching = false;

        const viewHierarchy = ['year', 'month', 'week', 'day'];

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                isPinching = true;
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (isPinching && e.touches.length === 2) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const scale = currentDist / initialPinchDist;
                // Subtle scale feedback
                viewport.style.transform = `scale(${Math.min(Math.max(scale, 0.9), 1.1)})`;
            }
        }, { passive: true });

        viewport.addEventListener('touchend', (e) => {
            viewport.style.transform = '';

            // Handle Pinch-to-open (zoom in) or Pinch-in (zoom out)
            if (isPinching) {
                isPinching = false;
                if (e.changedTouches.length >= 1 && initialPinchDist > 0) {
                    // Check pinch ratio
                    const finalDist = Math.hypot(
                        (e.touches[0]?.clientX || e.changedTouches[0].clientX) - (e.touches[1]?.clientX || e.changedTouches[0].clientX),
                        (e.touches[0]?.clientY || e.changedTouches[0].clientY) - (e.touches[1]?.clientY || e.changedTouches[0].clientY)
                    );

                    const currentIndex = viewHierarchy.indexOf(currentView);

                    // Pinch-out / Expand -> Zoom In (e.g., Year -> Month -> Week -> Day)
                    if (finalDist > initialPinchDist * 1.35) {
                        if (currentIndex !== -1 && currentIndex < viewHierarchy.length - 1) {
                            setView(viewHierarchy[currentIndex + 1]);
                        }
                    }
                    // Pinch-in / Collapse -> Zoom Out (e.g., Day -> Week -> Month -> Year)
                    else if (finalDist < initialPinchDist * 0.75) {
                        if (currentIndex > 0) {
                            setView(viewHierarchy[currentIndex - 1]);
                        }
                    }
                }
                return;
            }

            // Handle Horizontal Swiping (Single finger navigation)
            if (e.changedTouches.length === 1) {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;

                // Detect horizontal swipe
                if (Math.abs(deltaX) > 60 && Math.abs(deltaY) < 50) {
                    if (deltaX < 0) {
                        // Swipe left -> Next period
                        changePeriod(1);
                    } else {
                        // Swipe right -> Prev period
                        changePeriod(-1);
                    }
                }
            }
        }, { passive: true });

        // ================= CREATION MODAL LOGIC =================
        const modal = document.getElementById('eventModal');
        const openModalBtn = document.getElementById('openAddModalBtn');
        const closeModalBtn = document.getElementById('cancelModalBtn');
        const createEventForm = document.getElementById('createEventForm');

        openModalBtn.addEventListener('click', () => {
            const pad = (n) => String(n).padStart(2, '0');
            const dtString = `${selectedDate.getFullYear()}-${pad(selectedDate.getMonth() + 1)}-${pad(selectedDate.getDate())}T09:00`;
            document.getElementById('eventDateTime').value = dtString;
            modal.classList.add('active');
        });

        closeModalBtn.addEventListener('click', () => modal.classList.remove('active'));

        createEventForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('eventTitle').value.trim();
            const dtValue = document.getElementById('eventDateTime').value;
            const duration = document.getElementById('eventDuration').value;
            const type = document.getElementById('eventType').value;

            if (!title || !dtValue) return;

            const saveBtn = document.getElementById('saveEventBtn');
            saveBtn.innerText = "Saving...";

            try {
                await addDoc(collection(db, "data.sheet"), {
                    Name: title,
                    Date_Time: Timestamp.fromDate(new Date(dtValue)),
                    Duration: duration,
                    Type: type,
                    Email: activeUser.Email
                });

                createEventForm.reset();
                modal.classList.remove('active');
            } catch (err) {
                console.error("Firestore save error:", err);
                alert("Error saving event.");
            } finally {
                saveBtn.innerText = "Save";
            }
        });

        // Quick Input Capsule
        document.getElementById('quickEventInput').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const text = e.target.value.trim();
                if (!text) return;
                try {
                    await addDoc(collection(db, "data.sheet"), {
                        Name: text,
                        Date_Time: Timestamp.fromDate(selectedDate),
                        Duration: "1 Hour",
                        Type: "Schedule",
                        Email: activeUser.Email
                    });
                    e.target.value = '';
                } catch (err) {
                    console.error("Quick add error:", err);
                }
            }
        });

        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        renderActiveView();
    </script>
</body>
</html>
