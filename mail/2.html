<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose</title>
    <style>
        :root {
            --bg-body: #ffffff;
            --sidebar-bg: #f7f7f8;
            --border: #e5e7eb;
            --text-main: #111827;
            --text-sub: #6b7280;
            --accent: #111827;
            --accent-blue: #2563eb;
            --radius-md: 10px;
        }

        body.dark {
            --bg-body: #0d0d0d;
            --sidebar-bg: #171717;
            --border: #262626;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --accent: #ffffff;
            --accent-blue: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .compose-container {
            width: 100%;
            max-width: 980px;
            border: 1px solid var(--border);
            border-radius: 16px;
            display: grid;
            grid-template-columns: 1fr 280px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            background: var(--bg-body);
        }

        @media (max-width: 820px) {
            .compose-container { grid-template-columns: 1fr; }
        }

        .main-editor { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
        .sidebar-controls { background: var(--sidebar-bg); border-left: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; gap: 20px; }

        .form-row { display: flex; flex-direction: column; gap: 4px; }
        .form-row label { font-size: 13px; font-weight: 600; color: var(--text-sub); }

        input, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            outline: none;
            background: var(--bg-body);
            color: var(--text-main);
            font-family: inherit;
        }

        textarea { min-height: 260px; resize: vertical; }

        .attachment-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-attach {
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { background: var(--sidebar-bg); border: 1px solid var(--border); padding: 3px 8px; border-radius: 6px; font-size: 12px; }

        .btn-send {
            background: var(--accent);
            color: var(--bg-body);
            padding: 12px;
            border-radius: var(--radius-md);
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: auto;
        }

        /* Modal: Cloud Drive Picker */
        .modal-shade {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 16px;
        }
        .modal-shade.active { display: flex; }

        .modal-card {
            background: var(--bg-body);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drive-files-list {
            padding: 14px 20px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .drive-file-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .drive-file-row:hover { background: var(--sidebar-bg); }
        .drive-file-row.chosen { border-color: var(--accent-blue); background: rgba(37, 99, 235, 0.08); }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<div class="compose-container">
    <div class="main-editor">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-size: 20px;">Compose Email</h2>
            <a href="1.html" style="text-decoration: none; color: var(--text-sub); font-size: 13px;">&larr; Inbox</a>
        </div>

        <div class="attachment-bar">
            <!-- Native Device Upload -->
            <label class="btn-attach">
                📎 Upload Device File
                <input type="file" id="localFileInput" multiple style="display: none;">
            </label>
            
            <!-- Cloud Drive Picker Trigger -->
            <button class="btn-attach" id="btnOpenDrivePicker">
                ☁️ Attach from Cloud Drive
            </button>

            <div class="chip-list" id="attachedChips"></div>
        </div>

        <div class="form-row">
            <label>From</label>
            <input type="text" id="senderField" readonly>
        </div>

        <div class="form-row">
            <label>To</label>
            <input type="email" id="toEmail" placeholder="user@perplexity.com or someone@gmail.com" required>
        </div>

        <div class="form-row">
            <label>Subject</label>
            <input type="text" id="subject" placeholder="Subject">
        </div>

        <div class="form-row">
            <label>Message (HTML or plain text)</label>
            <textarea id="body" placeholder="Write message or paste complete HTML code here..."></textarea>
        </div>
    </div>

    <!-- Sidebar delivery options -->
    <div class="sidebar-controls">
        <div class="form-row">
            <label>Security</label>
            <label style="font-size: 13px; display: flex; align-items: center; gap: 8px; margin-top: 6px;">
                <input type="checkbox" id="oneTimeCheck"> 1-Time Self Destruct
            </label>
        </div>

        <div class="form-row">
            <label>Schedule Delivery</label>
            <input type="datetime-local" id="scheduleDate">
        </div>

        <div class="form-row">
            <label>Label</label>
            <input type="text" id="labelTag" placeholder="e.g. Work, Urgent">
        </div>

        <button class="btn-send" id="sendBtn">Send Email</button>
    </div>
</div>

<!-- Modal: Cloud Drive Browser -->
<div class="modal-shade" id="driveModal">
    <div class="modal-card">
        <div class="modal-head">
            <span style="font-weight: 600;">Your Cloud Drive Files</span>
            <button id="closeDriveModal" style="background: none; border: none; cursor: pointer; font-size: 18px;">&times;</button>
        </div>
        <div class="drive-files-list" id="driveList">
            <div style="color: var(--text-sub); font-size: 13px;">Loading Cloud Drive files...</div>
        </div>
        <div style="padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end;">
            <button class="btn-send" id="btnConfirmDriveAttach" style="padding: 8px 16px; margin: 0;">Add Selected</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, getDocs, query, where, or, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    emailjs.init({ publicKey: "Yr9MutUoHOEONnFgn" });

    const activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
    const sender = activeUser.Email || activeUser.email || "user@perplexity.com";
    document.getElementById('senderField').value = sender;

    let attachedItems = []; // { name, data / fileUrl }

    // 1. Device Local Upload
    document.getElementById('localFileInput').addEventListener('change', async (e) => {
        for (const file of Array.from(e.target.files)) {
            const b64 = await fileToBase64(file);
            attachedItems.push({ name: file.name, data: b64 });
        }
        renderChips();
    });

    function fileToBase64(f) {
        return new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(r.result);
            r.onerror = rej;
            r.readAsDataURL(f);
        });
    }

    // 2. Cloud Drive Modal Loader
    const driveModal = document.getElementById('driveModal');
    let driveSelected = new Set();

    document.getElementById('btnOpenDrivePicker').addEventListener('click', async () => {
        driveSelected.clear();
        driveModal.classList.add('active');
        const listContainer = document.getElementById('driveList');
        listContainer.innerHTML = '<div style="color: var(--text-sub); font-size: 13px;">Loading your Cloud Drive files...</div>';

        try {
            const q = query(
                collection(db, "Cloud Drive"),
                or(where("Email", "==", sender), where("Access.Viewer", "array-contains", sender))
            );
            const snap = await getDocs(q);
            const files = [];

            snap.forEach(d => {
                const data = d.data();
                if (data.Folder !== "True" && data.File) {
                    files.push({ id: d.id, name: data.Name || "File", url: data.File, type: data.Type || "Document" });
                }
            });

            if (!files.length) {
                listContainer.innerHTML = '<div style="color: var(--text-sub); font-size: 13px;">No files found in your Cloud Drive.</div>';
                return;
            }

            listContainer.innerHTML = '';
            files.forEach(file => {
                const row = document.createElement('div');
                row.className = 'drive-file-row';
                row.innerHTML = `
                    <span>📄 ${escapeHtml(file.name)}</span>
                    <span style="font-size: 11px; color: var(--text-sub);">${escapeHtml(file.type)}</span>
                `;
                row.onclick = () => {
                    if (driveSelected.has(file)) {
                        driveSelected.delete(file);
                        row.classList.remove('chosen');
                    } else {
                        driveSelected.add(file);
                        row.classList.add('chosen');
                    }
                };
                listContainer.appendChild(row);
            });
        } catch (err) {
            listContainer.innerHTML = '<div style="color: red; font-size: 13px;">Failed to load Cloud Drive.</div>';
        }
    });

    document.getElementById('closeDriveModal').addEventListener('click', () => driveModal.classList.remove('active'));

    document.getElementById('btnConfirmDriveAttach').addEventListener('click', () => {
        driveSelected.forEach(f => {
            attachedItems.push({ name: f.name, data: f.url });
        });
        driveModal.classList.remove('active');
        renderChips();
    });

    function renderChips() {
        const c = document.getElementById('attachedChips');
        c.innerHTML = attachedItems.map(a => `<span class="chip">📎 ${escapeHtml(a.name)}</span>`).join(' ');
    }

    // 3. Send
    document.getElementById('sendBtn').addEventListener('click', async () => {
        const to = document.getElementById('toEmail').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const body = document.getElementById('body').value.trim();
        const oneTime = document.getElementById('oneTimeCheck').checked;
        const schedule = document.getElementById('scheduleDate').value;
        const label = document.getElementById('labelTag').value.trim();

        if (!to || !body) return alert("Recipient and Message body required.");

        const btn = document.getElementById('sendBtn');
        btn.innerText = "Sending...";
        btn.disabled = true;

        try {
            const payload = {
                from: sender,
                to: to,
                subject: subject || '(No Subject)',
                body: body,
                attachments: attachedItems,
                oneTimeView: oneTime,
                scheduledFor: schedule ? new Date(schedule).toISOString() : null,
                label: label,
                isArchived: false,
                timestamp: serverTimestamp()
            };

            if (to.toLowerCase().endsWith('@perplexity.com')) {
                await addDoc(collection(db, "Email"), payload);
            } else {
                await emailjs.send("service_63mnm5a", "template_drkhsx5", {
                    to_email: to,
                    from_email: sender,
                    subject: subject,
                    message: body
                });
                await addDoc(collection(db, "Email"), payload);
            }

            alert("Sent successfully!");
            window.location.href = "1.html";
        } catch (e) {
            alert("Send failed: " + e.message);
            btn.disabled = false;
            btn.innerText = "Send Email";
        }
    });

    function escapeHtml(s) {
        return (s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }
</script>

</body>
</html>
