<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose Email</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #cbd5e1;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-link {
            text-decoration: none;
            color: var(--accent);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .user-display {
            padding: 10px 12px;
            background-color: #f1f5f9;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="email"],
        input[type="text"],
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 160px;
        }

        .btn-send {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn-send:hover {
            background-color: var(--accent-hover);
        }

        .btn-send:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin: 0;">New Message</h2>
        <a href="1.html" class="back-link">&larr; Back to Inbox</a>
    </div>

    <form id="mailForm">
        <div class="form-group">
            <label>From</label>
            <div class="user-display" id="senderEmail">Loading...</div>
        </div>

        <div class="form-group">
            <label for="toEmail">To</label>
            <input type="email" id="toEmail" placeholder="recipient@example.com" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="Subject" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="body">Message</label>
            <textarea id="body" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit" class="btn-send" id="sendBtn">Send Message</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // Firebase Init
    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
        measurementId: "G-QE17C33TMN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // EmailJS Init
    const EMAILJS_PUBLIC_KEY = "Yr9MutUoHOEONnFgn";
    const EMAILJS_SERVICE_ID = "service_63mnm5a";
    const EMAILJS_TEMPLATE_ID = "template_drkhsx5";
    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    // Identify Logged In User
    const activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
    const senderEmail = activeUser.Email || activeUser.email || "sender@perplexity.com";
    document.getElementById('senderEmail').innerText = senderEmail;

    // Handle Form Submit
    document.getElementById('mailForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const to = document.getElementById('toEmail').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const body = document.getElementById('body').value.trim();
        const sendBtn = document.getElementById('sendBtn');

        if (!to || !subject || !body) {
            alert("Please fill in all fields.");
            return;
        }

        sendBtn.disabled = true;
        sendBtn.innerText = "Sending...";

        try {
            const isInternal = to.toLowerCase().endsWith('@perplexity.com');

            if (isInternal) {
                // Internal Email: Store directly into Firestore
                await addDoc(collection(db, "Email"), {
                    from: senderEmail,
                    to: to,
                    subject: subject,
                    body: body,
                    timestamp: serverTimestamp()
                });
                alert("Internal message sent successfully!");
            } else {
                // External Email: Send using EmailJS
                const templateParams = {
                    to_email: to,
                    from_email: senderEmail,
                    subject: subject,
                    message: body
                };

                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);

                // Also save to Firestore so it appears in the sender's Sent tab
                await addDoc(collection(db, "Email"), {
                    from: senderEmail,
                    to: to,
                    subject: subject,
                    body: body,
                    timestamp: serverTimestamp(),
                    provider: 'emailjs'
                });

                alert("External email sent successfully via EmailJS!");
            }

            window.location.href = '1.html';
        } catch (error) {
            console.error("Failed to send message:", error);
            alert("Failed to send email: " + (error.text || error.message || error));
            sendBtn.disabled = false;
            sendBtn.innerText = "Send Message";
        }
    });
</script>

</body>
</html>
