<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Compose</title>
    <style>
        :root {
            --bg: #ffffff;
            --text-primary: #1f1f1f;
            --text-secondary: #5f6368;
            --border: #e0e0e0;
            --accent: #0b57d0;
            --hover-bg: #f1f3f4;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --text-primary: #e8eaed;
                --text-secondary: #9aa0a6;
                --border: #2d2d2d;
                --hover-bg: #2d2d2d;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Action Bar (Matching Screenshot) */
        .header-bar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
        }

        .header-actions { display: flex; align-items: center; gap: 20px; }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
        .btn-send svg { stroke: var(--accent); fill: var(--accent); }

        /* Compose Form Lines */
        .compose-container { display: flex; flex-direction: column; flex: 1; }

        .input-row {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }

        .input-label { width: 50px; font-size: 14px; color: var(--text-secondary); }

        .input-field {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
        }

        .body-field {
            flex: 1;
            border: none;
            outline: none;
            padding: 16px;
            font-size: 15px;
            line-height: 1.6;
            resize: none;
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
            min-height: 300px;
        }

        /* ================= ADD FILES CLOUD DRIVE PICKER (MATCHING SCREENSHOT) ================= */
        .picker-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(2px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .picker-modal-backdrop.active { display: flex; }

        .picker-card {
            background: var(--bg);
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .picker-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            position: relative;
        }

        .picker-circle-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--hover-bg);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
        }
        .picker-circle-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; }

        .picker-title { font-size: 18px; font-weight: 600; }

        .picker-menu {
            position: absolute;
            top: 60px;
            right: 20px;
            background: var(--bg);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid var(--border);
            padding: 8px 0;
            width: 170px;
            display: none;
            z-index: 100;
        }
        .picker-menu.active { display: block; }
        .picker-menu-item {
            padding: 10px 18px;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            color: var(--text-primary);
        }
        .picker-menu-item:hover { background: var(--hover-bg); }

        .picker-upload-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }
        .picker-upload-row svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

        .picker-section-title { padding: 16px 20px 8px 20px; font-size: 16px; font-weight: 600; }

        .picker-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 80px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .picker-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            cursor: pointer;
        }

        .picker-item-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
        .picker-thumb {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            object-fit: cover;
            background: var(--hover-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
        }

        .picker-file-meta { display: flex; flex-direction: column; overflow: hidden; }
        .picker-file-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .picker-file-date { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

        .picker-ring {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #ccc;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .picker-item.selected .picker-ring {
            border-color: var(--accent);
            background: var(--accent);
            box-shadow: inset 0 0 0 4px var(--bg);
        }

        .picker-list.grid-mode { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .picker-list.grid-mode .picker-item {
            flex-direction: column;
            align-items: flex-start;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            position: relative;
        }
        .picker-list.grid-mode .picker-thumb { width: 100%; height: 90px; margin-bottom: 8px; }
        .picker-list.grid-mode .picker-ring { position: absolute; top: 10px; right: 10px; }

        .picker-bottom-search-wrap {
            position: absolute;
            bottom: 16px;
            left: 20px;
            right: 20px;
        }
        .picker-search-pill {
            background: var(--hover-bg);
            border-radius: 999px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .picker-search-pill input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            color: var(--text-primary);
            width: 100%;
        }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<div class="header-bar">
    <a href="1.html" class="btn-icon">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>

    <div class="header-actions">
        <button class="btn-icon" id="attachBtn" title="Attach">
            <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <button class="btn-icon btn-send" id="sendBtn" title="Send">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
        <button class="btn-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
    </div>
</div>

<div class="compose-container">
    <div class="input-row">
        <span class="input-label">From</span>
        <input type="text" id="fromInput" class="input-field" readonly>
    </div>
    <div class="input-row">
        <span class="input-label">To</span>
        <input type="email" id="toInput" class="input-field" placeholder="" autocomplete="off" required>
    </div>
    <div class="input-row">
        <input type="text" id="subjectInput" class="input-field" placeholder="Subject">
    </div>
    <textarea id="bodyInput" class="body-field" placeholder="Compose email"></textarea>
</div>

<!-- ================= "ADD FILES" MODAL (MATCHING SCREENSHOT) ================= -->
<div class="picker-modal-backdrop" id="pickerModal">
    <div class="picker-card">
        <div class="picker-top-bar">
            <button class="picker-circle-btn" id="pickerCloseBtn">✕</button>
            <span class="picker-title">Add files</span>
            <button class="picker-circle-btn" id="pickerMoreBtn">⋮</button>

            <div class="picker-menu" id="pickerMenu">
                <div class="picker-menu-item" id="optViewGrid">
                    <span>⊞ Grid</span>
                </div>
                <div class="picker-menu-item" id="optViewList">
                    <span>☰ List</span>
                    <span id="listCheckmark">✓</span>
                </div>
            </div>
        </div>

        <div class="picker-upload-row" id="pickerUploadRow">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Upload files</span>
        </div>
        <input type="file" id="pickerNativeUpload" style="display: none;">

        <div class="picker-section-title">Recent</div>

        <div class="picker-list" id="pickerFilesList">
            <div style="padding: 20px; text-align: center; color: var(--text-secondary);">Loading library...</div>
        </div>

        <div class="picker-bottom-search-wrap">
            <div class="picker-search-pill">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="pickerSearchInput" placeholder="Search library">
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    emailjs.init({ publicKey: "Yr9MutUoHOEONnFgn" });

    const activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
    const senderEmail = activeUser.Email || activeUser.email || "user@perplexity.com";
    document.getElementById('fromInput').value = senderEmail;

    // Attach button opens Picker
    const pickerModal = document.getElementById('pickerModal');
    const pickerFilesList = document.getElementById('pickerFilesList');
    const pickerMenu = document.getElementById('pickerMenu');
    let cloudDriveFiles = [];

    document.getElementById('attachBtn').addEventListener('click', async () => {
        pickerModal.classList.add('active');
        pickerFilesList.innerHTML = `<div style="padding: 20px; text-align: center;">Loading library...</div>`;

        try {
            const q = query(collection(db, "Cloud Drive"), where("Email", "==", senderEmail));
            const snap = await getDocs(q);
            const list = [];
            snap.forEach(d => {
                const data = d.data();
                if (data.Folder !== "True" && data.File) list.push(data);
            });
            cloudDriveFiles = list;
            renderPickerFiles(list);
        } catch (e) {
            pickerFilesList.innerHTML = `<div style="padding: 20px; color: red;">Error: ${e.message}</div>`;
        }
    });

    function renderPickerFiles(files) {
        if (!files.length) {
            pickerFilesList.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-secondary);">No files in library</div>`;
            return;
        }

        pickerFilesList.innerHTML = files.map(f => {
            const isImg = (f.Type || '').toLowerCase().includes('img') || (f.Type || '').toLowerCase().includes('image');
            const thumb = isImg ? `<img src="${f.File}" class="picker-thumb">` : `<div class="picker-thumb">📄</div>`;

            return `
                <div class="picker-item" data-url="${f.File}" data-type="${f.Type || ''}" data-name="${f.Name || ''}">
                    <div class="picker-item-left">
                        ${thumb}
                        <div class="picker-file-meta">
                            <span class="picker-file-name">${f.Name || 'Untitled'}</span>
                            <span class="picker-file-date">${f.Updated ? f.Updated.split(',')[1] || 'Recently' : 'Recently'}</span>
                        </div>
                    </div>
                    <div class="picker-ring"></div>
                </div>
            `;
        }).join('');

        pickerFilesList.querySelectorAll('.picker-item').forEach(el => {
            el.addEventListener('click', () => {
                el.classList.add('selected');
                setTimeout(() => {
                    attachFileToComposer(el.dataset.url, el.dataset.type, el.dataset.name);
                    pickerModal.classList.remove('active');
                }, 150);
            });
        });
    }

    function attachFileToComposer(url, extType, fileName) {
        let t = ".doc";
        const low = (extType || "").toLowerCase();
        if (low.includes("img") || low.includes("png") || low.includes("jpg")) t = ".img";
        else if (low.includes("pdf")) t = ".pdf";
        else if (low.includes("mp4") || low.includes("video")) t = ".video";

        const code = `\n#{.ETCM:url=${url}&Type=${t}&Name=${encodeURIComponent(fileName || 'file')}}#\n`;
        document.getElementById('bodyInput').value += code;
    }

    document.getElementById('pickerCloseBtn').addEventListener('click', () => pickerModal.classList.remove('active'));
    document.getElementById('pickerMoreBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        pickerMenu.classList.toggle('active');
    });
    document.addEventListener('click', () => pickerMenu.classList.remove('active'));

    document.getElementById('optViewGrid').addEventListener('click', () => {
        pickerFilesList.classList.add('grid-mode');
        document.getElementById('listCheckmark').innerText = '';
    });
    document.getElementById('optViewList').addEventListener('click', () => {
        pickerFilesList.classList.remove('grid-mode');
        document.getElementById('listCheckmark').innerText = '✓';
    });

    const pickerNativeUpload = document.getElementById('pickerNativeUpload');
    document.getElementById('pickerUploadRow').addEventListener('click', () => pickerNativeUpload.click());
    pickerNativeUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            attachFileToComposer(evt.target.result, file.type, file.name);
            pickerModal.classList.remove('active');
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('pickerSearchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase().trim();
        renderPickerFiles(cloudDriveFiles.filter(f => (f.Name || '').toLowerCase().includes(term)));
    });

    // Send Mail Action
    document.getElementById('sendBtn').addEventListener('click', async () => {
        const to = document.getElementById('toInput').value.trim();
        const subject = document.getElementById('subjectInput').value.trim();
        const body = document.getElementById('bodyInput').value.trim();

        if (!to || !body) return alert("Please specify recipient and message body.");

        const btn = document.getElementById('sendBtn');
        btn.disabled = true;

        try {
            const isInternal = to.toLowerCase().endsWith('@perplexity.com');
            const payload = {
                from: senderEmail,
                to: to,
                subject: subject || '(No Subject)',
                body: body,
                timestamp: serverTimestamp()
            };

            if (isInternal) {
                await addDoc(collection(db, "Email"), payload);
            } else {
                await emailjs.send("service_63mnm5a", "template_drkhsx5", {
                    to_email: to,
                    from_email: senderEmail,
                    subject: subject,
                    message: body
                });
                await addDoc(collection(db, "Email"), payload);
            }

            alert("Sent!");
            window.location.href = "1.html";
        } catch (err) {
            alert("Error sending: " + err.message);
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
