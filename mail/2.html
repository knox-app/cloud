<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #1f1f1f;
            --text-secondary: #5f6368;
            --border-color: #e0e0e0;
            --accent-blue: #0b57d0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-primary: #e8eaed;
                --text-secondary: #9aa0a6;
                --border-color: #2d2d2d;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Action Bar (Matching Screenshot) */
        .header-bar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-actions { display: flex; align-items: center; gap: 20px; }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
        .btn-send svg { stroke: var(--accent-blue); fill: var(--accent-blue); }

        /* Compose Form Lines (Matching Screenshot) */
        .compose-container {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .input-row {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
        }

        .input-label {
            width: 50px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .input-field {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
        }

        .body-field {
            flex: 1;
            border: none;
            outline: none;
            padding: 16px;
            font-size: 15px;
            line-height: 1.6;
            resize: none;
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
            min-height: 300px;
        }

        /* Attachment Dropdown & Cloud Drive Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }
        .modal-overlay.active { display: flex; }

        .cloud-modal-card {
            background: var(--bg-color);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .modal-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .cloud-items-list {
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cloud-item {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .cloud-item:hover { background: rgba(0,0,0,0.04); }

        .popup-menu {
            position: absolute;
            top: 50px;
            right: 50px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            border-radius: 10px;
            display: none;
            flex-direction: column;
            z-index: 100;
        }
        .popup-menu.active { display: flex; }
        .popup-menu button {
            padding: 12px 16px;
            background: none;
            border: none;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-primary);
        }
        .popup-menu button:hover { background: rgba(0,0,0,0.05); }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<!-- Header Actions -->
<div class="header-bar">
    <a href="1.html" class="btn-icon">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>

    <div class="header-actions">
        <!-- Paperclip Attachment Button -->
        <button class="btn-icon" id="attachBtn" title="Attach">
            <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <!-- Paper Airplane Send Button -->
        <button class="btn-icon btn-send" id="sendBtn" title="Send">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
        <!-- 3 Dots -->
        <button class="btn-icon" id="moreOptionsBtn" title="More">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
    </div>
</div>

<!-- Attachment Source Selector Popup -->
<div class="popup-menu" id="attachMenu">
    <button id="btnCloudDrivePick">☁️ Pick from Cloud Drive</button>
    <button id="btnLocalUpload">📁 Upload from Device</button>
</div>
<input type="file" id="nativeFilePicker" style="display: none;">

<!-- Form Fields -->
<div class="compose-container">
    <div class="input-row">
        <span class="input-label">From</span>
        <input type="text" id="fromInput" class="input-field" readonly>
    </div>
    <div class="input-row">
        <span class="input-label">To</span>
        <input type="email" id="toInput" class="input-field" placeholder="" autocomplete="off" required>
    </div>
    <div class="input-row">
        <input type="text" id="subjectInput" class="input-field" placeholder="Subject">
    </div>
    <textarea id="bodyInput" class="body-field" placeholder="Compose email"></textarea>
</div>

<!-- Cloud Drive Selector Modal -->
<div class="modal-overlay" id="cloudModal">
    <div class="cloud-modal-card">
        <div class="modal-head">
            <span>Select file from Cloud Drive</span>
            <button class="btn-icon" id="closeCloudModal">✕</button>
        </div>
        <div class="cloud-items-list" id="cloudFilesList">
            <div style="padding: 20px; text-align: center; color: var(--text-secondary);">Loading your Cloud Drive...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    emailjs.init({ publicKey: "Yr9MutUoHOEONnFgn" });

    const activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
    const senderEmail = activeUser.Email || activeUser.email || "user@perplexity.com";
    document.getElementById('fromInput').value = senderEmail;

    // Attach Menu Dropdown Toggle
    const attachBtn = document.getElementById('attachBtn');
    const attachMenu = document.getElementById('attachMenu');
    attachBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        attachMenu.classList.toggle('active');
    });
    document.addEventListener('click', () => attachMenu.classList.remove('active'));

    // Inject Special Attachment Syntax: #{.ETCM:url=&Type=.img}#
    function injectAttachmentCode(url, extType, fileName = "") {
        let t = ".doc";
        const low = (extType || "").toLowerCase();
        if (low.includes("img") || low.includes("jpg") || low.includes("png") || low.includes("jpeg")) t = ".img";
        else if (low.includes("pdf")) t = ".pdf";
        else if (low.includes("mp4") || low.includes("video")) t = ".video";

        const code = `\n#{.ETCM:url=${url}&Type=${t}&Name=${encodeURIComponent(fileName)}}#\n`;
        const bodyBox = document.getElementById('bodyInput');
        bodyBox.value += code;
        alert(`Attached: ${fileName || 'File'}`);
    }

    // Cloud Drive Modal & File Fetching
    const cloudModal = document.getElementById('cloudModal');
    document.getElementById('btnCloudDrivePick').addEventListener('click', async () => {
        attachMenu.classList.remove('active');
        cloudModal.classList.add('active');

        const listDiv = document.getElementById('cloudFilesList');
        listDiv.innerHTML = `<div style="padding: 20px; text-align: center;">Loading Cloud Drive files...</div>`;

        try {
            const q = query(collection(db, "Cloud Drive"), where("Email", "==", senderEmail));
            const snap = await getDocs(q);

            const files = [];
            snap.forEach(d => {
                const data = d.data();
                if (data.Folder !== "True" && data.File) files.push(data);
            });

            if (!files.length) {
                listDiv.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-secondary);">No files found in your Cloud Drive.</div>`;
                return;
            }

            listDiv.innerHTML = files.map(f => `
                <div class="cloud-item" data-url="${f.File}" data-type="${f.Type || ''}" data-name="${f.Name || ''}">
                    <div>
                        <div style="font-weight: 500;">${f.Name || 'Untitled'}</div>
                        <div style="font-size: 12px; color: var(--text-secondary);">${f.Type || 'Document'}</div>
                    </div>
                    <span>📎 Select</span>
                </div>
            `).join('');

            listDiv.querySelectorAll('.cloud-item').forEach(el => {
                el.addEventListener('click', () => {
                    injectAttachmentCode(el.dataset.url, el.dataset.type, el.dataset.name);
                    cloudModal.classList.remove('active');
                });
            });

        } catch (e) {
            listDiv.innerHTML = `<div style="padding: 20px; color: red;">Error: ${e.message}</div>`;
        }
    });

    document.getElementById('closeCloudModal').addEventListener('click', () => cloudModal.classList.remove('active'));

    // Upload Local File
    const nativePicker = document.getElementById('nativeFilePicker');
    document.getElementById('btnLocalUpload').addEventListener('click', () => {
        attachMenu.classList.remove('active');
        nativePicker.click();
    });

    nativePicker.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            injectAttachmentCode(event.target.result, file.type, file.name);
        };
        reader.readAsDataURL(file);
    });

    // Send Mail Action
    document.getElementById('sendBtn').addEventListener('click', async () => {
        const to = document.getElementById('toInput').value.trim();
        const subject = document.getElementById('subjectInput').value.trim();
        const body = document.getElementById('bodyInput').value.trim();

        if (!to || !body) return alert("Please specify recipient and message body.");

        const btn = document.getElementById('sendBtn');
        btn.disabled = true;

        try {
            const isInternal = to.toLowerCase().endsWith('@perplexity.com');

            const payload = {
                from: senderEmail,
                to: to,
                subject: subject || '(No Subject)',
                body: body,
                timestamp: serverTimestamp()
            };

            if (isInternal) {
                await addDoc(collection(db, "Email"), payload);
            } else {
                await emailjs.send("service_63mnm5a", "template_drkhsx5", {
                    to_email: to,
                    from_email: senderEmail,
                    subject: subject,
                    message: body
                });
                await addDoc(collection(db, "Email"), payload);
            }

            alert("Sent successfully!");
            window.location.href = "1.html";
        } catch (err) {
            alert("Error sending: " + err.message);
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
