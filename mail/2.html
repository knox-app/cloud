<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Message</title>
    <style>
        :root {
            --bg-page: #fbfbfd;
            --surface: #ffffff;
            --sidebar-bg: #f5f5f7;
            --border: rgba(0, 0, 0, 0.08);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --danger: #ff3b30;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-page: #000000;
                --surface: #1c1c1e;
                --sidebar-bg: #151516;
                --border: rgba(255, 255, 255, 0.12);
                --text-primary: #f5f5f7;
                --text-secondary: #86868b;
                --accent: #2997ff;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .layout-shell {
            width: 100%;
            max-width: 1080px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        }

        @media (max-width: 860px) {
            .layout-shell { grid-template-columns: 1fr; }
        }

        /* Left Composer */
        .composer-main {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .comp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .field-group { display: flex; flex-direction: column; gap: 6px; }
        .field-group label { font-size: 13px; font-weight: 500; color: var(--text-secondary); }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        /* Attachment Bar */
        .attachment-strip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: var(--sidebar-bg);
            border-radius: var(--radius-md);
        }

        .btn-attach {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 980px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .attached-files-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .file-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Body & HTML Mode */
        .editor-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 6px;
        }

        .editor-modes {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            font-size: 12px;
        }

        .mode-toggle {
            cursor: pointer;
            color: var(--accent);
            font-weight: 500;
        }

        textarea {
            width: 100%;
            min-height: 240px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            resize: vertical;
        }

        /* Right Sidebar */
        .composer-sidebar {
            background: var(--sidebar-bg);
            border-left: 1px solid var(--border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .sidebar-section h4 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .feature-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .feature-toggle span { font-size: 14px; font-weight: 500; }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        .sidebar-input {
            width: 100%;
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text-primary);
            margin-top: 6px;
        }

        .btn-send-group {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-send {
            background: var(--text-primary);
            color: var(--bg-page);
            border: none;
            padding: 14px;
            border-radius: 980px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-send:hover { opacity: 0.9; }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<div class="layout-shell">
    <!-- Main Composer -->
    <div class="composer-main">
        <div class="comp-header">
            <h2>Compose</h2>
            <a href="1.html" class="back-link">&larr; Inbox</a>
        </div>

        <div class="attachment-strip">
            <label class="btn-attach">
                📎 Add Attachments
                <input type="file" id="fileInput" multiple style="display: none;">
            </label>
            <div class="attached-files-list" id="fileListPreview">No files attached</div>
        </div>

        <div class="field-group">
            <label>From</label>
            <input type="text" id="senderDisplay" readonly>
        </div>

        <div class="field-group">
            <label>To</label>
            <input type="email" id="toEmail" placeholder="user@perplexity.com or external@gmail.com" required>
        </div>

        <div class="field-group">
            <label>Subject</label>
            <input type="text" id="subject" placeholder="Write a subject...">
        </div>

        <div class="editor-container">
            <div class="editor-modes">
                <span class="mode-toggle" id="modeIndicator">HTML Supported</span>
            </div>
            <textarea id="body" placeholder="Write message or paste complete HTML code here..."></textarea>
        </div>
    </div>

    <!-- Right Sidebar Controls -->
    <div class="composer-sidebar">
        <div class="sidebar-section">
            <h4>Security & Privacy</h4>
            
            <div class="feature-toggle">
                <span>1-Time View (Self Destruct)</span>
                <label class="switch">
                    <input type="checkbox" id="oneTimeToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 6px;">
                Email automatically deletes after recipient opens and reads it.
            </div>
        </div>

        <div class="sidebar-section">
            <h4>Delivery Options</h4>
            <div class="field-group">
                <label>Schedule Delivery</label>
                <input type="datetime-local" id="scheduleTime" class="sidebar-input">
            </div>
        </div>

        <div class="sidebar-section">
            <h4>Organization</h4>
            <div class="field-group">
                <label>Add Label</label>
                <input type="text" id="labelInput" placeholder="Work, Important, etc." class="sidebar-input">
            </div>
        </div>

        <div class="btn-send-group">
            <button class="btn-send" id="sendBtn">Send Message</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // EmailJS Init
    emailjs.init({ publicKey: "Yr9MutUoHOEONnFgn" });

    const activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
    const senderEmail = activeUser.Email || activeUser.email || "user@perplexity.com";
    document.getElementById('senderDisplay').value = senderEmail;

    // Attachments Handling
    let attachedFiles = [];
    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        for (const file of files) {
            const base64 = await fileToBase64(file);
            attachedFiles.push({ name: file.name, size: file.size, type: file.type, data: base64 });
        }
        renderAttachedFiles();
    });

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    function renderAttachedFiles() {
        const preview = document.getElementById('fileListPreview');
        if (!attachedFiles.length) {
            preview.innerText = 'No files attached';
            return;
        }
        preview.innerHTML = attachedFiles.map(f => `<span class="file-chip">📎 ${f.name}</span>`).join(' ');
    }

    // Submit Handling
    document.getElementById('sendBtn').addEventListener('click', async () => {
        const to = document.getElementById('toEmail').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const body = document.getElementById('body').value.trim();
        const oneTimeView = document.getElementById('oneTimeToggle').checked;
        const scheduleTime = document.getElementById('scheduleTime').value;
        const label = document.getElementById('labelInput').value.trim();

        if (!to || !body) return alert("Recipient and Message body are required.");

        const sendBtn = document.getElementById('sendBtn');
        sendBtn.disabled = true;
        sendBtn.innerText = "Processing...";

        try {
            const isInternal = to.toLowerCase().endsWith('@perplexity.com');

            const payload = {
                from: senderEmail,
                to: to,
                subject: subject || '(No Subject)',
                body: body, // Raw text or HTML
                attachments: attachedFiles,
                oneTimeView: oneTimeView,
                scheduledFor: scheduleTime ? new Date(scheduleTime).toISOString() : null,
                label: label,
                timestamp: serverTimestamp()
            };

            if (isInternal) {
                await addDoc(collection(db, "Email"), payload);
            } else {
                // Send external email via EmailJS
                await emailjs.send("service_63mnm5a", "template_drkhsx5", {
                    to_email: to,
                    from_email: senderEmail,
                    subject: subject,
                    message: body
                });
                // Save record for Sent box
                await addDoc(collection(db, "Email"), payload);
            }

            alert("Message sent successfully!");
            window.location.href = "1.html";
        } catch (err) {
            alert("Error: " + err.message);
            sendBtn.disabled = false;
            sendBtn.innerText = "Send Message";
        }
    });
</script>

</body>
</html>
