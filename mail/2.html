<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose</title>
    <style>
        :root {
            --bg: #fbfbfd;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --border: #d2d2d7;
            --accent: #0071e3;
            --accent-hover: #0077ed;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card-bg: #1c1c1e;
                --text-main: #f5f5f7;
                --text-sub: #86868b;
                --border: #38383a;
                --accent: #2997ff;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--bg); color: var(--text-main);
            padding: 40px 20px; display: flex; justify-content: center;
        }

        .container {
            width: 100%; max-width: 680px; background: var(--card-bg);
            border: 1px solid var(--border); border-radius: 18px; padding: 28px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .back-link { text-decoration: none; color: var(--accent); font-size: 14px; font-weight: 500; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }

        input, textarea {
            width: 100%; padding: 12px 14px; font-size: 15px; border: 1px solid var(--border);
            border-radius: 10px; background: transparent; color: var(--text-main);
            outline: none; font-family: inherit;
        }
        input:focus, textarea:focus { border-color: var(--accent); }
        textarea { min-height: 180px; resize: vertical; }

        .attachment-bar {
            display: flex; gap: 8px; margin-bottom: 12px; background: rgba(0,0,0,0.03);
            padding: 8px 12px; border-radius: 8px; align-items: center;
        }
        .attachment-input { flex: 1; padding: 6px 10px; font-size: 13px; border-radius: 6px; }
        .btn-attach {
            background: var(--text-main); color: var(--bg); border: none; padding: 7px 14px;
            font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer;
        }

        .btn-send {
            background-color: var(--accent); color: #fff; border: none; padding: 14px;
            font-size: 15px; font-weight: 600; border-radius: 980px; cursor: pointer; width: 100%;
        }
        .btn-send:hover { background-color: var(--accent-hover); }
        .btn-send:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>New Message</h2>
        <a href="1.html" class="back-link">&larr; Inbox</a>
    </div>

    <form id="composeForm">
        <div class="form-group">
            <label>Sender</label>
            <input type="text" id="senderDisplay" readonly style="opacity: 0.75;">
        </div>

        <div class="form-group">
            <label>To</label>
            <input type="email" id="toEmail" placeholder="user@perplexity.com or any email..." required>
        </div>

        <div class="form-group">
            <label>Subject</label>
            <input type="text" id="subject" placeholder="Subject line" required>
        </div>

        <div class="form-group">
            <label>Schedule Delivery (Optional)</label>
            <input type="datetime-local" id="scheduleTime">
        </div>

        <div class="form-group">
            <label>Quick Attach Media / Document (URL)</label>
            <div class="attachment-bar">
                <input type="url" id="attachUrl" class="attachment-input" placeholder="Paste image, video (.mp4, .m3u8), or doc (.pptx, .docx, .exe) URL">
                <button type="button" class="btn-attach" id="insertAttachBtn">+ Embed</button>
            </div>
        </div>

        <div class="form-group">
            <label>Message Content (Supports Rich HTML & {\.file=URL})</label>
            <textarea id="body" placeholder="Write your message here... You can use HTML tags (e.g. <b>bold</b>, <h1>) or insert media with {\.file=https://...}" required></textarea>
        </div>

        <button type="submit" class="btn-send" id="sendBtn">Send</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
        measurementId: "G-QE17C33TMN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const EMAILJS_PUBLIC_KEY = "Yr9MutUoHOEONnFgn";
    const EMAILJS_SERVICE_ID = "service_63mnm5a";
    const EMAILJS_TEMPLATE_ID = "template_drkhsx5";
    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    const activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
    const senderEmail = activeUser.Email || activeUser.email || "user@perplexity.com";
    document.getElementById('senderDisplay').value = senderEmail;

    // Helper: Insert file syntax into textarea
    document.getElementById('insertAttachBtn').addEventListener('click', () => {
        const url = document.getElementById('attachUrl').value.trim();
        if (!url) return alert("Please enter a valid file URL.");
        const tag = `{\\.file=${url}}\n`;
        const bodyInput = document.getElementById('body');
        bodyInput.value += (bodyInput.value ? '\n' : '') + tag;
        document.getElementById('attachUrl').value = '';
    });

    document.getElementById('composeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const to = document.getElementById('toEmail').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const body = document.getElementById('body').value.trim();
        const scheduleVal = document.getElementById('scheduleTime').value;
        const sendBtn = document.getElementById('sendBtn');

        sendBtn.disabled = true;
        sendBtn.innerText = "Dispatching...";

        try {
            const scheduledTimestamp = scheduleVal ? Timestamp.fromDate(new Date(scheduleVal)) : null;
            const isInternal = to.toLowerCase().endsWith('@perplexity.com');

            const payload = {
                from: senderEmail,
                to: to,
                subject: subject,
                body: body,
                timestamp: serverTimestamp(),
                scheduledFor: scheduledTimestamp
            };

            if (isInternal) {
                await addDoc(collection(db, "Email"), payload);
            } else {
                // If not scheduled for later, send immediately via EmailJS
                if (!scheduledTimestamp || new Date(scheduleVal) <= new Date()) {
                    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                        to_email: to,
                        from_email: senderEmail,
                        subject: subject,
                        message: body.replace(/<[^>]*>/g, '') // strip html for raw email text
                    });
                }
                // Save copy to Firestore
                payload.provider = 'emailjs';
                await addDoc(collection(db, "Email"), payload);
            }

            alert("Message saved and scheduled successfully.");
            window.location.href = "1.html";
        } catch (err) {
            alert("Error: " + err.message);
            sendBtn.disabled = false;
            sendBtn.innerText = "Send";
        }
    });
</script>
</body>
</html>
