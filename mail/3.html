<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Email</title>
    <style>
        :root {
            --bg-page: #ffffff;
            --surface: #fbfbfd;
            --border: rgba(0, 0, 0, 0.08);
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --accent: #0071e3;
            --danger: #ff3b30;
            --radius-lg: 16px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-page: #000000;
                --surface: #161617;
                --border: rgba(255, 255, 255, 0.12);
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --accent: #2997ff;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .viewport {
            width: 100%;
            max-width: 820px;
            padding: 40px 24px 80px 24px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-back {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .btn-delete {
            background: none;
            border: 1px solid var(--border);
            color: var(--danger);
            padding: 6px 14px;
            border-radius: 980px;
            font-size: 13px;
            cursor: pointer;
        }

        .self-destruct-banner {
            background: rgba(255, 59, 48, 0.1);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .subject-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .sender-card {
            display: flex;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .attachments-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
        }

        .attach-card {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 13px;
        }

        .email-body-frame {
            width: 100%;
            border: none;
            min-height: 400px;
        }
    </style>
</head>
<body>

<div class="viewport">
    <div class="action-bar">
        <a href="1.html" class="btn-back">&larr; Back</a>
        <button class="btn-delete" id="deleteBtn">Delete</button>
    </div>

    <div id="destructBanner" class="self-destruct-banner" style="display: none;">
        ⚠️ One-Time View Notice: This email has now self-destructed and won't be accessible again.
    </div>

    <div id="contentArea">Loading message...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const docId = new URLSearchParams(window.location.search).get('id');

    async function loadEmail() {
        if (!docId) return;
        const ref = doc(db, "Email", docId);
        const snap = await getDoc(ref);

        if (!snap.exists()) {
            document.getElementById('contentArea').innerHTML = "Message deleted or not found.";
            return;
        }

        const data = snap.data();
        const from = data.from || data.From || 'Unknown';
        const to = data.to || data.To || 'Unknown';
        const subject = data.subject || '(No Subject)';
        const body = data.body || '';
        const attachments = data.attachments || [];
        const isOneTime = data.oneTimeView || false;

        if (isOneTime) {
            document.getElementById('destructBanner').style.display = 'block';
            // Self destruct execution: delete after opening
            await deleteDoc(ref);
        }

        let attachHtml = '';
        if (attachments.length) {
            attachHtml = `<div class="attachments-container">` + 
                attachments.map(a => `<a class="attach-card" href="${a.data}" download="${a.name}">📎 Download ${a.name}</a>`).join('') +
            `</div>`;
        }

        document.getElementById('contentArea').innerHTML = `
            <h1 class="subject-title">${escapeHtml(subject)}</h1>
            <div class="sender-card">
                <div>
                    <div><strong>From:</strong> ${escapeHtml(from)}</div>
                    <div style="color: var(--text-secondary);"><strong>To:</strong> ${escapeHtml(to)}</div>
                </div>
            </div>
            ${attachHtml}
            <iframe id="htmlViewer" class="email-body-frame" sandbox="allow-same-origin"></iframe>
        `;

        // Render HTML content safely inside iframe
        const frame = document.getElementById('htmlViewer');
        const frameDoc = frame.contentDocument || frame.contentWindow.document;
        frameDoc.open();
        frameDoc.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    body { font-family: -apple-system, sans-serif; font-size: 15px; line-height: 1.6; color: #1d1d1f; margin: 0; padding: 10px 0; }
                    @media (prefers-color-scheme: dark) { body { color: #f5f5f7; } }
                </style>
            </head>
            <body>${body}</body>
            </html>
        `);
        frameDoc.close();

        // Adjust iframe height dynamically
        setTimeout(() => {
            frame.style.height = frameDoc.body.scrollHeight + 40 + 'px';
        }, 150);

        document.getElementById('deleteBtn').onclick = async () => {
            if (confirm("Delete this email permanently?")) {
                await deleteDoc(ref);
                window.location.href = "1.html";
            }
        };
    }

    function escapeHtml(str) {
        return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    loadEmail();
</script>

</body>
</html>
