<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message View</title>
    <style>
        :root {
            --bg-page: #ffffff;
            --surface: #fbfbfd;
            --border: rgba(0, 0, 0, 0.08);
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #a1a1a6;
            --accent: #0071e3;
            --danger: #ff3b30;
            --avatar-bg: #f2f2f7;
            --radius-lg: 16px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-page: #000000;
                --surface: #161617;
                --border: rgba(255, 255, 255, 0.12);
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --text-tertiary: #636366;
                --accent: #2997ff;
                --danger: #ff453a;
                --avatar-bg: #2c2c2e;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .viewport {
            width: 100%;
            max-width: 760px;
            padding: 40px 24px 80px 24px;
            display: flex;
            flex-direction: column;
        }

        /* Top Action Bar */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            transition: color 0.15s;
        }

        .btn-back:hover {
            color: var(--text-primary);
        }

        .right-actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 980px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s, border-color 0.15s;
        }

        .btn-action:hover {
            border-color: rgba(0, 0, 0, 0.2);
        }

        .btn-action.delete {
            color: var(--danger);
        }

        /* Email Card Layout */
        .subject-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.25;
            margin-bottom: 24px;
        }

        .sender-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--avatar-bg);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            text-transform: uppercase;
        }

        .sender-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .sender-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .recipient-line {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .date-line {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .email-body {
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .loading-state {
            text-align: center;
            padding: 80px 0;
            color: var(--text-secondary);
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="viewport">
    <div class="action-bar">
        <a href="1.html" class="btn-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back
        </a>
        <div class="right-actions" id="actionButtons" style="display: none;">
            <button class="btn-action delete" id="deleteBtn">Delete</button>
            <a href="2.html" class="btn-action" id="replyBtn">Reply</a>
        </div>
    </div>

    <div id="contentArea">
        <div class="loading-state">Loading message...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
        measurementId: "G-QE17C33TMN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const emailId = urlParams.get('id');

    async function loadEmail() {
        if (!emailId) {
            document.getElementById('contentArea').innerHTML = `<div class="loading-state">No email ID specified.</div>`;
            return;
        }

        try {
            const docRef = doc(db, "Email", emailId);
            const snap = await getDoc(docRef);

            if (!snap.exists()) {
                document.getElementById('contentArea').innerHTML = `<div class="loading-state">Message not found or deleted.</div>`;
                return;
            }

            const data = snap.data();
            const from = data.from || data.From || data.sender || data.Sender || 'Unknown';
            const to = data.to || data.To || data.recipient || data.Recipient || 'Unknown';
            const subject = data.subject || data.Subject || '(No Subject)';
            const body = data.body || data.Body || data.message || data.Message || '';
            
            let dateStr = 'Unknown date';
            if (data.timestamp) {
                const d = data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp);
                dateStr = d.toLocaleString(undefined, { dateStyle: 'full', timeStyle: 'short' });
            }

            const initial = (from[0] || 'U').toUpperCase();

            document.getElementById('contentArea').innerHTML = `
                <div class="subject-title">${escapeHtml(subject)}</div>
                
                <div class="sender-card">
                    <div class="avatar">${initial}</div>
                    <div class="sender-meta">
                        <div class="sender-name">${escapeHtml(from)}</div>
                        <div class="recipient-line">to ${escapeHtml(to)}</div>
                        <div class="date-line">${dateStr}</div>
                    </div>
                </div>

                <div class="email-body">${escapeHtml(body)}</div>
            `;

            document.getElementById('actionButtons').style.display = 'flex';

            // Delete action
            document.getElementById('deleteBtn').onclick = async () => {
                if (confirm("Permanently delete this email?")) {
                    await deleteDoc(docRef);
                    window.location.href = "1.html";
                }
            };

            // Reply action
            document.getElementById('replyBtn').href = `2.html?to=${encodeURIComponent(from)}&subject=${encodeURIComponent("Re: " + subject)}`;

        } catch (err) {
            console.error(err);
            document.getElementById('contentArea').innerHTML = `<div class="loading-state">Failed to load message: ${err.message}</div>`;
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    loadEmail();
</script>

</body>
</html>
