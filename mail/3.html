<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Email</title>
    <style>
        :root {
            --bg-body: #ffffff;
            --border: #e5e5e8;
            --text-main: #111827;
            --text-sub: #6b7280;
            --accent-blue: #2563eb;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .view-shell {
            width: 100%;
            max-width: 800px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .btn-nav {
            text-decoration: none;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 500;
        }

        .action-btns { display: flex; gap: 8px; }
        .btn-act {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            font-size: 13px;
            cursor: pointer;
        }

        .lang-banner {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subject-line { font-size: 24px; font-weight: 700; margin-bottom: 16px; }

        .sender-box {
            display: flex;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
            font-size: 14px;
        }

        .attachments-list {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .attach-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #f4f4f5;
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 13px;
        }

        .body-render {
            font-size: 15px;
            line-height: 1.7;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="view-shell">
    <div class="top-bar">
        <a href="1.html" class="btn-nav">&larr; Back to Inbox</a>
        <div class="action-btns">
            <button class="btn-act" id="toggleTranslateBtn" style="display: none;">Show Original</button>
            <button class="btn-act" id="deleteBtn" style="color: var(--danger);">Delete</button>
        </div>
    </div>

    <!-- Translation Status Banner -->
    <div class="lang-banner" id="langBanner" style="display: none;">
        <span id="langNoticeText">Translated automatically</span>
        <button id="toggleBtnInline" style="background: none; border: none; color: var(--accent-blue); cursor: pointer; font-weight: 600;">Show Original</button>
    </div>

    <div id="contentPane">Loading email...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const emailId = new URLSearchParams(window.location.search).get('id');
    const activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
    const targetLang = (activeUser["Email-Lang-Target"] || activeUser["Email_Lang_Target"] || "").toLowerCase().trim();

    let originalSubject = "";
    let originalBody = "";
    let translatedSubject = "";
    let translatedBody = "";
    let isShowingTranslated = false;

    // Language Code Mapper
    const langCodes = {
        "hindi": "hi",
        "spanish": "es",
        "french": "fr",
        "german": "de",
        "japanese": "ja",
        "russian": "ru",
        "arabic": "ar",
        "bengali": "bn"
    };

    async function translateText(text, target) {
        if (!text || !target) return text;
        const code = langCodes[target] || target;
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${code}&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            return data[0].map(item => item[0]).join('');
        } catch (e) {
            console.error("Translation failed:", e);
            return text;
        }
    }

    async function load() {
        if (!emailId) return;
        const ref = doc(db, "Email", emailId);
        const snap = await getDoc(ref);

        if (!snap.exists()) {
            document.getElementById('contentPane').innerHTML = "Message not found or already deleted.";
            return;
        }

        const data = snap.data();
        originalSubject = data.subject || data.Subject || '(No Subject)';
        originalBody = data.body || data.Body || '';
        const from = data.from || data.From || 'Unknown';
        const to = data.to || data.To || 'Unknown';
        const attachments = data.attachments || [];

        // If One Time View -> self destruct document
        if (data.oneTimeView) {
            await deleteDoc(ref);
        }

        // Auto Translation Trigger
        if (targetLang && targetLang !== "english" && targetLang !== "en") {
            translatedSubject = await translateText(originalSubject, targetLang);
            // Translate plain text representation of body
            translatedBody = await translateText(originalBody.replace(/<[^>]*>?/gm, ''), targetLang);
            isShowingTranslated = true;

            document.getElementById('langBanner').style.display = 'flex';
            document.getElementById('langNoticeText').innerText = `Translated to ${targetLang.toUpperCase()} as per your preferences`;
            document.getElementById('toggleTranslateBtn').style.display = 'inline-block';
        }

        renderContent(from, to, attachments);

        document.getElementById('deleteBtn').onclick = async () => {
            if (confirm("Delete this email permanently?")) {
                await deleteDoc(ref);
                window.location.href = "1.html";
            }
        };

        const toggleHandler = () => {
            isShowingTranslated = !isShowingTranslated;
            const btnText = isShowingTranslated ? "Show Original" : `Translate to ${targetLang.toUpperCase()}`;
            document.getElementById('toggleTranslateBtn').innerText = btnText;
            document.getElementById('toggleBtnInline').innerText = btnText;
            renderContent(from, to, attachments);
        };

        document.getElementById('toggleTranslateBtn').onclick = toggleHandler;
        document.getElementById('toggleBtnInline').onclick = toggleHandler;
    }

    function renderContent(from, to, attachments) {
        const currentSub = isShowingTranslated ? translatedSubject : originalSubject;
        const currentBody = isShowingTranslated ? translatedBody : originalBody;

        let attachHtml = '';
        if (attachments.length) {
            attachHtml = `<div class="attachments-list">` + 
                attachments.map(a => `<a class="attach-btn" href="${a.data}" download="${a.name}">📎 ${a.name}</a>`).join('') +
            `</div>`;
        }

        document.getElementById('contentPane').innerHTML = `
            <div class="subject-line">${escapeHtml(currentSub)}</div>
            <div class="sender-box">
                <div>
                    <strong>From:</strong> ${escapeHtml(from)}<br>
                    <span style="color: var(--text-sub);"><strong>To:</strong> ${escapeHtml(to)}</span>
                </div>
            </div>
            ${attachHtml}
            <div class="body-render">${currentBody}</div>
        `;
    }

    function escapeHtml(str) {
        return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    load();
</script>

</body>
</html>
