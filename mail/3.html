<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Email</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #1f1f1f;
            --text-secondary: #5f6368;
            --border-color: #e0e0e0;
            --cube-bg: #f8fafc;
            --accent-blue: #0b57d0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-primary: #e8eaed;
                --text-secondary: #9aa0a6;
                --border-color: #2d2d2d;
                --cube-bg: #1e1e24;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 16px 80px 16px;
            display: flex;
            justify-content: center;
        }

        .reader-shell {
            width: 100%;
            max-width: 760px;
        }

        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .email-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .meta-strip {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .avatar-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar-circle img,
        .avatar-circle video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .meta-info { flex: 1; }
        .meta-sender { font-weight: 600; font-size: 15px; }
        .meta-recipient { font-size: 12px; color: var(--text-secondary); }

        .email-body-text {
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 30px;
        }

        /* 3D Cubic Isometric Attachment Cards */
        .cubic-attachments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .cubic-card {
            background: var(--cube-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: var(--text-primary);
            position: relative;
            transform-style: preserve-3d;
            perspective: 800px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
        }
        .cubic-card:hover {
            transform: translateY(-4px) rotateX(4deg) rotateY(-4deg);
            box-shadow: 0 14px 28px rgba(0,0,0,0.12);
        }

        /* Cube Graphic Representation */
        .cube-shape {
            width: 58px;
            height: 58px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-weight: 800;
            font-size: 13px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 4px 10px rgba(0,0,0,0.1);
        }

        .cube-shape.img { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; }
        .cube-shape.pdf { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; }
        .cube-shape.video { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; }
        .cube-shape.doc { background: linear-gradient(135deg, #10b981, #047857); color: white; }

        .cube-file-name {
            font-size: 13px;
            font-weight: 600;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cube-tag {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .translate-pill {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="reader-shell">
    <div class="top-action-bar">
        <a href="1.html" class="back-link">&larr; Back</a>
        <button id="deleteBtn" style="background: none; border: none; color: #ef4444; font-weight: 600; cursor: pointer;">Delete</button>
    </div>

    <div id="translateNotice" class="translate-pill" style="display: none;">
        <span id="transText">Translated automatically</span>
        <button id="btnToggleTrans" style="background:none; border:none; color:#1e40af; font-weight:600; cursor:pointer;">Show Original</button>
    </div>

    <div id="contentPane">Loading email...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import {
        getFirestore,
        doc,
        getDoc,
        deleteDoc,
        collection,
        query,
        where,
        getDocs,
        limit
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const docId = new URLSearchParams(window.location.search).get('id');
    const activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
    const targetLang = (activeUser["Email-Lang-Target"] || activeUser["Email_Lang_Target"] || "").toLowerCase().trim();

    let origSubject = "", origBody = "", transSubject = "", transBody = "", showingTranslated = false;
    let senderProfilePic = "";

    // Extract email address if formatted as "Name <email@domain.com>"
    function extractEmailAddress(str) {
        if (!str) return "";
        const match = str.match(/<([^>]+)>/);
        return (match ? match[1] : str).trim();
    }

    // Pick profile picture field regardless of casing/naming
    function pickProfilePictureField(obj) {
        if (!obj || typeof obj !== "object") return "";
        return (
            obj.Profile_Picture ||
            obj.profile_picture ||
            obj.profilePicture ||
            obj.ProfilePicture ||
            obj.senderProfilePicture ||
            obj.avatar ||
            ""
        );
    }

    // Fetch sender's Profile_Picture from email doc, localStorage, or Firestore user collections
    async function fetchSenderProfilePicture(from, emailData) {
        const directPic = pickProfilePictureField(emailData);
        if (directPic) return directPic;

        const cleanFrom = extractEmailAddress(from);
        if (!cleanFrom) return "";

        const activeEmail = extractEmailAddress(
            activeUser.email || activeUser.Email || activeUser.userEmail || ""
        );
        if (activeEmail && activeEmail.toLowerCase() === cleanFrom.toLowerCase()) {
            const activePic = pickProfilePictureField(activeUser);
            if (activePic) return activePic;
        }

        const userCollections = ["Users", "users", "User", "Accounts"];
        const emailFields = ["Email", "email", "userEmail", "mail"];
        const idCandidates = [...new Set([cleanFrom, cleanFrom.toLowerCase()])];

        for (const colName of userCollections) {
            // 1. Try direct document lookup by email ID
            for (const candidateId of idCandidates) {
                try {
                    const userSnap = await getDoc(doc(db, colName, candidateId));
                    if (userSnap.exists()) {
                        const pic = pickProfilePictureField(userSnap.data());
                        if (pic) return pic;
                    }
                } catch (e) {}
            }

            // 2. Try querying by common email fields
            for (const field of emailFields) {
                for (const candidateEmail of idCandidates) {
                    try {
                        const q = query(
                            collection(db, colName),
                            where(field, "==", candidateEmail),
                            limit(1)
                        );
                        const snap = await getDocs(q);
                        if (!snap.empty) {
                            const pic = pickProfilePictureField(snap.docs[0].data());
                            if (pic) return pic;
                        }
                    } catch (e) {}
                }
            }
        }

        return "";
    }

    // Normalize data URLs / raw base64 / file extensions and detect image vs video (.webm, etc.)
    function normalizeProfileMedia(raw) {
        if (!raw || typeof raw !== "string") return null;
        let src = raw.trim();
        if (!src) return null;

        // Handle raw base64 without data: prefix
        if (!/^(data:|https?:\/\/|\/|\.\/)/i.test(src)) {
            if (src.startsWith("/9j/")) src = "data:image/jpeg;base64," + src;
            else if (src.startsWith("iVBOR")) src = "data:image/png;base64," + src;
            else if (src.startsWith("UklGR")) src = "data:image/webp;base64," + src;
            else if (src.startsWith("R0lGO")) src = "data:image/gif;base64," + src;
            else if (src.startsWith("GkXfo")) src = "data:video/webm;base64," + src;
            else src = "data:image/jpeg;base64," + src;
        }

        // Normalize .jpmg MIME typo to image/jpeg
        src = src.replace(/^data:image\/jpmg\b/i, "data:image/jpeg");

        // Validate allowed URL protocols
        if (!/^(data:(image|video)\/[a-zA-Z0-9+.-]+;|https?:\/\/|\/|\.\/)/i.test(src)) {
            return null;
        }

        const isVideo =
            /^data:video\//i.test(src) ||
            /^data:image\/webm\b/i.test(src) ||
            /\.(webm|mp4|mov|ogg)(\?.*)?$/i.test(src);

        if (isVideo) {
            src = src.replace(/^data:image\/webm\b/i, "data:video/webm");
        }

        return { src, isVideo };
    }

    // Populate the avatar container with <img>, <video> (for .webm), or fallback initial
    function updateAvatarElement(from, profilePic) {
        const avatarEl = document.getElementById('senderAvatar');
        if (!avatarEl) return;

        const fallbackInitial = (extractEmailAddress(from)[0] || from[0] || 'U').toUpperCase();
        const media = normalizeProfileMedia(profilePic);

        if (!media) {
            avatarEl.textContent = fallbackInitial;
            return;
        }

        avatarEl.innerHTML = "";
        const el = document.createElement(media.isVideo ? "video" : "img");
        el.src = media.src;
        el.alt = `${from} profile picture`;

        if (media.isVideo) {
            el.autoplay = true;
            el.loop = true;
            el.muted = true;
            el.playsInline = true;
        }

        el.onerror = () => {
            avatarEl.textContent = fallbackInitial;
        };

        avatarEl.appendChild(el);
    }

    // Translation function
    async function translateString(text, lang) {
        if (!text || !lang || lang === "english" || lang === "en") return text;
        const codeMap = { hindi: "hi", spanish: "es", french: "fr", german: "de", japanese: "ja" };
        const code = codeMap[lang] || lang;
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${code}&dt=t&q=${encodeURIComponent(text)}`);
            const j = await res.json();
            return j[0].map(s => s[0]).join('');
        } catch(e) {
            return text;
        }
    }

    async function loadEmail() {
        if (!docId) return;
        const ref = doc(db, "Email", docId);
        const snap = await getDoc(ref);

        if (!snap.exists()) {
            document.getElementById('contentPane').innerHTML = "Message not found or deleted.";
            return;
        }

        const data = snap.data();
        origSubject = data.subject || '(No Subject)';
        origBody = data.body || '';
        const from = data.from || 'Unknown';
        const to = data.to || 'Unknown';

        // Start fetching sender's Profile_Picture in parallel
        const profilePicPromise = fetchSenderProfilePicture(from, data).then(pic => {
            senderProfilePic = pic;
            updateAvatarElement(from, senderProfilePic);
        });

        // Auto Translation if target language exists
        if (targetLang && targetLang !== "english") {
            transSubject = await translateString(origSubject, targetLang);
            // Translate clean body (without attachment codes)
            const pureText = origBody.replace(/#\{\.ETCM:.*?\}#/g, '');
            transBody = await translateString(pureText, targetLang);
            showingTranslated = true;
            document.getElementById('translateNotice').style.display = 'flex';
            document.getElementById('transText').innerText = `Translated to ${targetLang.toUpperCase()} as per your preferences`;
        }

        renderReader(from, to);
        await profilePicPromise;

        document.getElementById('deleteBtn').onclick = async () => {
            if (confirm("Delete this email permanently?")) {
                await deleteDoc(ref);
                window.location.href = "1.html";
            }
        };

        document.getElementById('btnToggleTrans').onclick = () => {
            showingTranslated = !showingTranslated;
            document.getElementById('btnToggleTrans').innerText = showingTranslated ? "Show Original" : "Show Translation";
            renderReader(from, to);
        };
    }

    // Parser for #{.ETCM:url=&Type=.img&Name=}#
    function parseAttachments(bodyText) {
        const regex = /#\{\.ETCM:url=(.*?)&Type=(.*?)(?:&Name=(.*?))?\}#/g;
        const items = [];
        let clean = bodyText;
        let match;

        while ((match = regex.exec(bodyText)) !== null) {
            items.push({
                raw: match[0],
                url: match[1],
                type: match[2],
                name: match[3] ? decodeURIComponent(match[3]) : 'File'
            });
        }
        clean = clean.replace(regex, '').trim();
        return { cleanBody: clean, attachments: items };
    }

    function renderReader(from, to) {
        const activeSub = showingTranslated ? transSubject : origSubject;
        const activeRawBody = showingTranslated ? transBody : origBody;
        const { cleanBody, attachments } = parseAttachments(activeRawBody);

        let cubesHtml = '';
        if (attachments.length) {
            cubesHtml = `<div class="cubic-attachments-grid">` + attachments.map(item => {
                const ext = item.type.replace('.', '').toLowerCase();
                return `
                    <a href="${item.url}" class="cubic-card" target="_blank" download>
                        <div class="cube-shape ${ext}">
                            ${item.type.toUpperCase()}
                        </div>
                        <div class="cube-file-name" title="${item.name}">${item.name}</div>
                        <div class="cube-tag">${item.type} File • Click to View</div>
                    </a>
                `;
            }).join('') + `</div>`;
        }

        document.getElementById('contentPane').innerHTML = `
            <div class="email-title">${escapeHtml(activeSub)}</div>
            <div class="meta-strip">
                <div class="avatar-circle" id="senderAvatar">${(from[0] || 'U').toUpperCase()}</div>
                <div class="meta-info">
                    <div class="meta-sender">${escapeHtml(from)}</div>
                    <div class="meta-recipient">to ${escapeHtml(to)}</div>
                </div>
            </div>
            <div class="email-body-text">${cleanBody}</div>
            ${cubesHtml}
        `;

        updateAvatarElement(from, senderProfilePic);
    }

    function escapeHtml(str) {
        return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    loadEmail();
</script>

</body>
</html>
