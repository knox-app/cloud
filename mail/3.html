<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Reader</title>
    <style>
        :root {
            --bg-page: #ffffff;
            --border: #e5e7eb;
            --text-main: #111827;
            --text-sub: #6b7280;
            --accent-blue: #0b57d0;
            --danger: #ef4444;
            --cubic-bg: #f8fafc;
            --cubic-border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px 16px 80px 16px;
        }

        .view-shell {
            width: 100%;
            max-width: 800px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .btn-nav {
            text-decoration: none;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .action-btns { display: flex; gap: 8px; }
        .btn-act {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 9999px;
            background: #fff;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }

        .subject-line {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 14px;
            letter-spacing: -0.01em;
        }

        .sender-box {
            display: flex;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .email-body-text {
            font-size: 15px;
            line-height: 1.7;
            word-break: break-word;
            white-space: pre-wrap;
        }

        /* ================= CUBIC STRUCTURE ATTACHMENT CARD ================= */
        .cubic-card-attachment {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: var(--cubic-bg);
            border: 1px solid var(--cubic-border);
            border-radius: 16px;
            padding: 12px 18px;
            margin: 14px 6px;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
            max-width: 320px;
        }

        .cubic-card-attachment:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        /* 3D Cubic Icon Block */
        .cubic-box {
            width: 44px;
            height: 44px;
            background: #ffffff;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), 0 3px 6px rgba(0,0,0,0.06);
            flex-shrink: 0;
            font-size: 22px;
        }

        .cubic-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cubic-file-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .cubic-type-badge {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-top: 2px;
        }

        /* One-Time View Alert */
        .destruct-notice {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="view-shell">
    <div class="top-bar">
        <a href="1.html" class="btn-nav">&larr; Back to Inbox</a>
        <div class="action-btns">
            <button class="btn-act" id="deleteBtn" style="color: var(--danger);">Delete</button>
        </div>
    </div>

    <div id="destructAlert" class="destruct-notice" style="display: none;">
        ⚠️ This message was sent as a 1-Time View and has now been erased from the database.
    </div>

    <div id="contentPane">Loading email...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const emailId = new URLSearchParams(window.location.search).get('id');

    // Return visual emoji icon for the cubic box
    function getCubicIcon(type) {
        const t = (type || "").toLowerCase();
        if (t === ".img") return "🖼️";
        if (t === ".pdf") return "📕";
        if (t === ".video") return "🎬";
        return "📄"; // default .doc
    }

    // Engine: Finds #{.ETCM:url=...&Type=...}# and turns it into a Cubic Card HTML
    function parseAndRenderETCM(rawText) {
        // Regex matches #{.ETCM:url=<URL>&Type=<TYPE>(optional &name=<NAME>)}#
        const regex = /#\{\.ETCM:url=([^&]+)&Type=([^&\}]+)(?:&name=([^&\}]+))?\}#/g;

        return rawText.replace(regex, (match, url, type, encodedName) => {
            const fileName = encodedName ? decodeURIComponent(encodedName) : (url.split('/').pop()?.split('?')[0] || "Attachment");
            const icon = getCubicIcon(type);

            return `
                <a class="cubic-card-attachment" href="${url}" target="_blank" download="${escapeHtml(fileName)}">
                    <div class="cubic-box">${icon}</div>
                    <div class="cubic-details">
                        <span class="cubic-file-name" title="${escapeHtml(fileName)}">${escapeHtml(fileName)}</span>
                        <span class="cubic-type-badge">${escapeHtml(type)} File</span>
                    </div>
                </a>
            `;
        });
    }

    async function load() {
        if (!emailId) return;
        const ref = doc(db, "Email", emailId);
        const snap = await getDoc(ref);

        if (!snap.exists()) {
            document.getElementById('contentPane').innerHTML = "Message not found or already deleted.";
            return;
        }

        const data = snap.data();
        const subject = data.subject || data.Subject || '(No Subject)';
        const rawBody = data.body || data.Body || '';
        const from = data.from || data.From || 'Unknown';
        const to = data.to || data.To || 'Unknown';

        // 1-Time Self Destruct
        if (data.oneTimeView) {
            document.getElementById('destructAlert').style.display = 'block';
            await deleteDoc(ref);
        }

        // Parse ETCM attachments into Cubic Structures
        const parsedBodyHtml = parseAndRenderETCM(rawBody);

        document.getElementById('contentPane').innerHTML = `
            <div class="subject-line">${escapeHtml(subject)}</div>
            <div class="sender-box">
                <div>
                    <strong>From:</strong> ${escapeHtml(from)}<br>
                    <span style="color: var(--text-sub);"><strong>To:</strong> ${escapeHtml(to)}</span>
                </div>
            </div>
            <div class="email-body-text">${parsedBodyHtml}</div>
        `;

        document.getElementById('deleteBtn').onclick = async () => {
            if (confirm("Delete this email?")) {
                await deleteDoc(ref);
                window.location.href = "1.html";
            }
        };
    }

    function escapeHtml(s) {
        return (s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    load();
</script>

</body>
</html>
