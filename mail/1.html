<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailbox</title>
    <style>
        :root {
            --bg-page: #fbfbfd;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-card: #ffffff;
            --border: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.16);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --text-tertiary: #a1a1a6;
            --accent: #0071e3;
            --danger: #ff3b30;
            --badge-schedule: #fff4e5;
            --badge-schedule-text: #b25e00;
            --radius-lg: 16px;
            --radius-sm: 6px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-page: #000000;
                --surface: rgba(28, 28, 30, 0.8);
                --surface-card: #1c1c1e;
                --border: rgba(255, 255, 255, 0.1);
                --border-hover: rgba(255, 255, 255, 0.2);
                --text-primary: #f5f5f7;
                --text-secondary: #86868b;
                --text-tertiary: #636366;
                --accent: #2997ff;
                --badge-schedule: #382710;
                --badge-schedule-text: #ffaa40;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .shell { width: 100%; max-width: 860px; }
        .top-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .title-group h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
        .user-tag { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

        .btn-compose {
            display: inline-flex; align-items: center; gap: 6px;
            background-color: var(--text-primary); color: var(--bg-page);
            padding: 10px 18px; border-radius: 980px; font-size: 14px;
            font-weight: 500; text-decoration: none; transition: opacity 0.2s;
        }
        .btn-compose:hover { opacity: 0.85; }

        .controls-card {
            background: var(--surface); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 12px 16px; margin-bottom: 24px; display: flex;
            flex-direction: column; gap: 12px;
        }

        .search-wrap { position: relative; display: flex; align-items: center; }
        .search-input {
            width: 100%; background: transparent; border: none; outline: none;
            padding: 10px 14px; font-size: 15px; color: var(--text-primary);
        }

        .tabs-wrap { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; }
        .tab-btn {
            background: none; border: none; padding: 6px 14px; font-size: 13px;
            font-weight: 500; border-radius: 980px; color: var(--text-secondary);
            cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active { background: var(--text-primary); color: var(--bg-page); }

        .mail-feed { display: flex; flex-direction: column; gap: 12px; }
        .mail-row {
            background: var(--surface-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 18px 22px;
            display: flex; flex-direction: column; gap: 8px;
            cursor: pointer; transition: transform 0.15s, border-color 0.2s;
        }
        .mail-row:hover { border-color: var(--border-hover); transform: translateY(-1px); }

        .mail-meta { display: flex; justify-content: space-between; align-items: center; }
        .badge {
            font-size: 11px; text-transform: uppercase; padding: 3px 8px;
            border-radius: var(--radius-sm); font-weight: 600;
        }
        .badge.scheduled { background: var(--badge-schedule); color: var(--badge-schedule-text); }
        .badge.attach { background: rgba(0, 113, 227, 0.1); color: var(--accent); }

        .mail-subject { font-size: 16px; font-weight: 600; }
        .mail-preview {
            font-size: 14px; color: var(--text-secondary);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .mail-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .btn-delete {
            background: none; border: none; color: var(--text-tertiary);
            padding: 4px 8px; font-size: 12px; cursor: pointer; border-radius: var(--radius-sm);
        }
        .btn-delete:hover { color: var(--danger); background: rgba(255, 59, 48, 0.08); }

        .sentinel { height: 40px; }
        .empty-view { text-align: center; padding: 80px 0; color: var(--text-tertiary); }
    </style>
</head>
<body>

<div class="shell">
    <div class="top-nav">
        <div class="title-group">
            <h1>Inbox</h1>
            <div class="user-tag" id="userDisplay">Connecting...</div>
        </div>
        <a href="2.html" class="btn-compose">+ Compose</a>
    </div>

    <div class="controls-card">
        <div class="search-wrap">
            <input type="text" id="searchInput" class="search-input" placeholder="Search sender, subject, or message content...">
        </div>
        <div class="tabs-wrap">
            <button class="tab-btn active" id="tabAll">All</button>
            <button class="tab-btn" id="tabInbox">Received</button>
            <button class="tab-btn" id="tabSent">Sent</button>
        </div>
    </div>

    <div class="mail-feed" id="mailFeed">
        <div class="empty-view">Listening for live updates...</div>
    </div>

    <div id="sentinel" class="sentinel"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
        measurementId: "G-QE17C33TMN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
    const userEmail = (activeUser.Email || activeUser.email || '').toLowerCase().trim();
    document.getElementById('userDisplay').innerText = userEmail ? `Live as ${userEmail}` : "Guest Session";

    let rawEmails = [];
    let filteredEmails = [];
    let currentFilter = 'all';
    let searchQuery = '';
    const PAGE_SIZE = 10;
    let visibleCount = PAGE_SIZE;

    function parseEmailDoc(snap) {
        const d = snap.data();
        const to = (d.to || d.To || '').trim();
        const from = (d.from || d.From || '').trim();
        const subject = d.subject || d.Subject || '';
        const body = d.body || d.Body || '';
        
        let dateObj = new Date();
        if (d.timestamp) dateObj = d.timestamp.toDate ? d.timestamp.toDate() : new Date(d.timestamp);

        let scheduledDate = null;
        if (d.scheduledFor) {
            scheduledDate = d.scheduledFor.toDate ? d.scheduledFor.toDate() : new Date(d.scheduledFor);
        }

        const hasAttachment = /\{\\\.file=(.*?)\}/i.test(body) || /\{\.file=(.*?)\}/i.test(body);

        return { id: snap.id, to, from, subject, body, date: dateObj, scheduledFor: scheduledDate, hasAttachment };
    }

    onSnapshot(collection(db, "Email"), (snapshot) => {
        const now = new Date();
        const docs = [];

        snapshot.forEach((snap) => {
            const item = parseEmailDoc(snap);
            const isToMe = item.to.toLowerCase() === userEmail;
            const isFromMe = item.from.toLowerCase() === userEmail;

            if (userEmail && !isToMe && !isFromMe) return;

            // SCHEDULE FILTER: Recipients do NOT see emails until scheduled time is reached
            if (isToMe && !isFromMe && item.scheduledFor && item.scheduledFor > now) {
                return;
            }

            docs.push(item);
        });

        docs.sort((a, b) => b.date - a.date);
        rawEmails = docs;
        applyFiltersAndRender();
    });

    function applyFiltersAndRender() {
        const now = new Date();

        filteredEmails = rawEmails.filter(mail => {
            const isInbox = mail.to.toLowerCase() === userEmail;
            const isSent = mail.from.toLowerCase() === userEmail;

            if (currentFilter === 'inbox' && !isInbox) return false;
            if (currentFilter === 'sent' && !isSent) return false;

            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                const plainBody = mail.body.replace(/<[^>]*>/g, '').toLowerCase();
                return mail.subject.toLowerCase().includes(q) || plainBody.includes(q) || mail.to.toLowerCase().includes(q) || mail.from.toLowerCase().includes(q);
            }
            return true;
        });

        renderList();
    }

    function renderList() {
        const feed = document.getElementById('mailFeed');
        const visibleSlice = filteredEmails.slice(0, visibleCount);
        const now = new Date();

        if (visibleSlice.length === 0) {
            feed.innerHTML = `<div class="empty-view">No messages found.</div>`;
            return;
        }

        feed.innerHTML = visibleSlice.map(mail => {
            const isIncoming = mail.to.toLowerCase() === userEmail;
            const isScheduledFuture = mail.scheduledFor && mail.scheduledFor > now;
            const contact = isIncoming ? `From: ${escapeHtml(mail.from)}` : `To: ${escapeHtml(mail.to)}`;
            const plainPreview = mail.body.replace(/<[^>]*>/g, '').replace(/\{\\?\.file=[^}]+\}/gi, '[Attachment]').trim();

            return `
                <div class="mail-row" onclick="window.location.href='3.html?id=${mail.id}'">
                    <div class="mail-meta">
                        <div style="display:flex; gap:8px; align-items:center;">
                            <span style="font-size:13px; font-weight:600;">${contact}</span>
                            ${isScheduledFuture ? `<span class="badge scheduled">Scheduled: ${mail.scheduledFor.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>` : ''}
                            ${mail.hasAttachment ? `<span class="badge attach">Attachment</span>` : ''}
                        </div>
                        <span style="font-size:12px; color:var(--text-tertiary);">${mail.date.toLocaleDateString([], {month:'short', day:'numeric'})}</span>
                    </div>
                    <div class="mail-subject">${escapeHtml(mail.subject || "(No Subject)")}</div>
                    <div class="mail-preview">${escapeHtml(plainPreview || "No preview text")}</div>
                    <div class="mail-footer">
                        <span></span>
                        <button class="btn-delete" onclick="event.stopPropagation(); deleteMail('${mail.id}')">Delete</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && visibleCount < filteredEmails.length) {
            visibleCount += PAGE_SIZE;
            renderList();
        }
    });
    observer.observe(document.getElementById('sentinel'));

    window.deleteMail = async (id) => {
        if (!confirm("Delete this message?")) return;
        await deleteDoc(doc(db, "Email", id));
    };

    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        visibleCount = PAGE_SIZE;
        applyFiltersAndRender();
    });

    ['tabAll', 'tabInbox', 'tabSent'].forEach(tabId => {
        document.getElementById(tabId).addEventListener('click', (e) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentFilter = tabId.replace('tab', '').toLowerCase();
            visibleCount = PAGE_SIZE;
            applyFiltersAndRender();
        });
    });

    function escapeHtml(str) {
        return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }
</script>
</body>
</html>
