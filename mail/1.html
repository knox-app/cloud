<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail - Inbox</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .user-info {
            font-size: 14px;
            color: var(--text-sub);
        }
        .user-info strong {
            color: var(--text-main);
        }

        .btn-compose {
            background-color: var(--accent);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .btn-compose:hover {
            background-color: var(--accent-hover);
        }

        .tabs {
            display: flex;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-sub);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent);
            border-color: var(--accent);
        }

        .mail-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mail-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            transition: box-shadow 0.2s;
        }
        .mail-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .mail-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .mail-subject {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .mail-body {
            font-size: 14px;
            color: #334155;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--text-sub);
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2>Mailbox</h2>
            <div class="user-info">Logged in as: <strong id="userEmail">Loading...</strong></div>
        </div>
        <a href="2.html" class="btn-compose">+ Compose</a>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tabInbox">Inbox</button>
        <button class="tab-btn" id="tabSent">Sent</button>
    </div>

    <div class="mail-list" id="mailList">
        <div class="empty-state">Loading emails...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
        measurementId: "G-QE17C33TMN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Get Active User
    const activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
    const userEmail = activeUser.Email || activeUser.email;

    if (!userEmail) {
        alert("Please log in first.");
        // Redirect to login page if desired: window.location.href = "1.html";
    } else {
        document.getElementById('userEmail').innerText = userEmail;
    }

    let currentTab = 'inbox';

    async function loadEmails() {
        const mailList = document.getElementById('mailList');
        mailList.innerHTML = '<div class="empty-state">Loading emails...</div>';

        try {
            const emailCol = collection(db, "Email");
            let q;
            if (currentTab === 'inbox') {
                q = query(emailCol, where("to", "==", userEmail));
            } else {
                q = query(emailCol, where("from", "==", userEmail));
            }

            const snapshot = await getDocs(q);
            if (snapshot.empty) {
                mailList.innerHTML = `<div class="empty-state">No ${currentTab} messages found.</div>`;
                return;
            }

            let html = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                const contact = currentTab === 'inbox' ? `From: ${data.from}` : `To: ${data.to}`;
                const dateStr = data.timestamp ? new Date(data.timestamp.toDate ? data.timestamp.toDate() : data.timestamp).toLocaleString() : '';

                html += `
                    <div class="mail-card">
                        <div class="mail-header">
                            <span>${contact}</span>
                            <span>${dateStr}</span>
                        </div>
                        <div class="mail-subject">${escapeHtml(data.subject || "(No Subject)")}</div>
                        <div class="mail-body">${escapeHtml(data.body || "")}</div>
                    </div>
                `;
            });

            mailList.innerHTML = html;
        } catch (err) {
            console.error(err);
            mailList.innerHTML = '<div class="empty-state">Failed to load emails. Check Firestore rules/connection.</div>';
        }
    }

    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
    }

    document.getElementById('tabInbox').addEventListener('click', () => {
        currentTab = 'inbox';
        document.getElementById('tabInbox').classList.add('active');
        document.getElementById('tabSent').classList.remove('active');
        loadEmails();
    });

    document.getElementById('tabSent').addEventListener('click', () => {
        currentTab = 'sent';
        document.getElementById('tabSent').classList.add('active');
        document.getElementById('tabInbox').classList.remove('active');
        loadEmails();
    });

    if (userEmail) {
        loadEmails();
    }
</script>

</body>
</html>
