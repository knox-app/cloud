<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mailbox - Workspace</title>
    <style>
        :root {
            --bg-body: #fdfdfd;
            --sidebar-bg: #f7f7f8;
            --card-bg: #ffffff;
            --border: #ebebed;
            --border-hover: #d2d2d7;
            --text-main: #111827;
            --text-sub: #6b7280;
            --accent: #111827;
            --accent-blue: #2563eb;
            --danger: #ef4444;
            --radius-md: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Vertical Sidebar */
        .sidebar {
            width: 250px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            padding: 0 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-compose {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
            transition: opacity 0.2s;
        }
        .btn-compose:hover { opacity: 0.9; }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-sub);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .nav-item:hover { background: #ececee; color: var(--text-main); }
        .nav-item.active { background: #e5e5e8; color: var(--text-main); font-weight: 600; }

        /* Profile at bottom */
        .profile-card {
            border-top: 1px solid var(--border);
            padding-top: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
            overflow: hidden;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .profile-meta {
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .profile-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .profile-email { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Main Workspace */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 30px 40px;
        }

        .search-bar {
            width: 100%;
            max-width: 600px;
            background: #f4f4f5;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px 16px;
            font-size: 14px;
            outline: none;
            margin-bottom: 20px;
        }
        .search-bar:focus { background: #fff; border-color: var(--border-hover); }

        /* Batch Bar */
        .batch-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: var(--text-main);
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 14px;
        }
        .batch-bar.active { display: flex; }
        .batch-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 6px;
        }

        .email-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 860px;
        }

        .email-row {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .email-row:hover { border-color: var(--border-hover); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .email-row.selected { background: #f0f7ff; border-color: var(--accent-blue); }

        .email-check { display: none; width: 16px; height: 16px; accent-color: var(--accent-blue); }
        .multi-mode .email-check { display: block; }

        .email-info { flex: 1; min-width: 0; }
        .email-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
        .email-subject { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .email-snippet { font-size: 13px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .pill { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
        .pill-label { background: #e0e7ff; color: #3730a3; }
        .pill-1time { background: #fee2e2; color: #991b1b; }

        /* Context Menu */
        .context-menu {
            position: absolute;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 6px;
            width: 160px;
            z-index: 100;
            display: none;
        }
        .context-item {
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
        }
        .context-item:hover { background: #f4f4f5; }
        .context-item.danger { color: var(--danger); }
        .context-item.danger:hover { background: #fee2e2; }
    </style>
</head>
<body>

<!-- Left Navigation -->
<div class="sidebar">
    <div class="brand-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Mail Workspace
    </div>

    <a href="2.html" class="btn-compose">
        <span>+</span> Compose
    </a>

    <ul class="nav-list">
        <li class="nav-item active" data-filter="inbox">📥 Inbox</li>
        <li class="nav-item" data-filter="sent">📤 Sent</li>
        <li class="nav-item" data-filter="scheduled">⏰ Scheduled</li>
        <li class="nav-item" data-filter="labels">🏷️ Labels</li>
        <li class="nav-item" onclick="alert('Target Language: ' + (activeUser['Email-Lang-Target'] || 'English'))">⚙️ Settings</li>
    </ul>

    <div class="profile-card">
        <div class="avatar" id="userAvatar">U</div>
        <div class="profile-meta">
            <span class="profile-name" id="userNameDisplay">User</span>
            <span class="profile-email" id="userEmailDisplay">Loading...</span>
        </div>
    </div>
</div>

<!-- Main Area -->
<div class="main-content" id="appContainer">
    <input type="text" id="searchBox" class="search-bar" placeholder="Search emails...">

    <div class="batch-bar" id="batchBar">
        <span id="selectedCountText">0 selected</span>
        <div>
            <button class="batch-btn" onclick="batchLabel()">Apply Label</button>
            <button class="batch-btn" onclick="batchDelete()" style="background: var(--danger); border: none;">Delete</button>
            <button class="batch-btn" onclick="exitMultiSelect()">Cancel</button>
        </div>
    </div>

    <div class="email-list" id="emailFeed">
        <div style="color: var(--text-sub); font-size: 14px;">Loading messages...</div>
    </div>
</div>

<div class="context-menu" id="contextMenu">
    <div class="context-item" onclick="openContextMail()">Open</div>
    <div class="context-item" onclick="labelContextMail()">Add Label</div>
    <div class="context-item danger" onclick="deleteContextMail()">Delete</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
    window.activeUser = activeUser;
    const userEmail = (activeUser.Email || activeUser.email || '').toLowerCase().trim();

    // Profile Setup
    document.getElementById('userNameDisplay').innerText = activeUser["First Name"] || activeUser["Name"] || "Account";
    document.getElementById('userEmailDisplay').innerText = userEmail || "Not logged in";
    if (activeUser["Profile Picture"] || activeUser["Profile_Picture"]) {
        document.getElementById('userAvatar').innerHTML = `<img src="${activeUser["Profile Picture"] || activeUser["Profile_Picture"]}">`;
    } else {
        document.getElementById('userAvatar').innerText = (userEmail[0] || 'U').toUpperCase();
    }

    let allEmails = [];
    let selectedSet = new Set();
    let currentTab = 'inbox';
    let searchQuery = '';
    let contextTargetId = null;

    onSnapshot(collection(db, "Email"), (snapshot) => {
        const list = [];
        snapshot.forEach(d => {
            const data = d.data();
            list.push({
                id: d.id,
                to: (data.to || data.To || '').trim(),
                from: (data.from || data.From || '').trim(),
                subject: data.subject || data.Subject || '(No Subject)',
                body: data.body || data.Body || '',
                label: data.label || '',
                oneTimeView: data.oneTimeView || false,
                scheduledFor: data.scheduledFor || null,
                timestamp: data.timestamp ? (data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp)) : new Date()
            });
        });
        list.sort((a, b) => b.timestamp - a.timestamp);
        allEmails = list;
        render();
    });

    function render() {
        const feed = document.getElementById('emailFeed');
        const now = new Date();

        const filtered = allEmails.filter(m => {
            const isToMe = m.to.toLowerCase() === userEmail;
            const isFromMe = m.from.toLowerCase() === userEmail;
            const isScheduled = m.scheduledFor && new Date(m.scheduledFor) > now;

            if (currentTab === 'inbox' && (!isToMe || isScheduled)) return false;
            if (currentTab === 'sent' && !isFromMe) return false;
            if (currentTab === 'scheduled' && !isScheduled) return false;
            if (currentTab === 'labels' && !m.label) return false;

            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                return m.subject.toLowerCase().includes(q) || m.body.toLowerCase().includes(q) || m.to.toLowerCase().includes(q) || m.from.toLowerCase().includes(q);
            }
            return true;
        });

        if (!filtered.length) {
            feed.innerHTML = `<div style="color: var(--text-sub); font-size: 14px; padding: 20px 0;">No messages in this folder.</div>`;
            return;
        }

        feed.innerHTML = filtered.map(mail => {
            const isSelected = selectedSet.has(mail.id);
            const isIncoming = mail.to.toLowerCase() === userEmail;
            const textPreview = mail.body.replace(/<[^>]*>?/gm, '');

            return `
                <div class="email-row ${isSelected ? 'selected' : ''}" 
                     onclick="handleRowClick('${mail.id}')"
                     ondblclick="handleRowDblClick('${mail.id}')"
                     oncontextmenu="handleRightClick(event, '${mail.id}')">
                    <input type="checkbox" class="email-check" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheck('${mail.id}')">
                    <div class="email-info">
                        <div class="email-header">
                            <span>${isIncoming ? 'From: ' + mail.from : 'To: ' + mail.to}</span>
                            <span>${mail.timestamp.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span>
                        </div>
                        <div class="email-subject">
                            ${escapeHtml(mail.subject)}
                            ${mail.label ? `<span class="pill pill-label">${escapeHtml(mail.label)}</span>` : ''}
                            ${mail.oneTimeView ? `<span class="pill pill-1time">1-Time</span>` : ''}
                        </div>
                        <div class="email-snippet">${escapeHtml(textPreview)}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Navigation Tabs
    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
            if (!item.dataset.filter) return;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            currentTab = item.dataset.filter;
            render();
        });
    });

    // Search
    document.getElementById('searchBox').addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        render();
    });

    // Multi-Select
    window.handleRowClick = (id) => {
        if (selectedSet.size > 0) toggleCheck(id);
        else window.location.href = `3.html?id=${id}`;
    };

    window.handleRowDblClick = (id) => {
        document.getElementById('appContainer').classList.add('multi-mode');
        document.getElementById('batchBar').classList.add('active');
        toggleCheck(id);
    };

    window.toggleCheck = (id) => {
        if (selectedSet.has(id)) selectedSet.delete(id);
        else selectedSet.add(id);

        if (selectedSet.size === 0) exitMultiSelect();
        else {
            document.getElementById('selectedCountText').innerText = `${selectedSet.size} selected`;
            render();
        }
    };

    window.exitMultiSelect = () => {
        selectedSet.clear();
        document.getElementById('appContainer').classList.remove('multi-mode');
        document.getElementById('batchBar').classList.remove('active');
        render();
    };

    window.batchDelete = async () => {
        if (!confirm(`Delete ${selectedSet.size} emails?`)) return;
        for (let id of selectedSet) await deleteDoc(doc(db, "Email", id));
        exitMultiSelect();
    };

    window.batchLabel = async () => {
        const l = prompt("Enter Label name:");
        if (!l) return;
        for (let id of selectedSet) await updateDoc(doc(db, "Email", id), { label: l.trim() });
        exitMultiSelect();
    };

    // Right Click Context Menu
    const ctx = document.getElementById('contextMenu');
    window.handleRightClick = (e, id) => {
        e.preventDefault();
        contextTargetId = id;
        ctx.style.top = `${e.pageY}px`;
        ctx.style.left = `${e.pageX}px`;
        ctx.style.display = 'block';
    };

    document.addEventListener('click', () => ctx.style.display = 'none');

    window.openContextMail = () => { if (contextTargetId) window.location.href = `3.html?id=${contextTargetId}`; };
    window.labelContextMail = async () => {
        const l = prompt("Add Label:");
        if (l && contextTargetId) await updateDoc(doc(db, "Email", contextTargetId), { label: l.trim() });
    };
    window.deleteContextMail = async () => {
        if (contextTargetId && confirm("Delete this email?")) await deleteDoc(doc(db, "Email", contextTargetId));
    };

    function escapeHtml(str) {
        return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }
</script>

</body>
</html>
