<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages</title>
    <style>
        :root {
            --bg-page: #fbfbfd;
            --surface: rgba(255, 255, 255, 0.85);
            --surface-card: #ffffff;
            --border: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.16);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --text-tertiary: #a1a1a6;
            --accent: #0071e3;
            --danger: #ff3b30;
            --badge-inbox: #e8f2ff;
            --badge-inbox-text: #0066cc;
            --badge-sent: #f2f2f7;
            --badge-sent-text: #636366;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-page: #000000;
                --surface: rgba(28, 28, 30, 0.75);
                --surface-card: #1c1c1e;
                --border: rgba(255, 255, 255, 0.1);
                --border-hover: rgba(255, 255, 255, 0.2);
                --text-primary: #f5f5f7;
                --text-secondary: #86868b;
                --text-tertiary: #636366;
                --accent: #2997ff;
                --danger: #ff453a;
                --badge-inbox: #1c2738;
                --badge-inbox-text: #58a6ff;
                --badge-sent: #2c2c2e;
                --badge-sent-text: #aeaeb2;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .shell { width: 100%; max-width: 900px; }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .title-group h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
        .user-tag { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

        .btn-compose {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--text-primary);
            color: var(--bg-page);
            padding: 10px 18px;
            border-radius: 980px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.15s;
        }
        .btn-compose:hover { opacity: 0.85; transform: scale(0.98); }

        /* Multi-selection Bar */
        .batch-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: var(--text-primary);
            color: var(--bg-page);
            padding: 12px 20px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            animation: fadeIn 0.2s ease-in-out;
        }

        .batch-bar.active { display: flex; }
        .batch-actions { display: flex; gap: 10px; }
        .batch-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: inherit;
            padding: 6px 14px;
            border-radius: 980px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .batch-btn:hover { background: rgba(255,255,255,0.2); }
        .batch-btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }

        .controls-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 10px 14px 10px 38px;
            font-size: 15px;
            color: var(--text-primary);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            width: 16px;
            height: 16px;
            stroke: var(--text-tertiary);
            stroke-width: 2;
            fill: none;
        }

        .tabs-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 980px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn.active { background: var(--text-primary); color: var(--bg-page); }

        .mail-feed { display: flex; flex-direction: column; gap: 10px; }

        .mail-row {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
            position: relative;
        }

        .mail-row:hover {
            border-color: var(--border-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .mail-row.selected {
            border-color: var(--accent);
            background: rgba(0, 113, 227, 0.04);
        }

        .mail-checkbox {
            margin-top: 4px;
            cursor: pointer;
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            display: none;
        }
        .multi-mode .mail-checkbox { display: inline-block; }

        .mail-content { flex: 1; min-width: 0; }

        .mail-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .contact-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
        }

        .badge {
            font-size: 11px;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .badge.inbox { background: var(--badge-inbox); color: var(--badge-inbox-text); }
        .badge.sent { background: var(--badge-sent); color: var(--badge-sent-text); }
        
        .pill-label {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 980px;
            background: rgba(0, 113, 227, 0.1);
            color: var(--accent);
            font-weight: 600;
        }

        .pill-ephemeral {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 980px;
            background: rgba(255, 59, 48, 0.1);
            color: var(--danger);
            font-weight: 600;
        }

        .timestamp { font-size: 12px; color: var(--text-tertiary); }
        .mail-subject { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .mail-preview {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-view { text-align: center; padding: 60px 0; color: var(--text-tertiary); font-size: 14px; }

        /* Custom Context Menu */
        .context-menu {
            position: absolute;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 6px;
            width: 180px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 1000;
            display: none;
            backdrop-filter: blur(20px);
        }

        .context-menu-item {
            padding: 8px 12px;
            font-size: 13px;
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .context-menu-item:hover {
            background: var(--accent);
            color: #ffffff;
        }
        .context-menu-item.danger:hover {
            background: var(--danger);
            color: #ffffff;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="shell" id="appContainer">
    <div class="top-nav">
        <div class="title-group">
            <h1>Inbox</h1>
            <div class="user-tag" id="userDisplay">Connecting...</div>
        </div>
        <a href="2.html" class="btn-compose">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
            Compose
        </a>
    </div>

    <!-- Multi-Selection Bar -->
    <div class="batch-bar" id="batchBar">
        <span id="selectedCount">0 emails selected</span>
        <div class="batch-actions">
            <button class="batch-btn" onclick="applyBatchLabel()">Label</button>
            <button class="batch-btn danger" onclick="deleteSelectedMails()">Delete</button>
            <button class="batch-btn" onclick="exitMultiSelect()">Cancel</button>
        </div>
    </div>

    <div class="controls-card">
        <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search mail, recipients, labels...">
        </div>
        <div class="tabs-wrap" id="tabsWrap">
            <button class="tab-btn active" data-filter="all">All</button>
            <button class="tab-btn" data-filter="inbox">Received</button>
            <button class="tab-btn" data-filter="sent">Sent</button>
        </div>
    </div>

    <div class="mail-feed" id="mailFeed">
        <div class="empty-view">Listening for updates...</div>
    </div>
</div>

<!-- Right Click Context Menu -->
<div class="context-menu" id="contextMenu">
    <div class="context-menu-item" onclick="openContextMenuEmail()">Open</div>
    <div class="context-menu-item" onclick="promptLabelEmail()">Add Label</div>
    <div class="context-menu-item danger" onclick="deleteContextMenuEmail()">Delete</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
    const userEmail = (activeUser.Email || activeUser.email || '').toLowerCase().trim();
    document.getElementById('userDisplay').innerText = userEmail ? `Live as ${userEmail}` : "Guest Session";

    let rawEmails = [];
    let selectedEmailIds = new Set();
    let isMultiSelect = false;
    let targetContextEmailId = null;
    let currentFilter = 'all';
    let searchQuery = '';

    function parseDoc(docSnap) {
        const d = docSnap.data();
        let dateObj = new Date();
        if (d.timestamp) {
            dateObj = d.timestamp.toDate ? d.timestamp.toDate() : new Date(d.timestamp);
        }
        return {
            id: docSnap.id,
            to: (d.to || d.To || '').trim(),
            from: (d.from || d.From || '').trim(),
            subject: d.subject || d.Subject || '',
            body: d.body || d.Body || '',
            label: d.label || '',
            oneTimeView: d.oneTimeView || false,
            scheduledFor: d.scheduledFor || null,
            attachments: d.attachments || [],
            date: dateObj
        };
    }

    // Real-Time Listener
    onSnapshot(collection(db, "Email"), (snapshot) => {
        const docs = [];
        snapshot.forEach(s => {
            const item = parseDoc(s);
            // Hide scheduled emails if the time hasn't passed yet for inbox recipients
            if (item.scheduledFor && new Date(item.scheduledFor) > new Date() && item.to.toLowerCase() === userEmail) {
                return;
            }
            if (!userEmail || item.to.toLowerCase() === userEmail || item.from.toLowerCase() === userEmail) {
                docs.push(item);
            }
        });
        docs.sort((a, b) => b.date - a.date);
        rawEmails = docs;
        renderFeed();
    });

    function renderFeed() {
        const feed = document.getElementById('mailFeed');
        const filtered = rawEmails.filter(m => {
            const isInbox = m.to.toLowerCase() === userEmail;
            const isSent = m.from.toLowerCase() === userEmail;

            if (currentFilter === 'inbox' && !isInbox) return false;
            if (currentFilter === 'sent' && !isSent) return false;
            if (currentFilter.startsWith('label:') && m.label !== currentFilter.replace('label:', '')) return false;

            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                return m.subject.toLowerCase().includes(q) || 
                       m.body.toLowerCase().includes(q) || 
                       m.to.toLowerCase().includes(q) || 
                       m.from.toLowerCase().includes(q) || 
                       (m.label && m.label.toLowerCase().includes(q));
            }
            return true;
        });

        if (filtered.length === 0) {
            feed.innerHTML = `<div class="empty-view">No emails found.</div>`;
            return;
        }

        feed.innerHTML = filtered.map(mail => {
            const isIncoming = mail.to.toLowerCase() === userEmail;
            const isSelected = selectedEmailIds.has(mail.id);
            const plainText = mail.body.replace(/<[^>]*>?/gm, ''); // strip HTML preview

            return `
                <div class="mail-row ${isSelected ? 'selected' : ''}" 
                     data-id="${mail.id}" 
                     onclick="handleMailClick('${mail.id}')"
                     ondblclick="handleMailDblClick('${mail.id}')"
                     oncontextmenu="handleContextMenu(event, '${mail.id}')">
                     
                    <input type="checkbox" class="mail-checkbox" ${isSelected ? 'checked' : ''} 
                           onclick="event.stopPropagation(); toggleSelect('${mail.id}')">
                    
                    <div class="mail-content">
                        <div class="mail-meta">
                            <div class="contact-group">
                                <span class="badge ${isIncoming ? 'inbox' : 'sent'}">${isIncoming ? 'Received' : 'Sent'}</span>
                                ${mail.label ? `<span class="pill-label">${escapeHtml(mail.label)}</span>` : ''}
                                ${mail.oneTimeView ? `<span class="pill-ephemeral">1-Time View</span>` : ''}
                                <span>${isIncoming ? 'From: ' + escapeHtml(mail.from) : 'To: ' + escapeHtml(mail.to)}</span>
                            </div>
                            <span class="timestamp">${formatTime(mail.date)}</span>
                        </div>
                        <div class="mail-subject">${escapeHtml(mail.subject || "(No Subject)")} ${mail.attachments.length ? '📎' : ''}</div>
                        <div class="mail-preview">${escapeHtml(plainText || "Empty message")}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Single / Double Click Handlers
    window.handleMailClick = (id) => {
        if (isMultiSelect) {
            toggleSelect(id);
        } else {
            window.location.href = `3.html?id=${id}`;
        }
    };

    window.handleMailDblClick = (id) => {
        isMultiSelect = true;
        document.getElementById('appContainer').classList.add('multi-mode');
        document.getElementById('batchBar').classList.add('active');
        toggleSelect(id);
    };

    window.toggleSelect = (id) => {
        if (selectedEmailIds.has(id)) {
            selectedEmailIds.delete(id);
        } else {
            selectedEmailIds.add(id);
        }
        document.getElementById('selectedCount').innerText = `${selectedEmailIds.size} emails selected`;
        renderFeed();
    };

    window.exitMultiSelect = () => {
        isMultiSelect = false;
        selectedEmailIds.clear();
        document.getElementById('appContainer').classList.remove('multi-mode');
        document.getElementById('batchBar').classList.remove('active');
        renderFeed();
    };

    // Batch Actions
    window.deleteSelectedMails = async () => {
        if (!confirm(`Delete ${selectedEmailIds.size} selected emails?`)) return;
        for (const id of selectedEmailIds) {
            await deleteDoc(doc(db, "Email", id));
        }
        exitMultiSelect();
    };

    window.applyBatchLabel = async () => {
        const label = prompt("Enter label name (e.g. Work, Personal, Important):");
        if (!label) return;
        for (const id of selectedEmailIds) {
            await updateDoc(doc(db, "Email", id), { label: label.trim() });
        }
        exitMultiSelect();
    };

    // Right Click Context Menu
    const contextMenu = document.getElementById('contextMenu');
    window.handleContextMenu = (e, id) => {
        e.preventDefault();
        targetContextEmailId = id;
        contextMenu.style.top = `${e.pageY}px`;
        contextMenu.style.left = `${e.pageX}px`;
        contextMenu.style.display = 'block';
    };

    document.addEventListener('click', () => { contextMenu.style.display = 'none'; });

    window.openContextMenuEmail = () => {
        if (targetContextEmailId) window.location.href = `3.html?id=${targetContextEmailId}`;
    };

    window.promptLabelEmail = async () => {
        if (!targetContextEmailId) return;
        const label = prompt("Enter label name:");
        if (label !== null) {
            await updateDoc(doc(db, "Email", targetContextEmailId), { label: label.trim() });
        }
    };

    window.deleteContextMenuEmail = async () => {
        if (targetContextEmailId && confirm("Delete this email?")) {
            await deleteDoc(doc(db, "Email", targetContextEmailId));
        }
    };

    // Search and Tabs
    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        renderFeed();
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderFeed();
        });
    });

    function escapeHtml(str) {
        return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    function formatTime(d) {
        return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }
</script>

</body>
</html>
