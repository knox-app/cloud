<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - Webmail</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar / Email List Pane */
        .sidebar {
            width: 380px;
            background: #ffffff;
            border-right: 1px solid #e1e4e8;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #e1e4e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .btn-compose {
            background-color: #0066cc;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn-compose:hover {
            background-color: #0052a3;
        }

        .email-list {
            flex: 1;
            overflow-y: auto;
        }

        .email-item {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .email-item:hover {
            background-color: #f8f9fa;
        }

        .email-item.active {
            background-color: #e8f0fe;
            border-left: 4px solid #0066cc;
        }

        .email-item .sender {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: #111;
        }

        .email-item .subject {
            font-size: 13px;
            color: #444;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .email-item .receiver-tag {
            font-size: 11px;
            color: #777;
            margin-top: 4px;
        }

        /* Main View Pane */
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            overflow-y: auto;
            padding: 40px;
        }

        .empty-state {
            margin: auto;
            color: #888;
            font-size: 16px;
        }

        .email-content {
            display: none;
            max-width: 800px;
        }

        .email-content h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #111;
        }

        .meta-card {
            background: #f9fbfd;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.6;
        }

        .meta-card strong {
            color: #444;
            display: inline-block;
            width: 70px;
        }

        .body-text {
            font-size: 15px;
            line-height: 1.6;
            color: #222;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <!-- Email List Sidebar -->
    <div class="sidebar">
        <div class="header">
            <h1>Inbox</h1>
            <a href="2.html" class="btn-compose">+ Compose</a>
        </div>
        <div class="email-list" id="emailList">
            <div style="padding: 20px; color: #888; text-align: center;">Listening for incoming emails...</div>
        </div>
    </div>

    <!-- Email Full View Area -->
    <div class="main-view">
        <div id="emptyState" class="empty-state">Select an email to read</div>
        
        <div id="emailContent" class="email-content">
            <h2 id="viewSubject">Subject Placeholder</h2>
            <div class="meta-card">
                <div><strong>From:</strong> <span id="viewSender">-</span></div>
                <div><strong>To:</strong> <span id="viewReceiver">-</span></div>
            </div>
            <div class="body-text" id="viewBody">No message body provided.</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Replace with your project credentials
        const firebaseConfig = {
            apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
            authDomain: "cloud-computer-4891a.firebaseapp.com",
            projectId: "cloud-computer-4891a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const emailListEl = document.getElementById('emailList');
        const emptyStateEl = document.getElementById('emptyState');
        const emailContentEl = document.getElementById('emailContent');

        const viewSubject = document.getElementById('viewSubject');
        const viewSender = document.getElementById('viewSender');
        const viewReceiver = document.getElementById('viewReceiver');
        const viewBody = document.getElementById('viewBody');

        let emailsData = {};

        // Real-time listener for "Email" collection
        const q = query(collection(db, "Email"));
        onSnapshot(q, (snapshot) => {
            emailListEl.innerHTML = '';
            emailsData = {};

            if (snapshot.empty) {
                emailListEl.innerHTML = '<div style="padding: 20px; color: #888; text-align: center;">No emails found</div>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                emailsData[id] = data;

                const item = document.createElement('div');
                item.className = 'email-item';
                item.id = `item-${id}`;
                item.innerHTML = `
                    <div class="sender">${data.Sender || 'Unknown Sender'}</div>
                    <div class="subject">${data.Subjct || data.Subject || '(No Subject)'}</div>
                    <div class="receiver-tag">To: ${data.Reciver || data.Receiver || 'N/A'}</div>
                `;

                item.addEventListener('click', () => displayEmail(id));
                emailListEl.appendChild(item);
            });
        }, (error) => {
            console.error("Error fetching emails:", error);
            emailListEl.innerHTML = '<div style="padding: 20px; color: red; text-align: center;">Failed to load emails.</div>';
        });

        function displayEmail(id) {
            const data = emailsData[id];
            if (!data) return;

            // Highlight active in list
            document.querySelectorAll('.email-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById(`item-${id}`);
            if (activeItem) activeItem.classList.add('active');

            // Render details
            emptyStateEl.style.display = 'none';
            emailContentEl.style.display = 'block';

            viewSubject.textContent = data.Subjct || data.Subject || '(No Subject)';
            viewSender.textContent = data.Sender || 'Unknown';
            viewReceiver.textContent = data.Reciver || data.Receiver || 'Unknown';
            viewBody.textContent = data.Body || data.Message || 'No content available for this email.';
        }
    </script>
</body>
</html>
