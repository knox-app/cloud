<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Cloud Workspace</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #f3f4f6;
            --hover-bg: #f9fafb;
            --btn-dark-bg: #0d0d0d;
            --btn-dark-text: #ffffff;
            --accent: #10a37f;
            --danger: #ef4444;
            --sidebar-width: 64px;
        }

        body.dark {
            --bg-color: #0d0d0d;
            --surface-color: #171717;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #262626;
            --hover-bg: #1f1f1f;
            --btn-dark-bg: #ffffff;
            --btn-dark-text: #0d0d0d;
            --accent: #10a37f;
            --danger: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        aside.sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            flex-shrink: 0;
            background: var(--surface-color);
        }

        .side-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
        }
        .side-icon:hover, .side-icon.active { background-color: var(--hover-bg); color: var(--text-primary); }
        .side-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

        main.content-area {
            flex-grow: 1;
            padding: 36px 48px;
            max-width: 1200px;
        }

        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-title { font-size: 22px; font-weight: 600; }

        .section-title { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin: 28px 0 16px 0; text-transform: uppercase; font-size: 12px; letter-spacing: 0.05em; }

        /* Quick Recents Grid */
        .recents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .recent-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            transition: transform 0.15s, background-color 0.15s;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .recent-card:hover { transform: translateY(-2px); background-color: var(--hover-bg); }

        .card-preview {
            height: 100px;
            background: var(--hover-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text-secondary);
        }
        .card-preview img { width: 100%; height: 100%; object-fit: cover; }
        .card-preview svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.8; }

        .card-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-date { font-size: 11px; color: var(--text-secondary); }

        /* Data Table */
        .data-table { width: 100%; border-collapse: collapse; }
        .table-head {
            display: grid;
            grid-template-columns: 3.5fr 2fr 1.5fr 1fr 40px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .table-row {
            display: grid;
            grid-template-columns: 3.5fr 2fr 1.5fr 1fr 40px;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            transition: background-color 0.15s;
        }
        .table-row:hover { background-color: var(--hover-bg); }

        .file-title-cell { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .file-icon-box {
            width: 36px; height: 36px; border-radius: 8px;
            background: var(--hover-bg); display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; color: var(--text-secondary);
        }
        .file-icon-box svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; }
        .file-icon-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

        .file-name { font-weight: 500; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-dots { background: none; border: none; cursor: pointer; color: var(--text-secondary); padding: 6px; }

        .btn-pill {
            background-color: var(--btn-dark-bg);
            color: var(--btn-dark-text);
            border: none;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Modals */
        .modal-shade {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center; z-index: 500;
            visibility: hidden; opacity: 0; transition: opacity 0.2s; padding: 16px;
        }
        .modal-shade.active { visibility: visible; opacity: 1; }
        .modal-box { background: var(--surface-color); border-radius: 20px; width: 100%; max-width: 460px; padding: 28px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        .detail-row span:first-child { color: var(--text-secondary); }

        .toast-popup {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #111827; color: #fff; padding: 10px 22px; border-radius: 9999px; font-size: 13px; display: none; z-index: 2000;
        }

        @media(max-width: 768px) {
            aside.sidebar { display: none; }
            main.content-area { padding: 20px 16px; }
            .table-head { display: none; }
            .table-row { grid-template-columns: 1fr auto 30px; }
            .cell-format, .cell-date { display: none; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <a href="home.html" class="side-icon active" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <a href="1.html" class="side-icon" title="All Files">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    </a>
    <a href="share.html" class="side-icon" title="Shared with Me">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    </a>
    <a href="label.html" class="side-icon" title="Labels">
        <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
    </a>
    <div class="side-icon" id="themeToggleBtn" title="Toggle Theme" style="margin-top: auto;">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line></svg>
    </div>
</aside>

<main class="content-area">
    <div class="top-row">
        <div class="page-title">Home</div>
        <div style="display: flex; gap: 8px;">
            <a href="1.html" class="btn-pill">Open Drive</a>
        </div>
    </div>

    <div class="section-title">Recently Opened</div>
    <div class="recents-grid" id="recentsGrid">
        <!-- Rendered recently accessed files -->
    </div>

    <div class="section-title">Recent Activity</div>
    <div class="data-table">
        <div class="table-head">
            <div>Name</div>
            <div>Owner</div>
            <div class="cell-format">Format</div>
            <div class="cell-date">Opened</div>
            <div></div>
        </div>
        <div id="recentsTable">
            <div style="padding: 16px 0; color: var(--text-secondary);">Loading activity...</div>
        </div>
    </div>
</main>

<!-- Details Modal -->
<div class="modal-shade" id="detailsModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 style="font-size: 17px;">File Details</h3>
            <button class="btn-dots" id="closeDetailsModal">&times;</button>
        </div>
        <div id="detailsContent"></div>
    </div>
</div>

<div class="toast-popup" id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Theme Logic (shared across tabs)
    function syncTheme() {
        const isDark = localStorage.getItem('theme_mode') === 'dark' || 
            (!localStorage.getItem('theme_mode') && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.body.classList.toggle("dark", isDark);
    }
    syncTheme();

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
        const isDark = document.body.classList.toggle("dark");
        localStorage.setItem('theme_mode', isDark ? 'dark' : 'light');
    });

    const user = JSON.parse(localStorage.getItem('active_user') || '{}');
    if (!user.Email) window.location.href = "1.html";

    const recentsGrid = document.getElementById('recentsGrid');
    const recentsTable = document.getElementById('recentsTable');

    // Retrieve recent file history stored locally
    async function loadRecentFiles() {
        const recentsHistory = JSON.parse(localStorage.getItem('recent_files') || '[]');
        if (recentsHistory.length === 0) {
            recentsGrid.innerHTML = `<div style="color:var(--text-secondary); font-size:13px;">No recently opened files.</div>`;
            recentsTable.innerHTML = `<div style="color:var(--text-secondary); font-size:13px; padding:12px 0;">No activity yet.</div>`;
            return;
        }

        recentsGrid.innerHTML = '';
        recentsTable.innerHTML = '';

        for (const item of recentsHistory.slice(0, 6)) {
            const isImg = (item.Type || '').includes('img');
            const preview = isImg ? `<img src="${item.File}">` : `<span>${(item.Type || 'DOC').replace('.', '').toUpperCase()}</span>`;

            // Card item
            const card = document.createElement('div');
            card.className = 'recent-card';
            card.innerHTML = `
                <div class="card-preview">${preview}</div>
                <div class="card-name">${item.Name || 'Untitled'}</div>
                <div class="card-date">${new Date(item.openedAt).toLocaleDateString()}</div>
            `;
            card.onclick = () => window.open(item.File, '_blank');
            recentsGrid.appendChild(card);

            // Table item
            const row = document.createElement('div');
            row.className = 'table-row';
            row.innerHTML = `
                <div class="file-title-cell">
                    <div class="file-icon-box">${isImg ? `<img src="${item.File}">` : '📄'}</div>
                    <span class="file-name">${item.Name || 'Untitled'}</span>
                </div>
                <div>${item.Email}</div>
                <div class="cell-format">${item.Type || 'File'}</div>
                <div class="cell-date" style="font-size:12px; color:var(--text-secondary);">${new Date(item.openedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                <div><button class="btn-dots info-btn">ℹ️</button></div>
            `;
            row.querySelector('.info-btn').onclick = (e) => {
                e.stopPropagation();
                showDetails(item);
            };
            row.onclick = () => window.open(item.File, '_blank');
            recentsTable.appendChild(row);
        }
    }

    function showDetails(item) {
        const modal = document.getElementById('detailsModal');
        const content = document.getElementById('detailsContent');
        content.innerHTML = `
            <div class="detail-row"><span>File Name</span><span>${item.Name || 'Untitled'}</span></div>
            <div class="detail-row"><span>Format</span><span>${item.Type || 'Unknown'}</span></div>
            <div class="detail-row"><span>File Size</span><span>${item.Size ? (item.Size/(1024*1024)).toFixed(2) + ' MB' : 'N/A'}</span></div>
            <div class="detail-row"><span>Uploaded Date</span><span>${item.CreatedAt ? new Date(item.CreatedAt).toLocaleDateString() : 'Recent'}</span></div>
            <div class="detail-row"><span>Owner</span><span>${item.Email}</span></div>
        `;
        modal.classList.add('active');
    }

    document.getElementById('closeDetailsModal').onclick = () => document.getElementById('detailsModal').classList.remove('active');

    loadRecentFiles();
</script>
</body>
</html>
