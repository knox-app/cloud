<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Drive</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/knox-app/cloud/d235b91b67a58037117f8f0c2d1391ffd209a463/logo/ca81fecf-2d54-4aea-8de0-f189a43e1002.png">
    <!-- Global Design System -->
    <link rel="stylesheet" href="index.css">
    <!-- jsPDF for Image-to-PDF conversion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<!-- Workspace Sidebar -->
<aside class="sidebar">
    <div class="side-icon active" title="Cloud Drive">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <div class="side-icon" id="themeToggleBtn" title="Toggle Theme (Shift+T then D/L)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </div>
    <div class="side-icon" id="logoutSideBtn" title="Sign Out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </div>
</aside>

<!-- Drag Overlay -->
<div class="drag-overlay" id="dragOverlay">
    <div class="drag-overlay-card">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span>Drop files here to upload</span>
    </div>
</div>

<!-- Main Area -->
<main class="content-area" id="mainArea">
    <div class="top-row">
        <div class="page-title" id="breadcrumbArea">
            <span>Cloud Drive</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button class="btn-pill" id="btnSelectModeToggle" style="background: var(--hover-bg); color: var(--text-primary); border: 1px solid var(--border-color);" title="Select Multiple (Shift+S)">
                Select
            </button>
            <button class="btn-pill" id="uploadTriggerBtn" title="Upload (Shift+U)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Upload
            </button>
            <button class="btn-pill" id="newFolderTriggerBtn" style="background: var(--hover-bg); color: var(--text-primary); border: 1px solid var(--border-color);" title="New Folder (Shift+C)">
                + Folder
            </button>

            <!-- Top-Right User Profile Button -->
            <div class="user-profile-btn" id="userProfileBtn" title="Account Menu">
                <span id="userAvatarInitial">U</span>
                <img id="userAvatarImg" alt="Profile" style="display: none;" referrerpolicy="no-referrer">
            </div>
        </div>
    </div>

    <!-- Floating Pill Selection Toolbar -->
    <div class="selection-toolbar" id="selectionToolbar">
        <span id="selectedCountText" style="font-weight: 600; font-size: 13px;">0 Selected</span>
        <div class="selection-actions">
            <button class="selection-icon-btn" id="btnMultiDownload" title="Download Files">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
            <button class="selection-icon-btn" id="btnMultiMove" title="Move (Shift+M)">
                <svg viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>
            </button>
            <button class="selection-icon-btn danger" id="btnMultiDelete" title="Delete (Shift+D)">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
            <button class="btn-done-select" id="btnCancelSelect">Done</button>
        </div>
    </div>

    <!-- Hidden Native File Picker -->
    <input type="file" id="nativeFileInput" multiple style="display: none;">

    <div class="controls-row">
        <div class="search-container">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search entire drive or labels (Shift+F)">
        </div>
        <div class="view-switcher-group">
            <button class="view-btn" id="viewListBtn" title="List View">
                <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </button>
            <button class="view-btn" id="viewGridBtn" title="Grid View">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </button>
        </div>
    </div>

    <!-- Workspace View Container -->
    <div id="workspaceViewWrapper">
        <div style="padding: 24px 0; color: var(--text-secondary); font-size: 14px;">Loading Cloud Drive...</div>
    </div>
</main>

<!-- Desktop Floating Context Dropdown -->
<div class="desktop-action-dropdown" id="desktopDropdown"></div>

<!-- Mobile Bottom Action Sheet -->
<div class="bottom-sheet-backdrop" id="bottomSheetBackdrop">
    <div class="bottom-sheet-card" id="bottomSheetCard">
        <div class="bottom-sheet-handle"></div>
        <div class="bottom-sheet-header">
            <div id="bottomSheetHeaderIcon" style="width: 24px; height: 24px; display: flex; align-items: center;"></div>
            <div class="bottom-sheet-title" id="bottomSheetHeaderTitle"></div>
        </div>
        <div id="bottomSheetActionsList"></div>
    </div>
</div>

<!-- Profile Popover / Bottom Sheet -->
<div class="profile-popover-card" id="profilePopover">
    <div class="profile-card-header">
        <div class="profile-card-avatar" id="popoverAvatar">
            <span id="popoverAvatarInitial">U</span>
            <img id="popoverAvatarImg" alt="Profile" style="display: none;" referrerpolicy="no-referrer">
        </div>
        <div class="profile-card-name" id="popoverName">User Name</div>
        <div class="profile-card-email" id="popoverEmail">user@example.com</div>
    </div>
    <div class="profile-menu-items">
        <button class="profile-menu-item" id="btnManageAccount">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span>Manage Account</span>
        </button>
        <button class="profile-menu-item" id="btnSwitchAccount">
            <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            <span>Switch Account</span>
        </button>
        <button class="profile-menu-item" id="btnSettingsPage">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            <span>Settings</span>
        </button>
        <button class="profile-menu-item" id="btnLogoutMenu" style="color: var(--danger);">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            <span>Sign Out</span>
        </button>
    </div>
</div>

<div class="toast-popup" id="toastPopup"></div>

<script type="module">
    import { initModals, renderCustomizePicker } from "https://knox-app.github.io/cloud/drive/system/model.js";
    import { FOLDER_COLORS, FOLDER_BADGE_ICONS } from "https://knox-app.github.io/cloud/drive/folder/icon-sys.js";
    import { 
        resolveCurrentUser, goToSwitchAccount, goToManageAccount, goToSettings, signOut 
    } from "./auth.js";
    import { 
        subscribeToDrive, subscribeToUserProfile, formatDisplayDate, getContrastColor,
        createFolderRecord, createFileRecord, renameRecord, updateRecordLabels,
        updateRecordAccess, transferRecordOwnership, updateFolderCustomize,
        updateFolderPassword, moveRecords, deleteRecord 
    } from "./datasets.js";
    import { uploadFile } from "./upload.js";

    // 1. Resolve Active Session & User Info
    const currentUser = resolveCurrentUser();
    if (!currentUser) throw new Error("No active account resolved");

    const userEmail = currentUser.email;
    const userIndex = currentUser.index;

    // 2. View Switcher Handling (Persist State Reliably)
    let currentViewMode = localStorage.getItem('drive_view_mode') || 'list';
    
    function setViewMode(mode) {
        currentViewMode = mode;
        localStorage.setItem('drive_view_mode', mode);
        updateViewSwitcherUI();
        renderCurrentWorkspace();
    }

    function updateViewSwitcherUI() {
        document.getElementById('viewListBtn').classList.toggle('active', currentViewMode === 'list');
        document.getElementById('viewGridBtn').classList.toggle('active', currentViewMode === 'grid');
    }

    // Apply saved view state immediately on load
    updateViewSwitcherUI();

    document.getElementById('viewListBtn').addEventListener('click', () => setViewMode('list'));
    document.getElementById('viewGridBtn').addEventListener('click', () => setViewMode('grid'));

    // 3. Theme Toggle (Pure AMOLED Dark Mode)
    function setTheme(dark) {
        if (dark) {
            document.body.classList.add('dark');
            localStorage.setItem('drive_theme', 'dark');
        } else {
            document.body.classList.remove('dark');
            localStorage.setItem('drive_theme', 'light');
        }
    }
    if (localStorage.getItem('drive_theme') === 'dark') setTheme(true);

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
        setTheme(!document.body.classList.contains('dark'));
    });

    document.getElementById('logoutSideBtn').addEventListener('click', () => signOut());

    function showToast(msg) {
        const t = document.getElementById('toastPopup');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 2600);
    }

    // 4. Render User Profile & Menu
    function renderProfileHeader(data) {
        const firstName = data["First Name"] || "";
        const lastName = data["Last Name"] || "";
        const fullName = `${firstName} ${lastName}`.trim() || data.Email || "User";
        const email = data.Email || data.email;
        const pic = data["Profile_Picture"] || data["Profile Picture"] || "";

        const avatarInitial = firstName ? firstName.charAt(0).toUpperCase() : email.charAt(0).toUpperCase();

        // Top button
        const btnImg = document.getElementById('userAvatarImg');
        const btnInit = document.getElementById('userAvatarInitial');
        if (pic) {
            btnImg.src = pic;
            btnImg.style.display = 'block';
            btnInit.style.display = 'none';
        } else {
            btnInit.innerText = avatarInitial;
            btnImg.style.display = 'none';
            btnInit.style.display = 'block';
        }

        // Popover
        const popImg = document.getElementById('popoverAvatarImg');
        const popInit = document.getElementById('popoverAvatarInitial');
        document.getElementById('popoverName').innerText = fullName;
        document.getElementById('popoverEmail').innerText = email;

        if (pic) {
            popImg.src = pic;
            popImg.style.display = 'block';
            popInit.style.display = 'none';
        } else {
            popInit.innerText = avatarInitial;
            popImg.style.display = 'none';
            popInit.style.display = 'block';
        }
    }

    renderProfileHeader(currentUser.account);
    subscribeToUserProfile(currentUser.lotus, userEmail, renderProfileHeader);

    const profilePopover = document.getElementById('profilePopover');
    const userProfileBtn = document.getElementById('userProfileBtn');

    userProfileBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        profilePopover.classList.toggle('active');
    });

    window.addEventListener('click', (e) => {
        if (!e.target.closest('#profilePopover') && !e.target.closest('#userProfileBtn')) {
            profilePopover.classList.remove('active');
        }
    });

    document.getElementById('btnSwitchAccount').addEventListener('click', () => goToSwitchAccount());
    document.getElementById('btnManageAccount').addEventListener('click', () => goToManageAccount(userIndex));
    document.getElementById('btnSettingsPage').addEventListener('click', () => goToSettings(userIndex));
    document.getElementById('btnLogoutMenu').addEventListener('click', () => signOut());

    // 5. SVG File Types
    const SVG_ICONS = {
        image: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`,
        pdf: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>`,
        doc: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`,
        video: `<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>`,
        dots: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>`,
        trash: `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`,
        share: `<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>`,
        download: `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`,
        edit: `<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
        users: `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`,
        move: `<svg viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>`,
        info: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`,
        tag: `<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>`,
        lock: `<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`,
        customize: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>`
    };

    function getFormatInfo(typeStr, isFolder) {
        if (isFolder) return { label: "Folder", icon: FOLDER_BADGE_ICONS.folder };
        const t = (typeStr || "").toLowerCase();
        if (t.includes("img") || t.includes("png") || t.includes("jpg") || t.includes("jpeg") || t.includes("image")) return { label: "Image", icon: SVG_ICONS.image };
        if (t.includes("pdf")) return { label: "PDF", icon: SVG_ICONS.pdf };
        if (t.includes("mp4") || t.includes("mkv") || t.includes("video")) return { label: "Video", icon: SVG_ICONS.video };
        return { label: "Document", icon: SVG_ICONS.doc };
    }

    let allWorkspaceDocs = [];
    let allFolderDocs = [];
    let currentRenderedItems = [];
    let selectedItemIds = new Set();
    let isSelectionMode = false;

    // 6. Real-time Subscription to Drive Documents
    subscribeToDrive(userEmail, (data) => {
        allWorkspaceDocs = data.all;
        allFolderDocs = data.folders;
        renderCurrentWorkspace();
    });

    function renderCurrentWorkspace() {
        const wrapper = document.getElementById('workspaceViewWrapper');

        // Root View: Show items not assigned inside any folder
        const assignedChildIds = new Set();
        allFolderDocs.forEach(f => {
            if (Array.isArray(f.File)) f.File.forEach(id => assignedChildIds.add(id));
        });

        const rootItems = allWorkspaceDocs.filter(i => !assignedChildIds.has(i.id));
        currentRenderedItems = rootItems;

        if (rootItems.length === 0) {
            wrapper.innerHTML = `
                <div class="empty-state-container">
                    <img src="https://indus.sarvam.ai/studio/assets/empty-table.webp" alt="No files" class="empty-state-img">
                    <div class="empty-state-title">No Files In Your Drive</div>
                </div>
            `;
            return;
        }

        rootItems.sort((a, b) => (b.Folder === "True" ? 1 : 0) - (a.Folder === "True" ? 1 : 0));

        if (currentViewMode === 'list') {
            renderListView(rootItems, wrapper);
        } else {
            renderGridView(rootItems, wrapper);
        }
    }

    function renderListView(items, wrapper) {
        wrapper.innerHTML = `
            <div class="data-table" id="dataTable">
                <div class="table-head">
                    <div class="cell-checkbox">
                        <div class="custom-checkbox" id="selectAllCheckbox">
                            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                    </div>
                    <div>Name</div>
                    <div class="cell-uploader">Owner</div>
                    <div class="cell-format">Format</div>
                    <div class="cell-date">Updated</div>
                    <div></div>
                </div>
                <div id="tableContent"></div>
            </div>
        `;

        const container = document.getElementById('tableContent');
        items.forEach((item, idx) => {
            const isFolder = item.Folder === "True";
            const name = item.Name || (item.File ? item.File.split('/').pop() : 'Untitled');
            const format = getFormatInfo(item.Type, isFolder);
            const displayDate = formatDisplayDate(item.Updated);
            const ownerEmail = item.Email || userEmail;
            const isViewer = (ownerEmail !== userEmail);

            const folderColor = item.Customize?.Colour || (isFolder ? 'var(--folder-default-color)' : '');
            const folderIconKey = item.Customize?.Icon || 'folder';
            const badgeSvg = isFolder ? (FOLDER_BADGE_ICONS[folderIconKey] || FOLDER_BADGE_ICONS.folder) : format.icon;

            const row = document.createElement('div');
            row.className = 'table-row';
            row.setAttribute('data-id', item.id);
            row.setAttribute('data-index', idx);

            row.innerHTML = `
                <div class="cell-checkbox">
                    <div class="custom-checkbox row-checkbox-btn" data-id="${item.id}">
                        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>
                <div class="file-title-cell">
                    <div class="file-icon-box" style="${isFolder ? `color: ${folderColor};` : ''}">
                        ${badgeSvg}
                    </div>
                    <div class="file-info-col">
                        <span class="file-name" title="${name}">${name}</span>
                        <div class="file-labels">${(item.Label || []).map(l => `<span class="label-badge">${l}</span>`).join('')}</div>
                    </div>
                </div>
                <div class="cell-uploader" style="font-size: 13px; color: var(--text-secondary);">${ownerEmail}</div>
                <div class="cell-format" style="font-size: 13px; color: var(--text-secondary);">${format.label}</div>
                <div class="cell-date" style="font-size: 13px; color: var(--text-secondary);">${displayDate}</div>
                <div class="actions-cell">
                    <button class="btn-dots">${SVG_ICONS.dots}</button>
                </div>
            `;

            attachItemEvents(row, item, isFolder, name, isViewer);
            container.appendChild(row);
        });

        document.getElementById('selectAllCheckbox')?.addEventListener('click', (e) => {
            e.stopPropagation();
            const shouldSelectAll = (selectedItemIds.size !== currentRenderedItems.length);
            currentRenderedItems.forEach(item => toggleSelectItem(item.id, shouldSelectAll));
        });
    }

    function renderGridView(items, wrapper) {
        const grid = document.createElement('div');
        grid.className = 'grid-container';
        grid.id = 'dataTable';

        items.forEach((item, idx) => {
            const isFolder = item.Folder === "True";
            const name = item.Name || (item.File ? item.File.split('/').pop() : 'Untitled');
            const format = getFormatInfo(item.Type, isFolder);
            const ownerEmail = item.Email || userEmail;
            const isViewer = (ownerEmail !== userEmail);
            const folderColor = item.Customize?.Colour || 'var(--folder-default-color)';
            const folderIconKey = item.Customize?.Icon || 'folder';
            const customIconSvg = FOLDER_BADGE_ICONS[folderIconKey] || FOLDER_BADGE_ICONS.folder;
            const contrastColor = getContrastColor(folderColor.startsWith('var') ? '#E57373' : folderColor);

            const card = document.createElement('div');
            card.className = 'grid-card';
            card.setAttribute('data-id', item.id);
            card.setAttribute('data-index', idx);

            let previewHtml = '';
            if (isFolder) {
                previewHtml = `
                    <div class="grid-folder-body">
                        <svg class="big-folder-svg" viewBox="0 0 24 24" fill="${folderColor}">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <div class="big-folder-badge-icon" style="color: ${contrastColor};">
                            ${customIconSvg}
                        </div>
                    </div>
                `;
            } else {
                if (format.label === 'Image') {
                    previewHtml = `
                        <div class="grid-file-preview">
                            <img src="${item.File}" alt="${name}" loading="lazy">
                        </div>
                    `;
                } else {
                    previewHtml = `
                        <div class="grid-file-preview">
                            <div class="doc-mockup-page">
                                <div class="doc-line" style="width: 50%;"></div>
                                <div class="doc-line" style="width: 85%;"></div>
                                <div class="doc-line" style="width: 70%;"></div>
                                <div class="doc-line" style="width: 60%;"></div>
                            </div>
                        </div>
                    `;
                }
            }

            card.innerHTML = `
                <div class="grid-card-checkbox">
                    <div class="custom-checkbox row-checkbox-btn" data-id="${item.id}">
                        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>
                <div class="grid-card-top">
                    <div class="grid-header-left">
                        <div class="grid-card-icon" style="${isFolder ? `color: ${folderColor};` : 'color: var(--text-secondary);'}">
                            ${isFolder ? customIconSvg : format.icon}
                        </div>
                        <span class="grid-card-title" title="${name}">${name}</span>
                    </div>
                    <div class="actions-cell">
                        <button class="btn-dots">${SVG_ICONS.dots}</button>
                    </div>
                </div>
                ${previewHtml}
            `;

            attachItemEvents(card, item, isFolder, name, isViewer);
            grid.appendChild(card);
        });

        wrapper.innerHTML = '';
        wrapper.appendChild(grid);
    }

    // 7. Navigation & Item Events (No Password prompt on click for folders!)
    function attachItemEvents(el, item, isFolder, name, isViewer) {
        el.addEventListener('click', (e) => {
            if (e.target.closest('.actions-cell')) return;
            if (isSelectionMode) {
                toggleSelectItem(item.id, !selectedItemIds.has(item.id));
            } else {
                if (isFolder) {
                    // Redirect to folder.html immediately. If locked, folder.html handles security
                    window.location.href = `folder.html?id=${item.id}`;
                } else {
                    window.open(item.File, '_blank');
                }
            }
        });

        const dotsBtn = el.querySelector('.btn-dots');
        dotsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showItemActions(item, isFolder, name, isViewer, e);
        });
    }

    // 8. Actions Menu (Mobile Sheet + Desktop Dropdown)
    const desktopDropdown = document.getElementById('desktopDropdown');
    const bottomSheetBackdrop = document.getElementById('bottomSheetBackdrop');

    function showItemActions(item, isFolder, name, isViewer, event) {
        const isMobile = window.innerWidth <= 768;

        const actionItems = [];
        if (!isViewer && !isFolder) actionItems.push({ id: 'download', icon: SVG_ICONS.download, label: 'Download' });
        if (!isViewer) actionItems.push({ id: 'rename', icon: SVG_ICONS.edit, label: 'Rename' });
        if (!isViewer && isFolder) {
            actionItems.push({ id: 'customize', icon: SVG_ICONS.customize, label: 'Customize' });
            actionItems.push({ id: 'security', icon: SVG_ICONS.lock, label: 'Security' });
        }
        if (!isViewer && !isFolder) actionItems.push({ id: 'share', icon: SVG_ICONS.share, label: 'Share' });
        if (!isViewer) {
            actionItems.push({ id: 'access', icon: SVG_ICONS.users, label: 'Manage Access' });
            actionItems.push({ id: 'label', icon: SVG_ICONS.tag, label: 'Label' });
            actionItems.push({ id: 'move', icon: SVG_ICONS.move, label: isFolder ? 'Organise' : 'Move' });
        }
        actionItems.push({ id: 'details', icon: SVG_ICONS.info, label: 'Details' });
        actionItems.push({ id: 'delete', icon: SVG_ICONS.trash, label: isViewer ? 'Remove Access' : 'Delete', danger: true });

        const handleActionClick = (actionId) => {
            closeAllActionMenus();
            if (actionId === 'download') directDownload(item.File, item.Name);
            if (actionId === 'rename') openRename(item);
            if (actionId === 'customize') openCustomize(item);
            if (actionId === 'security') openSecurity(item);
            if (actionId === 'share') openShare(item);
            if (actionId === 'access') openAccess(item);
            if (actionId === 'label') openLabel(item);
            if (actionId === 'move') openMove(item);
            if (actionId === 'details') openDetails(item);
            if (actionId === 'delete') openDelete(item, isViewer);
        };

        if (isMobile) {
            const headerIcon = document.getElementById('bottomSheetHeaderIcon');
            const format = getFormatInfo(item.Type, isFolder);
            const folderColor = item.Customize?.Colour || 'var(--folder-default-color)';
            headerIcon.style.color = isFolder ? folderColor : 'var(--text-secondary)';
            headerIcon.innerHTML = isFolder ? (FOLDER_BADGE_ICONS[item.Customize?.Icon] || FOLDER_BADGE_ICONS.folder) : format.icon;

            document.getElementById('bottomSheetHeaderTitle').innerText = name;

            const list = document.getElementById('bottomSheetActionsList');
            list.innerHTML = '';
            actionItems.forEach(act => {
                const div = document.createElement('div');
                div.className = `bottom-sheet-item ${act.danger ? 'danger' : ''}`;
                div.innerHTML = `${act.icon} <span>${act.label}</span>`;
                div.addEventListener('click', () => handleActionClick(act.id));
                list.appendChild(div);
            });

            bottomSheetBackdrop.classList.add('active');
        } else {
            desktopDropdown.innerHTML = '';
            actionItems.forEach(act => {
                const div = document.createElement('div');
                div.className = `dropdown-item ${act.danger ? 'danger' : ''}`;
                div.innerHTML = `${act.icon} <span>${act.label}</span>`;
                div.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleActionClick(act.id);
                });
                desktopDropdown.appendChild(div);
            });

            const rect = event.currentTarget.getBoundingClientRect();
            let top = rect.bottom + 6;
            let left = rect.right - 200;
            if (left < 10) left = 10;
            if (top + 320 > window.innerHeight) top = rect.top - 320;

            desktopDropdown.style.top = `${top}px`;
            desktopDropdown.style.left = `${left}px`;
            desktopDropdown.classList.add('active');
        }
    }

    function closeAllActionMenus() {
        desktopDropdown.classList.remove('active');
        bottomSheetBackdrop.classList.remove('active');
    }

    bottomSheetBackdrop.addEventListener('click', (e) => {
        if (e.target === bottomSheetBackdrop) closeAllActionMenus();
    });
    window.addEventListener('click', () => closeAllActionMenus());

    async function directDownload(url, fileName) {
        showToast("Starting download...");
        try {
            const res = await fetch(url);
            const blob = await res.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = fileName || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
            showToast("Download finished");
        } catch(e) {
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }

    // 9. Modal Interactions
    function openRename(item) {
        const modal = document.getElementById('renameModal');
        const input = document.getElementById('renameInput');
        input.value = item.Name || '';
        modal.classList.add('active');

        document.getElementById('closeRenameModal').onclick = () => modal.classList.remove('active');
        document.getElementById('btnSubmitRename').onclick = async () => {
            const newName = input.value.trim();
            if (newName) {
                await renameRecord(item.id, newName);
                showToast("Renamed successfully");
                modal.classList.remove('active');
            }
        };
    }

    function openCustomize(item) {
        const modal = document.getElementById('customizeModal');
        let selectedColor = item.Customize?.Colour || '#4285F4';
        let selectedIcon = item.Customize?.Icon || 'folder';

        renderCustomizePicker(
            selectedColor, selectedIcon,
            (c) => { selectedColor = c; renderCustomizePicker(selectedColor, selectedIcon, () => {}, () => {}); },
            (i) => { selectedIcon = i; renderCustomizePicker(selectedColor, selectedIcon, () => {}, () => {}); }
        );

        modal.classList.add('active');
        document.getElementById('closeCustomizeModal').onclick = () => modal.classList.remove('active');
        document.getElementById('btnSaveCustomize').onclick = async () => {
            await updateFolderCustomize(item.id, selectedColor, selectedIcon);
            showToast("Folder customized");
            modal.classList.remove('active');
        };
    }

    function openSecurity(item) {
        const modal = document.getElementById('securityModal');
        const body = document.getElementById('securityModalBody');
        const hasPass = Boolean(item.Password);

        if (hasPass) {
            body.innerHTML = `
                <div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;">
                    🔒 This folder is locked by password.
                </div>
                <div style="display: flex; gap: 8px; justify-content: flex-end;">
                    <button class="btn-pill" id="btnDisablePass" style="background: var(--danger); color: #fff;">Disable</button>
                </div>
            `;
            document.getElementById('btnDisablePass').onclick = async () => {
                await updateFolderPassword(item.id, "");
                showToast("Password disabled");
                modal.classList.remove('active');
            };
        } else {
            body.innerHTML = `
                <div class="input-group">
                    <label>Set Password</label>
                    <input type="password" id="newPassInput" class="clean-input" placeholder="Password to lock folder">
                </div>
                <div style="display: flex; justify-content: flex-end; margin-top: 14px;">
                    <button class="btn-pill" id="btnSavePass">Save Password</button>
                </div>
            `;
            document.getElementById('btnSavePass').onclick = async () => {
                const pass = document.getElementById('newPassInput').value.trim();
                if (pass) {
                    await updateFolderPassword(item.id, pass);
                    showToast("Password enabled");
                    modal.classList.remove('active');
                }
            };
        }

        modal.classList.add('active');
        document.getElementById('closeSecurityModal').onclick = () => modal.classList.remove('active');
    }

    function openShare(item) {
        const modal = document.getElementById('shareModal');
        modal.classList.add('active');
        document.getElementById('closeShareModal').onclick = () => modal.classList.remove('active');

        document.getElementById('btnCopyShareLink').onclick = () => {
            navigator.clipboard.writeText(item.File);
            showToast("Link copied to clipboard");
        };

        document.getElementById('btnExecuteShare').onclick = async () => {
            const format = document.getElementById('shareFormatChoice').value;
            if (navigator.share) {
                await navigator.share({ title: item.Name, url: item.File });
            } else {
                navigator.clipboard.writeText(item.File);
                showToast("Link copied");
            }
        };
    }

    function openAccess(item) {
        const modal = document.getElementById('accessModal');
        modal.classList.add('active');
        document.getElementById('closeAccessModal').onclick = () => modal.classList.remove('active');
    }

    function openLabel(item) {
        const modal = document.getElementById('labelModal');
        const list = document.getElementById('currentLabelsList');
        let currentLabels = [...(item.Label || [])];

        const renderBadges = () => {
            list.innerHTML = currentLabels.map((l, i) => `
                <span class="label-badge" style="padding: 4px 8px;">
                    ${l} <span style="cursor: pointer; margin-left: 4px; color: var(--danger);" data-idx="${i}">&times;</span>
                </span>
            `).join('') || `<span style="font-size: 12px; color: var(--text-secondary);">No labels</span>`;

            list.querySelectorAll('span[data-idx]').forEach(btn => {
                btn.onclick = () => {
                    currentLabels.splice(parseInt(btn.getAttribute('data-idx')), 1);
                    renderBadges();
                };
            });
        };

        renderBadges();
        modal.classList.add('active');
        document.getElementById('closeLabelModal').onclick = () => modal.classList.remove('active');

        document.getElementById('btnAddLabel').onclick = () => {
            const val = document.getElementById('newLabelInput').value.trim();
            if (val && !currentLabels.includes(val)) {
                currentLabels.push(val);
                document.getElementById('newLabelInput').value = "";
                renderBadges();
            }
        };

        document.getElementById('btnSaveLabels').onclick = async () => {
            await updateRecordLabels(item.id, currentLabels);
            showToast("Labels updated");
            modal.classList.remove('active');
        };
    }

    function openMove(item) {
        const modal = document.getElementById('moveModal');
        const sel = document.getElementById('moveDestinationSelect');
        sel.innerHTML = `<option value="root">Root Directory</option>`;
        allFolderDocs.forEach(f => {
            if (f.id !== item?.id) sel.innerHTML += `<option value="${f.id}">${f.Name}</option>`;
        });
        modal.classList.add('active');
        document.getElementById('closeMoveModal').onclick = () => modal.classList.remove('active');

        document.getElementById('btnConfirmMove').onclick = async () => {
            const dest = sel.value;
            await moveRecords([item.id], dest, allFolderDocs);
            showToast("Moved successfully");
            modal.classList.remove('active');
        };
    }

    function openDetails(item) {
        const modal = document.getElementById('detailsModal');
        const c = document.getElementById('detailsContent');
        const isFolder = item.Folder === "True";
        c.innerHTML = `
            <div class="details-item"><span class="details-label">Name</span><span class="details-val">${item.Name}</span></div>
            <div class="details-item"><span class="details-label">Type</span><span class="details-val">${isFolder ? 'Folder' : item.Type}</span></div>
            <div class="details-item"><span class="details-label">Date</span><span class="details-val">${item.Updated || 'N/A'}</span></div>
            <div class="details-item"><span class="details-label">Owner</span><span class="details-val">${item.Email}</span></div>
        `;
        modal.classList.add('active');
        document.getElementById('closeDetailsModal').onclick = () => modal.classList.remove('active');
    }

    async function openDelete(item, isViewer) {
        if (confirm(`Delete "${item.Name || 'item'}"?`)) {
            await deleteRecord(item.id, userEmail, isViewer, allFolderDocs);
            showToast("Item deleted");
        }
    }

    // 10. Selection Toolbar
    function enterSelectionMode() {
        isSelectionMode = true;
        document.getElementById('dataTable')?.classList.add('selection-active');
        document.getElementById('selectionToolbar').classList.add('active');
        document.getElementById('btnSelectModeToggle').innerText = "Cancel";
    }

    function exitSelectionMode() {
        isSelectionMode = false;
        selectedItemIds.clear();
        document.getElementById('dataTable')?.classList.remove('selection-active');
        document.getElementById('selectionToolbar').classList.remove('active');
        document.getElementById('btnSelectModeToggle').innerText = "Select";
        document.querySelectorAll('.row-checkbox-btn').forEach(c => c.classList.remove('checked'));
        document.querySelectorAll('.table-row, .grid-card').forEach(r => r.classList.remove('selected'));
    }

    document.getElementById('btnSelectModeToggle').addEventListener('click', () => {
        isSelectionMode ? exitSelectionMode() : enterSelectionMode();
    });

    function toggleSelectItem(id, isSelected) {
        if (!isSelectionMode) enterSelectionMode();
        isSelected ? selectedItemIds.add(id) : selectedItemIds.delete(id);

        const el = document.querySelector(`[data-id="${id}"]`);
        if (el) {
            el.classList.toggle('selected', isSelected);
            el.querySelector('.row-checkbox-btn')?.classList.toggle('checked', isSelected);
        }
        document.getElementById('selectedCountText').innerText = `${selectedItemIds.size} Selected`;
    }

    document.getElementById('btnCancelSelect').addEventListener('click', exitSelectionMode);

    document.getElementById('btnMultiDelete').addEventListener('click', async () => {
        if (selectedItemIds.size === 0) return;
        if (confirm(`Delete ${selectedItemIds.size} selected items?`)) {
            for (const id of selectedItemIds) {
                await deleteRecord(id, userEmail, false, allFolderDocs);
            }
            showToast("Items deleted");
            exitSelectionMode();
        }
    });

    // 11. Folder Creation
    document.getElementById('newFolderTriggerBtn').addEventListener('click', () => {
        const modal = document.getElementById('folderModal');
        document.getElementById('newFolderName').value = "";
        document.getElementById('newFolderPassword').value = "";
        modal.classList.add('active');
        document.getElementById('closeFolderModal').onclick = () => modal.classList.remove('active');

        document.getElementById('btnCreateFolder').onclick = async () => {
            const name = document.getElementById('newFolderName').value.trim();
            const pass = document.getElementById('newFolderPassword').value.trim();
            if (name) {
                await createFolderRecord({ userEmail, name, password: pass });
                showToast("Folder created");
                modal.classList.remove('active');
            }
        };
    });

    // 12. Upload Engine (Uploadcare for PDFs, ImgBB for Images)
    const fileInput = document.getElementById('nativeFileInput');
    document.getElementById('uploadTriggerBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleBatchUpload(e.target.files);
    });

    const dragOverlay = document.getElementById('dragOverlay');
    window.addEventListener('dragover', (e) => { e.preventDefault(); dragOverlay.classList.add('active'); });
    window.addEventListener('dragleave', (e) => { if (e.clientX === 0 && e.clientY === 0) dragOverlay.classList.remove('active'); });
    window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragOverlay.classList.remove('active');
        if (e.dataTransfer.files.length) handleBatchUpload(e.dataTransfer.files);
    });

    async function handleBatchUpload(files) {
        showToast(`Uploading ${files.length} file(s)...`);
        for (const file of files) {
            try {
                const uploaded = await uploadFile(file);
                await createFileRecord({
                    userEmail,
                    fileUrl: uploaded.url,
                    fileName: uploaded.name,
                    fileType: uploaded.type
                });
            } catch(err) {
                console.error("Upload error:", err);
            }
        }
        showToast("Upload completed!");
    }

    // 13. Search
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase().trim();
        const wrapper = document.getElementById('workspaceViewWrapper');

        if (!val) {
            renderCurrentWorkspace();
            return;
        }

        const matches = allWorkspaceDocs.filter(item => {
            const name = (item.Name || '').toLowerCase();
            const labels = (item.Label || []).join(' ').toLowerCase();
            return name.includes(val) || labels.includes(val);
        });

        currentRenderedItems = matches;
        currentViewMode === 'list' ? renderListView(matches, wrapper) : renderGridView(matches, wrapper);
    });
</script>
</body>
</html>
