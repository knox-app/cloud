<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Cloud Workspace</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --surface-color: #171717;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #262626;
            --hover-bg: #1f1f1f;
            --accent: #ffffff;
            --accent-text: #000000;
            --card-bg: #141414;
            --sidebar-width: 64px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        aside.sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            flex-shrink: 0;
            background: var(--surface-color);
        }

        .side-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
        }
        .side-icon:hover, .side-icon.active {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }
        .side-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }

        /* Main Workspace */
        main.main-content {
            flex-grow: 1;
            padding: 36px 48px;
            max-width: 1200px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .btn-open-drive {
            background-color: var(--accent);
            color: var(--accent-text);
            border: none;
            padding: 10px 22px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.15s;
        }
        .btn-open-drive:hover { opacity: 0.9; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 16px;
            display: block;
        }

        /* Recently Opened Visual Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .recent-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }
        .recent-card:hover {
            transform: translateY(-2px);
            border-color: #3f3f46;
        }

        .card-preview {
            width: 100%;
            height: 120px;
            background: #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%);
        }
        .card-preview svg { width: 32px; height: 32px; stroke: var(--text-secondary); fill: none; stroke-width: 1.5; }

        .card-info {
            padding: 14px;
        }
        .card-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Recent Activity Table */
        .activity-table {
            width: 100%;
            border-collapse: collapse;
        }

        .activity-head {
            display: grid;
            grid-template-columns: 3.5fr 2.5fr 1.5fr 1.5fr 40px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .activity-row {
            display: grid;
            grid-template-columns: 3.5fr 2.5fr 1.5fr 1.5fr 40px;
            align-items: center;
            padding: 14px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            transition: background-color 0.15s;
        }
        .activity-row:hover { background-color: var(--hover-bg); }

        .item-name-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }
        .thumb-box {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #262626;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-box svg { width: 18px; height: 18px; stroke: var(--text-secondary); fill: none; stroke-width: 1.8; }

        .item-name-text {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .info-pill {
            background: #2563eb;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            border-radius: 4px;
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            aside.sidebar { display: none; }
            main.main-content { padding: 20px 16px; }
            .activity-head { display: none; }
            .activity-row {
                grid-template-columns: 1fr auto 30px;
                gap: 8px;
            }
            .cell-owner, .cell-format { display: none; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <a href="home.html" class="side-icon active" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <a href="1.html" class="side-icon" title="Files & Knowledge Base">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    </a>
    <div class="side-icon" id="logoutBtn" title="Sign Out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </div>
</aside>

<main class="main-content">
    <div class="header-top">
        <div class="page-title">Home</div>
        <a href="1.html" class="btn-open-drive">Open Drive</a>
    </div>

    <span class="section-label">Recently Opened</span>
    <div class="cards-grid" id="recentlyOpenedGrid">
        <div style="color: var(--text-secondary); font-size: 13px;">No recently opened files.</div>
    </div>

    <span class="section-label">Recent Activity</span>
    <div class="activity-table">
        <div class="activity-head">
            <div>Name</div>
            <div class="cell-owner">Owner</div>
            <div class="cell-format">Format</div>
            <div>Opened</div>
            <div></div>
        </div>
        <div id="recentActivityList">
            <div style="padding: 16px 0; color: var(--text-secondary); font-size: 13px;">Loading activity...</div>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getFirestore, collection, query, where, getDocs, or, doc, updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('active_user')); } catch(e){}
    if (!currentUser || !currentUser.Email) {
        window.location.href = "1.html";
    }
    const userEmail = currentUser.Email;

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('active_user');
        window.location.reload();
    });

    const SVG_DOC = `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`;

    function formatTime(isoStr) {
        if (!isoStr) return "Just now";
        const d = new Date(isoStr);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatDate(isoStr) {
        if (!isoStr) return new Date().toLocaleDateString();
        const d = new Date(isoStr);
        return `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;
    }

    async function loadRecentFiles() {
        const grid = document.getElementById('recentlyOpenedGrid');
        const list = document.getElementById('recentActivityList');

        try {
            const q = query(
                collection(db, "Cloud Drive"),
                or(
                    where("Email", "==", userEmail),
                    where("Access.Viewer", "array-contains", userEmail),
                    where("Access.Commentator", "array-contains", userEmail),
                    where("Access.Editor", "array-contains", userEmail)
                )
            );

            const snap = await getDocs(q);
            let items = [];
            snap.forEach(d => {
                const data = d.data();
                if (data.Folder !== "True") {
                    items.push({ id: d.id, ...data });
                }
            });

            // Sort by LastOpened timestamp (descending)
            items.sort((a, b) => new Date(b.LastOpened || b.CreatedAt || 0) - new Date(a.LastOpened || a.CreatedAt || 0));

            if (items.length === 0) {
                grid.innerHTML = `<div style="color: var(--text-secondary); font-size: 13px;">No recently opened files found.</div>`;
                list.innerHTML = `<div style="padding: 16px 0; color: var(--text-secondary); font-size: 13px;">No activity logged yet.</div>`;
                return;
            }

            // Render top 4 items to visual cards
            grid.innerHTML = "";
            items.slice(0, 4).forEach(item => {
                const card = document.createElement('div');
                card.className = "recent-card";
                const isImg = (item.Type || "").includes("img") || (item.Type || "").includes("png") || (item.Type || "").includes("jpg");
                
                const previewHtml = isImg 
                    ? `<img src="${item.File}" alt="${item.Name || 'preview'}">` 
                    : SVG_DOC;

                card.innerHTML = `
                    <div class="card-preview">${previewHtml}</div>
                    <div class="card-info">
                        <div class="card-name">${item.Name || item.File.split('/').pop()}</div>
                        <div class="card-date">${formatDate(item.LastOpened)}</div>
                    </div>
                `;

                card.addEventListener('click', async () => {
                    await updateDoc(doc(db, "Cloud Drive", item.id), {
                        LastOpened: new Date().toISOString(),
                        LastOpenedBy: userEmail
                    });
                    window.open(item.File, '_blank');
                });
                grid.appendChild(card);
            });

            // Render Recent Activity Rows
            list.innerHTML = "";
            items.forEach(item => {
                const row = document.createElement('div');
                row.className = "activity-row";
                const isImg = (item.Type || "").includes("img") || (item.Type || "").includes("png") || (item.Type || "").includes("jpg");
                const previewHtml = isImg ? `<img src="${item.File}">` : SVG_DOC;
                const name = item.Name || item.File.split('/').pop();

                row.innerHTML = `
                    <div class="item-name-cell">
                        <div class="thumb-box">${previewHtml}</div>
                        <span class="item-name-text" title="${name}">${name}</span>
                    </div>
                    <div class="cell-owner" style="color: var(--text-secondary);">${item.Email}</div>
                    <div class="cell-format" style="color: var(--text-secondary);">${item.Type || '.file'}</div>
                    <div style="color: var(--text-secondary);">${formatTime(item.LastOpened)}</div>
                    <div style="text-align: right;"><span class="info-pill">i</span></div>
                `;

                row.querySelector('.item-name-text').addEventListener('click', async () => {
                    await updateDoc(doc(db, "Cloud Drive", item.id), {
                        LastOpened: new Date().toISOString(),
                        LastOpenedBy: userEmail
                    });
                    window.open(item.File, '_blank');
                });

                list.appendChild(row);
            });

        } catch(e) {
            console.error("Home loading error:", e);
        }
    }

    loadRecentFiles();
</script>
</body>
</html>
