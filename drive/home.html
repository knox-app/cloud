<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Cloud Workspace</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --surface-color: #171717;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #262626;
            --hover-bg: #1f1f1f;
            --btn-bg: #ffffff;
            --btn-text: #0d0d0d;
            --accent: #10a37f;
            --sidebar-width: 64px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar */
        aside.sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            flex-shrink: 0;
            background: var(--surface-color);
        }

        .side-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: none;
            transition: 0.15s;
        }
        .side-icon.active, .side-icon:hover {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }
        .side-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

        /* Main Workspace */
        main.content-area {
            flex-grow: 1;
            padding: 36px 48px;
            max-width: 1200px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .btn-pill {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 20px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .section-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        /* Recently Opened Grid */
        .recent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .recent-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .recent-card:hover { transform: translateY(-2px); }

        .card-preview {
            width: 100%;
            height: 120px;
            background: #262626;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-preview img { width: 100%; height: 100%; object-fit: cover; }

        .card-info {
            padding: 14px;
        }
        .card-title {
            font-size: 14px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card-date {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Table Structure */
        .data-table { width: 100%; border-collapse: collapse; }
        .table-head {
            display: grid;
            grid-template-columns: 3fr 2.5fr 1.5fr 1.5fr;
            padding: 12px 16px;
            font-size: 13px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .table-row {
            display: grid;
            grid-template-columns: 3fr 2.5fr 1.5fr 1.5fr;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .table-row:hover { background-color: var(--hover-bg); }

        .file-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }
        .thumb-box {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #262626;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-box svg { width: 16px; height: 16px; stroke: var(--text-secondary); }

        @media(max-width: 768px) {
            aside.sidebar { display: none; }
            main.content-area { padding: 20px 16px; }
            .table-head { display: none; }
            .table-row { grid-template-columns: 1fr auto; gap: 8px; }
            .col-owner, .col-format { display: none; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <a href="home.html" class="side-icon active" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <a href="1.html" class="side-icon" title="Drive Workspace">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    </a>
</aside>

<main class="content-area">
    <div class="top-row">
        <h1 class="page-title">Home</h1>
        <a href="1.html" class="btn-pill">Open Drive</a>
    </div>

    <div class="section-label">Recently Opened</div>
    <div class="recent-grid" id="recentGrid">
        <div style="color: var(--text-secondary); font-size: 13px;">No recent files found.</div>
    </div>

    <div class="section-label">Recent Activity</div>
    <div class="data-table">
        <div class="table-head">
            <div>Name</div>
            <div>Owner</div>
            <div class="col-format">Format</div>
            <div>Opened</div>
        </div>
        <div id="activityList">
            <div style="padding: 16px 0; color: var(--text-secondary); font-size: 13px;">Loading activity...</div>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('active_user')); } catch(e){}
    if(!currentUser) window.location.href = "1.html";

    // Read local recent items log
    let recentLog = [];
    try {
        recentLog = JSON.parse(localStorage.getItem(`recent_opened_${currentUser.Email}`) || '[]');
    } catch(e){}

    const recentGrid = document.getElementById('recentGrid');
    const activityList = document.getElementById('activityList');

    async function renderHome() {
        if (recentLog.length === 0) {
            recentGrid.innerHTML = `<div style="color: var(--text-secondary); font-size: 13px;">No recent files opened yet.</div>`;
            activityList.innerHTML = `<div style="padding: 16px 0; color: var(--text-secondary); font-size: 13px;">No activity logged.</div>`;
            return;
        }

        recentGrid.innerHTML = "";
        activityList.innerHTML = "";

        // Fetch document metadata for up to 6 recently opened files
        for (const item of recentLog.slice(0, 6)) {
            try {
                const snap = await getDoc(doc(db, "Cloud Drive", item.id));
                if (!snap.exists()) continue;
                const data = snap.data();
                const name = data.Name || "Untitled";
                const isImg = (data.Type || "").toLowerCase().includes("img") || (data.Type || "").includes("jpg") || (data.Type || "").includes("png");

                // Render Top Grid Card
                const card = document.createElement('div');
                card.className = 'recent-card';
                card.innerHTML = `
                    <div class="card-preview">
                        ${isImg ? `<img src="${data.File}" alt="preview">` : `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>`}
                    </div>
                    <div class="card-info">
                        <div class="card-title">${name}</div>
                        <div class="card-date">${item.date}</div>
                    </div>
                `;
                card.onclick = () => window.open(data.File, '_blank');
                recentGrid.appendChild(card);

                // Render Table Row
                const row = document.createElement('div');
                row.className = 'table-row';
                row.innerHTML = `
                    <div class="file-cell">
                        <div class="thumb-box">
                            ${isImg ? `<img src="${data.File}">` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>`}
                        </div>
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${name}</span>
                    </div>
                    <div class="col-owner" style="color: var(--text-secondary);">${data.Email}</div>
                    <div class="col-format" style="color: var(--text-secondary);">${data.Type || '.file'}</div>
                    <div style="color: var(--text-secondary); display:flex; align-items:center; gap:6px;">
                        ${item.time} <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#3b82f6;"></span>
                    </div>
                `;
                row.onclick = () => window.open(data.File, '_blank');
                activityList.appendChild(row);
            } catch(e) {
                console.error(e);
            }
        }
    }

    renderHome();
</script>
</body>
</html>
