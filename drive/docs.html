<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cloud Drive — Universal Document Viewer</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SheetJS for Native XLSX / Spreadsheet Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Docx-Preview for Native DOCX Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.1/dist/docx-preview.min.js"></script>

  <!-- Firebase v10 Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glassmorphism {
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    /* Spreadsheet Styles */
    .sheet-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
      color: #e4e4e7;
    }
    .sheet-table th, .sheet-table td {
      border: 1px solid #3f3f46;
      padding: 6px 12px;
      white-space: nowrap;
    }
    .sheet-table th {
      background: #27272a;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    /* DOCX Wrapper */
    .docx-wrapper {
      background: transparent !important;
      padding: 0 !important;
    }
    .docx-wrapper > section.docx {
      background: #ffffff !important;
      color: #18181b !important;
      margin-bottom: 20px !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important;
      border-radius: 8px !important;
      padding: 40px !important;
    }
  </style>
</head>
<body class="bg-[#0c0c0e] text-zinc-100 h-screen w-screen overflow-hidden flex flex-col justify-between">

  <!-- ================= TOP ACTION BAR ================= -->
  <header class="fixed top-0 inset-x-0 z-40 flex items-center justify-between px-4 py-3 glassmorphism border-b border-white/10 shadow-lg">
    <div class="flex items-center gap-3">
      <div id="file-badge" class="px-2.5 py-1 rounded-md text-[11px] font-bold tracking-wider uppercase bg-indigo-600/30 text-indigo-400 border border-indigo-500/30">
        FILE
      </div>
      <div>
        <h1 id="doc-title" class="text-sm font-semibold tracking-wide truncate max-w-[150px] sm:max-w-xs md:max-w-md">Loading...</h1>
        <p id="doc-meta" class="text-xs text-zinc-400 truncate max-w-[150px] sm:max-w-xs"></p>
      </div>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-1.5 sm:gap-2">
      <button id="btn-fullscreen" title="Toggle Fullscreen" class="p-2 rounded-lg hover:bg-white/10 active:scale-95 text-zinc-300 hover:text-white transition">
        <i data-lucide="maximize" class="w-4 h-4"></i>
      </button>
      <button id="btn-download" title="Download Document" class="p-2 rounded-lg hover:bg-white/10 active:scale-95 text-zinc-300 hover:text-white transition">
        <i data-lucide="download" class="w-4 h-4"></i>
      </button>
      <button id="btn-share" title="Share Link" class="p-2 rounded-lg hover:bg-white/10 active:scale-95 text-zinc-300 hover:text-white transition">
        <i data-lucide="share-2" class="w-4 h-4"></i>
      </button>
      <button id="btn-delete" title="Delete Document" class="p-2 rounded-lg hover:bg-red-500/20 active:scale-95 text-zinc-400 hover:text-red-400 transition">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- ================= MAIN VIEWER CONTAINER ================= -->
  <main class="relative flex-1 flex items-center justify-center pt-16 pb-20 px-2 sm:px-6 overflow-hidden">
    
    <!-- Loading Overlay -->
    <div id="loader" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/80 gap-3 backdrop-blur-sm">
      <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
      <p id="loader-text" class="text-xs text-zinc-400 font-medium">Opening document...</p>
    </div>

    <!-- Viewer Screen Slots -->
    <div id="viewer-container" class="w-full h-full max-w-6xl flex items-center justify-center relative overflow-hidden rounded-xl bg-zinc-950/60 border border-white/5 shadow-2xl">
      
      <!-- 1. PDF & Presentation / Web Embed View (PDF, PPTX, fallback) -->
      <iframe id="embed-viewer" class="w-full h-full rounded-xl border-0 hidden" allowfullscreen></iframe>

      <!-- 2. DOCX Native Render Slot -->
      <div id="docx-viewer" class="w-full h-full overflow-y-auto p-4 sm:p-8 hidden"></div>

      <!-- 3. XLSX / Spreadsheet Viewer Slot -->
      <div id="xlsx-viewer" class="w-full h-full flex flex-col hidden">
        <div id="xlsx-table-container" class="flex-1 overflow-auto p-2"></div>
        <div id="xlsx-sheets-bar" class="flex items-center gap-1 px-3 py-1.5 bg-zinc-900 border-t border-zinc-800 overflow-x-auto hide-scrollbar"></div>
      </div>

      <!-- 4. Image Viewer Slot -->
      <div id="image-viewer" class="w-full h-full flex items-center justify-center p-2 hidden">
        <img id="img-display" class="max-h-full max-w-full object-contain rounded-lg shadow-2xl" src="" alt="preview" />
      </div>

    </div>
  </main>

  <!-- ================= BOTTOM RECENT DOCS CAROUSEL ================= -->
  <footer class="fixed bottom-0 inset-x-0 z-40 glassmorphism border-t border-white/10 px-4 py-2.5">
    <div class="max-w-6xl mx-auto flex items-center gap-3">
      <div class="text-[11px] font-semibold text-zinc-400 uppercase tracking-wider hidden sm:block">Documents:</div>
      <div id="thumbnails-container" class="flex items-center gap-2 overflow-x-auto hide-scrollbar flex-1 py-0.5">
        <!-- Document Chips injected dynamically -->
      </div>
    </div>
  </footer>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    // 1. Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
      authDomain: "cloud-computer-4891a.firebaseapp.com",
      projectId: "cloud-computer-4891a",
      storageBucket: "cloud-computer-4891a.firebasestorage.app",
      messagingSenderId: "744203234287",
      appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
      measurementId: "G-QE17C33TMN"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const COLLECTION = "Cloud Drive";

    // App State
    let currentDocId = "";
    let currentData = null;
    let allDocuments = [];

    // DOM References
    const docTitle = document.getElementById("doc-title");
    const docMeta = document.getElementById("doc-meta");
    const fileBadge = document.getElementById("file-badge");
    const loader = document.getElementById("loader");
    const loaderText = document.getElementById("loader-text");
    const thumbContainer = document.getElementById("thumbnails-container");

    const embedViewer = document.getElementById("embed-viewer");
    const docxViewer = document.getElementById("docx-viewer");
    const xlsxViewer = document.getElementById("xlsx-viewer");
    const xlsxTableContainer = document.getElementById("xlsx-table-container");
    const xlsxSheetsBar = document.getElementById("xlsx-sheets-bar");
    const imageViewer = document.getElementById("image-viewer");
    const imgDisplay = document.getElementById("img-display");

    lucide.createIcons();

    // 2. Identify File Format
    function detectFormat(typeField, url) {
      const combined = ((typeField || "") + " " + (url || "")).toLowerCase();
      if (combined.includes(".pdf") || combined.includes("pdf")) return "PDF";
      if (combined.includes(".docx") || combined.includes("docx") || combined.includes("word")) return "DOCX";
      if (combined.includes(".xlsx") || combined.includes(".xls") || combined.includes("spreadsheet") || combined.includes("sheet")) return "XLSX";
      if (combined.includes(".pptx") || combined.includes(".ppt") || combined.includes("presentation") || combined.includes("powerpoint")) return "PPTX";
      if (combined.includes(".png") || combined.includes(".jpg") || combined.includes(".jpeg") || combined.includes(".webp") || combined.includes(".img") || combined.includes("image")) return "IMAGE";
      return "DOC";
    }

    function hideAllViewers() {
      embedViewer.classList.add("hidden");
      embedViewer.src = "";
      docxViewer.classList.add("hidden");
      docxViewer.innerHTML = "";
      xlsxViewer.classList.add("hidden");
      xlsxTableContainer.innerHTML = "";
      xlsxSheetsBar.innerHTML = "";
      imageViewer.classList.add("hidden");
      imgDisplay.src = "";
    }

    // 3. Load and Render Document
    async function loadDocument(id) {
      if (!id) return;
      currentDocId = id;
      window.location.hash = id;
      loader.classList.remove("hidden");
      loaderText.textContent = "Loading file...";
      hideAllViewers();

      try {
        const docSnap = await db.collection(COLLECTION).doc(id).get();
        if (!docSnap.exists) {
          alert(`Document ID: ${id} not found in Firestore.`);
          loader.classList.add("hidden");
          return;
        }

        currentData = docSnap.data();
        const fileUrl = currentData.File;
        const fileType = detectFormat(currentData.Type, fileUrl);

        // Update Headers
        docTitle.textContent = id;
        docMeta.textContent = currentData.Email || "Cloud Storage";
        fileBadge.textContent = fileType;

        setBadgeColor(fileType);
        await renderByFormat(fileType, fileUrl);
      } catch (err) {
        console.error(err);
        alert("Error loading document: " + err.message);
      } finally {
        loader.classList.add("hidden");
        renderThumbnails();
      }
    }

    function setBadgeColor(type) {
      const colors = {
        PDF: "bg-red-500/20 text-red-400 border-red-500/30",
        DOCX: "bg-blue-500/20 text-blue-400 border-blue-500/30",
        XLSX: "bg-emerald-500/20 text-emerald-400 border-emerald-500/30",
        PPTX: "bg-amber-500/20 text-amber-400 border-amber-500/30",
        IMAGE: "bg-purple-500/20 text-purple-400 border-purple-500/30"
      };
      fileBadge.className = `px-2.5 py-1 rounded-md text-[11px] font-bold tracking-wider uppercase border ${colors[type] || colors.PDF}`;
    }

    // 4. Format-Specific Render Engines
    async function renderByFormat(type, url) {
      if (type === "IMAGE") {
        imgDisplay.src = url;
        imageViewer.classList.remove("hidden");
      } 
      else if (type === "DOCX") {
        try {
          loaderText.textContent = "Parsing Word document...";
          const response = await fetch(url);
          const blob = await response.blob();
          docxViewer.classList.remove("hidden");
          await docx.renderAsync(blob, docxViewer);
        } catch (e) {
          console.warn("CORS/Native render failed, using Office viewer fallback:", e);
          renderViaOfficeViewer(url);
        }
      } 
      else if (type === "XLSX") {
        try {
          loaderText.textContent = "Parsing Spreadsheet...";
          const response = await fetch(url);
          const arrayBuffer = await response.arrayBuffer();
          const workbook = XLSX.read(arrayBuffer, { type: "array" });
          
          xlsxViewer.classList.remove("hidden");
          renderSpreadsheet(workbook);
        } catch (e) {
          console.warn("CORS/Native render failed, using Office viewer fallback:", e);
          renderViaOfficeViewer(url);
        }
      } 
      else if (type === "PDF") {
        embedViewer.src = `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`;
        embedViewer.classList.remove("hidden");
      } 
      else if (type === "PPTX") {
        renderViaOfficeViewer(url);
      } 
      else {
        renderViaOfficeViewer(url);
      }
    }

    function renderViaOfficeViewer(url) {
      embedViewer.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
      embedViewer.classList.remove("hidden");
    }

    // Render interactive Excel table with tabs
    function renderSpreadsheet(workbook) {
      xlsxSheetsBar.innerHTML = "";
      
      workbook.SheetNames.forEach((sheetName, index) => {
        const tabBtn = document.createElement("button");
        tabBtn.className = `px-3 py-1 text-xs rounded-md transition font-medium ${
          index === 0 ? "bg-emerald-600 text-white" : "bg-zinc-800 text-zinc-400 hover:text-white"
        }`;
        tabBtn.textContent = sheetName;
        tabBtn.onclick = () => {
          document.querySelectorAll("#xlsx-sheets-bar button").forEach(b => {
            b.className = "px-3 py-1 text-xs rounded-md transition font-medium bg-zinc-800 text-zinc-400 hover:text-white";
          });
          tabBtn.className = "px-3 py-1 text-xs rounded-md transition font-medium bg-emerald-600 text-white";
          displaySheet(workbook.Sheets[sheetName]);
        };
        xlsxSheetsBar.appendChild(tabBtn);
      });

      // Display the first sheet
      displaySheet(workbook.Sheets[workbook.SheetNames[0]]);
    }

    function displaySheet(sheet) {
      const htmlTable = XLSX.utils.sheet_to_html(sheet, { header: "", footer: "" });
      xlsxTableContainer.innerHTML = htmlTable;
      const table = xlsxTableContainer.querySelector("table");
      if (table) table.className = "sheet-table";
    }

    // 5. Fetch Library / Carousel Thumbnails
    async function fetchAllDocuments() {
      try {
        const snap = await db.collection(COLLECTION).get();
        allDocuments = [];
        snap.forEach(d => allDocuments.push({ id: d.id, ...d.data() }));
        renderThumbnails();
      } catch (err) {
        console.error("Fetch library error:", err);
      }
    }

    function renderThumbnails() {
      thumbContainer.innerHTML = "";
      allDocuments.forEach(doc => {
        const type = detectFormat(doc.Type, doc.File);
        const isActive = doc.id === currentDocId;
        const chip = document.createElement("button");
        chip.className = `flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs font-medium transition-all ${
          isActive 
            ? "bg-white/15 border-indigo-500 text-white scale-105 shadow-md" 
            : "bg-white/5 border-white/5 text-zinc-400 hover:text-white hover:bg-white/10"
        }`;
        
        let iconName = "file-text";
        if (type === "PDF") iconName = "file";
        if (type === "XLSX") iconName = "table";
        if (type === "PPTX") iconName = "presentation";
        if (type === "IMAGE") iconName = "image";

        chip.innerHTML = `<i data-lucide="${iconName}" class="w-3.5 h-3.5"></i><span class="truncate max-w-[90px]">${doc.id}</span>`;
        chip.onclick = () => loadDocument(doc.id);
        thumbContainer.appendChild(chip);
      });
      lucide.createIcons();
    }

    // 6. Action Bar Features
    document.getElementById("btn-download").addEventListener("click", () => {
      if (currentData?.File) {
        const a = document.createElement("a");
        a.href = currentData.File;
        a.target = "_blank";
        a.download = currentDocId;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    });

    document.getElementById("btn-share").addEventListener("click", async () => {
      if (navigator.share) {
        await navigator.share({
          title: `Document: ${currentDocId}`,
          url: window.location.href,
        });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("Share link copied to clipboard!");
      }
    });

    document.getElementById("btn-fullscreen").addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    document.getElementById("btn-delete").addEventListener("click", async () => {
      if (confirm(`Delete document "${currentDocId}" from Cloud Drive?`)) {
        try {
          await db.collection(COLLECTION).doc(currentDocId).delete();
          alert("Deleted successfully.");
          location.reload();
        } catch (e) {
          alert("Failed to delete: " + e.message);
        }
      }
    });

    // 7. Initial Startup
    function getDocIdFromURL() {
      return window.location.hash.replace("#", "").trim() || "p7543LtVQA49lB6L3mvO";
    }

    window.addEventListener("hashchange", () => loadDocument(getDocIdFromURL()));
    window.addEventListener("DOMContentLoaded", () => {
      fetchAllDocuments();
      loadDocument(getDocIdFromURL());
    });
  </script>
</body>
</html>
