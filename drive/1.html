<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Drive - Knowledge Base</title>
    <style>
        :root {
            --bg-color: #f9fafb;
            --surface-color: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --hover-color: #f3f4f6;
            --btn-bg: #111827;
            --btn-text: #ffffff;
            --accent: #2563eb;
            --badge-green-bg: #ecfdf5;
            --badge-green-text: #059669;
            --danger: #ef4444;
            --shadow-popup: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        body.dark {
            --bg-color: #09090b;
            --surface-color: #121214;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #27272a;
            --hover-color: #18181b;
            --btn-bg: #fafafa;
            --btn-text: #09090b;
            --accent: #3b82f6;
            --badge-green-bg: #064e3b;
            --badge-green-text: #34d399;
            --danger: #f87171;
            --shadow-popup: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
        }

        /* Top Header */
        header {
            background: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .user-info { font-size: 13px; color: var(--text-secondary); }

        .btn-ui {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .container {
            max-width: 1000px;
            margin: 24px auto;
            padding: 0 16px;
        }

        /* Navigation & Action Bar */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .breadcrumbs {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .breadcrumb-link { cursor: pointer; color: var(--text-secondary); text-decoration: none; }
        .breadcrumb-link:hover { color: var(--text-primary); }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        /* View Layout Toggle */
        .layout-toggle {
            display: flex;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .layout-btn {
            background: none;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .layout-btn.active {
            background: var(--hover-color);
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Files Table (Linear View) */
        .files-table-container {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: visible;
        }

        .table-header {
            display: grid;
            grid-template-columns: 3fr 1fr 1fr 1fr 40px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .file-row {
            display: grid;
            grid-template-columns: 3fr 1fr 1fr 1fr 40px;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            transition: background 0.15s;
        }

        .file-row:last-child { border-bottom: none; }
        .file-row:hover { background: var(--hover-color); }

        .col-name {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            font-weight: 500;
            font-size: 14px;
        }

        .file-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
            overflow: hidden;
        }

        .file-icon img { width: 100%; height: 100%; object-fit: cover; }

        .name-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }

        .col-size, .col-added { font-size: 13px; color: var(--text-secondary); }

        .status-pill {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: var(--badge-green-bg);
            color: var(--badge-green-text);
            width: fit-content;
        }

        /* 3-Dots Dropdown */
        .col-actions { position: relative; text-align: right; }
        .dots-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 6px;
        }
        .dots-btn:hover { background: var(--border-color); color: var(--text-primary); }

        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 32px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-popup);
            width: 170px;
            z-index: 100;
            display: none;
            padding: 6px 0;
        }

        .dropdown-menu.active { display: block; }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            font-size: 13px;
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s;
        }

        .dropdown-item:hover { background: var(--hover-color); }
        .dropdown-item.danger { color: var(--danger); }

        /* Grid View Alternative */
        .items-grid-view {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .grid-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .grid-card .item-preview {
            height: 120px;
            border-radius: 8px;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            overflow: hidden;
            font-size: 32px;
        }

        .grid-card .item-preview img { width: 100%; height: 100%; object-fit: cover; }

        /* Custom Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 16px;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .modal-overlay.active { visibility: visible; opacity: 1; }

        .modal {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow-popup);
        }

        .modal h3 { margin: 0 0 16px 0; font-size: 17px; }
        .modal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            display: none;
            z-index: 300;
        }

        @media (max-width: 640px) {
            .table-header, .col-size, .col-added { display: none; }
            .file-row { grid-template-columns: 1fr auto 40px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-title">
        <span>⚙️</span> Knowledge Base
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
        <span class="user-info" id="userDisplay">Loading...</span>
        <button class="btn-ui" id="logoutBtn" style="background: transparent; color: var(--text-primary); border: 1px solid var(--border-color);">Sign Out</button>
    </div>
</header>

<div class="container">
    <div class="nav-bar">
        <div class="breadcrumbs" id="breadcrumbs">
            <span class="breadcrumb-link" id="navRoot">Knowledge base</span>
        </div>

        <div style="display: flex; gap: 8px;">
            <div class="layout-toggle">
                <button class="layout-btn active" id="btnList">☰ List</button>
                <button class="layout-btn" id="btnGrid">⊞ Grid</button>
            </div>
            <button class="btn-ui" id="newFolderBtn" style="background: transparent; color: var(--text-primary); border: 1px solid var(--border-color);">+ New Folder</button>
            <a href="upload.html" class="btn-ui">↑ Upload</a>
        </div>
    </div>

    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search files...">
    </div>

    <!-- Table View (Default Linear) -->
    <div class="files-table-container" id="tableView">
        <div class="table-header">
            <div>Name</div>
            <div>Size</div>
            <div>Status</div>
            <div>Added</div>
            <div></div>
        </div>
        <div id="tableBody"></div>
    </div>

    <!-- Grid View -->
    <div class="items-grid-view" id="gridView"></div>
</div>

<!-- Modal: Rename -->
<div class="modal-overlay" id="renameModal">
    <div class="modal">
        <h3>Rename Item</h3>
        <input type="text" id="renameInput" class="modal-input">
        <div class="modal-actions">
            <button class="btn-ui" id="closeRenameModal" style="background: transparent; color: var(--text-primary); border: 1px solid var(--border-color);">Cancel</button>
            <button class="btn-ui" id="submitRename">Save</button>
        </div>
    </div>
</div>

<!-- Modal: Shift to Folder -->
<div class="modal-overlay" id="shiftModal">
    <div class="modal">
        <h3>Shift to Folder</h3>
        <select id="shiftFolderSelect" class="modal-input"></select>
        <div class="modal-actions">
            <button class="btn-ui" id="closeShiftModal" style="background: transparent; color: var(--text-primary); border: 1px solid var(--border-color);">Cancel</button>
            <button class="btn-ui" id="submitShift">Shift</button>
        </div>
    </div>
</div>

<!-- Modal: New Folder -->
<div class="modal-overlay" id="folderModal">
    <div class="modal">
        <h3>Create New Folder</h3>
        <input type="text" id="newFolderNameInput" class="modal-input" placeholder="Folder name...">
        <div class="modal-actions">
            <button class="btn-ui" id="closeFolderModal" style="background: transparent; color: var(--text-primary); border: 1px solid var(--border-color);">Cancel</button>
            <button class="btn-ui" id="submitNewFolder">Create</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getFirestore, collection, query, where, getDocs, 
        doc, updateDoc, deleteDoc, addDoc, arrayUnion, arrayRemove 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.body.classList.add("dark");
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2500);
    }

    // Auth verification
    let currentUser = null;
    try {
        currentUser = JSON.parse(localStorage.getItem('active_user'));
    } catch(e) {}

    if (!currentUser || !currentUser.Email) {
        window.location.href = "1.html";
    }
    const userEmail = currentUser.Email;
    document.getElementById('userDisplay').innerText = userEmail;

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('active_user');
        window.location.reload();
    });

    // Close any open 3-dots dropdown when clicking outside
    window.addEventListener('click', (e) => {
        if (!e.target.classList.contains('dots-btn')) {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('active'));
        }
    });

    // View States
    let currentFolderId = null;
    let currentFolderName = "";
    let isGridView = false;
    let allFolders = [];
    let currentLoadedFiles = [];

    // Layout Toggle
    const btnList = document.getElementById('btnList');
    const btnGrid = document.getElementById('btnGrid');
    const tableView = document.getElementById('tableView');
    const gridView = document.getElementById('gridView');

    btnList.addEventListener('click', () => switchLayout(false));
    btnGrid.addEventListener('click', () => switchLayout(true));

    function switchLayout(grid) {
        isGridView = grid;
        if (grid) {
            btnGrid.classList.add('active');
            btnList.classList.remove('active');
            tableView.style.display = 'none';
            gridView.style.display = 'grid';
        } else {
            btnList.classList.add('active');
            btnGrid.classList.remove('active');
            tableView.style.display = 'block';
            gridView.style.display = 'none';
        }
    }

    // Breadcrumbs
    const breadcrumbs = document.getElementById('breadcrumbs');
    function updateBreadcrumbs() {
        if (!currentFolderId) {
            breadcrumbs.innerHTML = `<span>Knowledge base</span>`;
        } else {
            breadcrumbs.innerHTML = `
                <span class="breadcrumb-link" id="navHome">Knowledge base</span>
                <span style="color: var(--text-secondary)">/</span>
                <span>${currentFolderName}</span>
            `;
            document.getElementById('navHome').addEventListener('click', () => {
                currentFolderId = null;
                currentFolderName = "";
                loadDrive();
            });
        }
    }

    // Data Fetching
    async function loadDrive() {
        updateBreadcrumbs();
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = `<div style="padding: 20px; color: var(--text-secondary);">Loading records...</div>`;
        gridView.innerHTML = '';

        try {
            const q = query(collection(db, "Cloud Drive"), where("Email", "==", userEmail));
            const snapshot = await getDocs(q);

            const folders = [];
            const files = [];

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (data.Folder === "True") {
                    folders.push({ id: docSnap.id, ...data });
                } else {
                    files.push({ id: docSnap.id, ...data });
                }
            });

            allFolders = folders;
            currentLoadedFiles = files;
            tableBody.innerHTML = '';

            let itemsToRender = [];

            if (currentFolderId === null) {
                // Root: Folders + Standalone Files
                const folderAssignedFiles = new Set();
                folders.forEach(f => {
                    if (Array.isArray(f.Files)) f.Files.forEach(id => folderAssignedFiles.add(id));
                });
                
                itemsToRender = [
                    ...folders.map(f => ({ ...f, isFolder: true })),
                    ...files.filter(file => !folderAssignedFiles.has(file.id)).map(f => ({ ...f, isFolder: false }))
                ];
            } else {
                // Inside Folder
                const activeFolder = folders.find(f => f.id === currentFolderId);
                const fileIds = (activeFolder && Array.isArray(activeFolder.Files)) ? activeFolder.Files : [];
                itemsToRender = files.filter(f => fileIds.includes(f.id)).map(f => ({ ...f, isFolder: false, insideFolder: true }));
            }

            if (itemsToRender.length === 0) {
                tableBody.innerHTML = `<div style="padding: 24px; text-align: center; color: var(--text-secondary);">No items available</div>`;
                return;
            }

            itemsToRender.forEach(item => renderRow(item));
        } catch (err) {
            console.error("Load failed:", err);
            tableBody.innerHTML = `<div style="padding: 20px; color: var(--danger);">Failed to load data</div>`;
        }
    }

    // Render Row & Grid Card
    function renderRow(item) {
        const tableBody = document.getElementById('tableBody');
        const isFolder = item.isFolder;
        const displayName = item.Name || (item.File ? item.File.split('/').pop() : "Untitled");
        const type = (item.Type || (isFolder ? "folder" : ".file")).toLowerCase();
        const isImg = type === '.img' || ['.png', '.jpg', '.jpeg', '.gif', '.webp'].includes(type);

        const iconHtml = isFolder ? '📁' : (isImg ? `<img src="${item.File}" alt="thumb">` : '📄');

        // Linear Row
        const row = document.createElement('div');
        row.className = 'file-row';
        row.innerHTML = `
            <div class="col-name">
                <div class="file-icon">${iconHtml}</div>
                <div class="name-text" title="${displayName}">${displayName}</div>
            </div>
            <div class="col-size">${isFolder ? `${(item.Files || []).length} items` : '127 KB'}</div>
            <div class="col-status"><span class="status-pill">Ready</span></div>
            <div class="col-added">Now</div>
            <div class="col-actions">
                <button class="dots-btn">···</button>
                <div class="dropdown-menu">
                    ${!isFolder ? `<div class="dropdown-item opt-download">📥 Download</div>` : ''}
                    <div class="dropdown-item opt-rename">✏️ Rename</div>
                    ${!isFolder ? `<div class="dropdown-item opt-shift">📁 ${item.insideFolder ? 'Remove from Folder' : 'Shift to folder'}</div>` : ''}
                    ${!isFolder ? `<div class="dropdown-item opt-share">🔗 Share</div>` : ''}
                    <div class="dropdown-item danger opt-delete">🗑️ Delete</div>
                </div>
            </div>
        `;

        // Grid Card
        const card = document.createElement('div');
        card.className = 'grid-card';
        card.innerHTML = `
            <div class="item-preview">${iconHtml}</div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="name-text" style="font-weight: 600; font-size: 14px;">${displayName}</div>
                <div class="col-actions">
                    <button class="dots-btn">···</button>
                    <div class="dropdown-menu">
                        ${!isFolder ? `<div class="dropdown-item opt-download">📥 Download</div>` : ''}
                        <div class="dropdown-item opt-rename">✏️ Rename</div>
                        ${!isFolder ? `<div class="dropdown-item opt-shift">📁 ${item.insideFolder ? 'Remove from Folder' : 'Shift to folder'}</div>` : ''}
                        ${!isFolder ? `<div class="dropdown-item opt-share">🔗 Share</div>` : ''}
                        <div class="dropdown-item danger opt-delete">🗑️ Delete</div>
                    </div>
                </div>
            </div>
            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 6px;">
                ${isFolder ? `${(item.Files || []).length} items` : 'Ready'}
            </div>
        `;

        // Attach action events for both Table & Grid elements
        [row, card].forEach(el => {
            const dotsBtn = el.querySelector('.dots-btn');
            const menu = el.querySelector('.dropdown-menu');

            dotsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.dropdown-menu').forEach(m => m !== menu && m.classList.remove('active'));
                menu.classList.toggle('active');
            });

            if (isFolder) {
                el.querySelector('.col-name, .item-preview').addEventListener('click', () => {
                    currentFolderId = item.id;
                    currentFolderName = item.Name;
                    loadDrive();
                });
            }

            // 1. Download
            const btnDownload = el.querySelector('.opt-download');
            if (btnDownload) {
                btnDownload.addEventListener('click', () => {
                    window.open(item.File, '_blank');
                    showToast("Download started");
                });
            }

            // 2. Rename
            el.querySelector('.opt-rename').addEventListener('click', () => {
                openRenameModal(item);
            });

            // 3. Shift
            const btnShift = el.querySelector('.opt-shift');
            if (btnShift) {
                btnShift.addEventListener('click', async () => {
                    if (item.insideFolder) {
                        await updateDoc(doc(db, "Cloud Drive", currentFolderId), {
                            Files: arrayRemove(item.id)
                        });
                        showToast("Removed from folder");
                        loadDrive();
                    } else {
                        openShiftModal(item.id);
                    }
                });
            }

            // 4. Share
            const btnShare = el.querySelector('.opt-share');
            if (btnShare) {
                btnShare.addEventListener('click', () => {
                    navigator.clipboard.writeText(item.File).then(() => {
                        showToast("Link copied to clipboard!");
                    });
                });
            }

            // 5. Delete
            el.querySelector('.opt-delete').addEventListener('click', async () => {
                if (confirm(`Delete ${isFolder ? 'folder' : 'file'} permanently?`)) {
                    await deleteDoc(doc(db, "Cloud Drive", item.id));
                    showToast("Deleted successfully");
                    loadDrive();
                }
            });
        });

        tableBody.appendChild(row);
        gridView.appendChild(card);
    }

    // Modal Operations
    let activeRenameItem = null;
    const renameModal = document.getElementById('renameModal');
    const renameInput = document.getElementById('renameInput');

    function openRenameModal(item) {
        activeRenameItem = item;
        renameInput.value = item.Name || item.File.split('/').pop();
        renameModal.classList.add('active');
    }

    document.getElementById('closeRenameModal').addEventListener('click', () => renameModal.classList.remove('active'));
    document.getElementById('submitRename').addEventListener('click', async () => {
        const newName = renameInput.value.trim();
        if (newName && activeRenameItem) {
            await updateDoc(doc(db, "Cloud Drive", activeRenameItem.id), { Name: newName });
            renameModal.classList.remove('active');
            showToast("Renamed successfully");
            loadDrive();
        }
    });

    // Shift Modal
    let activeShiftFileId = null;
    const shiftModal = document.getElementById('shiftModal');
    const shiftFolderSelect = document.getElementById('shiftFolderSelect');

    function openShiftModal(fileId) {
        activeShiftFileId = fileId;
        shiftFolderSelect.innerHTML = "";
        if (allFolders.length === 0) {
            showToast("No folders available. Create one first.");
            return;
        }
        allFolders.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f.id;
            opt.innerText = f.Name;
            shiftFolderSelect.appendChild(opt);
        });
        shiftModal.classList.add('active');
    }

    document.getElementById('closeShiftModal').addEventListener('click', () => shiftModal.classList.remove('active'));
    document.getElementById('submitShift').addEventListener('click', async () => {
        const targetId = shiftFolderSelect.value;
        if (targetId && activeShiftFileId) {
            await updateDoc(doc(db, "Cloud Drive", targetId), {
                Files: arrayUnion(activeShiftFileId)
            });
            shiftModal.classList.remove('active');
            showToast("Shifted to folder");
            loadDrive();
        }
    });

    // Create Folder Modal
    const folderModal = document.getElementById('folderModal');
    const newFolderNameInput = document.getElementById('newFolderNameInput');

    document.getElementById('newFolderBtn').addEventListener('click', () => {
        newFolderNameInput.value = "";
        folderModal.classList.add('active');
    });

    document.getElementById('closeFolderModal').addEventListener('click', () => folderModal.classList.remove('active'));
    document.getElementById('submitNewFolder').addEventListener('click', async () => {
        const name = newFolderNameInput.value.trim();
        if (name) {
            await addDoc(collection(db, "Cloud Drive"), {
                Email: userEmail,
                Folder: "True",
                Name: name,
                Files: []
            });
            folderModal.classList.remove('active');
            showToast(`Folder created: ${name}`);
            loadDrive();
        }
    });

    // Live Search Filter
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.file-row').forEach(row => {
            const text = row.querySelector('.name-text').innerText.toLowerCase();
            row.style.display = text.includes(val) ? 'grid' : 'none';
        });
        document.querySelectorAll('.grid-card').forEach(card => {
            const text = card.querySelector('.name-text').innerText.toLowerCase();
            card.style.display = text.includes(val) ? 'flex' : 'none';
        });
    });

    loadDrive();
</script>
</body>
</html>
