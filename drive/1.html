<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge base</title>
    <!-- jsPDF for Image to PDF conversion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- JSZip for multi-file batch downloading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #f3f4f6;
            --hover-bg: #f9fafb;
            --btn-dark-bg: #0d0d0d;
            --btn-dark-text: #ffffff;
            --accent: #10a37f;
            --accent-soft: rgba(16, 163, 127, 0.1);
            --danger: #ef4444;
            --sidebar-width: 64px;
        }

        body.dark {
            --bg-color: #0d0d0d;
            --surface-color: #171717;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #262626;
            --hover-bg: #1f1f1f;
            --btn-dark-bg: #ffffff;
            --btn-dark-text: #0d0d0d;
            --accent: #10a37f;
            --accent-soft: rgba(16, 163, 127, 0.2);
            --danger: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Minimal Sidebar */
        aside.sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            flex-shrink: 0;
            background: var(--surface-color);
        }

        .side-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .side-icon:hover, .side-icon.active {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }
        .side-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

        /* Main Viewport */
        main.content-area {
            flex-grow: 1;
            padding: 32px 40px;
            max-width: 1280px;
            position: relative;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .breadcrumbs {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .breadcrumb-node {
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.15s;
        }
        .breadcrumb-node:hover { color: var(--text-primary); }
        .breadcrumb-node.current { color: var(--text-primary); cursor: default; }

        .btn-pill {
            background-color: var(--btn-dark-bg);
            color: var(--btn-dark-text);
            border: none;
            padding: 9px 18px;
            border-radius: 9999px;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn-pill:hover { opacity: 0.9; }

        /* Multi-selection Floating Action Bar */
        .batch-action-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            border-radius: 9999px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 400;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .batch-action-bar.active {
            transform: translateX(-50%) translateY(0);
        }
        .batch-counter {
            font-size: 13px;
            font-weight: 600;
            padding-right: 8px;
            border-right: 1px solid var(--border-color);
        }

        /* Search input bar */
        .search-container {
            position: relative;
            max-width: 360px;
            margin-bottom: 20px;
        }
        .search-container svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            fill: none;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            user-select: text;
        }

        /* Drag & Drop Full Page Overlay */
        .drag-overlay {
            position: fixed;
            inset: 0;
            background: rgba(16, 163, 127, 0.08);
            border: 2px dashed var(--accent);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }
        .drag-overlay.active { display: flex; }
        .drag-overlay-card {
            background: var(--surface-color);
            padding: 24px 36px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Data Table Grid Layout */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .table-head {
            display: grid;
            grid-template-columns: 36px 3.5fr 1.5fr 1fr 1fr 40px;
            padding: 12px 16px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .table-row {
            display: grid;
            grid-template-columns: 36px 3.5fr 1.5fr 1fr 1fr 40px;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            transition: background-color 0.15s;
            cursor: pointer;
            border-radius: 8px;
        }
        .table-row:hover { background-color: var(--hover-bg); }
        .table-row.selected {
            background-color: var(--accent-soft);
        }

        .checkbox-cell input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }

        .file-title-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            white-space: nowrap;
        }
        .file-icon-box {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--hover-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--text-secondary);
        }
        .file-icon-box svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; }
        .file-icon-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

        .file-info-col {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .file-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .label-tags-row {
            display: flex;
            gap: 4px;
            margin-top: 3px;
        }
        .label-pill {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 600;
            background: var(--border-color);
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* Action Dropdown Menu */
        .actions-cell { position: relative; text-align: right; }
        .btn-dots {
            background: none;
            border: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-dots:hover { color: var(--text-primary); background: var(--border-color); }
        .btn-dots svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        .action-dropdown {
            position: absolute;
            right: 0;
            top: 32px;
            background: var(--surface-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            border-radius: 12px;
            width: 190px;
            padding: 6px 0;
            z-index: 200;
            display: none;
            border: 1px solid var(--border-color);
        }
        .action-dropdown.active { display: block; }
        .dropdown-item {
            padding: 9px 14px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .dropdown-item:hover { background: var(--hover-bg); }
        .dropdown-item.danger { color: var(--danger); }
        .dropdown-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

        /* Minimal Borderless Modals */
        .modal-shade {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 16px;
        }
        .modal-shade.active { visibility: visible; opacity: 1; }

        .modal-box {
            background: var(--surface-color);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 28px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title { font-size: 17px; font-weight: 600; }
        .modal-close { background: none; border: none; cursor: pointer; color: var(--text-secondary); }
        .modal-close svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .clean-input {
            width: 100%;
            padding: 11px 14px;
            background: var(--hover-bg);
            border: none;
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            user-select: text;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 12px;
            font-size: 13px;
            padding: 8px 0;
        }
        .details-grid div:nth-child(odd) { color: var(--text-secondary); font-weight: 500; }

        /* Toast Feedback */
        .toast-popup {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 9999px;
            font-size: 13px;
            display: none;
            z-index: 2000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* Mobile / Tab Responsiveness */
        @media (max-width: 768px) {
            aside.sidebar { display: none; }
            main.content-area { padding: 18px 12px; width: 100%; }
            .table-head { display: none; }
            .table-row {
                grid-template-columns: 32px 1fr 30px;
                gap: 8px;
                padding: 12px 6px;
            }
            .cell-format, .cell-password { display: none; }
            .batch-action-bar { width: 92%; justify-content: space-around; padding: 10px 14px; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="side-icon active" title="Knowledge Base">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    </div>
    <div class="side-icon" id="logoutSideBtn" title="Sign Out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </div>
</aside>

<!-- Drag Overlay -->
<div class="drag-overlay" id="dragOverlay">
    <div class="drag-overlay-card">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span>Drop files here to upload to this directory</span>
    </div>
</div>

<main class="content-area">
    <div class="top-row">
        <div class="breadcrumbs" id="breadcrumbArea">
            <span class="breadcrumb-node current">Knowledge base</span>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-pill" id="uploadTriggerBtn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Upload
            </button>
            <button class="btn-pill" id="newFolderTriggerBtn" style="background: var(--hover-bg); color: var(--text-primary);">
                + Folder
            </button>
        </div>
    </div>

    <!-- Hidden Native File Picker -->
    <input type="file" id="nativeFileInput" multiple style="display: none;">

    <div class="search-container">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search files & folders...">
    </div>

    <!-- Main Table -->
    <div class="data-table">
        <div class="table-head">
            <div class="checkbox-cell"><input type="checkbox" id="selectAllCheckbox"></div>
            <div>Name</div>
            <div>Uploaded by</div>
            <div class="cell-format">Format</div>
            <div class="cell-password">Password</div>
            <div></div>
        </div>
        <div id="tableContent">
            <div style="padding: 24px 0; color: var(--text-secondary); font-size: 14px;">Loading workspace...</div>
        </div>
    </div>
</main>

<!-- Floating Multi-Select Batch Bar -->
<div class="batch-action-bar" id="batchActionBar">
    <span class="batch-counter" id="batchCountText">0 selected</span>
    <button class="btn-pill" id="batchDownloadBtn" style="padding: 6px 12px; font-size: 12px;">Download (ZIP)</button>
    <button class="btn-pill" id="batchLabelBtn" style="padding: 6px 12px; font-size: 12px; background: var(--hover-bg); color: var(--text-primary);">Label</button>
    <button class="btn-pill" id="batchMoveBtn" style="padding: 6px 12px; font-size: 12px; background: var(--hover-bg); color: var(--text-primary);">Move</button>
    <button class="btn-pill" id="batchDeleteBtn" style="padding: 6px 12px; font-size: 12px; background: var(--danger); color: #fff;">Delete</button>
</div>

<!-- Modal: Rename Item -->
<div class="modal-shade" id="renameModal">
    <div class="modal-box" style="max-width: 400px;">
        <div class="modal-header">
            <div class="modal-title">Rename</div>
            <button class="modal-close" data-close="renameModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group">
            <input type="text" id="renameInput" class="clean-input">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-pill" id="btnSaveRename">Save</button>
        </div>
    </div>
</div>

<!-- Modal: Apply Labels -->
<div class="modal-shade" id="labelModal">
    <div class="modal-box" style="max-width: 400px;">
        <div class="modal-header">
            <div class="modal-title">Add / Edit Labels</div>
            <button class="modal-close" data-close="labelModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group">
            <label>Comma separated tags</label>
            <input type="text" id="labelInput" class="clean-input" placeholder="e.g. Work, Finance, Review">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-pill" id="btnSaveLabel">Save Labels</button>
        </div>
    </div>
</div>

<!-- Modal: Item Details -->
<div class="modal-shade" id="detailsModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Item Details</div>
            <button class="modal-close" data-close="detailsModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="details-grid" id="detailsContent"></div>
    </div>
</div>

<!-- Modal: Move To Folder -->
<div class="modal-shade" id="moveModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Move to Destination</div>
            <button class="modal-close" data-close="moveModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group">
            <label>Select Destination Directory</label>
            <select id="moveTargetSelect" class="clean-input"></select>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-pill" id="btnSaveMove">Move Here</button>
        </div>
    </div>
</div>

<!-- Modal: New Nested Folder -->
<div class="modal-shade" id="folderModal">
    <div class="modal-box" style="max-width: 400px;">
        <div class="modal-header">
            <div class="modal-title">Create Folder</div>
            <button class="modal-close" data-close="folderModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group">
            <label>Folder Name</label>
            <input type="text" id="newFolderName" class="clean-input" placeholder="e.g. Invoices">
        </div>
        <div class="input-group">
            <label>Folder Password (Optional)</label>
            <input type="text" id="newFolderPassword" class="clean-input" placeholder="Lock folder with password">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-pill" id="btnCreateFolder">Create</button>
        </div>
    </div>
</div>

<!-- Password Unlock Modal -->
<div class="modal-shade" id="passAuthModal">
    <div class="modal-box" style="max-width: 360px;">
        <div class="modal-header">
            <div class="modal-title">Enter Password</div>
            <button class="modal-close" data-close="passAuthModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group">
            <input type="password" id="authPasswordInput" class="clean-input" placeholder="Password">
        </div>
        <div style="display: flex; justify-content: flex-end;">
            <button class="btn-pill" id="btnSubmitUnlock">Unlock</button>
        </div>
    </div>
</div>

<div class="toast-popup" id="toastPopup"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getFirestore, collection, query, where, getDocs, or,
        doc, updateDoc, deleteDoc, addDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const IMGBB_API_KEY = "80c452b9a4b80f240ada316f23078d2c";
    const UPLOADCARE_PUB_KEY = "demopublickey";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Dark Mode Match
    if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.body.classList.add("dark");
    }

    // Auth State Check
    let currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('active_user')); } catch(e){}
    if (!currentUser || !currentUser.Email) {
        window.location.href = "1.html";
    }
    const userEmail = currentUser.Email;

    document.getElementById('logoutSideBtn').addEventListener('click', () => {
        localStorage.removeItem('active_user');
        window.location.reload();
    });

    function showToast(msg) {
        const t = document.getElementById('toastPopup');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 2500);
    }

    // SVGs
    const SVG = {
        folder: `<svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`,
        image: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`,
        pdf: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>`,
        doc: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`,
        dots: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>`,
        trash: `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`,
        edit: `<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
        download: `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`,
        tag: `<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>`,
        move: `<svg viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>`,
        info: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`
    };

    function getFormatInfo(typeStr, isFolder) {
        if (isFolder) return { label: "Folder", icon: SVG.folder };
        const t = (typeStr || "").toLowerCase();
        if (t.includes("img") || t.includes("png") || t.includes("jpg") || t.includes("jpeg")) return { label: "Image", icon: SVG.image };
        if (t.includes("pdf")) return { label: "PDF", icon: SVG.pdf };
        return { label: "Document", icon: SVG.doc };
    }

    // Hierarchical Folder Navigation State
    let folderHierarchy = [{ id: null, name: "Knowledge base" }];
    let allUserItems = [];
    let selectedItemIds = new Set();

    function getCurrentFolderId() {
        return folderHierarchy[folderHierarchy.length - 1].id;
    }

    function renderBreadcrumbs() {
        const bar = document.getElementById('breadcrumbArea');
        bar.innerHTML = "";
        folderHierarchy.forEach((node, index) => {
            const isLast = index === folderHierarchy.length - 1;
            const span = document.createElement('span');
            span.className = `breadcrumb-node ${isLast ? 'current' : ''}`;
            span.innerText = node.name;
            if (!isLast) {
                span.addEventListener('click', () => {
                    folderHierarchy = folderHierarchy.slice(0, index + 1);
                    selectedItemIds.clear();
                    updateBatchBar();
                    loadDrive();
                });
            }
            bar.appendChild(span);
            if (!isLast) {
                const sep = document.createElement('span');
                sep.style.color = "var(--text-secondary)";
                sep.innerText = "/";
                bar.appendChild(sep);
            }
        });
    }

    // Modal Manager
    document.querySelectorAll('[data-close]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.getElementById(btn.getAttribute('data-close')).classList.remove('active');
        });
    });

    // Load Database Records
    async function loadDrive() {
        renderBreadcrumbs();
        const container = document.getElementById('tableContent');
        container.innerHTML = `<div style="padding: 24px 0; color: var(--text-secondary); font-size: 14px;">Loading contents...</div>`;

        try {
            const q = query(
                collection(db, "Cloud Drive"),
                or(
                    where("Email", "==", userEmail),
                    where("Access.Viewer", "array-contains", userEmail),
                    where("Access.Commentator", "array-contains", userEmail),
                    where("Access.Editor", "array-contains", userEmail)
                )
            );
            const snap = await getDocs(q);
            allUserItems = [];
            snap.forEach(docSnap => {
                allUserItems.push({ id: docSnap.id, ...docSnap.data() });
            });

            container.innerHTML = "";
            const currId = getCurrentFolderId();

            // Filter items by parent folder
            const currentViewItems = allUserItems.filter(item => {
                const p = item.parentId || null;
                return p === currId;
            });

            if (currentViewItems.length === 0) {
                container.innerHTML = `<div style="padding: 36px 0; color: var(--text-secondary); font-size: 14px;">No files or folders in this directory.</div>`;
                return;
            }

            // Sort: folders first, then files
            currentViewItems.sort((a,b) => (b.Folder === "True") - (a.Folder === "True"));
            currentViewItems.forEach(item => renderRow(item));
        } catch (e) {
            console.error(e);
            container.innerHTML = `<div style="padding: 20px 0; color: var(--danger);">Failed to load workspace.</div>`;
        }
    }

    function renderRow(item) {
        const container = document.getElementById('tableContent');
        const isFolder = item.Folder === "True";
        const name = item.Name || (item.File ? item.File.split('/').pop() : 'Untitled');
        const format = getFormatInfo(item.Type, isFolder);
        const labels = Array.isArray(item.Labels) ? item.Labels : [];

        const row = document.createElement('div');
        row.className = 'table-row';
        row.id = `row-${item.id}`;

        const isChecked = selectedItemIds.has(item.id);
        if (isChecked) row.classList.add('selected');

        const labelsHtml = labels.map(l => `<span class="label-pill">${l}</span>`).join('');

        row.innerHTML = `
            <div class="checkbox-cell">
                <input type="checkbox" class="row-checkbox" ${isChecked ? 'checked' : ''}>
            </div>
            <div class="file-title-cell">
                <div class="file-icon-box">${format.icon}</div>
                <div class="file-info-col">
                    <span class="file-name" title="${name}">${name}</span>
                    <div class="label-tags-row">${labelsHtml}</div>
                </div>
            </div>
            <div style="font-size: 13px; color: var(--text-secondary);">${item.Email}</div>
            <div class="cell-format" style="font-size: 13px; color: var(--text-secondary);">${format.label}</div>
            <div class="cell-password" style="font-size: 13px; color: var(--text-secondary);">${item.Password ? '🔒 Protected' : 'None'}</div>
            <div class="actions-cell">
                <button class="btn-dots">${SVG.dots}</button>
                <div class="action-dropdown">
                    <div class="dropdown-item act-rename">${SVG.edit} Rename</div>
                    <div class="dropdown-item act-download">${SVG.download} Download</div>
                    <div class="dropdown-item act-label">${SVG.tag} Add Label</div>
                    <div class="dropdown-item act-move">${SVG.move} Move to...</div>
                    <div class="dropdown-item act-info">${SVG.info} Details</div>
                    <div class="dropdown-item danger act-delete">${SVG.trash} Delete</div>
                </div>
            </div>
        `;

        // Checkbox Click
        const chk = row.querySelector('.row-checkbox');
        chk.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleSelection(item.id, row);
        });

        // Dropdown Click Handler
        const dotsBtn = row.querySelector('.btn-dots');
        const dropdown = row.querySelector('.action-dropdown');
        dotsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.action-dropdown').forEach(d => d !== dropdown && d.classList.remove('active'));
            dropdown.classList.toggle('active');
        });

        // Touch Interaction: Double Tap and Long Press (Mobile & Desktop)
        let lastTap = 0;
        let pressTimer = null;

        row.addEventListener('touchstart', (e) => {
            pressTimer = setTimeout(() => {
                toggleSelection(item.id, row);
            }, 500);
        });

        row.addEventListener('touchend', (e) => {
            clearTimeout(pressTimer);
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                // Double tap on mobile
                openItem(item);
                e.preventDefault();
            }
            lastTap = currentTime;
        });

        // Desktop Double Click
        row.addEventListener('dblclick', () => openItem(item));

        // Row Click: Selection or Navigation
        row.addEventListener('click', (e) => {
            if (e.target.closest('.actions-cell') || e.target.closest('.checkbox-cell')) return;
            if (e.ctrlKey || e.metaKey) {
                toggleSelection(item.id, row);
            } else if (selectedItemIds.size > 0) {
                toggleSelection(item.id, row);
            }
        });

        // Dropdown Actions Handlers
        row.querySelector('.act-rename').addEventListener('click', () => openRenameModal(item));
        row.querySelector('.act-download').addEventListener('click', () => downloadSingleItem(item));
        row.querySelector('.act-label').addEventListener('click', () => openLabelModal([item.id]));
        row.querySelector('.act-move').addEventListener('click', () => openMoveModal([item.id]));
        row.querySelector('.act-info').addEventListener('click', () => openDetailsModal(item));
        row.querySelector('.act-delete').addEventListener('click', () => deleteItems([item.id]));

        container.appendChild(row);
    }

    // Dismiss Dropdowns on window click
    window.addEventListener('click', () => {
        document.querySelectorAll('.action-dropdown').forEach(d => d.classList.remove('active'));
    });

    // Multi-Selection State & Action Bar Handling
    function toggleSelection(id, rowElem) {
        if (selectedItemIds.has(id)) {
            selectedItemIds.delete(id);
            rowElem.classList.remove('selected');
            rowElem.querySelector('.row-checkbox').checked = false;
        } else {
            selectedItemIds.add(id);
            rowElem.classList.add('selected');
            rowElem.querySelector('.row-checkbox').checked = true;
        }
        updateBatchBar();
    }

    function updateBatchBar() {
        const bar = document.getElementById('batchActionBar');
        const countText = document.getElementById('batchCountText');
        const count = selectedItemIds.size;
        countText.innerText = `${count} selected`;
        if (count > 0) bar.classList.add('active');
        else bar.classList.remove('active');
    }

    document.getElementById('selectAllCheckbox').addEventListener('change', (e) => {
        const checked = e.target.checked;
        const currentViewItems = allUserItems.filter(item => (item.parentId || null) === getCurrentFolderId());
        selectedItemIds.clear();
        currentViewItems.forEach(item => {
            const row = document.getElementById(`row-${item.id}`);
            if (checked) {
                selectedItemIds.add(item.id);
                if (row) {
                    row.classList.add('selected');
                    row.querySelector('.row-checkbox').checked = true;
                }
            } else {
                if (row) {
                    row.classList.remove('selected');
                    row.querySelector('.row-checkbox').checked = false;
                }
            }
        });
        updateBatchBar();
    });

    // Open File or Nested Folder (Handling Passwords)
    function openItem(item) {
        const isFolder = item.Folder === "True";
        if (item.Password) {
            promptPassword(item.Password, () => {
                if (isFolder) {
                    folderHierarchy.push({ id: item.id, name: item.Name });
                    selectedItemIds.clear();
                    updateBatchBar();
                    loadDrive();
                } else {
                    window.open(item.File, '_blank');
                }
            });
        } else {
            if (isFolder) {
                folderHierarchy.push({ id: item.id, name: item.Name });
                selectedItemIds.clear();
                updateBatchBar();
                loadDrive();
            } else {
                window.open(item.File, '_blank');
            }
        }
    }

    function promptPassword(expected, onSuccess) {
        const modal = document.getElementById('passAuthModal');
        const input = document.getElementById('authPasswordInput');
        input.value = "";
        modal.classList.add('active');
        document.getElementById('btnSubmitUnlock').onclick = () => {
            if (input.value === expected) {
                modal.classList.remove('active');
                onSuccess();
            } else {
                showToast("Incorrect Password!");
            }
        };
    }

    // 1. Rename Single Item
    let activeRenameItem = null;
    function openRenameModal(item) {
        activeRenameItem = item;
        document.getElementById('renameInput').value = item.Name || item.File.split('/').pop();
        document.getElementById('renameModal').classList.add('active');
    }
    document.getElementById('btnSaveRename').addEventListener('click', async () => {
        const newName = document.getElementById('renameInput').value.trim();
        if (newName && activeRenameItem) {
            await updateDoc(doc(db, "Cloud Drive", activeRenameItem.id), { Name: newName });
            document.getElementById('renameModal').classList.remove('active');
            showToast("Renamed successfully");
            loadDrive();
        }
    });

    // 2. Download Operations (Single & Batch ZIP)
    async function downloadSingleItem(item) {
        if (item.Folder === "True") {
            showToast("Cannot direct download a folder. Open to view contents.");
            return;
        }
        showToast("Downloading...");
        const a = document.createElement('a');
        a.href = item.File;
        a.target = '_blank';
        a.download = item.Name || 'download';
        a.click();
    }

    document.getElementById('batchDownloadBtn').addEventListener('click', async () => {
        const ids = Array.from(selectedItemIds);
        const filesToDownload = allUserItems.filter(i => ids.includes(i.id) && i.Folder !== "True");
        if (filesToDownload.length === 0) {
            showToast("No downloadable files selected.");
            return;
        }
        showToast("Compressing files into ZIP...");
        const zip = new JSZip();
        for (const file of filesToDownload) {
            try {
                const res = await fetch(file.File);
                const blob = await res.blob();
                zip.file(file.Name || `file-${file.id}`, blob);
            } catch (err) {
                console.warn("Could not load file for zip:", file.File);
            }
        }
        const zipBlob = await zip.generateAsync({ type: "blob" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(zipBlob);
        link.download = `Batch_Files_${Date.now()}.zip`;
        link.click();
        showToast("Download started!");
    });

    // 3. Label Modal & Batch Labeling
    let targetedLabelIds = [];
    function openLabelModal(ids) {
        targetedLabelIds = ids;
        document.getElementById('labelInput').value = "";
        document.getElementById('labelModal').classList.add('active');
    }
    document.getElementById('batchLabelBtn').addEventListener('click', () => openLabelModal(Array.from(selectedItemIds)));
    document.getElementById('btnSaveLabel').addEventListener('click', async () => {
        const val = document.getElementById('labelInput').value;
        const labels = val.split(',').map(s => s.trim()).filter(Boolean);
        for (const id of targetedLabelIds) {
            await updateDoc(doc(db, "Cloud Drive", id), { Labels: labels });
        }
        document.getElementById('labelModal').classList.remove('active');
        showToast("Labels updated!");
        loadDrive();
    });

    // 4. Move Destination Modal & Execution
    let targetedMoveIds = [];
    function openMoveModal(ids) {
        targetedMoveIds = ids;
        const select = document.getElementById('moveTargetSelect');
        select.innerHTML = `<option value="root">Knowledge base (Root)</option>`;
        
        // Show available folders excluding moving folders themselves
        const folders = allUserItems.filter(i => i.Folder === "True" && !ids.includes(i.id));
        folders.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f.id;
            opt.innerText = `📁 ${f.Name}`;
            select.appendChild(opt);
        });

        document.getElementById('moveModal').classList.add('active');
    }
    document.getElementById('batchMoveBtn').addEventListener('click', () => openMoveModal(Array.from(selectedItemIds)));
    document.getElementById('btnSaveMove').addEventListener('click', async () => {
        const target = document.getElementById('moveTargetSelect').value;
        const newParentId = target === "root" ? null : target;
        for (const id of targetedMoveIds) {
            await updateDoc(doc(db, "Cloud Drive", id), { parentId: newParentId });
        }
        document.getElementById('moveModal').classList.remove('active');
        selectedItemIds.clear();
        updateBatchBar();
        showToast("Items moved successfully!");
        loadDrive();
    });

    // 5. Details Modal
    function openDetailsModal(item) {
        const c = document.getElementById('detailsContent');
        const isFolder = item.Folder === "True";
        c.innerHTML = `
            <div>Type</div><div>${isFolder ? 'Folder' : (item.Type || 'File')}</div>
            <div>Name</div><div>${item.Name || 'Untitled'}</div>
            <div>Owner</div><div>${item.Email}</div>
            <div>Password</div><div>${item.Password ? 'Protected' : 'None'}</div>
            ${!isFolder ? `<div>File URL</div><div style="word-break: break-all;"><a href="${item.File}" target="_blank" style="color:var(--accent)">${item.File}</a></div>` : ''}
        `;
        document.getElementById('detailsModal').classList.add('active');
    }

    // 6. Delete Operations
    async function deleteItems(ids) {
        if (!confirm(`Permanently delete ${ids.length} item(s)?`)) return;
        for (const id of ids) {
            await deleteDoc(doc(db, "Cloud Drive", id));
        }
        selectedItemIds.clear();
        updateBatchBar();
        showToast("Items deleted.");
        loadDrive();
    }
    document.getElementById('batchDeleteBtn').addEventListener('click', () => deleteItems(Array.from(selectedItemIds)));

    // Create Nested Folder
    document.getElementById('newFolderTriggerBtn').addEventListener('click', () => {
        document.getElementById('newFolderName').value = "";
        document.getElementById('newFolderPassword').value = "";
        document.getElementById('folderModal').classList.add('active');
    });
    document.getElementById('btnCreateFolder').addEventListener('click', async () => {
        const name = document.getElementById('newFolderName').value.trim();
        const pass = document.getElementById('newFolderPassword').value.trim();
        if (name) {
            await addDoc(collection(db, "Cloud Drive"), {
                Email: userEmail,
                Folder: "True",
                Name: name,
                Password: pass,
                parentId: getCurrentFolderId(),
                Labels: [],
                Access: { Viewer: [], Commentator: [], Editor: [] }
            });
            document.getElementById('folderModal').classList.remove('active');
            showToast("Folder created.");
            loadDrive();
        }
    });

    // Multi-File Upload & Drag/Drop Directly Into Active Folder
    const nativeFileInput = document.getElementById('nativeFileInput');
    document.getElementById('uploadTriggerBtn').addEventListener('click', () => nativeFileInput.click());
    nativeFileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleUpload(e.target.files);
    });

    const dragOverlay = document.getElementById('dragOverlay');
    window.addEventListener('dragover', (e) => { e.preventDefault(); dragOverlay.classList.add('active'); });
    window.addEventListener('dragleave', (e) => {
        if (e.clientX === 0 && e.clientY === 0) dragOverlay.classList.remove('active');
    });
    window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragOverlay.classList.remove('active');
        if (e.dataTransfer.files.length) handleUpload(e.dataTransfer.files);
    });

    async function handleUpload(files) {
        showToast(`Uploading ${files.length} file(s)...`);
        const currFolder = getCurrentFolderId();

        for (const file of files) {
            if (file.size > 50 * 1024 * 1024) {
                showToast(`Skipped ${file.name} (>50MB)`);
                continue;
            }

            try {
                let fileUrl = "";
                let fileType = "";
                if (file.type.startsWith('image/')) {
                    const fd = new FormData();
                    fd.append('image', file);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = j.data.url;
                    fileType = ".img";
                } else {
                    const fd = new FormData();
                    fd.append('UPLOADCARE_PUB_KEY', UPLOADCARE_PUB_KEY);
                    fd.append('UPLOADCARE_STORE', '1');
                    fd.append('file', file);
                    const res = await fetch('https://upload.uploadcare.com/base/', { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = `https://ucarecdn.com/${j.file}/${encodeURIComponent(file.name)}`;
                    const ext = file.name.split('.').pop();
                    fileType = ext ? `.${ext.toLowerCase()}` : '.file';
                }

                await addDoc(collection(db, "Cloud Drive"), {
                    Email: userEmail,
                    File: fileUrl,
                    Type: fileType,
                    Name: file.name,
                    Password: "",
                    parentId: currFolder,
                    Labels: [],
                    Access: { Viewer: [], Commentator: [], Editor: [] }
                });
            } catch(err) {
                console.error("Upload error:", err);
            }
        }
        showToast("Upload completed!");
        loadDrive();
    }

    // Search Filter
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.table-row').forEach(row => {
            const name = row.querySelector('.file-name').innerText.toLowerCase();
            row.style.display = name.includes(val) ? 'grid' : 'none';
        });
    });

    loadDrive();
</script>
</body>
</html>
