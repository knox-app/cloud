<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Drive</title>
    <!-- jsPDF for Image-to-PDF compilation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --card-bg: #f9fafb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #f3f4f6;
            --hover-bg: #f3f4f6;
            --btn-dark-bg: #0d0d0d;
            --btn-dark-text: #ffffff;
            --select-accent: #0d0d0d;
            --danger: #ef4444;
            --tag-bg: #e5e7eb;
            --tag-text: #374151;
            --sidebar-width: 64px;
        }

        body.dark {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --card-bg: #252525;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #2d2d2d;
            --hover-bg: #2c2c2c;
            --btn-dark-bg: #ffffff;
            --btn-dark-text: #121212;
            --select-accent: #ffffff;
            --danger: #f87171;
            --tag-bg: #333333;
            --tag-text: #d1d5db;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Sidebar */
        aside.sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 16px;
            flex-shrink: 0;
            background: var(--surface-color);
        }

        .side-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .side-icon:hover, .side-icon.active {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }
        .side-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

        /* Main Viewport */
        main.content-area {
            flex-grow: 1;
            padding: 30px 40px;
            max-width: 1300px;
            position: relative;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-pill {
            background-color: var(--btn-dark-bg);
            color: var(--btn-dark-text);
            border: none;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: opacity 0.2s;
            user-select: none;
        }
        .btn-pill:hover { opacity: 0.9; }

        .btn-icon-only {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 10px;
            border-radius: 9999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon-only:hover { background: var(--hover-bg); }
        .btn-icon-only svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        /* Search input bar */
        .search-container {
            position: relative;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .search-container svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            fill: none;
        }
        .search-input {
            width: 100%;
            padding: 9px 14px 9px 38px;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
        }
        .search-input:focus { border-color: var(--text-secondary); }

        /* Floating Selection Pill Bar (Screenshot 3 style) */
        .selection-toolbar {
            position: sticky;
            top: 12px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 9999px;
            display: none;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            z-index: 100;
        }
        .selection-toolbar.active { display: flex; }
        .selection-count { font-size: 14px; font-weight: 500; }
        .selection-actions { display: flex; align-items: center; gap: 14px; }
        .sel-icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            transition: transform 0.15s;
        }
        .sel-icon-btn:hover { transform: scale(1.1); }
        .sel-icon-btn.danger { color: var(--danger); }
        .sel-icon-btn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; }
        .btn-done-sel {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            margin-left: 6px;
        }

        /* Circular Checkboxes */
        .circle-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-secondary);
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: transparent;
            transition: all 0.2s;
        }
        .circle-checkbox:checked {
            background: var(--select-accent);
            border-color: var(--select-accent);
        }
        .circle-checkbox:checked::after {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--bg-color);
            border-radius: 50%;
            position: absolute;
        }

        /* Tags / Labels */
        .label-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 7px;
            background: var(--tag-bg);
            color: var(--tag-text);
            border-radius: 6px;
            font-size: 11px;
            margin-right: 4px;
            margin-top: 2px;
            font-weight: 500;
        }

        /* Empty Drive State Container */
        .empty-state-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }
        .empty-state-img {
            max-width: 240px;
            margin-bottom: 16px;
            opacity: 0.9;
        }
        .empty-state-text {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* List View Layout */
        .data-table { width: 100%; border-collapse: collapse; }
        .table-head {
            display: grid;
            grid-template-columns: 3.2fr 1.8fr 1.5fr 1.8fr 40px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .table-row {
            display: grid;
            grid-template-columns: 3.2fr 1.8fr 1.5fr 1.8fr 40px;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            transition: background-color 0.15s;
            cursor: pointer;
            user-select: none;
        }
        .table-row:hover { background-color: var(--hover-bg); }
        .table-row.selected { background-color: var(--hover-bg); border-left: 3px solid var(--select-accent); }
        .table-row.keyboard-focused { outline: 2px solid var(--select-accent); outline-offset: -2px; }

        .selection-active .table-head { grid-template-columns: 36px 3.2fr 1.8fr 1.5fr 1.8fr 40px; }
        .selection-active .table-row { grid-template-columns: 36px 3.2fr 1.8fr 1.5fr 1.8fr 40px; }

        .cell-checkbox { display: none; align-items: center; justify-content: center; }
        .selection-active .cell-checkbox { display: flex; }

        .file-title-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-icon-box {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--hover-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--text-secondary);
        }
        .file-icon-box svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; }
        .file-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Google Drive Style Grid View Layout */
        .grid-view-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px;
            margin-top: 10px;
        }
        .grid-item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
            user-select: none;
        }
        .grid-item-card:hover {
            transform: translateY(-2px);
            border-color: var(--text-secondary);
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
        }
        .grid-item-card.selected {
            border-color: var(--select-accent);
            box-shadow: 0 0 0 2px var(--select-accent);
        }
        .grid-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .grid-card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
        }
        .grid-preview-box {
            width: 100%;
            height: 110px;
            border-radius: 10px;
            background: var(--surface-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 6px;
            position: relative;
        }
        .grid-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .grid-folder-large-icon {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .grid-folder-large-icon svg { width: 46px; height: 46px; stroke: currentColor; fill: currentColor; fill-opacity: 0.15; }

        /* 3-Dots Dropdown */
        .actions-cell { position: relative; text-align: right; }
        .btn-dots {
            background: none;
            border: none;
            padding: 5px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-dots:hover { color: var(--text-primary); background: var(--border-color); }
        .btn-dots svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; }

        .action-dropdown {
            position: absolute;
            right: 0;
            top: 28px;
            background: var(--surface-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.16);
            border-radius: 12px;
            width: 190px;
            padding: 6px 0;
            z-index: 200;
            display: none;
            border: 1px solid var(--border-color);
            text-align: left;
        }
        .action-dropdown.active { display: block; }
        .dropdown-item {
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .dropdown-item:hover { background: var(--hover-bg); }
        .dropdown-item.danger { color: var(--danger); }
        .dropdown-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

        /* Modals */
        .modal-shade {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 16px;
        }
        .modal-shade.active { visibility: visible; opacity: 1; }

        .modal-box {
            background: var(--surface-color);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 26px;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .modal-title { font-size: 17px; font-weight: 600; }
        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .modal-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .clean-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--hover-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
        }

        /* Folder Customizer Modal Layout (Screenshot 1) */
        .color-palette-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s;
        }
        .color-dot:hover { transform: scale(1.15); }
        .color-dot.active { border-color: var(--text-primary); }

        .icon-glyph-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding: 4px;
        }
        .icon-glyph-btn {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--hover-bg);
            border: 1px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: all 0.15s;
        }
        .icon-glyph-btn:hover, .icon-glyph-btn.active {
            border-color: var(--text-primary);
            background: var(--surface-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .icon-glyph-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }

        .user-access-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        /* Toast Popup */
        .toast-popup {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: #ffffff;
            padding: 9px 20px;
            border-radius: 9999px;
            font-size: 13px;
            display: none;
            z-index: 2000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .details-grid { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
        .details-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border-color); }
        .details-label { color: var(--text-secondary); }
        .details-val { font-weight: 500; text-align: right; max-width: 260px; overflow-wrap: break-word; }

        /* Responsive */
        @media (max-width: 768px) {
            aside.sidebar { display: none; }
            main.content-area { padding: 18px 14px; width: 100%; }
            .table-head { display: none; }
            .table-row { grid-template-columns: 1fr auto 30px; gap: 8px; padding: 10px 0; }
            .selection-active .table-row { grid-template-columns: 28px 1fr auto 30px; }
            .cell-uploader, .cell-format { display: none; }
            .cell-date { font-size: 11px; color: var(--text-secondary); }
        }
    </style>
</head>
<body>

<!-- Workspace Sidebar -->
<aside class="sidebar">
    <div class="side-icon active" title="Cloud Drive">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <div class="side-icon" id="themeToggleBtn" title="Toggle Theme (Shift+T then D/L)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </div>
    <div class="side-icon" id="logoutSideBtn" title="Sign Out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </div>
</aside>

<!-- Main Workspace -->
<main class="content-area" id="mainArea">
    <div class="top-row">
        <div class="page-title" id="breadcrumbArea">
            <span>Cloud Drive</span>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button class="btn-icon-only" id="btnToggleViewMode" title="Switch Grid/List View">
                <svg id="viewModeIcon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </button>
            <button class="btn-pill" id="btnSelectModeToggle" style="background: var(--hover-bg); color: var(--text-primary); border: 1px solid var(--border-color);" title="Select Multiple (Shift+S)">
                Select
            </button>
            <button class="btn-pill" id="uploadTriggerBtn" title="Upload (Shift+U)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Upload
            </button>
            <button class="btn-pill" id="newFolderTriggerBtn" style="background: var(--hover-bg); color: var(--text-primary); border: 1px solid var(--border-color);" title="New Folder (Shift+C)">
                + Folder
            </button>
        </div>
    </div>

    <!-- Floating Selection Action Bar (Screenshot 3 style) -->
    <div class="selection-toolbar" id="selectionToolbar">
        <span class="selection-count" id="selectedCountText">1 Selected</span>
        <div class="selection-actions">
            <button class="sel-icon-btn" id="btnMultiDownload" title="Download Files">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
            <button class="sel-icon-btn" id="btnMultiMove" title="Move (Shift+M)">
                <svg viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>
            </button>
            <button class="sel-icon-btn danger" id="btnMultiDelete" title="Delete (Shift+D)">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
            <span class="btn-done-sel" id="btnCancelSelect">Done</span>
        </div>
    </div>

    <!-- Hidden Native File Input -->
    <input type="file" id="nativeFileInput" multiple style="display: none;">

    <div class="search-container">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search inside folders and files (Shift+F)">
    </div>

    <!-- Dynamic Content Presentation: List / Grid -->
    <div id="viewContainer">
        <!-- Injected dynamically based on viewMode -->
    </div>
</main>

<!-- Modal: Folder Customizer (Screenshot 1) -->
<div class="modal-shade" id="customizeModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Customize Folder</div>
            <button class="modal-close" id="closeCustomizeModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="input-group">
            <label>Folder Color</label>
            <div class="color-palette-grid" id="colorPaletteGrid"></div>
        </div>

        palette: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 0 0 20c1.5 0 2-1 2-2 0-.8-.3-1.4-.8-1.9-.4-.5-.6-1.1-.6-1.8 0-1.7 1.3-3 3-3h1.4c2.8 0 5-2.2 5-5 0-4.4-4.5-8.3-10-8.3z"></path></svg>`,
        lock: `<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`,
        image: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`,
        pdf: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`,
        doc: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`
    };

    function getFormatInfo(typeStr, isFolder) {
        if (isFolder) return { label: "Folder", icon: GLYPH_ICONS.folder };
        const t = (typeStr || "").toLowerCase();
        if (t.includes("img") || t.includes("png") || t.includes("jpg") || t.includes("jpeg") || t.includes("image")) return { label: "Image", icon: SVG_SYSTEM.image };
        if (t.includes("pdf")) return { label: "PDF", icon: SVG_SYSTEM.pdf };
        return { label: "Document", icon: SVG_SYSTEM.doc };
    }

    // State Variables
    let folderHierarchy = [];
    let allWorkspaceDocs = [];
    let allFolderDocs = [];
    let currentRenderedItems = [];
    let selectedItemIds = new Set();
    let isSelectionMode = false;
    let keyboardFocusedIndex = -1;

    function getCurrentFolderId() {
        return folderHierarchy.length > 0 ? folderHierarchy[folderHierarchy.length - 1].id : null;
    }

    function getCurrentFolderName() {
        return folderHierarchy.length > 0 ? folderHierarchy[folderHierarchy.length - 1].name : "";
    }

    function getUserRole(item) {
        if (item.Email === userEmail) return 'Owner';
        const acc = item.Access || {};
        if (acc.Editor?.includes(userEmail)) return 'Editor';
        if (acc.Contributor?.includes(userEmail)) return 'Contributor';
        if (acc.Commenter?.includes(userEmail) || acc.Commentator?.includes(userEmail)) return 'Commenter';
        if (acc.Viewer?.includes(userEmail)) return 'Viewer';

        // Check parent folder inheritance
        for (const f of folderHierarchy) {
            const pDoc = allFolderDocs.find(x => x.id === f.id);
            if (pDoc) {
                if (pDoc.Email === userEmail) return 'Owner';
                const pAcc = pDoc.Access || {};
                if (pAcc.Editor?.includes(userEmail)) return 'Editor';
                if (pAcc.Contributor?.includes(userEmail)) return 'Contributor';
                if (pAcc.Commenter?.includes(userEmail) || pAcc.Commentator?.includes(userEmail)) return 'Commenter';
                if (pAcc.Viewer?.includes(userEmail)) return 'Viewer';
            }
        }
        return 'Viewer';
    }

    function renderBreadcrumb() {
        const area = document.getElementById('breadcrumbArea');
        if (folderHierarchy.length === 0) {
            area.innerHTML = `<span>Cloud Drive</span>`;
        } else {
            let html = `<span style="color: var(--text-secondary); cursor: pointer;" id="bc-root">Cloud Drive</span>`;
            folderHierarchy.forEach((item, index) => {
                html += ` <span style="color: var(--text-secondary); font-weight: 400;">/</span> `;
                if (index === folderHierarchy.length - 1) {
                    html += `<span>${item.name}</span>`;
                } else {
                    html += `<span style="color: var(--text-secondary); cursor: pointer;" class="bc-crumb" data-idx="${index}">${item.name}</span>`;
                }
            });
            area.innerHTML = html;

            document.getElementById('bc-root')?.addEventListener('click', () => {
                folderHierarchy = [];
                loadDrive();
            });
            document.querySelectorAll('.bc-crumb').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.getAttribute('data-idx'));
                    folderHierarchy = folderHierarchy.slice(0, idx + 1);
                    loadDrive();
                });
            });
        }
    }

    // View Switcher (Grid / List)
    document.getElementById('btnToggleViewMode').addEventListener('click', () => {
        currentViewMode = (currentViewMode === 'grid') ? 'list' : 'grid';
        localStorage.setItem('drive_view_mode', currentViewMode);
        renderCurrentView();
    });

    async function loadDrive() {
        renderBreadcrumb();
        exitSelectionMode();
        keyboardFocusedIndex = -1;

        const viewArea = document.getElementById('viewContainer');
        viewArea.innerHTML = `<div style="padding: 30px 0; color: var(--text-secondary); font-size: 14px;">Loading workspace...</div>`;

        try {
            const q = query(
                collection(db, "Cloud Drive"),
                or(
                    where("Email", "==", userEmail),
                    where("Access.Viewer", "array-contains", userEmail),
                    where("Access.Contributor", "array-contains", userEmail),
                    where("Access.Commenter", "array-contains", userEmail),
                    where("Access.Commentator", "array-contains", userEmail),
                    where("Access.Editor", "array-contains", userEmail)
                )
            );

            const snap = await getDocs(q);
            const items = [];
            snap.forEach(docSnap => {
                items.push({ id: docSnap.id, ...docSnap.data() });
            });

            allWorkspaceDocs = items;
            allFolderDocs = items.filter(d => d.Folder === "True");

            const currId = getCurrentFolderId();
            let renderItems = [];

            if (!currId) {
                const assignedChildIds = new Set();
                allFolderDocs.forEach(f => {
                    if (Array.isArray(f.File)) f.File.forEach(id => assignedChildIds.add(id));
                });
                renderItems = items.filter(i => !assignedChildIds.has(i.id));
            } else {
                const activeFolder = allFolderDocs.find(f => f.id === currId);
                const assignedIds = (activeFolder && Array.isArray(activeFolder.File)) ? activeFolder.File : [];
                renderItems = items.filter(i => assignedIds.includes(i.id));
            }

            currentRenderedItems = renderItems;
            renderCurrentView();
        } catch(e) {
            console.error(e);
            viewArea.innerHTML = `<div style="padding: 20px 0; color: var(--danger);">Failed to load Cloud Drive.</div>`;
        }
    }

    function renderCurrentView() {
        const viewArea = document.getElementById('viewContainer');
        viewArea.innerHTML = "";

        if (currentRenderedItems.length === 0) {
            const emptyLabel = getCurrentFolderId() ? `No Files In Your ${getCurrentFolderName()}` : `No Files In Your Drive`;
            viewArea.innerHTML = `
                <div class="empty-state-card">
                    <img src="https://indus.sarvam.ai/studio/assets/empty-table.webp" class="empty-state-img" alt="Empty Workspace">
                    <span class="empty-state-text">${emptyLabel}</span>
                </div>
            `;
            return;
        }

        // Sort Folders first
        currentRenderedItems.sort((a, b) => (b.Folder === "True" ? 1 : 0) - (a.Folder === "True" ? 1 : 0));

        if (currentViewMode === 'grid') {
            const grid = document.createElement('div');
            grid.className = 'grid-view-container';
            currentRenderedItems.forEach((item, idx) => grid.appendChild(createGridItemCard(item, idx)));
            viewArea.appendChild(grid);
        } else {
            const table = document.createElement('div');
            table.className = `data-table ${isSelectionMode ? 'selection-active' : ''}`;
            table.id = 'dataTable';
            table.innerHTML = `
                <div class="table-head">
                    <div class="cell-checkbox"><input type="checkbox" class="circle-checkbox" id="selectAllCheckbox"></div>
                    <div>Name</div>
                    <div class="cell-uploader">Owner</div>
                    <div class="cell-format">Format</div>
                    <div class="cell-date">Updated</div>
                    <div></div>
                </div>
                <div id="tableRowsList"></div>
            `;
            const rowsList = table.querySelector('#tableRowsList');
            currentRenderedItems.forEach((item, idx) => rowsList.appendChild(createListRow(item, idx)));
            viewArea.appendChild(table);

            table.querySelector('#selectAllCheckbox')?.addEventListener('change', (e) => {
                const check = e.target.checked;
                currentRenderedItems.forEach(item => toggleSelectItem(item.id, check));
            });
        }
    }

    // Grid View Card Generator
    function createGridItemCard(item, index) {
        const isFolder = item.Folder === "True";
        const name = item.Name || (item.File ? item.File.split('/').pop() : 'Untitled');
        const format = getFormatInfo(item.Type, isFolder);
        const role = getUserRole(item);
        const isViewer = (role === 'Viewer');

        const cardColor = item.Customize?.Colour || (isFolder ? '#60a5fa' : 'transparent');
        const iconKey = item.Customize?.Icon || (isFolder ? 'folder' : 'doc');
        const iconSvg = GLYPH_ICONS[iconKey] || format.icon;

        const card = document.createElement('div');
        card.className = `grid-item-card ${selectedItemIds.has(item.id) ? 'selected' : ''}`;
        card.setAttribute('data-id', item.id);
        card.setAttribute('data-index', index);

        let previewContent = '';
        if (isFolder) {
            previewContent = `<div class="grid-folder-large-icon" style="color: ${cardColor};">${iconSvg}</div>`;
        } else if (format.label === 'Image') {
            previewContent = `<img src="${item.File}" loading="lazy" alt="${name}">`;
        } else {
            previewContent = `<div style="color: var(--text-secondary);">${format.icon}</div>`;
        }

        card.innerHTML = `
            <div class="grid-card-top">
                <div class="grid-card-title" title="${name}">
                    <span style="color: ${cardColor}; width: 18px; height: 18px; display: flex; align-items:center;">${iconSvg}</span>
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${name}</span>
                </div>
                <div class="actions-cell">
                    <button class="btn-dots">${SVG_SYSTEM.dots}</button>
                    <div class="action-dropdown">${buildDropdownMenu(item, isFolder, isViewer)}</div>
                </div>
            </div>
            <div class="grid-preview-box">${previewContent}</div>
            <div style="font-size: 11px; color: var(--text-secondary); display:flex; justify-content:space-between; align-items:center;">
                <span>${item.Updated ? item.Updated.split(',')[1] || item.Updated : ''}</span>
                ${item.Password ? '<span>🔒</span>' : ''}
            </div>
        `;

        setupCardEvents(card, item, isFolder, name);
        return card;
    }

    // List Row Generator
    function createListRow(item, index) {
        const isFolder = item.Folder === "True";
        const name = item.Name || (item.File ? item.File.split('/').pop() : 'Untitled');
        const format = getFormatInfo(item.Type, isFolder);
        const updated = item.Updated || "Recently";
        const ownerEmail = item.Email || userEmail;
        const role = getUserRole(item);
        const isViewer = (role === 'Viewer');

        const cardColor = item.Customize?.Colour || (isFolder ? '#60a5fa' : 'var(--text-secondary)');
        const iconKey = item.Customize?.Icon || (isFolder ? 'folder' : 'doc');
        const iconSvg = GLYPH_ICONS[iconKey] || format.icon;

        let labels = Array.isArray(item.Label) ? [...item.Label] : [];
        const labelsHtml = labels.map(l => `<span class="label-badge">${l}</span>`).join('');

        const row = document.createElement('div');
        row.className = `table-row ${selectedItemIds.has(item.id) ? 'selected' : ''}`;
        row.setAttribute('data-id', item.id);
        row.setAttribute('data-index', index);

        row.innerHTML = `
            <div class="cell-checkbox"><input type="checkbox" class="circle-checkbox row-checkbox" data-id="${item.id}" ${selectedItemIds.has(item.id) ? 'checked' : ''}></div>
            <div class="file-title-cell">
                <div class="file-icon-box" style="color: ${cardColor};">${iconSvg}</div>
                <div class="file-info-col">
                    <span class="file-name" title="${name}">${name}</span>
                    <div class="file-labels">${labelsHtml}</div>
                </div>
            </div>
            <div class="cell-uploader" style="font-size: 13px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${ownerEmail}</div>
            <div class="cell-format" style="font-size: 13px; color: var(--text-secondary);">${format.label}</div>
            <div class="cell-date" style="font-size: 13px; color: var(--text-secondary);">${updated}</div>
            <div class="actions-cell">
                <button class="btn-dots">${SVG_SYSTEM.dots}</button>
                <div class="action-dropdown">${buildDropdownMenu(item, isFolder, isViewer)}</div>
            </div>
        `;

        setupCardEvents(row, item, isFolder, name);
        return row;
    }

    // 3-Dots Dropdown HTML builder
    function buildDropdownMenu(item, isFolder, isViewer) {
        if (isViewer) {
            return `
                <div class="dropdown-item opt-details">${SVG_SYSTEM.info} Details</div>
                <div class="dropdown-item danger opt-delete">${SVG_SYSTEM.trash} Remove from Drive</div>
            `;
        }

        let html = '';
        if (!isFolder) html += `<div class="dropdown-item opt-download">${SVG_SYSTEM.download} Download</div>`;
        html += `<div class="dropdown-item opt-rename">${SVG_SYSTEM.edit} Rename</div>`;
        if (isFolder) {
            html += `<div class="dropdown-item opt-customize">${SVG_SYSTEM.palette} Customize</div>`;
            html += `<div class="dropdown-item opt-security">${SVG_SYSTEM.lock} Security</div>`;
        } else {
            html += `<div class="dropdown-item opt-share">${SVG_SYSTEM.share} Share</div>`;
        }
        html += `<div class="dropdown-item opt-access">${SVG_SYSTEM.users} Manage Access</div>`;
        html += `<div class="dropdown-item opt-label">${SVG_SYSTEM.tag} Label</div>`;
        html += `<div class="dropdown-item opt-move">${SVG_SYSTEM.move} ${isFolder ? 'Organise' : 'Move'}</div>`;
        html += `<div class="dropdown-item opt-details">${SVG_SYSTEM.info} Details</div>`;
        html += `<div class="dropdown-item danger opt-delete">${SVG_SYSTEM.trash} Delete</div>`;
        return html;
    }

    // Event Binder for Rows / Grid Cards
    function setupCardEvents(el, item, isFolder, name) {
        const dotsBtn = el.querySelector('.btn-dots');
        const dropdown = el.querySelector('.action-dropdown');

        dotsBtn?.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.action-dropdown').forEach(d => d !== dropdown && d.classList.remove('active'));
            dropdown.classList.toggle('active');
        });

        // Click anywhere to select or open
        el.addEventListener('click', (e) => {
            if (e.target.closest('.actions-cell')) return;
            if (isSelectionMode) {
                toggleSelectItem(item.id, !selectedItemIds.has(item.id));
                return;
            }
            if (item.Password) {
                promptPasswordAuth(item.Password, () => openItem(item, isFolder, name));
            } else {
                openItem(item, isFolder, name);
            }
        });

        // Mobile Long-Press support
        let touchTimer = null;
        let touchMoved = false;
        el.addEventListener('touchstart', (e) => {
            if (e.target.closest('.actions-cell')) return;
            touchMoved = false;
            touchTimer = setTimeout(() => {
                if (!touchMoved) {
                    if (navigator.vibrate) navigator.vibrate(40);
                    if (!isSelectionMode) enterSelectionMode();
                    toggleSelectItem(item.id, !selectedItemIds.has(item.id));
                }
            }, 500);
        }, { passive: true });
        el.addEventListener('touchmove', () => { touchMoved = true; clearTimeout(touchTimer); });
        el.addEventListener('touchend', () => clearTimeout(touchTimer));

        // Dropdown Click Handlers
        el.querySelector('.opt-download')?.addEventListener('click', (e) => { e.stopPropagation(); directDownloadFile(item.File, item.Name); });
        el.querySelector('.opt-rename')?.addEventListener('click', (e) => { e.stopPropagation(); openRenameModal(item); });
        el.querySelector('.opt-share')?.addEventListener('click', (e) => { e.stopPropagation(); openShareModal(item); });
        el.querySelector('.opt-customize')?.addEventListener('click', (e) => { e.stopPropagation(); openCustomizeModal(item); });
        el.querySelector('.opt-security')?.addEventListener('click', (e) => { e.stopPropagation(); openSecurityModal(item); });
        el.querySelector('.opt-access')?.addEventListener('click', (e) => { e.stopPropagation(); openAccessModal(item); });
        el.querySelector('.opt-label')?.addEventListener('click', (e) => { e.stopPropagation(); openLabelModal(item); });
        el.querySelector('.opt-move')?.addEventListener('click', (e) => { e.stopPropagation(); openMoveModal(item); });
        el.querySelector('.opt-details')?.addEventListener('click', (e) => { e.stopPropagation(); openDetailsModal(item); });
        el.querySelector('.opt-delete')?.addEventListener('click', (e) => { e.stopPropagation(); handleDelete(item); });
    }

    function openItem(item, isFolder, name) {
        if (isFolder) {
            folderHierarchy.push({ id: item.id, name: name });
            loadDrive();
        } else {
            updateDoc(doc(db, "Cloud Drive", item.id), {
                LastOpened: new Date().toISOString(),
                LastOpenedBy: userEmail
            }).catch(() => {});
            window.open(item.File, '_blank');
        }
    }

    // Direct Browser Download
    async function directDownloadFile(url, fileName) {
        showToast("Starting download...");
        try {
            const res = await fetch(url);
            const blob = await res.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = fileName || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
            showToast("Download complete");
        } catch(e) {
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }

    window.addEventListener('click', () => {
        document.querySelectorAll('.action-dropdown').forEach(d => d.classList.remove('active'));
    });

    // Password Challenge Modal
    const passModal = document.getElementById('passwordAuthModal');
    let passSuccessCallback = null;
    let expectedPass = "";

    function promptPasswordAuth(password, onSuccess) {
        expectedPass = password;
        passSuccessCallback = onSuccess;
        document.getElementById('authPasswordInput').value = "";
        passModal.classList.add('active');
    }
    document.getElementById('closePassModal').addEventListener('click', () => passModal.classList.remove('active'));
    document.getElementById('btnSubmitAuth').addEventListener('click', () => {
        const val = document.getElementById('authPasswordInput').value;
        if (val === expectedPass) {
            passModal.classList.remove('active');
            if (passSuccessCallback) passSuccessCallback();
        } else {
            showToast("Incorrect password!");
        }
    });

    // Multi-Selection System
    function enterSelectionMode() {
        isSelectionMode = true;
        document.getElementById('selectionToolbar').classList.add('active');
        document.getElementById('btnSelectModeToggle').innerText = "Cancel";
        const table = document.getElementById('dataTable');
        if (table) table.classList.add('selection-active');
        updateSelectionToolbar();
    }

    function exitSelectionMode() {
        isSelectionMode = false;
        selectedItemIds.clear();
        document.getElementById('selectionToolbar').classList.remove('active');
        document.getElementById('btnSelectModeToggle').innerText = "Select";
        const table = document.getElementById('dataTable');
        if (table) table.classList.remove('selection-active');
        document.querySelectorAll('.grid-item-card, .table-row').forEach(el => el.classList.remove('selected'));
        document.querySelectorAll('.circle-checkbox').forEach(c => c.checked = false);
    }

    document.getElementById('btnSelectModeToggle').addEventListener('click', () => {
        if (isSelectionMode) exitSelectionMode();
        else enterSelectionMode();
    });

    function toggleSelectItem(id, isSelected) {
        if (!isSelectionMode) enterSelectionMode();

        if (isSelected) selectedItemIds.add(id);
        else selectedItemIds.delete(id);
        
        document.querySelectorAll(`[data-id="${id}"]`).forEach(el => {
            el.classList.toggle('selected', isSelected);
            const chk = el.querySelector('.circle-checkbox');
            if (chk) chk.checked = isSelected;
        });
        updateSelectionToolbar();
    }

    function updateSelectionToolbar() {
        const countText = document.getElementById('selectedCountText');
        countText.innerText = `${selectedItemIds.size} Selected`;
    }

    document.getElementById('btnCancelSelect').addEventListener('click', () => exitSelectionMode());

    // Multi Delete
    document.getElementById('btnMultiDelete').addEventListener('click', async () => {
        if (selectedItemIds.size === 0) return;
        if (confirm(`Delete ${selectedItemIds.size} selected item(s)?`)) {
            for (const id of selectedItemIds) {
                const item = allWorkspaceDocs.find(d => d.id === id);
                if (item) await handleDelete(item, true);
            }
            showToast("Selected items deleted");
            loadDrive();
        }
    });

    // Multi Download
    document.getElementById('btnMultiDownload').addEventListener('click', async () => {
        const filesToDownload = currentRenderedItems.filter(i => selectedItemIds.has(i.id) && i.Folder !== "True");
        if (filesToDownload.length === 0) {
            showToast("No files selected to download");
            return;
        }
        showToast(`Downloading ${filesToDownload.length} files...`);
        for (const f of filesToDownload) {
            await directDownloadFile(f.File, f.Name);
        }
    });

    // Multi Move
    document.getElementById('btnMultiMove').addEventListener('click', () => {
        if (selectedItemIds.size === 0) return;
        openMoveModal(null, true);
    });

    // Modal: Folder Customizer (Screenshot 1)
    const customizeModal = document.getElementById('customizeModal');
    let targetCustomizeItem = null;
    let selectedColor = '#60a5fa';
    let selectedIcon = 'folder';

    function initCustomizerModal() {
        const palGrid = document.getElementById('colorPaletteGrid');
        palGrid.innerHTML = "";
        FOLDER_COLORS.forEach(c => {
            const dot = document.createElement('div');
            dot.className = 'color-dot';
            dot.style.backgroundColor = c.hex;
            dot.title = c.name;
            dot.addEventListener('click', () => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                selectedColor = c.hex;
            });
            palGrid.appendChild(dot);
        });

        const iconGrid = document.getElementById('iconGlyphGrid');
        iconGrid.innerHTML = "";
        Object.keys(GLYPH_ICONS).forEach(k => {
            const btn = document.createElement('div');
            btn.className = 'icon-glyph-btn';
            btn.innerHTML = GLYPH_ICONS[k];
            btn.addEventListener('click', () => {
                document.querySelectorAll('.icon-glyph-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedIcon = k;
            });
            iconGrid.appendChild(btn);
        });
    }
    initCustomizerModal();

    function openCustomizeModal(item) {
        targetCustomizeItem = item;
        selectedColor = item.Customize?.Colour || '#60a5fa';
        selectedIcon = item.Customize?.Icon || 'folder';
        customizeModal.classList.add('active');
    }
    document.getElementById('closeCustomizeModal').addEventListener('click', () => customizeModal.classList.remove('active'));
    document.getElementById('btnSaveCustomize').addEventListener('click', async () => {
        if (!targetCustomizeItem) return;
        await updateDoc(doc(db, "Cloud Drive", targetCustomizeItem.id), {
            Customize: { Colour: selectedColor, Icon: selectedIcon },
            Updated: formatFirestoreDate()
        });
        showToast("Folder customized");
        customizeModal.classList.remove('active');
        loadDrive();
    });

    // Modal: Security Password on Folder
    const securityModal = document.getElementById('securityModal');
    let targetSecurityItem = null;

    function openSecurityModal(item) {
        targetSecurityItem = item;
        document.getElementById('folderSecurityPassInput').value = item.Password || '';
        securityModal.classList.add('active');
    }
    document.getElementById('closeSecurityModal').addEventListener('click', () => securityModal.classList.remove('active'));
    document.getElementById('btnSaveSecurity').addEventListener('click', async () => {
        if (!targetSecurityItem) return;
        const pass = document.getElementById('folderSecurityPassInput').value.trim();
        await updateDoc(doc(db, "Cloud Drive", targetSecurityItem.id), {
            Password: pass,
            Updated: formatFirestoreDate()
        });
        showToast("Folder security updated");
        securityModal.classList.remove('active');
        loadDrive();
    });

    // Manage Access Modal (With Contributor)
    const accessModal = document.getElementById('accessModal');
    let targetAccessItem = null;
    let localAccessState = { Viewer: [], Contributor: [], Commenter: [], Editor: [] };

    function openAccessModal(item) {
        targetAccessItem = item;
        const role = getUserRole(item);
        const isViewer = (role === 'Viewer');

        const access = item.Access || {};
        localAccessState = {
            Viewer: [...(access.Viewer || [])],
            Contributor: [...(access.Contributor || [])],
            Commenter: [...(access.Commenter || access.Commentator || [])],
            Editor: [...(access.Editor || [])]
        };

        document.getElementById('inviteSection').style.display = isViewer ? 'none' : 'block';
        document.getElementById('btnSaveAccess').style.display = isViewer ? 'none' : 'block';

        renderAccessList(isViewer);
        accessModal.classList.add('active');
    }

    document.getElementById('closeAccessModal').addEventListener('click', () => accessModal.classList.remove('active'));

    function renderAccessList(isViewer) {
        const c = document.getElementById('accessListContainer');
        c.innerHTML = `
            <div class="user-access-row">
                <span>${targetAccessItem.Email || userEmail} <strong>(Owner)</strong></span>
                <span style="font-size: 11px; color: var(--text-primary); font-weight:600;">Owner</span>
            </div>
        `;
        ['Editor', 'Contributor', 'Viewer', 'Commenter'].forEach(role => {
            (localAccessState[role] || []).forEach((email, idx) => {
                const div = document.createElement('div');
                div.className = 'user-access-row';
                div.innerHTML = `
                    <span>${email}</span>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span style="font-size: 11px; color: var(--text-secondary);">${role}</span>
                        ${!isViewer ? `<span style="cursor: pointer; color: var(--danger); font-size:16px;" data-role="${role}" data-idx="${idx}">&times;</span>` : ''}
                    </div>
                `;
                if (!isViewer) {
                    div.querySelector('span[data-role]')?.addEventListener('click', () => {
                        localAccessState[role].splice(idx, 1);
                        renderAccessList(isViewer);
                    });
                }
                c.appendChild(div);
            });
        });
    }

    document.getElementById('btnAddAccess').addEventListener('click', async () => {
        const email = document.getElementById('inviteEmailInput').value.trim();
        const role = document.getElementById('inviteRoleSelect').value;
        if (!email) return;

        if (role === 'Transfer') {
            if (confirm(`Transfer ownership to ${email}? You will lose owner access.`)) {
                await updateDoc(doc(db, "Cloud Drive", targetAccessItem.id), {
                    Email: email,
                    Access: { Viewer: [], Contributor: [], Commenter: [], Editor: [] },
                    Updated: formatFirestoreDate()
                });
                showToast("Ownership transferred");
                accessModal.classList.remove('active');
                loadDrive();
            }
            return;
        }

        ['Viewer', 'Contributor', 'Commenter', 'Editor'].forEach(r => {
            localAccessState[r] = (localAccessState[r] || []).filter(e => e !== email);
        });
        if (!localAccessState[role]) localAccessState[role] = [];
        localAccessState[role].push(email);
        document.getElementById('inviteEmailInput').value = "";
        renderAccessList(false);
    });

    document.getElementById('btnSaveAccess').addEventListener('click', async () => {
        if (!targetAccessItem) return;
        await updateDoc(doc(db, "Cloud Drive", targetAccessItem.id), { 
            Access: localAccessState,
            Updated: formatFirestoreDate()
        });
        showToast("Permissions updated");
        accessModal.classList.remove('active');
        loadDrive();
    });

    // Share Modal
    const shareModal = document.getElementById('shareModal');
    let targetShareItem = null;

    function openShareModal(item) {
        targetShareItem = item;
        shareModal.classList.add('active');
    }
    document.getElementById('closeShareModal').addEventListener('click', () => shareModal.classList.remove('active'));

    document.getElementById('btnExecuteShare').addEventListener('click', async () => {
        if (!targetShareItem) return;
        const choice = document.getElementById('shareFormatChoice').value;

        if (choice === 'pdf') {
            showToast("Converting to PDF...");
            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF();
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = targetShareItem.File;
                img.onload = async () => {
                    pdf.addImage(img, 'JPEG', 15, 20, 180, 160);
                    const blob = pdf.output('blob');
                    const file = new File([blob], `${targetShareItem.Name || 'Document'}.pdf`, { type: 'application/pdf' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: targetShareItem.Name });
                    } else {
                        pdf.save(`${targetShareItem.Name || 'Document'}.pdf`);
                        showToast("PDF saved");
                    }
                };
            } catch(e) {
                navigator.share ? navigator.share({ title: targetShareItem.Name, url: targetShareItem.File }) : null;
            }
        } else if (choice === 'image' && navigator.canShare) {
            try {
                const res = await fetch(targetShareItem.File);
                const blob = await res.blob();
                const file = new File([blob], targetShareItem.Name || "image.png", { type: blob.type });
                await navigator.share({ files: [file], title: targetShareItem.Name });
            } catch(e) {
                if (navigator.share) await navigator.share({ title: targetShareItem.Name, url: targetShareItem.File });
            }
        } else {
            if (navigator.share) {
                await navigator.share({ title: targetShareItem.Name, url: targetShareItem.File });
            } else {
                navigator.clipboard.writeText(targetShareItem.File);
                showToast("Link copied to clipboard");
            }
        }
    });

    document.getElementById('btnCopyShareLink').addEventListener('click', () => {
        if (targetShareItem && targetShareItem.File) {
            navigator.clipboard.writeText(targetShareItem.File).then(() => showToast("Link copied"));
        }
    });

    // Move Modal
    const moveModal = document.getElementById('moveModal');
    let targetMoveItem = null;
    let isBatchMove = false;

    function openMoveModal(item, batch = false) {
        targetMoveItem = item;
        isBatchMove = batch;
        const select = document.getElementById('moveDestinationSelect');
        document.getElementById('moveModalTitle').innerText = batch ? "Move Selected Items" : (item?.Folder === "True" ? "Organise Folder" : "Move File");
        select.innerHTML = `<option value="root">Root Directory</option>`;
        
        allFolderDocs.forEach(f => {
            if (!batch && f.id === item?.id) return;
            select.innerHTML += `<option value="${f.id}">${f.Name || 'Untitled Folder'}</option>`;
        });
        moveModal.classList.add('active');
    }
    document.getElementById('closeMoveModal').addEventListener('click', () => moveModal.classList.remove('active'));

    document.getElementById('btnConfirmMove').addEventListener('click', async () => {
        const destFolderId = document.getElementById('moveDestinationSelect').value;
        const moveIds = isBatchMove ? Array.from(selectedItemIds) : [targetMoveItem.id];

        for (const id of moveIds) {
            for (const f of allFolderDocs) {
                if (Array.isArray(f.File) && f.File.includes(id)) {
                    await updateDoc(doc(db, "Cloud Drive", f.id), {
                        File: arrayRemove(id),
                        Updated: formatFirestoreDate()
                    });
                }
            }
            if (destFolderId !== "root") {
                await updateDoc(doc(db, "Cloud Drive", destFolderId), {
                    File: arrayUnion(id),
                    Updated: formatFirestoreDate()
                });
            }
        }

        showToast("Moved successfully");
        moveModal.classList.remove('active');
        loadDrive();
    });

    // Delete / Remove Action
    async function handleDelete(item, skipConfirm = false) {
        const role = getUserRole(item);

        if (role === 'Viewer') {
            // Remove Viewer access only (cancel access)
            await updateDoc(doc(db, "Cloud Drive", item.id), {
                "Access.Viewer": arrayRemove(userEmail)
            });
            showToast("Removed from your drive");
            loadDrive();
            return;
        }

        if (skipConfirm || confirm(`Permanently delete "${item.Name || 'item'}"?`)) {
            for (const f of allFolderDocs) {
                if (Array.isArray(f.File) && f.File.includes(item.id)) {
                    await updateDoc(doc(db, "Cloud Drive", f.id), {
                        File: arrayRemove(item.id)
                    });
                }
            }
            await deleteDoc(doc(db, "Cloud Drive", item.id));
            if (!skipConfirm) {
                showToast("Item deleted");
                loadDrive();
            }
        }
    }

    // Rename Modal
    let targetRenameItem = null;
    const renameModal = document.getElementById('renameModal');
    function openRenameModal(item) {
        targetRenameItem = item;
        document.getElementById('renameInput').value = item.Name || '';
        renameModal.classList.add('active');
    }
    document.getElementById('closeRenameModal').addEventListener('click', () => renameModal.classList.remove('active'));
    document.getElementById('btnSubmitRename').addEventListener('click', async () => {
        const newName = document.getElementById('renameInput').value.trim();
        if (newName && targetRenameItem) {
            await updateDoc(doc(db, "Cloud Drive", targetRenameItem.id), {
                Name: newName,
                Updated: formatFirestoreDate()
            });
            showToast("Renamed successfully");
            renameModal.classList.remove('active');
            loadDrive();
        }
    });

    // Details Modal
    const detailsModal = document.getElementById('detailsModal');
    function openDetailsModal(item) {
        const isFolder = item.Folder === "True";
        const format = getFormatInfo(item.Type, isFolder);
        const locationPath = folderHierarchy.length > 0 ? folderHierarchy.map(h => h.name).join(' / ') : 'Root Directory';

        const content = document.getElementById('detailsContent');
        content.innerHTML = `
            <div class="details-item"><span class="details-label">Name</span><span class="details-val">${item.Name || 'Untitled'}</span></div>
            <div class="details-item"><span class="details-label">Type</span><span class="details-val">${format.label}</span></div>
            <div class="details-item"><span class="details-label">Date (Updated)</span><span class="details-val">${item.Updated || 'N/A'}</span></div>
            <div class="details-item"><span class="details-label">Location</span><span class="details-val">${locationPath}</span></div>
            <div class="details-item"><span class="details-label">Owner</span><span class="details-val">${item.Email || userEmail}</span></div>
            <div class="details-item"><span class="details-label">Labels</span><span class="details-val">${(item.Label || []).join(', ') || 'None'}</span></div>
        `;
        detailsModal.classList.add('active');
    }
    document.getElementById('closeDetailsModal').addEventListener('click', () => detailsModal.classList.remove('active'));

    // Labels Modal
    const labelModal = document.getElementById('labelModal');
    let targetLabelItem = null;
    let localLabels = [];

    function openLabelModal(item) {
        targetLabelItem = item;
        localLabels = Array.isArray(item.Label) ? [...item.Label] : [];
        const isViewer = (getUserRole(item) === 'Viewer');
        document.getElementById('newLabelInput').disabled = isViewer;
        document.getElementById('btnAddLabel').disabled = isViewer;
        document.getElementById('btnSaveLabels').disabled = isViewer;
        renderLabelBadges(isViewer);
        labelModal.classList.add('active');
    }

    document.getElementById('closeLabelModal').addEventListener('click', () => labelModal.classList.remove('active'));

    function renderLabelBadges(isViewer) {
        const list = document.getElementById('currentLabelsList');
        list.innerHTML = "";
        if (localLabels.length === 0) {
            list.innerHTML = `<span style="color:var(--text-secondary); font-size:12px;">No labels added.</span>`;
            return;
        }
        localLabels.forEach((l, idx) => {
            const badge = document.createElement('span');
            badge.className = 'label-badge';
            badge.style.padding = '4px 8px';
            badge.innerHTML = `${l} ${!isViewer ? `<span style="cursor:pointer; margin-left:4px; color:var(--danger);" data-idx="${idx}">&times;</span>` : ''}`;
            if (!isViewer) {
                badge.querySelector('span')?.addEventListener('click', () => {
                    localLabels.splice(idx, 1);
                    renderLabelBadges(isViewer);
                });
            }
            list.appendChild(badge);
        });
    }

    document.getElementById('btnAddLabel').addEventListener('click', () => {
        const txt = document.getElementById('newLabelInput').value.trim();
        if (txt && !localLabels.includes(txt)) {
            localLabels.push(txt);
            document.getElementById('newLabelInput').value = "";
            renderLabelBadges(false);
        }
    });

    document.getElementById('btnSaveLabels').addEventListener('click', async () => {
        if (!targetLabelItem) return;
        await updateDoc(doc(db, "Cloud Drive", targetLabelItem.id), {
            Label: localLabels,
            Updated: formatFirestoreDate()
        });
        showToast("Labels updated");
        labelModal.classList.remove('active');
        loadDrive();
    });

    // Create Folder Modal
    const folderModal = document.getElementById('folderModal');
    document.getElementById('newFolderTriggerBtn').addEventListener('click', () => {
        document.getElementById('newFolderName').value = "";
        document.getElementById('newFolderPassword').value = "";
        folderModal.classList.add('active');
    });
    document.getElementById('closeFolderModal').addEventListener('click', () => folderModal.classList.remove('active'));

    document.getElementById('btnCreateFolder').addEventListener('click', async () => {
        const name = document.getElementById('newFolderName').value.trim();
        const pass = document.getElementById('newFolderPassword').value.trim();
        if (name) {
            const newDoc = await addDoc(collection(db, "Cloud Drive"), {
                Email: userEmail,
                Folder: "True",
                Name: name,
                Password: pass,
                File: [],
                Label: [],
                Customize: { Colour: "#60a5fa", Icon: "folder" },
                Updated: formatFirestoreDate(),
                Access: { Viewer: [], Contributor: [], Commenter: [], Editor: [] }
            });

            const currFolderId = getCurrentFolderId();
            if (currFolderId) {
                await updateDoc(doc(db, "Cloud Drive", currFolderId), {
                    File: arrayUnion(newDoc.id),
                    Updated: formatFirestoreDate()
                });
            }

            folderModal.classList.remove('active');
            showToast("Folder created");
            loadDrive();
        }
    });

    // Batch File Upload
    const nativeFileInput = document.getElementById('nativeFileInput');
    document.getElementById('uploadTriggerBtn').addEventListener('click', () => nativeFileInput.click());
    nativeFileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleBatchUpload(e.target.files);
    });

    async function handleBatchUpload(files) {
        showToast(`Uploading ${files.length} file(s)...`);
        for (const file of files) {
            if (file.size > 50 * 1024 * 1024) {
                showToast(`Skipped ${file.name} (exceeds 50MB)`);
                continue;
            }

            try {
                let fileUrl = "";
                let fileType = "Document";

                if (file.type.startsWith('image/')) {
                    const fd = new FormData();
                    fd.append('image', file);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = j.data.url;
                    fileType = "Image";
                } else {
                    const fd = new FormData();
                    fd.append('UPLOADCARE_PUB_KEY', UPLOADCARE_PUB_KEY);
                    fd.append('UPLOADCARE_STORE', '1');
                    fd.append('file', file);
                    const res = await fetch('https://upload.uploadcare.com/base/', { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = `https://ucarecdn.com/${j.file}/${encodeURIComponent(file.name)}`;
                    const ext = file.name.split('.').pop()?.toUpperCase();
                    fileType = ext || "Document";
                }

                const newDoc = await addDoc(collection(db, "Cloud Drive"), {
                    Email: userEmail,
                    File: fileUrl,
                    Type: fileType,
                    Name: file.name,
                    Password: "",
                    Label: [],
                    LastOpened: new Date().toISOString(),
                    LastOpenedBy: userEmail,
                    Updated: formatFirestoreDate(),
                    Access: { Viewer: [], Contributor: [], Commenter: [], Editor: [] }
                });

                const currFolderId = getCurrentFolderId();
                if (currFolderId) {
                    await updateDoc(doc(db, "Cloud Drive", currFolderId), {
                        File: arrayUnion(newDoc.id),
                        Updated: formatFirestoreDate()
                    });
                }
            } catch(err) {
                console.error("Upload error:", err);
            }
        }
        showToast("Upload completed!");
        loadDrive();
    }

    // Full Recursive Search across Drive & Folders
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase().trim();
        if (!val) {
            currentRenderedItems = (getCurrentFolderId() === null)
                ? allWorkspaceDocs.filter(i => !allFolderDocs.some(f => Array.isArray(f.File) && f.File.includes(i.id)))
                : allWorkspaceDocs.filter(i => (allFolderDocs.find(f => f.id === getCurrentFolderId())?.File || []).includes(i.id));
            renderCurrentView();
            return;
        }

        // Search in all documents
        currentRenderedItems = allWorkspaceDocs.filter(item => {
            const name = (item.Name || '').toLowerCase();
            const labels = (item.Label || []).join(' ').toLowerCase();
            return name.includes(val) || labels.includes(val);
        });
        renderCurrentView();
    });

    // Keyboard Shortcuts
    let themeKeySequence = [];
    let themeTimer = null;

    window.addEventListener('keydown', (e) => {
        const tag = e.target.tagName.toLowerCase();
        const isTyping = (tag === 'input' || tag === 'textarea' || tag === 'select');

        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-shade').forEach(m => m.classList.remove('active'));
            if (isSelectionMode) exitSelectionMode();
            return;
        }

        if (isTyping) return;

        // Shift + F -> Focus search
        if (e.shiftKey && (e.key === 'F' || e.key === 'f')) {
            e.preventDefault();
            const s = document.getElementById('searchInput');
            s.focus();
            s.select();
            return;
        }

        // Shift + C -> Create Folder
        if (e.shiftKey && (e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
            document.getElementById('newFolderTriggerBtn').click();
            return;
        }

        // Shift + U -> File Upload
        if (e.shiftKey && (e.key === 'U' || e.key === 'u')) {
            e.preventDefault();
            nativeFileInput.click();
            return;
        }

        // Shift + S -> Toggle Multi-select mode
        if (e.shiftKey && (e.key === 'S' || e.key === 's')) {
            e.preventDefault();
            if (!isSelectionMode) enterSelectionMode();
            else if (selectedItemIds.size > 0) document.getElementById('btnMultiDelete').click();
            else exitSelectionMode();
            return;
        }

        // Shift + D -> Delete selected items
        if (e.shiftKey && (e.key === 'D' || e.key === 'd')) {
            e.preventDefault();
            if (selectedItemIds.size > 0) document.getElementById('btnMultiDelete').click();
            return;
        }

        // Shift + M -> Move selected
        if (e.shiftKey && (e.key === 'M' || e.key === 'm')) {
            e.preventDefault();
            if (selectedItemIds.size > 0) document.getElementById('btnMultiMove').click();
            return;
        }

        // Theme Switch: Shift+T followed by D or L
        if (e.shiftKey && (e.key === 'T' || e.key === 't')) {
            themeKeySequence = ['T'];
            clearTimeout(themeTimer);
            themeTimer = setTimeout(() => { themeKeySequence = []; }, 1500);
            return;
        }
        if (themeKeySequence[0] === 'T') {
            if (e.key === 'd' || e.key === 'D') {
                setTheme(true);
                showToast("Dark theme enabled");
                themeKeySequence = [];
            } else if (e.key === 'l' || e.key === 'L') {
                setTheme(false);
                showToast("Light theme enabled");
                themeKeySequence = [];
            }
        }
    });

    // Initial Load
    loadDrive();
</script>
</body>
</html>
