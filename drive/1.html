<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge base - All Files</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #f3f4f6;
            --hover-bg: #f9fafb;
            --btn-dark-bg: #0d0d0d;
            --btn-dark-text: #ffffff;
            --accent: #10a37f;
            --danger: #ef4444;
            --sidebar-width: 64px;
        }

        body.dark {
            --bg-color: #0d0d0d;
            --surface-color: #171717;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #262626;
            --hover-bg: #1f1f1f;
            --btn-dark-bg: #ffffff;
            --btn-dark-text: #0d0d0d;
            --accent: #10a37f;
            --danger: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }

        aside.sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            flex-shrink: 0;
            background: var(--surface-color);
        }

        .side-icon {
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; color: var(--text-secondary); cursor: pointer; text-decoration: none; transition: all 0.15s;
        }
        .side-icon:hover, .side-icon.active { background-color: var(--hover-bg); color: var(--text-primary); }
        .side-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

        main.content-area { flex-grow: 1; padding: 36px 48px; max-width: 1200px; position: relative; }
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-title { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

        .btn-pill {
            background-color: var(--btn-dark-bg);
            color: var(--btn-dark-text);
            border: none;
            padding: 10px 18px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .search-container { position: relative; max-width: 360px; margin-bottom: 24px; }
        .search-container svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--text-secondary); stroke-width: 2; fill: none; }
        .search-input {
            width: 100%; padding: 10px 14px 10px 38px; border-radius: 9999px; border: 1px solid var(--border-color);
            background: var(--surface-color); font-size: 14px; color: var(--text-primary); outline: none;
        }

        .data-table { width: 100%; border-collapse: collapse; }
        .table-head {
            display: grid; grid-template-columns: 3.5fr 2fr 1.5fr 1fr 40px;
            padding: 12px 16px; font-size: 13px; font-weight: 500; color: var(--text-secondary); border-bottom: 1px solid var(--border-color);
        }
        .table-row {
            display: grid; grid-template-columns: 3.5fr 2fr 1.5fr 1fr 40px; align-items: center;
            padding: 14px 16px; border-bottom: 1px solid var(--border-color); font-size: 14px; transition: background 0.15s;
        }
        .table-row:hover { background-color: var(--hover-bg); }

        .file-title-cell { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .file-icon-box {
            width: 36px; height: 36px; border-radius: 8px; background: var(--hover-bg);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-secondary);
        }
        .file-icon-box svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; }
        .file-icon-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

        .file-name { font-weight: 500; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .label-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: rgba(16,163,127,0.12); color: var(--accent); margin-left: 6px; }

        .actions-cell { position: relative; text-align: right; }
        .btn-dots { background: none; border: none; padding: 6px; border-radius: 6px; cursor: pointer; color: var(--text-secondary); }
        .action-dropdown {
            position: absolute; right: 0; top: 32px; background: var(--surface-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12); border-radius: 12px; width: 190px; padding: 6px 0; z-index: 100; display: none;
        }
        .action-dropdown.active { display: block; }
        .dropdown-item {
            padding: 9px 16px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--text-primary);
        }
        .dropdown-item:hover { background: var(--hover-bg); }
        .dropdown-item.danger { color: var(--danger); }

        /* Modal Styles */
        .modal-shade {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center; z-index: 500; visibility: hidden; opacity: 0; transition: opacity 0.2s; padding: 16px;
        }
        .modal-shade.active { visibility: visible; opacity: 1; }
        .modal-box { background: var(--surface-color); border-radius: 20px; width: 100%; max-width: 480px; padding: 28px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .clean-input {
            width: 100%; padding: 12px 14px; background: var(--hover-bg); border: none; border-radius: 10px; color: var(--text-primary); font-size: 14px; outline: none; margin-bottom: 14px;
        }
        .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }

        .toast-popup {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #111827; color: #fff; padding: 10px 22px; border-radius: 9999px; font-size: 13px; display: none; z-index: 2000;
        }

        @media(max-width: 768px) {
            aside.sidebar { display: none; }
            main.content-area { padding: 20px 16px; }
            .table-head { display: none; }
            .table-row { grid-template-columns: 1fr auto 30px; }
            .cell-format, .cell-pass { display: none; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <a href="home.html" class="side-icon" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <a href="1.html" class="side-icon active" title="Knowledge Base">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    </a>
    <a href="share.html" class="side-icon" title="Shared with Me">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    </a>
    <a href="label.html" class="side-icon" title="Labels">
        <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
    </a>
    <div class="side-icon" id="themeToggleBtn" title="Toggle Theme" style="margin-top: auto;">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line></svg>
    </div>
</aside>

<main class="content-area">
    <div class="top-row">
        <div class="page-title" id="breadcrumbArea">Knowledge base</div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-pill" id="uploadBtn">+ Upload</button>
            <button class="btn-pill" id="folderBtn" style="background: var(--hover-bg); color: var(--text-primary);">+ Folder</button>
        </div>
    </div>

    <input type="file" id="fileInput" multiple style="display: none;">

    <div class="search-container">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search files...">
    </div>

    <div class="data-table">
        <div class="table-head">
            <div>Name</div>
            <div>Access</div>
            <div class="cell-format">Format</div>
            <div class="cell-pass">Password</div>
            <div></div>
        </div>
        <div id="tableContent"></div>
    </div>
</main>

<!-- Details Modal -->
<div class="modal-shade" id="detailsModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Details</h3>
            <button class="btn-dots" id="closeDetailsModal">&times;</button>
        </div>
        <div id="detailsContent"></div>
    </div>
</div>

<!-- Rename Modal -->
<div class="modal-shade" id="renameModal">
    <div class="modal-box" style="max-width: 380px;">
        <div class="modal-header"><h3>Rename</h3></div>
        <input type="text" id="renameInput" class="clean-input" placeholder="Enter new name...">
        <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button class="btn-pill" id="btnSaveRename">Save</button>
        </div>
    </div>
</div>

<!-- Labels Modal -->
<div class="modal-shade" id="labelModal">
    <div class="modal-box" style="max-width: 380px;">
        <div class="modal-header"><h3>Assign Label</h3></div>
        <input type="text" id="labelInput" class="clean-input" placeholder="e.g. Work, Invoice, Personal">
        <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button class="btn-pill" id="btnSaveLabel">Apply</button>
        </div>
    </div>
</div>

<div class="toast-popup" id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getFirestore, collection, query, where, getDocs, or, doc, updateDoc, deleteDoc, addDoc, arrayUnion 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const IMGBB_API_KEY = "80c452b9a4b80f240ada316f23078d2c";
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Theme Logic
    function syncTheme() {
        const isDark = localStorage.getItem('theme_mode') === 'dark' || 
            (!localStorage.getItem('theme_mode') && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.body.classList.toggle("dark", isDark);
    }
    syncTheme();

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
        const isDark = document.body.classList.toggle("dark");
        localStorage.setItem('theme_mode', isDark ? 'dark' : 'light');
    });

    const user = JSON.parse(localStorage.getItem('active_user') || '{}');
    if (!user.Email) window.location.href = "1.html";
    const userEmail = user.Email;

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2500);
    }

    let currentFolderId = null;
    let currentFolderName = "";
    let activeItem = null;

    async function loadDrive() {
        const container = document.getElementById('tableContent');
        container.innerHTML = `<div style="padding:20px 0; color:var(--text-secondary);">Loading...</div>`;

        try {
            const q = query(
                collection(db, "Cloud Drive"),
                or(
                    where("Email", "==", userEmail),
                    where("Access.Viewer", "array-contains", userEmail),
                    where("Access.Editor", "array-contains", userEmail)
                )
            );

            const snap = await getDocs(q);
            const folders = [];
            const files = [];

            snap.forEach(d => {
                const data = { id: d.id, ...d.data() };
                if (data.Folder === "True") folders.push(data);
                else files.push(data);
            });

            container.innerHTML = "";
            let items = currentFolderId ? files.filter(f => (folders.find(x => x.id === currentFolderId)?.Files || []).includes(f.id)) : [...folders, ...files];

            if (items.length === 0) {
                container.innerHTML = `<div style="padding:24px 0; color:var(--text-secondary);">No files found.</div>`;
                return;
            }

            items.forEach(item => renderRow(item));
        } catch(e) {
            console.error(e);
            container.innerHTML = `<div style="color:var(--danger); padding:16px 0;">Error loading records.</div>`;
        }
    }

    function renderRow(item) {
        const container = document.getElementById('tableContent');
        const isFolder = item.Folder === "True";
        const isImg = (item.Type || '').includes('img');
        const name = item.Name || (item.File ? item.File.split('/').pop() : 'Untitled');

        const row = document.createElement('div');
        row.className = 'table-row';
        row.innerHTML = `
            <div class="file-title-cell">
                <div class="file-icon-box">${isFolder ? '📁' : (isImg ? `<img src="${item.File}">` : '📄')}</div>
                <span class="file-name">${name}</span>
                ${item.Label ? `<span class="label-tag">${item.Label}</span>` : ''}
            </div>
            <div>${item.Email === userEmail ? 'Personal' : 'Shared'}</div>
            <div class="cell-format">${isFolder ? 'Folder' : (item.Type || 'File')}</div>
            <div class="cell-pass">${item.Password ? '🔒 Yes' : 'No'}</div>
            <div class="actions-cell">
                <button class="btn-dots">···</button>
                <div class="action-dropdown">
                    <div class="dropdown-item opt-rename">✏️ Rename</div>
                    <div class="dropdown-item opt-label">🏷️ Add Label</div>
                    <div class="dropdown-item opt-details">ℹ️ Details</div>
                    <div class="dropdown-item danger opt-delete">🗑️ Delete</div>
                </div>
            </div>
        `;

        const dropdown = row.querySelector('.action-dropdown');
        row.querySelector('.btn-dots').onclick = (e) => {
            e.stopPropagation();
            document.querySelectorAll('.action-dropdown').forEach(d => d !== dropdown && d.classList.remove('active'));
            dropdown.classList.toggle('active');
        };

        row.querySelector('.file-name').onclick = () => {
            if (isFolder) {
                currentFolderId = item.id;
                loadDrive();
            } else {
                trackRecent(item);
                window.open(item.File, '_blank');
            }
        };

        row.querySelector('.opt-rename').onclick = () => openRename(item);
        row.querySelector('.opt-label').onclick = () => openLabel(item);
        row.querySelector('.opt-details').onclick = () => showDetails(item);
        row.querySelector('.opt-delete').onclick = async () => {
            if (confirm("Delete file?")) {
                await deleteDoc(doc(db, "Cloud Drive", item.id));
                showToast("Deleted");
                loadDrive();
            }
        };

        container.appendChild(row);
    }

    function trackRecent(item) {
        let recents = JSON.parse(localStorage.getItem('recent_files') || '[]');
        recents = recents.filter(r => r.id !== item.id);
        recents.unshift({ ...item, openedAt: new Date().toISOString() });
        localStorage.setItem('recent_files', JSON.stringify(recents.slice(0, 15)));
    }

    // Modal Actions
    function showDetails(item) {
        document.getElementById('detailsContent').innerHTML = `
            <div class="detail-row"><span>Name</span><span>${item.Name || 'Untitled'}</span></div>
            <div class="detail-row"><span>Type</span><span>${item.Type || 'File'}</span></div>
            <div class="detail-row"><span>Owner</span><span>${item.Email}</span></div>
            <div class="detail-row"><span>Label</span><span>${item.Label || 'None'}</span></div>
            <div class="detail-row"><span>Upload Date</span><span>${item.CreatedAt ? new Date(item.CreatedAt).toLocaleDateString() : 'Recent'}</span></div>
        `;
        document.getElementById('detailsModal').classList.add('active');
    }
    document.getElementById('closeDetailsModal').onclick = () => document.getElementById('detailsModal').classList.remove('active');

    function openRename(item) {
        activeItem = item;
        document.getElementById('renameInput').value = item.Name || '';
        document.getElementById('renameModal').classList.add('active');
    }
    document.getElementById('btnSaveRename').onclick = async () => {
        const val = document.getElementById('renameInput').value.trim();
        if (val && activeItem) {
            await updateDoc(doc(db, "Cloud Drive", activeItem.id), { Name: val });
            document.getElementById('renameModal').classList.remove('active');
            showToast("Renamed");
            loadDrive();
        }
    };

    function openLabel(item) {
        activeItem = item;
        document.getElementById('labelInput').value = item.Label || '';
        document.getElementById('labelModal').classList.add('active');
    }
    document.getElementById('btnSaveLabel').onclick = async () => {
        const val = document.getElementById('labelInput').value.trim();
        if (activeItem) {
            await updateDoc(doc(db, "Cloud Drive", activeItem.id), { Label: val });
            document.getElementById('labelModal').classList.remove('active');
            showToast("Label updated");
            loadDrive();
        }
    };

    // Upload & Folder triggers
    const fileInput = document.getElementById('fileInput');
    document.getElementById('uploadBtn').onclick = () => fileInput.click();
    fileInput.onchange = async (e) => {
        for (const file of e.target.files) {
            showToast(`Uploading ${file.name}...`);
            const fd = new FormData();
            fd.append('image', file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: fd });
            const j = await res.json();
            await addDoc(collection(db, "Cloud Drive"), {
                Email: userEmail,
                File: j.data.url,
                Name: file.name,
                Type: ".img",
                Size: file.size,
                CreatedAt: new Date().toISOString(),
                Access: { Viewer: [], Editor: [] }
            });
        }
        showToast("Uploaded successfully");
        loadDrive();
    };

    window.onclick = () => document.querySelectorAll('.action-dropdown').forEach(d => d.classList.remove('active'));
    loadDrive();
</script>
</body>
</html>
