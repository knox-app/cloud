<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Base - Cloud Drive</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #f3f4f6;
            --hover-bg: #f9fafb;
            --btn-dark-bg: #0d0d0d;
            --btn-dark-text: #ffffff;
            --accent: #10a37f;
            --danger: #ef4444;
            --selected-bg: #eff6ff;
            --selected-border: #3b82f6;
            --sidebar-width: 64px;
        }

        body.dark {
            --bg-color: #0d0d0d;
            --surface-color: #171717;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #262626;
            --hover-bg: #1f1f1f;
            --btn-dark-bg: #ffffff;
            --btn-dark-text: #0d0d0d;
            --accent: #10a37f;
            --danger: #f87171;
            --selected-bg: #1e293b;
            --selected-border: #60a5fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar */
        aside.sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            flex-shrink: 0;
            background: var(--surface-color);
        }

        .side-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .side-icon:hover, .side-icon.active {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }
        .side-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

        /* Main Workspace */
        main.content-area {
            flex-grow: 1;
            padding: 32px 40px;
            max-width: 1200px;
            position: relative;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .breadcrumbs-bar {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .crumb-link {
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.15s;
        }
        .crumb-link:hover { color: var(--text-primary); }

        .btn-pill {
            background-color: var(--btn-dark-bg);
            color: var(--btn-dark-text);
            border: none;
            padding: 10px 18px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn-pill:hover { opacity: 0.9; }

        /* Search input */
        .search-container {
            position: relative;
            max-width: 360px;
            margin-bottom: 20px;
        }
        .search-container svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            fill: none;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
        }

        /* Drag & Drop Overlay */
        .drag-overlay {
            position: fixed;
            inset: 0;
            background: rgba(16, 163, 127, 0.08);
            border: 2px dashed var(--accent);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }
        .drag-overlay.active { display: flex; }
        .drag-overlay-card {
            background: var(--surface-color);
            padding: 20px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Data Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .table-head {
            display: grid;
            grid-template-columns: 35px 3.5fr 1.5fr 1.2fr 1fr 40px;
            padding: 12px 14px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
        }

        .table-row {
            display: grid;
            grid-template-columns: 35px 3.5fr 1.5fr 1.2fr 1fr 40px;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            transition: background 0.15s;
            border-radius: 10px;
            cursor: pointer;
        }
        .table-row:hover { background-color: var(--hover-bg); }
        .table-row.selected {
            background-color: var(--selected-bg) !important;
        }

        .select-checkbox {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .table-row.selected .select-checkbox {
            background: var(--accent);
            border-color: var(--accent);
        }
        .table-row.selected .select-checkbox::after {
            content: '✓';
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
        }

        .file-title-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-icon-box {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--hover-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--text-secondary);
        }
        .file-icon-box svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; }
        .file-icon-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

        .file-info-col {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .file-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-tags-row {
            display: flex;
            gap: 4px;
            margin-top: 2px;
            flex-wrap: wrap;
        }
        .tag-pill {
            font-size: 10px;
            background: var(--border-color);
            padding: 1px 6px;
            border-radius: 4px;
            color: var(--text-secondary);
        }

        /* 3-Dots Dropdown */
        .actions-cell { position: relative; text-align: right; }
        .btn-dots {
            background: none;
            border: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-dots:hover { color: var(--text-primary); background: var(--border-color); }
        .btn-dots svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        .action-dropdown {
            position: absolute;
            right: 0;
            top: 32px;
            background: var(--surface-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 12px;
            width: 190px;
            padding: 6px 0;
            z-index: 100;
            display: none;
            border: 1px solid var(--border-color);
        }
        .action-dropdown.active { display: block; }
        .dropdown-item {
            padding: 9px 14px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .dropdown-item:hover { background: var(--hover-bg); }
        .dropdown-item.danger { color: var(--danger); }
        .dropdown-item svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }

        /* Floating Bulk Action Bar */
        .bulk-action-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--btn-dark-bg);
            color: var(--btn-dark-text);
            padding: 10px 24px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            z-index: 400;
            transition: transform 0.25s ease;
        }
        .bulk-action-bar.active {
            transform: translateX(-50%) translateY(0);
        }
        .bulk-btn {
            background: none;
            border: none;
            color: var(--btn-dark-text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bulk-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        /* Borderless Modals */
        .modal-shade {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 600;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 16px;
        }
        .modal-shade.active { visibility: visible; opacity: 1; }

        .modal-box {
            background: var(--surface-color);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 28px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .modal-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .clean-input {
            width: 100%;
            padding: 12px 14px;
            background: var(--hover-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        /* Details list */
        .details-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }
        .details-label { color: var(--text-secondary); }

        .toast-popup {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 9999px;
            font-size: 13px;
            display: none;
            z-index: 2000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* Mobile / Tablet Responsive Adjustments */
        @media (max-width: 768px) {
            aside.sidebar { display: none; }
            main.content-area { padding: 18px 14px; width: 100%; }
            .table-head { display: none; }
            .table-row {
                grid-template-columns: 28px 1fr 30px;
                gap: 8px;
                padding: 12px 6px;
            }
            .cell-access, .cell-format, .cell-password { display: none; }
            .modal-box { padding: 22px; }
            .bulk-action-bar { width: 90%; justify-content: space-around; padding: 10px 14px; font-size: 11px; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="side-icon active" title="Knowledge Base">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    </div>
    <div class="side-icon" id="logoutSideBtn" title="Sign Out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </div>
</aside>

<!-- Drag Overlay -->
<div class="drag-overlay" id="dragOverlay">
    <div class="drag-overlay-card">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span>Drop files here to upload to current folder</span>
    </div>
</div>

<!-- Main Area -->
<main class="content-area">
    <div class="top-row">
        <div class="breadcrumbs-bar" id="breadcrumbArea">
            <span class="crumb-link" id="rootCrumb">Knowledge base</span>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-pill" id="uploadTriggerBtn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Upload
            </button>
            <button class="btn-pill" id="newFolderTriggerBtn" style="background: var(--hover-bg); color: var(--text-primary); border: 1px solid var(--border-color);">
                + Folder
            </button>
        </div>
    </div>

    <input type="file" id="nativeFileInput" multiple style="display: none;">

    <div class="search-container">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search files & folders">
    </div>

    <div class="data-table">
        <div class="table-head">
            <div></div>
            <div>Name</div>
            <div class="cell-access">Access</div>
            <div class="cell-format">Format</div>
            <div class="cell-password">Password</div>
            <div></div>
        </div>
        <div id="tableContent">
            <div style="padding: 24px 0; color: var(--text-secondary); font-size: 14px;">Loading workspace...</div>
        </div>
    </div>
</main>

<!-- Floating Bulk Bar -->
<div class="bulk-action-bar" id="bulkActionBar">
    <span id="bulkCount" style="font-weight: 600; font-size: 13px;">0 Selected</span>
    <button class="bulk-btn" id="bulkDownloadBtn">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Download
    </button>
    <button class="bulk-btn" id="bulkLabelBtn">
        <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
        Label
    </button>
    <button class="bulk-btn" id="bulkMoveBtn">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        Move
    </button>
    <button class="bulk-btn" id="bulkDeleteBtn" style="color: var(--danger);">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        Delete
    </button>
</div>

<!-- Modal: Rename -->
<div class="modal-shade" id="renameModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Rename</div>
            <button class="modal-close" onclick="closeModal('renameModal')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group">
            <input type="text" id="renameInput" class="clean-input">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-pill" id="btnSaveRename">Save</button>
        </div>
    </div>
</div>

<!-- Modal: Details Inspector -->
<div class="modal-shade" id="detailsModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Item Details</div>
            <button class="modal-close" onclick="closeModal('detailsModal')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div id="detailsContent"></div>
    </div>
</div>

<!-- Modal: Label / Tags -->
<div class="modal-shade" id="labelModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Edit Labels</div>
            <button class="modal-close" onclick="closeModal('labelModal')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group">
            <label>Comma-separated Tags</label>
            <input type="text" id="labelTagsInput" class="clean-input" placeholder="e.g. Important, Invoices, Marketing">
        </div>
        <div style="display: flex; justify-content: flex-end;">
            <button class="btn-pill" id="btnSaveLabels">Save Labels</button>
        </div>
    </div>
</div>

<!-- Modal: Move To Folder (With On-the-fly Folder Creation) -->
<div class="modal-shade" id="moveFolderModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Move To Folder</div>
            <button class="modal-close" onclick="closeModal('moveFolderModal')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group">
            <label>Select Destination Folder</label>
            <select id="moveDestinationSelect" class="clean-input"></select>
        </div>
        <div class="input-group">
            <label>Or Create New Folder Here</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="moveInlineNewFolder" class="clean-input" placeholder="New folder name">
                <button class="btn-pill" id="btnCreateAndSelectFolder" style="padding: 0 16px;">Create</button>
            </div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
            <button class="btn-pill" id="btnConfirmMove">Move Here</button>
        </div>
    </div>
</div>

<!-- Modal: Password Unlock -->
<div class="modal-shade" id="passwordAuthModal">
    <div class="modal-box" style="max-width: 360px;">
        <div class="modal-header">
            <div class="modal-title">Enter Password</div>
            <button class="modal-close" onclick="closeModal('passwordAuthModal')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group">
            <input type="password" id="authPasswordInput" class="clean-input" placeholder="Password required">
        </div>
        <div style="display: flex; justify-content: flex-end;">
            <button class="btn-pill" id="btnSubmitAuth">Unlock</button>
        </div>
    </div>
</div>

<!-- Modal: Create Folder -->
<div class="modal-shade" id="folderModal">
    <div class="modal-box" style="max-width: 400px;">
        <div class="modal-header">
            <div class="modal-title">New Folder</div>
            <button class="modal-close" onclick="closeModal('folderModal')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group">
            <label>Folder Name</label>
            <input type="text" id="newFolderName" class="clean-input" placeholder="e.g. Design, Financials">
        </div>
        <div class="input-group">
            <label>Folder Password (Optional)</label>
            <input type="text" id="newFolderPassword" class="clean-input" placeholder="Password protection">
        </div>
        <div style="display: flex; justify-content: flex-end;">
            <button class="btn-pill" id="btnCreateFolder">Create Folder</button>
        </div>
    </div>
</div>

<div class="toast-popup" id="toastPopup"></div>

    // Auth
    let currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('active_user')); } catch(e){}
    if (!currentUser || !currentUser.Email) window.location.href = "1.html";
    const userEmail = currentUser.Email;

    document.getElementById('logoutSideBtn').addEventListener('click', () => {
        localStorage.removeItem('active_user');
        window.location.reload();
    });

    window.closeModal = function(id) {
        document.getElementById(id).classList.remove('active');
    };

    function showToast(msg) {
        const t = document.getElementById('toastPopup');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2400);
    }

    const SVG_ICONS = {
        folder: `<svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`,
        image: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`,
        pdf: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>`,
        doc: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`,
        video: `<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>`,
        dots: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>`,
        download: `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`,
        edit: `<svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>`,
        tag: `<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>`,
        info: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`,
        trash: `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`
    };

    function getFormatInfo(typeStr, isFolder) {
        if (isFolder) return { label: "Folder", icon: SVG_ICONS.folder };
        const t = (typeStr || "").toLowerCase();
        if (t.includes("img") || t.includes("png") || t.includes("jpg") || t.includes("jpeg")) return { label: "Image", icon: SVG_ICONS.image };
        if (t.includes("pdf")) return { label: "PDF", icon: SVG_ICONS.pdf };
        if (t.includes("mp4") || t.includes("video")) return { label: "Video", icon: SVG_ICONS.video };
        return { label: "Document", icon: SVG_ICONS.doc };
    }

    // Navigation and Multi-Folder State
    let currentFolderId = "root";
    let folderPathStack = [{ id: "root", name: "Knowledge base" }];
    let allWorkspaceData = [];
    let selectedItemIds = new Set();

    function updateBreadcrumb() {
        const bar = document.getElementById('breadcrumbArea');
        bar.innerHTML = "";
        folderPathStack.forEach((crumb, idx) => {
            const isLast = idx === folderPathStack.length - 1;
            const span = document.createElement('span');
            span.className = isLast ? "" : "crumb-link";
            span.innerText = crumb.name;
            if (!isLast) {
                span.addEventListener('click', () => {
                    folderPathStack = folderPathStack.slice(0, idx + 1);
                    currentFolderId = crumb.id;
                    selectedItemIds.clear();
                    updateBulkBar();
                    loadDrive();
                });
            }
            bar.appendChild(span);
            if (!isLast) {
                const sep = document.createElement('span');
                sep.innerText = "/";
                sep.style.color = "var(--text-secondary)";
                bar.appendChild(sep);
            }
        });
    }

    // Load Data (Recursive folder tree support)
    async function loadDrive() {
        updateBreadcrumb();
        const container = document.getElementById('tableContent');
        container.innerHTML = `<div style="padding: 24px 0; color: var(--text-secondary);">Loading items...</div>`;

        try {
            const q = query(
                collection(db, "Cloud Drive"),
                or(
                    where("Email", "==", userEmail),
                    where("Access.Viewer", "array-contains", userEmail),
                    where("Access.Commentator", "array-contains", userEmail),
                    where("Access.Editor", "array-contains", userEmail)
                )
            );

            const snap = await getDocs(q);
            allWorkspaceData = [];
            snap.forEach(d => allWorkspaceData.push({ id: d.id, ...d.data() }));

            container.innerHTML = "";

            // Filter items by parent folder
            const currentItems = allWorkspaceData.filter(item => (item.parentId || "root") === currentFolderId);

            if (currentItems.length === 0) {
                container.innerHTML = `<div style="padding: 32px 0; color: var(--text-secondary);">This folder is empty.</div>`;
                return;
            }

            currentItems.forEach(item => renderRow(item));
        } catch(e) {
            console.error(e);
            container.innerHTML = `<div style="padding: 20px 0; color: var(--danger);">Failed to load workspace.</div>`;
        }
    }

    function renderRow(item) {
        const container = document.getElementById('tableContent');
        const isFolder = item.Folder === "True";
        const name = item.Name || (item.File ? item.File.split('/').pop() : 'Untitled');
        const format = getFormatInfo(item.Type, isFolder);
        const tags = Array.isArray(item.Tags) ? item.Tags : [];

        const isSelected = selectedItemIds.has(item.id);

        const row = document.createElement('div');
        row.className = `table-row ${isSelected ? 'selected' : ''}`;
        row.dataset.id = item.id;

        const tagsHtml = tags.map(t => `<span class="tag-pill">${t}</span>`).join('');

        row.innerHTML = `
            <div><div class="select-checkbox"></div></div>
            <div class="file-title-cell">
                <div class="file-icon-box">${format.icon}</div>
                <div class="file-info-col">
                    <span class="file-name" title="${name}">${name}</span>
                    <div class="file-tags-row">${tagsHtml}</div>
                </div>
            </div>
            <div class="cell-access" style="font-size: 13px; color: var(--text-secondary);">${item.Email === userEmail ? 'Personal' : 'Shared'}</div>
            <div class="cell-format" style="font-size: 13px; color: var(--text-secondary);">${format.label}</div>
            <div class="cell-password" style="font-size: 13px; color: var(--text-secondary);">${item.Password ? '🔒 Protected' : 'None'}</div>
            <div class="actions-cell">
                <button class="btn-dots">${SVG_ICONS.dots}</button>
                <div class="action-dropdown">
                    <div class="dropdown-item opt-open">${SVG_ICONS.info} Open / Preview</div>
                    ${!isFolder ? `<div class="dropdown-item opt-download">${SVG_ICONS.download} Download</div>` : ''}
                    <div class="dropdown-item opt-rename">${SVG_ICONS.edit} Rename</div>
                    <div class="dropdown-item opt-label">${SVG_ICONS.tag} Label</div>
                    <div class="dropdown-item opt-move">${SVG_ICONS.folder} Move to folder</div>
                    <div class="dropdown-item opt-details">${SVG_ICONS.info} Details</div>
                    <div class="dropdown-item danger opt-delete">${SVG_ICONS.trash} Delete</div>
                </div>
            </div>
        `;

        // Selection Handlers (Single Tap to open, Long press / Double click to select)
        let pressTimer = null;
        let clickTimeout = null;

        // Mobile Longpress
        row.addEventListener('touchstart', (e) => {
            pressTimer = setTimeout(() => {
                toggleSelection(item.id, row);
            }, 600);
        });
        row.addEventListener('touchend', () => clearTimeout(pressTimer));

        // Checkbox click
        row.querySelector('.select-checkbox').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleSelection(item.id, row);
        });

        // Double Click Selection & Single Click to Open
        row.addEventListener('click', (e) => {
            if (e.target.closest('.actions-cell') || e.target.closest('.select-checkbox')) return;

            if (selectedItemIds.size > 0) {
                toggleSelection(item.id, row);
                return;
            }

            if (clickTimeout) {
                // Double tap / Double click detected: Trigger multi-select
                clearTimeout(clickTimeout);
                clickTimeout = null;
                toggleSelection(item.id, row);
            } else {
                clickTimeout = setTimeout(() => {
                    clickTimeout = null;
                    // Single Tap Action: Open
                    handleItemOpen(item);
                }, 250);
            }
        });

        // 3-Dots Menu
        const dotsBtn = row.querySelector('.btn-dots');
        const dropdown = row.querySelector('.action-dropdown');

        dotsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.action-dropdown').forEach(d => d !== dropdown && d.classList.remove('active'));
            dropdown.classList.toggle('active');
        });

        // Menu Action Hooks
        row.querySelector('.opt-open').addEventListener('click', () => handleItemOpen(item));
        if (!isFolder) {
            row.querySelector('.opt-download').addEventListener('click', () => downloadFile(item));
        }
        row.querySelector('.opt-rename').addEventListener('click', () => openRenameModal(item));
        row.querySelector('.opt-label').addEventListener('click', () => openLabelModal([item.id]));
        row.querySelector('.opt-move').addEventListener('click', () => openMoveModal([item.id]));
        row.querySelector('.opt-details').addEventListener('click', () => openDetailsModal(item));
        row.querySelector('.opt-delete').addEventListener('click', async () => {
            if (confirm("Delete this item permanently?")) {
                await deleteDoc(doc(db, "Cloud Drive", item.id));
                showToast("Item deleted");
                loadDrive();
            }
        });

        container.appendChild(row);
    }

    function toggleSelection(id, rowElem) {
        if (selectedItemIds.has(id)) {
            selectedItemIds.delete(id);
            rowElem.classList.remove('selected');
        } else {
            selectedItemIds.add(id);
            rowElem.classList.add('selected');
        }
        updateBulkBar();
    }

    function updateBulkBar() {
        const bar = document.getElementById('bulkActionBar');
        const count = document.getElementById('bulkCount');
        if (selectedItemIds.size > 0) {
            count.innerText = `${selectedItemIds.size} Selected`;
            bar.classList.add('active');
        } else {
            bar.classList.remove('active');
        }
    }

    // Open item action with /file?id= preview routing
    function handleItemOpen(item) {
        if (item.Password) {
            promptPasswordAuth(item.Password, () => {
                proceedOpen(item);
            });
        } else {
            proceedOpen(item);
        }
    }

    function proceedOpen(item) {
        const isFolder = item.Folder === "True";
        if (isFolder) {
            currentFolderId = item.id;
            folderPathStack.push({ id: item.id, name: item.Name });
            selectedItemIds.clear();
            updateBulkBar();
            loadDrive();
        } else {
            // Preview Route requested
            window.location.href = `/file?id=${item.id}`;
        }
    }

    function downloadFile(item) {
        if (item.File) {
            window.open(item.File, '_blank');
        }
    }

    // Password Unlock Modal
    let authSuccessCallback = null;
    let requiredPass = "";
    function promptPasswordAuth(pass, onSuccess) {
        requiredPass = pass;
        authSuccessCallback = onSuccess;
        document.getElementById('authPasswordInput').value = "";
        document.getElementById('passwordAuthModal').classList.add('active');
    }
    document.getElementById('btnSubmitAuth').addEventListener('click', () => {
        const val = document.getElementById('authPasswordInput').value;
        if (val === requiredPass) {
            closeModal('passwordAuthModal');
            if (authSuccessCallback) authSuccessCallback();
        } else {
            showToast("Incorrect password!");
        }
    });

    // Rename Modal
    let renamingItem = null;
    function openRenameModal(item) {
        renamingItem = item;
        document.getElementById('renameInput').value = item.Name || item.File.split('/').pop();
        document.getElementById('renameModal').classList.add('active');
    }
    document.getElementById('btnSaveRename').addEventListener('click', async () => {
        const val = document.getElementById('renameInput').value.trim();
        if (val && renamingItem) {
            await updateDoc(doc(db, "Cloud Drive", renamingItem.id), { Name: val });
            closeModal('renameModal');
            showToast("Renamed");
            loadDrive();
        }
    });

    // Details Inspector Modal
    function openDetailsModal(item) {
        const isFolder = item.Folder === "True";
        const format = getFormatInfo(item.Type, isFolder);
        const content = document.getElementById('detailsContent');
        content.innerHTML = `
            <div class="details-row"><span class="details-label">Name</span><span>${item.Name || 'Untitled'}</span></div>
            <div class="details-row"><span class="details-label">Type</span><span>${format.label}</span></div>
            <div class="details-row"><span class="details-label">Owner</span><span>${item.Email}</span></div>
            <div class="details-row"><span class="details-label">Folder Location</span><span>${item.parentId || 'Root'}</span></div>
            <div class="details-row"><span class="details-label">Protection</span><span>${item.Password ? 'Password Enabled' : 'None'}</span></div>
            <div class="details-row"><span class="details-label">Labels</span><span>${(item.Tags || []).join(', ') || 'None'}</span></div>
            ${item.File ? `<div class="details-row"><span class="details-label">Hosted URL</span><a href="${item.File}" target="_blank" style="color:var(--accent); font-size:12px;">Open Source</a></div>` : ''}
        `;
        document.getElementById('detailsModal').classList.add('active');
    }

    // Label Management (Single & Batch)
    let targetLabelIds = [];
    function openLabelModal(ids) {
        targetLabelIds = ids;
        document.getElementById('labelTagsInput').value = "";
        document.getElementById('labelModal').classList.add('active');
    }
    document.getElementById('btnSaveLabels').addEventListener('click', async () => {
        const raw = document.getElementById('labelTagsInput').value;
        const tags = raw.split(',').map(s => s.trim()).filter(Boolean);
        for (const id of targetLabelIds) {
            await updateDoc(doc(db, "Cloud Drive", id), { Tags: tags });
        }
        closeModal('labelModal');
        selectedItemIds.clear();
        updateBulkBar();
        showToast("Labels updated");
        loadDrive();
    });

    // Move To Folder (With recursive folders & on-the-fly folder creation)
    let moveTargetItemIds = [];
    function openMoveModal(ids) {
        moveTargetItemIds = ids;
        const select = document.getElementById('moveDestinationSelect');
        select.innerHTML = `<option value="root">📁 Knowledge base (Root)</option>`;

        const allFolders = allWorkspaceData.filter(d => d.Folder === "True" && !ids.includes(d.id));
        allFolders.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f.id;
            opt.innerText = `📁 ${f.Name}`;
            select.appendChild(opt);
        });

        document.getElementById('moveFolderModal').classList.add('active');
    }

    document.getElementById('btnCreateAndSelectFolder').addEventListener('click', async () => {
        const name = document.getElementById('moveInlineNewFolder').value.trim();
        if (!name) return;
        const newFolderDoc = await addDoc(collection(db, "Cloud Drive"), {
            Email: userEmail,
            Folder: "True",
            Name: name,
            parentId: currentFolderId,
            Password: "",
            Tags: []
        });

        const select = document.getElementById('moveDestinationSelect');
        const opt = document.createElement('option');
        opt.value = newFolderDoc.id;
        opt.innerText = `📁 ${name}`;
        opt.selected = true;
        select.appendChild(opt);

        document.getElementById('moveInlineNewFolder').value = "";
        showToast(`Created folder "${name}"`);
    });

    document.getElementById('btnConfirmMove').addEventListener('click', async () => {
        const destination = document.getElementById('moveDestinationSelect').value;
        for (const id of moveTargetItemIds) {
            await updateDoc(doc(db, "Cloud Drive", id), { parentId: destination });
        }
        closeModal('moveFolderModal');
        selectedItemIds.clear();
        updateBulkBar();
        showToast("Items moved successfully");
        loadDrive();
    });

    // Bulk Bar Action Listeners
    document.getElementById('bulkDeleteBtn').addEventListener('click', async () => {
        if (confirm(`Permanently delete ${selectedItemIds.size} items?`)) {
            for (const id of selectedItemIds) {
                await deleteDoc(doc(db, "Cloud Drive", id));
            }
            selectedItemIds.clear();
            updateBulkBar();
            showToast("Items deleted");
            loadDrive();
        }
    });
    document.getElementById('bulkLabelBtn').addEventListener('click', () => openLabelModal([...selectedItemIds]));
    document.getElementById('bulkMoveBtn').addEventListener('click', () => openMoveModal([...selectedItemIds]));
    document.getElementById('bulkDownloadBtn').addEventListener('click', () => {
        selectedItemIds.forEach(id => {
            const item = allWorkspaceData.find(d => d.id === id);
            if (item && item.File) window.open(item.File, '_blank');
        });
    });

    // Create New Folder
    document.getElementById('newFolderTriggerBtn').addEventListener('click', () => {
        document.getElementById('newFolderName').value = "";
        document.getElementById('newFolderPassword').value = "";
        document.getElementById('folderModal').classList.add('active');
    });
    document.getElementById('btnCreateFolder').addEventListener('click', async () => {
        const name = document.getElementById('newFolderName').value.trim();
        const pass = document.getElementById('newFolderPassword').value.trim();
        if (name) {
            await addDoc(collection(db, "Cloud Drive"), {
                Email: userEmail,
                Folder: "True",
                Name: name,
                parentId: currentFolderId,
                Password: pass,
                Tags: []
            });
            closeModal('folderModal');
            showToast("Folder created");
            loadDrive();
        }
    });

    // Multi-File Upload Handling
    const nativeFileInput = document.getElementById('nativeFileInput');
    document.getElementById('uploadTriggerBtn').addEventListener('click', () => nativeFileInput.click());
    nativeFileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleBatchUpload(e.target.files);
    });

    const dragOverlay = document.getElementById('dragOverlay');
    window.addEventListener('dragover', (e) => { e.preventDefault(); dragOverlay.classList.add('active'); });
    window.addEventListener('dragleave', (e) => {
        if (e.clientX === 0 && e.clientY === 0) dragOverlay.classList.remove('active');
    });
    window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragOverlay.classList.remove('active');
        if (e.dataTransfer.files.length) handleBatchUpload(e.dataTransfer.files);
    });

    async function handleBatchUpload(files) {
        showToast(`Uploading ${files.length} file(s)...`);
        for (const file of files) {
            if (file.size > 50 * 1024 * 1024) continue;
            try {
                let fileUrl = "";
                let fileType = "";
                if (file.type.startsWith('image/')) {
                    const fd = new FormData();
                    fd.append('image', file);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = j.data.url;
                    fileType = ".img";
                } else {
                    const fd = new FormData();
                    fd.append('UPLOADCARE_PUB_KEY', UPLOADCARE_PUB_KEY);
                    fd.append('UPLOADCARE_STORE', '1');
                    fd.append('file', file);
                    const res = await fetch('https://upload.uploadcare.com/base/', { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = `https://ucarecdn.com/${j.file}/${encodeURIComponent(file.name)}`;
                    const ext = file.name.split('.').pop();
                    fileType = ext ? `.${ext.toLowerCase()}` : '.file';
                }

                await addDoc(collection(db, "Cloud Drive"), {
                    Email: userEmail,
                    File: fileUrl,
                    Type: fileType,
                    Name: file.name,
                    parentId: currentFolderId,
                    Password: "",
                    Tags: []
                });
            } catch(e) { console.error(e); }
        }
        showToast("Upload complete");
        loadDrive();
    }

    // Dismiss 3-dots menus on outer click
    window.addEventListener('click', () => {
        document.querySelectorAll('.action-dropdown').forEach(d => d.classList.remove('active'));
    });

    // Search Filtering
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.table-row').forEach(row => {
            const name = row.querySelector('.file-name').innerText.toLowerCase();
            row.style.display = name.includes(val) ? 'grid' : 'none';
        });
    });

    loadDrive();
</script>
</body>
</html>
