<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge base - Cloud Drive</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --surface-color: #171717;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #262626;
            --hover-bg: #1f1f1f;
            --accent: #ffffff;
            --accent-text: #000000;
            --danger: #ef4444;
            --sidebar-width: 64px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }

        aside.sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            flex-shrink: 0;
            background: var(--surface-color);
        }

        .side-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
        }
        .side-icon:hover, .side-icon.active {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }
        .side-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }

        main.main-content {
            flex-grow: 1;
            padding: 36px 48px;
            max-width: 1200px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-pill {
            background-color: var(--accent);
            color: var(--accent-text);
            border: none;
            padding: 9px 18px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: opacity 0.15s;
        }
        .btn-pill:hover { opacity: 0.9; }

        .search-container {
            position: relative;
            max-width: 360px;
            margin-bottom: 24px;
        }
        .search-container svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            fill: none;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
        }

        /* Drag Overlay */
        .drag-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed #ffffff;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }
        .drag-overlay.active { display: flex; }

        /* Data Table */
        .data-table { width: 100%; }
        .table-head {
            display: grid;
            grid-template-columns: 3fr 1.5fr 1.2fr 1.2fr 1.2fr 40px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .table-row {
            display: grid;
            grid-template-columns: 3fr 1.5fr 1.2fr 1.2fr 1.2fr 40px;
            align-items: center;
            padding: 14px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            transition: background 0.15s;
        }
        .table-row:hover { background: var(--hover-bg); }

        .file-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }
        .icon-box {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #262626;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }
        .icon-box img { width: 100%; height: 100%; object-fit: cover; }
        .icon-box svg { width: 18px; height: 18px; stroke: var(--text-secondary); fill: none; stroke-width: 1.8; }

        .file-name {
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Inline Label Badge */
        .label-badge {
            background: #27272a;
            color: #d4d4d8;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            display: inline-block;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 3-Dots Menu */
        .actions-cell { position: relative; text-align: right; }
        .dots-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }
        .dots-btn:hover { color: var(--text-primary); }
        .dots-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        .action-dropdown {
            position: absolute;
            right: 0;
            top: 28px;
            background: #18181b;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 12px;
            width: 160px;
            padding: 6px 0;
            z-index: 100;
            display: none;
        }
        .action-dropdown.active { display: block; }
        .dropdown-item {
            padding: 9px 14px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }
        .dropdown-item:hover { background: var(--hover-bg); }
        .dropdown-item.danger { color: var(--danger); }

        /* Minimal Borderless Modal */
        .modal-shade {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 16px;
        }
        .modal-shade.active { visibility: visible; opacity: 1; }

        .modal-box {
            background: var(--surface-color);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            padding: 28px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { background: none; border: none; color: var(--text-secondary); cursor: pointer; }
        .modal-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

        .clean-input {
            width: 100%;
            padding: 12px 14px;
            background: #262626;
            border: none;
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }
        .detail-label { color: var(--text-secondary); }

        .toast-popup {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #000000;
            padding: 9px 20px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            z-index: 2000;
        }

        @media (max-width: 768px) {
            aside.sidebar { display: none; }
            main.main-content { padding: 20px 16px; }
            .table-head { display: none; }
            .table-row {
                grid-template-columns: 1fr auto 30px;
                gap: 8px;
                padding: 12px 0;
            }
            .cell-owner, .cell-format, .cell-label { display: none; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <a href="home.html" class="side-icon" title="Home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>
    <a href="1.html" class="side-icon active" title="Knowledge base">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    </a>
    <div class="side-icon" id="logoutBtn" title="Sign Out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </div>
</aside>

<div class="drag-overlay" id="dragOverlay">
    <div style="background: #18181b; padding: 20px 30px; border-radius: 12px; font-weight: 500;">Drop files to upload</div>
</div>

<main class="main-content">
    <div class="header-top">
        <div class="page-title" id="breadcrumbNav">Knowledge base</div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-pill" id="uploadTrigger">+ Upload</button>
            <button class="btn-pill" id="createFolderTrigger" style="background: #262626; color: #fff;">+ Folder</button>
        </div>
    </div>

    <input type="file" id="multiFileInput" multiple style="display: none;">

    <div class="search-container">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchDriveInput" class="search-input" placeholder="Search knowledge base">
    </div>

    <div class="data-table">
        <div class="table-head">
            <div>Name</div>
            <div class="cell-owner">Uploaded by</div>
            <div class="cell-format">Format</div>
            <div class="cell-label">Label</div>
            <div>Access</div>
            <div></div>
        </div>
        <div id="driveItemList">
            <div style="padding: 24px 0; color: var(--text-secondary); font-size: 14px;">Loading workspace...</div>
        </div>
    </div>
</main>

<!-- Details Modal -->
<div class="modal-shade" id="detailsModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Item Details</div>
            <button class="modal-close" id="closeDetailsModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="detail-row"><span class="detail-label">File Name</span><span id="detName"></span></div>
        <div class="detail-row"><span class="detail-label">File Size</span><span id="detSize"></span></div>
        <div class="detail-row"><span class="detail-label">Uploaded Date</span><span id="detDate"></span></div>
        <div class="detail-row"><span class="detail-label">Owner</span><span id="detOwner"></span></div>
        <div class="detail-row"><span class="detail-label">Who has Access</span><span id="detAccess"></span></div>
    </div>
</div>

<!-- Rename Modal -->
<div class="modal-shade" id="renameModal">
    <div class="modal-box" style="max-width: 380px;">
        <div class="modal-header">
            <div class="modal-title">Rename</div>
            <button class="modal-close" id="closeRenameModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <input type="text" id="renameField" class="clean-input">
        <div style="display: flex; justify-content: flex-end;"><button class="btn-pill" id="submitRenameBtn">Save</button></div>
    </div>
</div>

<!-- Label Editor Modal -->
<div class="modal-shade" id="labelModal">
    <div class="modal-box" style="max-width: 380px;">
        <div class="modal-header">
            <div class="modal-title">Edit Label</div>
            <button class="modal-close" id="closeLabelModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <input type="text" id="labelInputField" class="clean-input" placeholder="e.g. Work, Urgent, Archive">
        <div style="display: flex; justify-content: flex-end;"><button class="btn-pill" id="submitLabelBtn">Update</button></div>
    </div>
</div>

<!-- Create Sub/Root Folder Modal -->
<div class="modal-shade" id="createFolderModal">
    <div class="modal-box" style="max-width: 380px;">
        <div class="modal-header">
            <div class="modal-title">New Folder</div>
            <button class="modal-close" id="closeFolderModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <input type="text" id="newFolderTitle" class="clean-input" placeholder="Folder Name">
        <div style="display: flex; justify-content: flex-end;"><button class="btn-pill" id="submitFolderCreateBtn">Create</button></div>
    </div>
</div>

<div class="toast-popup" id="toastPopup"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getFirestore, collection, query, where, getDocs, or, doc, updateDoc, deleteDoc, addDoc, arrayUnion 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const IMGBB_API_KEY = "80c452b9a4b80f240ada316f23078d2c";
    const UPLOADCARE_PUB_KEY = "demopublickey";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('active_user')); } catch(e){}
    if (!currentUser || !currentUser.Email) {
        window.location.href = "1.html";
    }
    const userEmail = currentUser.Email;

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('active_user');
        window.location.reload();
    });

    function showToast(msg) {
        const t = document.getElementById('toastPopup');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2400);
    }

    // SVG Registry
    const SVG_FOLDER = `<svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`;
    const SVG_DOC = `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`;
    const SVG_DOTS = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>`;

    // State for Nested Navigation
    let folderHierarchy = []; // Stack of { id, name }

    function updateNav() {
        const area = document.getElementById('breadcrumbNav');
        if (folderHierarchy.length === 0) {
            area.innerHTML = `<span>Knowledge base</span>`;
        } else {
            let html = `<span style="color: var(--text-secondary); cursor: pointer;" id="rootCrumb">Knowledge base</span>`;
            folderHierarchy.forEach((f, idx) => {
                html += ` <span style="color: var(--text-secondary);">/</span> `;
                if (idx === folderHierarchy.length - 1) {
                    html += `<span>${f.name}</span>`;
                } else {
                    html += `<span style="color: var(--text-secondary); cursor: pointer;" class="crumb-jump" data-idx="${idx}">${f.name}</span>`;
                }
            });
            area.innerHTML = html;

            document.getElementById('rootCrumb').addEventListener('click', () => {
                folderHierarchy = [];
                loadDrive();
            });
            document.querySelectorAll('.crumb-jump').forEach(el => {
                el.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-idx'));
                    folderHierarchy = folderHierarchy.slice(0, idx + 1);
                    loadDrive();
                });
            });
        }
    }

    async function loadDrive() {
        updateNav();
        const container = document.getElementById('driveItemList');
        container.innerHTML = `<div style="padding: 24px 0; color: var(--text-secondary);">Loading...</div>`;

        try {
            const q = query(
                collection(db, "Cloud Drive"),
                or(
                    where("Email", "==", userEmail),
                    where("Access.Viewer", "array-contains", userEmail),
                    where("Access.Commentator", "array-contains", userEmail),
                    where("Access.Editor", "array-contains", userEmail)
                )
            );

            const snap = await getDocs(q);
            const allItems = [];
            snap.forEach(d => allItems.push({ id: d.id, ...d.data() }));

            const currentFolder = folderHierarchy.length > 0 ? folderHierarchy[folderHierarchy.length - 1] : null;

            let displayItems = [];
            if (!currentFolder) {
                // Root: items without ParentFolderId and not assigned in other folders
                displayItems = allItems.filter(i => !i.ParentFolderId);
            } else {
                // Inside Folder: items where ParentFolderId == currentFolder.id or folder's Files array includes it
                const folderData = allItems.find(i => i.id === currentFolder.id);
                const assignedFileIds = (folderData && Array.isArray(folderData.Files)) ? folderData.Files : [];
                displayItems = allItems.filter(i => i.ParentFolderId === currentFolder.id || assignedFileIds.includes(i.id));
            }

            container.innerHTML = "";
            if (displayItems.length === 0) {
                container.innerHTML = `<div style="padding: 32px 0; color: var(--text-secondary);">This folder is empty.</div>`;
                return;
            }

            displayItems.forEach(item => renderRow(item));
        } catch(e) {
            console.error(e);
            container.innerHTML = `<div style="padding: 20px 0; color: var(--danger);">Failed to load files.</div>`;
        }
    }

    function renderRow(item) {
        const container = document.getElementById('driveItemList');
        const isFolder = item.Folder === "True";
        const isImg = (item.Type || "").includes("img") || (item.Type || "").includes("png") || (item.Type || "").includes("jpg");
        const name = item.Name || (item.File ? item.File.split('/').pop() : 'Untitled');
        const labelText = item.Label || "Add Label";

        const iconHtml = isFolder ? SVG_FOLDER : (isImg ? `<img src="${item.File}">` : SVG_DOC);

        const row = document.createElement('div');
        row.className = "table-row";
        row.innerHTML = `
            <div class="file-cell">
                <div class="icon-box">${iconHtml}</div>
                <span class="file-name" title="${name}">${name}</span>
            </div>
            <div class="cell-owner" style="color: var(--text-secondary);">${item.Email}</div>
            <div class="cell-format" style="color: var(--text-secondary);">${isFolder ? 'Folder' : (item.Type || '.file')}</div>
            <div class="cell-label"><span class="label-badge label-trigger">${labelText}</span></div>
            <div style="color: var(--text-secondary);">${item.Access?.Viewer?.length ? 'Shared' : 'Personal'}</div>
            <div class="actions-cell">
                <button class="dots-btn">${SVG_DOTS}</button>
                <div class="action-dropdown">
                    <div class="dropdown-item opt-details">ℹ️ Details</div>
                    <div class="dropdown-item opt-rename">✏️ Rename</div>
                    <div class="dropdown-item opt-label">🏷️ Label</div>
                    <div class="dropdown-item danger opt-delete">🗑️ Delete</div>
                </div>
            </div>
        `;

        // 3-Dots Dropdown Trigger
        const dotsBtn = row.querySelector('.dots-btn');
        const dropdown = row.querySelector('.action-dropdown');
        dotsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.action-dropdown').forEach(d => d !== dropdown && d.classList.remove('active'));
            dropdown.classList.toggle('active');
        });

        // Open Action & Sync to Home
        row.querySelector('.file-name').addEventListener('click', async () => {
            if (isFolder) {
                folderHierarchy.push({ id: item.id, name: name });
                loadDrive();
            } else {
                await updateDoc(doc(db, "Cloud Drive", item.id), {
                    LastOpened: new Date().toISOString(),
                    LastOpenedBy: userEmail
                });
                window.open(item.File, '_blank');
            }
        });

        // Details Handler
        row.querySelector('.opt-details').addEventListener('click', () => {
            document.getElementById('detName').innerText = name;
            document.getElementById('detSize').innerText = item.Size || "N/A";
            document.getElementById('detDate').innerText = item.CreatedAt ? new Date(item.CreatedAt).toLocaleDateString() : "Today";
            document.getElementById('detOwner').innerText = item.Email;
            const accessCount = (item.Access?.Viewer?.length || 0) + (item.Access?.Editor?.length || 0);
            document.getElementById('detAccess').innerText = accessCount > 0 ? `You & ${accessCount} others` : "Personal Only";
            document.getElementById('detailsModal').classList.add('active');
        });

        // Rename Handler
        row.querySelector('.opt-rename').addEventListener('click', () => {
            openRenameModal(item);
        });

        // Live Label Update
        const openLabelEditor = () => openLabelModal(item, row.querySelector('.label-badge'));
        row.querySelector('.opt-label').addEventListener('click', openLabelEditor);
        row.querySelector('.label-trigger').addEventListener('click', openLabelEditor);

        // Delete Handler
        row.querySelector('.opt-delete').addEventListener('click', async () => {
            if (confirm("Delete permanently?")) {
                await deleteDoc(doc(db, "Cloud Drive", item.id));
                showToast("Deleted");
                loadDrive();
            }
        });

        container.appendChild(row);
    }

    window.addEventListener('click', () => {
        document.querySelectorAll('.action-dropdown').forEach(d => d.classList.remove('active'));
    });

    // Details Close
    document.getElementById('closeDetailsModal').addEventListener('click', () => {
        document.getElementById('detailsModal').classList.remove('active');
    });

    // Rename Modal Logic
    let activeRenameDoc = null;
    const renameModal = document.getElementById('renameModal');
    function openRenameModal(item) {
        activeRenameDoc = item;
        document.getElementById('renameField').value = item.Name || "";
        renameModal.classList.add('active');
    }
    document.getElementById('closeRenameModal').addEventListener('click', () => renameModal.classList.remove('active'));
    document.getElementById('submitRenameBtn').addEventListener('click', async () => {
        const val = document.getElementById('renameField').value.trim();
        if (val && activeRenameDoc) {
            await updateDoc(doc(db, "Cloud Drive", activeRenameDoc.id), { Name: val });
            renameModal.classList.remove('active');
            showToast("Renamed successfully");
            loadDrive();
        }
    });

    // Label Modal Logic (Live Inline Updating Without Reload)
    let activeLabelDoc = null;
    let activeBadgeEl = null;
    const labelModal = document.getElementById('labelModal');
    function openLabelModal(item, badgeElement) {
        activeLabelDoc = item;
        activeBadgeEl = badgeElement;
        document.getElementById('labelInputField').value = item.Label || "";
        labelModal.classList.add('active');
    }
    document.getElementById('closeLabelModal').addEventListener('click', () => labelModal.classList.remove('active'));
    document.getElementById('submitLabelBtn').addEventListener('click', async () => {
        const val = document.getElementById('labelInputField').value.trim();
        if (activeLabelDoc) {
            await updateDoc(doc(db, "Cloud Drive", activeLabelDoc.id), { Label: val });
            if (activeBadgeEl) activeBadgeEl.innerText = val || "Add Label";
            activeLabelDoc.Label = val;
            labelModal.classList.remove('active');
            showToast("Label updated");
        }
    });

    // Folder Inside Folder Creation
    const createFolderModal = document.getElementById('createFolderModal');
    document.getElementById('createFolderTrigger').addEventListener('click', () => {
        document.getElementById('newFolderTitle').value = "";
        createFolderModal.classList.add('active');
    });
    document.getElementById('closeFolderModal').addEventListener('click', () => createFolderModal.classList.remove('active'));
    document.getElementById('submitFolderCreateBtn').addEventListener('click', async () => {
        const title = document.getElementById('newFolderTitle').value.trim();
        if (!title) return;
        
        const parentId = folderHierarchy.length > 0 ? folderHierarchy[folderHierarchy.length - 1].id : null;

        await addDoc(collection(db, "Cloud Drive"), {
            Email: userEmail,
            Folder: "True",
            Name: title,
            ParentFolderId: parentId,
            CreatedAt: new Date().toISOString(),
            Files: [],
            Access: { Viewer: [], Commentator: [], Editor: [] }
        });

        createFolderModal.classList.remove('active');
        showToast("Folder created");
        loadDrive();
    });

    // Batch Upload & Drag/Drop
    const multiFileInput = document.getElementById('multiFileInput');
    document.getElementById('uploadTrigger').addEventListener('click', () => multiFileInput.click());
    multiFileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleUploads(e.target.files);
    });

    const dragOverlay = document.getElementById('dragOverlay');
    window.addEventListener('dragover', (e) => { e.preventDefault(); dragOverlay.classList.add('active'); });
    window.addEventListener('dragleave', (e) => { if (e.clientX === 0 && e.clientY === 0) dragOverlay.classList.remove('active'); });
    window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragOverlay.classList.remove('active');
        if (e.dataTransfer.files.length) handleUploads(e.dataTransfer.files);
    });

    async function handleUploads(files) {
        showToast(`Uploading ${files.length} file(s)...`);
        const parentId = folderHierarchy.length > 0 ? folderHierarchy[folderHierarchy.length - 1].id : null;

        for (const file of files) {
            try {
                let fileUrl = "";
                let fileType = "";
                if (file.type.startsWith('image/')) {
                    const fd = new FormData();
                    fd.append('image', file);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = j.data.url;
                    fileType = ".img";
                } else {
                    const fd = new FormData();
                    fd.append('UPLOADCARE_PUB_KEY', UPLOADCARE_PUB_KEY);
                    fd.append('UPLOADCARE_STORE', '1');
                    fd.append('file', file);
                    const res = await fetch('https://upload.uploadcare.com/base/', { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = `https://ucarecdn.com/${j.file}/${encodeURIComponent(file.name)}`;
                    const ext = file.name.split('.').pop();
                    fileType = ext ? `.${ext.toLowerCase()}` : '.file';
                }

                await addDoc(collection(db, "Cloud Drive"), {
                    Email: userEmail,
                    File: fileUrl,
                    Type: fileType,
                    Name: file.name,
                    Size: `${(file.size / (1024*1024)).toFixed(1)} MB`,
                    CreatedAt: new Date().toISOString(),
                    LastOpened: new Date().toISOString(),
                    LastOpenedBy: userEmail,
                    ParentFolderId: parentId,
                    Label: "",
                    Access: { Viewer: [], Commentator: [], Editor: [] }
                });
            } catch(e) {
                console.error("Upload error:", e);
            }
        }
        showToast("Upload completed");
        loadDrive();
    }

    loadDrive();
</script>
</body>
</html>
