<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge base</title>
    <!-- jsPDF & JSZip for Multi-Download & PDF Conversion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #f3f4f6;
            --hover-bg: #f9fafb;
            --select-bg: #f0fdf4;
            --btn-dark-bg: #0d0d0d;
            --btn-dark-text: #ffffff;
            --accent: #10a37f;
            --danger: #ef4444;
            --sidebar-width: 64px;
        }

        body.dark {
            --bg-color: #0d0d0d;
            --surface-color: #171717;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #262626;
            --hover-bg: #1f1f1f;
            --select-bg: #064e3b33;
            --btn-dark-bg: #ffffff;
            --btn-dark-text: #0d0d0d;
            --accent: #10a37f;
            --danger: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        aside.sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            flex-shrink: 0;
            background: var(--surface-color);
        }

        .side-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .side-icon:hover, .side-icon.active { background-color: var(--hover-bg); color: var(--text-primary); }
        .side-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

        main.content-area {
            flex-grow: 1;
            padding: 32px 48px;
            max-width: 1240px;
            position: relative;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
            flex-wrap: wrap;
        }
        .crumb-item {
            color: var(--text-secondary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .crumb-item:hover { color: var(--text-primary); }
        .crumb-current { color: var(--text-primary); }

        .btn-pill {
            background-color: var(--btn-dark-bg);
            color: var(--btn-dark-text);
            border: none;
            padding: 10px 18px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .search-container {
            position: relative;
            max-width: 380px;
            margin-bottom: 24px;
        }
        .search-container svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            fill: none;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
        }

        /* Multi-selection Bulk Action Bar */
        .selection-bar {
            position: sticky;
            top: 16px;
            background: var(--surface-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            border-radius: 14px;
            padding: 10px 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            z-index: 200;
            border: 1px solid var(--border-color);
        }
        .selection-bar.active { display: flex; }
        .selection-actions { display: flex; gap: 8px; }

        /* Full Drag & Drop Surface */
        .drag-overlay {
            position: fixed;
            inset: 0;
            background: rgba(16, 163, 127, 0.08);
            border: 2px dashed var(--accent);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }
        .drag-overlay.active { display: flex; }

        /* Table */
        .data-table { width: 100%; border-collapse: collapse; }
        .table-head {
            display: grid;
            grid-template-columns: 36px 3fr 1.5fr 1.2fr 1fr 40px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .table-row {
            display: grid;
            grid-template-columns: 36px 3fr 1.5fr 1.2fr 1fr 40px;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            transition: background 0.15s;
            cursor: pointer;
        }
        .table-row:hover { background-color: var(--hover-bg); }
        .table-row.selected { background-color: var(--select-bg); }

        .file-title-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            white-space: nowrap;
        }
        .file-icon-box {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--hover-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--text-secondary);
            overflow: hidden;
        }
        .file-icon-box svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; }
        .file-icon-box img { width: 100%; height: 100%; object-fit: cover; }

        .file-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .label-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            text-transform: capitalize;
        }

        /* 3-Dots Dropdown Menu */
        .actions-cell { position: relative; text-align: right; }
        .btn-dots {
            background: none;
            border: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .btn-dots svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        .action-dropdown {
            position: absolute;
            right: 0;
            top: 32px;
            background: var(--surface-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            border-radius: 12px;
            width: 190px;
            padding: 6px 0;
            z-index: 100;
            display: none;
            border: 1px solid var(--border-color);
        }
        .action-dropdown.active { display: block; }
        .dropdown-item {
            padding: 9px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .dropdown-item:hover { background: var(--hover-bg); }
        .dropdown-item.danger { color: var(--danger); }
        .dropdown-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

        /* Minimal Plain Modals */
        .modal-shade {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 16px;
        }
        .modal-shade.active { visibility: visible; opacity: 1; }

        .modal-box {
            background: var(--surface-color);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 28px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { background: none; border: none; cursor: pointer; color: var(--text-secondary); }
        .modal-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .clean-input {
            width: 100%;
            padding: 12px 14px;
            background: var(--hover-bg);
            border: none;
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .tab-bar { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .tab-link {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            background: none;
        }
        .tab-link.active { color: var(--text-primary); border-bottom-color: var(--text-primary); }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* Custom In-App Toast */
        .toast-popup {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 9999px;
            font-size: 13px;
            display: none;
            z-index: 2000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        @media (max-width: 768px) {
            aside.sidebar { display: none; }
            main.content-area { padding: 20px 16px; width: 100%; }
            .table-head { display: none; }
            .table-row {
                grid-template-columns: 28px 1fr auto 30px;
                gap: 8px;
                padding: 12px 0;
            }
            .cell-label, .cell-format { display: none; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="side-icon active" title="Knowledge Base">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    </div>
    <div class="side-icon" id="logoutSideBtn" title="Sign Out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </div>
</aside>

<!-- Drag Overlay -->
<div class="drag-overlay" id="dragOverlay">
    <div style="background: var(--surface-color); padding: 20px 30px; border-radius: 12px; font-weight: 500;">
        Drop files to upload into current folder
    </div>
</div>

<main class="content-area">
    <div class="top-row">
        <div class="breadcrumbs" id="breadcrumbArea">
            <span class="crumb-current">Knowledge base</span>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-pill" id="uploadTriggerBtn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Upload
            </button>
            <button class="btn-pill" id="newFolderTriggerBtn" style="background: var(--hover-bg); color: var(--text-primary);">
                + Folder
            </button>
        </div>
    </div>

    <!-- Hidden Native Upload Input -->
    <input type="file" id="nativeFileInput" multiple style="display: none;">

    <!-- Multi-Selection Bulk Action Toolbar -->
    <div class="selection-bar" id="selectionBar">
        <span id="selectedCountText" style="font-size: 13px; font-weight: 500;">0 selected</span>
        <div class="selection-actions">
            <button class="btn-pill" id="bulkDownloadBtn" style="padding: 6px 12px; font-size: 12px;">Download</button>
            <button class="btn-pill" id="bulkLabelBtn" style="padding: 6px 12px; font-size: 12px; background: var(--hover-bg); color: var(--text-primary);">Label</button>
            <button class="btn-pill" id="bulkMoveBtn" style="padding: 6px 12px; font-size: 12px; background: var(--hover-bg); color: var(--text-primary);">Move</button>
            <button class="btn-pill" id="bulkDeleteBtn" style="padding: 6px 12px; font-size: 12px; background: var(--danger); color: #fff;">Delete</button>
            <button class="btn-pill" id="cancelSelectionBtn" style="padding: 6px 12px; font-size: 12px; background: transparent; color: var(--text-secondary);">Cancel</button>
        </div>
    </div>

    <div class="search-container">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search knowledge base">
    </div>

    <!-- Data Table -->
    <div class="data-table">
        <div class="table-head">
            <div><input type="checkbox" id="selectAllCheckbox"></div>
            <div>Name</div>
            <div class="cell-label">Label</div>
            <div class="cell-format">Format</div>
            <div>Access</div>
            <div></div>
        </div>
        <div id="tableContent">
            <div style="padding: 24px 0; color: var(--text-secondary); font-size: 14px;">Loading workspace...</div>
        </div>
    </div>
</main>

<!-- Unified Modal: Share & Access -->
<div class="modal-shade" id="shareAccessModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Share & Permissions</div>
            <button class="modal-close" id="closeShareModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="tab-bar">
            <button class="tab-link active" id="tabShareBtn">Share</button>
            <button class="tab-link" id="tabAccessBtn">Access rights</button>
        </div>
        <div class="tab-pane active" id="paneShare">
            <div class="input-group">
                <label>Export Format</label>
                <select id="shareFormatSelect" class="clean-input">
                    <option value="original">Original Format</option>
                    <option value="pdf">Convert to PDF (.pdf)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Security Password</label>
                <input type="text" id="sharePasswordInput" class="clean-input" placeholder="No password set">
            </div>
            <div style="display: flex; gap: 8px; margin-top: 20px;">
                <button class="btn-pill" id="btnDeviceShare" style="flex: 1; justify-content: center;">Share to Device</button>
                <button class="btn-pill" id="btnCopyLink" style="background: var(--hover-bg); color: var(--text-primary);">Copy Link</button>
            </div>
        </div>
        <div class="tab-pane" id="paneAccess">
            <div class="input-group">
                <label>Invite Collaborator</label>
                <div style="display: flex; gap: 6px;">
                    <input type="email" id="inviteEmailInput" class="clean-input" placeholder="user@perplexity.com">
                    <select id="inviteRoleSelect" class="clean-input" style="width: 130px;">
                        <option value="Viewer">Viewer</option>
                        <option value="Commentator">Commentator</option>
                        <option value="Editor">Editor</option>
                        <option value="passon">Pass Ownership</option>
                    </select>
                    <button class="btn-pill" id="btnApplyAccess">Add</button>
                </div>
            </div>
            <div id="accessListContainer" style="max-height: 140px; overflow-y: auto; margin-bottom: 16px;"></div>
            <div style="display: flex; justify-content: flex-end;"><button class="btn-pill" id="btnSavePermissions">Done</button></div>
        </div>
    </div>
</div>

<!-- Modal: Rename -->
<div class="modal-shade" id="renameModal">
    <div class="modal-box" style="max-width: 380px;">
        <div class="modal-header">
            <div class="modal-title">Rename</div>
            <button class="modal-close" id="closeRenameModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group"><input type="text" id="renameInput" class="clean-input"></div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;"><button class="btn-pill" id="btnSaveRename">Save</button></div>
    </div>
</div>

<!-- Modal: Move / Shift to Folder -->
<div class="modal-shade" id="moveModal">
    <div class="modal-box" style="max-width: 400px;">
        <div class="modal-header">
            <div class="modal-title">Move to Folder</div>
            <button class="modal-close" id="closeMoveModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group">
            <label>Select Target Destination</label>
            <select id="moveTargetSelect" class="clean-input"></select>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;"><button class="btn-pill" id="btnSubmitMove">Move</button></div>
    </div>
</div>

<!-- Modal: Label -->
<div class="modal-shade" id="labelModal">
    <div class="modal-box" style="max-width: 360px;">
        <div class="modal-header">
            <div class="modal-title">Set Label</div>
            <button class="modal-close" id="closeLabelModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group">
            <select id="labelSelect" class="clean-input">
                <option value="">None</option>
                <option value="important" style="color:#ef4444;">🔴 Important</option>
                <option value="work" style="color:#3b82f6;">🔵 Work</option>
                <option value="personal" style="color:#10b981;">🟢 Personal</option>
                <option value="archive" style="color:#6b7280;">⚪ Archive</option>
            </select>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;"><button class="btn-pill" id="btnSaveLabel">Apply</button></div>
    </div>
</div>

<!-- Modal: Details Inspector -->
<div class="modal-shade" id="detailsModal">
    <div class="modal-box" style="max-width: 420px;">
        <div class="modal-header">
            <div class="modal-title">Details</div>
            <button class="modal-close" id="closeDetailsModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div id="detailsContent" style="font-size: 13px; line-height: 1.8; color: var(--text-secondary);"></div>
    </div>
</div>

<!-- Modal: Password Check -->
<div class="modal-shade" id="passwordAuthModal">
    <div class="modal-box" style="max-width: 360px;">
        <div class="modal-header">
            <div class="modal-title">Locked Folder</div>
            <button class="modal-close" id="closePassModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group"><input type="password" id="authPasswordInput" class="clean-input" placeholder="Password required"></div>
        <div style="display: flex; justify-content: flex-end;"><button class="btn-pill" id="btnSubmitAuth">Unlock</button></div>
    </div>
</div>

<!-- Modal: Create Folder -->
<div class="modal-shade" id="folderModal">
    <div class="modal-box" style="max-width: 380px;">
        <div class="modal-header">
            <div class="modal-title">New Folder</div>
            <button class="modal-close" id="closeFolderModal"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="input-group"><input type="text" id="newFolderName" class="clean-input" placeholder="Folder name"></div>
        <div class="input-group"><input type="text" id="newFolderPassword" class="clean-input" placeholder="Password lock (optional)"></div>
        <div style="display: flex; justify-content: flex-end;"><button class="btn-pill" id="btnCreateFolder">Create</button></div>
    </div>
</div>

<div class="toast-popup" id="toastPopup"></div>

<script type="module">

    import { 
        getFirestore, collection, query, where, getDocs, or,
        doc, updateDoc, deleteDoc, addDoc, arrayUnion, arrayRemove 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const IMGBB_API_KEY = "80c452b9a4b80f240ada316f23078d2c";
    const UPLOADCARE_PUB_KEY = "demopublickey";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Authentication Verification
    let currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('active_user')); } catch(e){}
    if (!currentUser || !currentUser.Email) { window.location.href = "1.html"; }
    const userEmail = currentUser.Email;

    document.getElementById('logoutSideBtn').addEventListener('click', () => {
        localStorage.removeItem('active_user');
        window.location.reload();
    });

    function showToast(msg) {
        const t = document.getElementById('toastPopup');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2600);
    }

    const SVG = {
        folder: `<svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`,
        image: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`,
        pdf: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`,
        doc: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`,
        dots: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>`,
        download: `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`,
        edit: `<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
        move: `<svg viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>`,
        info: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`,
        tag: `<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>`,
        share: `<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>`,
        trash: `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path></svg>`
    };

    function getFormat(type, isFolder) {
        if (isFolder) return { label: "Folder", icon: SVG.folder };
        const t = (type || "").toLowerCase();
        if (t.includes("img") || t.includes("png") || t.includes("jpg")) return { label: "Image", icon: SVG.image };
        if (t.includes("pdf")) return { label: "PDF", icon: SVG.pdf };
        return { label: "Document", icon: SVG.doc };
    }

    // Navigation Stack for Nested Subfolders
    let folderPathStack = []; // array of { id, name }
    let currentFolderId = null;
    let rawItems = [];
    let selectedItemIds = new Set();

    function updateBreadcrumbs() {
        const area = document.getElementById('breadcrumbArea');
        if (folderPathStack.length === 0) {
            area.innerHTML = `<span class="crumb-current">Knowledge base</span>`;
        } else {
            let html = `<span class="crumb-item" id="crumbRoot">Knowledge base</span>`;
            folderPathStack.forEach((f, idx) => {
                const isLast = idx === folderPathStack.length - 1;
                html += ` <span style="color:var(--text-secondary);">/</span> `;
                if (isLast) html += `<span class="crumb-current">${f.name}</span>`;
                else html += `<span class="crumb-item" data-idx="${idx}">${f.name}</span>`;
            });
            area.innerHTML = html;

            document.getElementById('crumbRoot').addEventListener('click', () => {
                folderPathStack = [];
                currentFolderId = null;
                loadDrive();
            });
            area.querySelectorAll('.crumb-item[data-idx]').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.getAttribute('data-idx'));
                    folderPathStack = folderPathStack.slice(0, idx + 1);
                    currentFolderId = folderPathStack[folderPathStack.length - 1].id;
                    loadDrive();
                });
            });
        }
    }

    // Load Items with Nested Tree Support
    async function loadDrive() {
        updateBreadcrumbs();
        selectedItemIds.clear();
        updateSelectionBar();
        const container = document.getElementById('tableContent');
        container.innerHTML = `<div style="padding: 24px 0; color: var(--text-secondary); font-size: 14px;">Loading workspace...</div>`;

        try {
            const q = query(
                collection(db, "Cloud Drive"),
                or(
                    where("Email", "==", userEmail),
                    where("Access.Viewer", "array-contains", userEmail),
                    where("Access.Commentator", "array-contains", userEmail),
                    where("Access.Editor", "array-contains", userEmail)
                )
            );
            const snap = await getDocs(q);
            rawItems = [];
            snap.forEach(d => rawItems.push({ id: d.id, ...d.data() }));

            container.innerHTML = "";
            let itemsToDisplay = [];

            if (currentFolderId === null) {
                // Root items: items with parentFolder == null or not listed in any folder's Files
                const childIds = new Set();
                rawItems.forEach(i => {
                    if (i.Folder === "True" && Array.isArray(i.Files)) {
                        i.Files.forEach(id => childIds.add(id));
                    }
                });
                itemsToDisplay = rawItems.filter(i => !childIds.has(i.id) && !i.parentFolder);
            } else {
                // Subfolder contents
                const currFolder = rawItems.find(i => i.id === currentFolderId);
                const assigned = (currFolder && Array.isArray(currFolder.Files)) ? currFolder.Files : [];
                itemsToDisplay = rawItems.filter(i => assigned.includes(i.id) || i.parentFolder === currentFolderId);
            }

            if (itemsToDisplay.length === 0) {
                container.innerHTML = `<div style="padding: 32px 0; color: var(--text-secondary); font-size: 14px;">Folder is empty.</div>`;
                return;
            }

            itemsToDisplay.forEach(item => renderRow(item));
        } catch (e) {
            console.error(e);
            container.innerHTML = `<div style="padding: 24px 0; color: var(--danger);">Failed to load files.</div>`;
        }
    }

    function renderRow(item) {
        const container = document.getElementById('tableContent');
        const isFolder = item.Folder === "True";
        const name = item.Name || (item.File ? item.File.split('/').pop() : 'Untitled');
        const fmt = getFormat(item.Type, isFolder);

        // Labels
        let labelHtml = "—";
        if (item.Label) {
            const colors = { important: "#ef4444", work: "#3b82f6", personal: "#10b981", archive: "#6b7280" };
            labelHtml = `<span class="label-tag" style="background:${colors[item.Label]}20; color:${colors[item.Label]};">${item.Label}</span>`;
        }

        const accessTotal = (item.Access?.Viewer?.length || 0) + (item.Access?.Commentator?.length || 0) + (item.Access?.Editor?.length || 0);
        const accessLabel = accessTotal > 0 ? `Shared (${accessTotal})` : 'Personal';

        const row = document.createElement('div');
        row.className = 'table-row';
        row.id = `row-${item.id}`;
        row.innerHTML = `
            <div><input type="checkbox" class="row-checkbox" data-id="${item.id}"></div>
            <div class="file-title-cell">
                <div class="file-icon-box">${fmt.icon}</div>
                <span class="file-name" title="${name}">${name}</span>
            </div>
            <div class="cell-label">${labelHtml}</div>
            <div class="cell-format" style="font-size: 13px; color: var(--text-secondary);">${fmt.label}</div>
            <div style="font-size: 13px; color: var(--text-secondary);">${accessLabel}</div>
            <div class="actions-cell">
                <button class="btn-dots">${SVG.dots}</button>
                <div class="action-dropdown">
                    <div class="dropdown-item opt-download">${SVG.download} Download</div>
                    <div class="dropdown-item opt-rename">${SVG.edit} Rename</div>
                    <div class="dropdown-item opt-label">${SVG.tag} Label</div>
                    <div class="dropdown-item opt-move">${SVG.move} Move</div>
                    <div class="dropdown-item opt-details">${SVG.info} Details</div>
                    <div class="dropdown-item opt-share">${SVG.share} Share & Access</div>
                    <div class="dropdown-item danger opt-delete">${SVG.trash} Delete</div>
                </div>
            </div>
        `;

        // Checkbox & Selection
        const chk = row.querySelector('.row-checkbox');
        chk.addEventListener('change', (e) => {
            e.stopPropagation();
            if (chk.checked) selectedItemIds.add(item.id);
            else selectedItemIds.delete(item.id);
            row.classList.toggle('selected', chk.checked);
            updateSelectionBar();
        });

        // Long Press Handler for Mobile Multi-select
        let pressTimer;
        row.addEventListener('touchstart', (e) => {
            pressTimer = setTimeout(() => {
                chk.checked = !chk.checked;
                chk.dispatchEvent(new Event('change'));
            }, 600);
        });
        row.addEventListener('touchend', () => clearTimeout(pressTimer));

        // Click on Name -> Open (with Folder Lock Password Check)
        row.querySelector('.file-name').addEventListener('click', (e) => {
            e.stopPropagation();
            if (item.Password) {
                promptPassword(item.Password, () => openItem(item, isFolder, name));
            } else {
                openItem(item, isFolder, name);
            }
        });

        // Context 3-Dots Dropdown Trigger
        const dots = row.querySelector('.btn-dots');
        const menu = row.querySelector('.action-dropdown');
        dots.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.action-dropdown').forEach(m => m !== menu && m.classList.remove('active'));
            menu.classList.toggle('active');
        });

        // Menu Handlers
        row.querySelector('.opt-download').addEventListener('click', () => downloadSingle(item));
        row.querySelector('.opt-rename').addEventListener('click', () => openRenameModal(item));
        row.querySelector('.opt-label').addEventListener('click', () => openLabelModal([item.id]));
        row.querySelector('.opt-move').addEventListener('click', () => openMoveModal([item.id]));
        row.querySelector('.opt-details').addEventListener('click', () => openDetailsModal(item));
        row.querySelector('.opt-share').addEventListener('click', () => openShareModal(item));
        row.querySelector('.opt-delete').addEventListener('click', async () => {
            if (confirm("Delete permanently?")) {
                await deleteDoc(doc(db, "Cloud Drive", item.id));
                showToast("Item deleted");
                loadDrive();
            }
        });

        container.appendChild(row);
    }

    function openItem(item, isFolder, name) {
        if (isFolder) {
            folderPathStack.push({ id: item.id, name: name });
            currentFolderId = item.id;
            loadDrive();
        } else {
            window.open(item.File, '_blank');
        }
    }

    window.addEventListener('click', () => document.querySelectorAll('.action-dropdown').forEach(d => d.classList.remove('active')));

    // Selection Toolbar Handler
    function updateSelectionBar() {
        const bar = document.getElementById('selectionBar');
        const countText = document.getElementById('selectedCountText');
        if (selectedItemIds.size > 0) {
            bar.classList.add('active');
            countText.innerText = `${selectedItemIds.size} selected`;
        } else {
            bar.classList.remove('active');
        }
    }

    document.getElementById('selectAllCheckbox').addEventListener('change', (e) => {
        const isChecked = e.target.checked;
        document.querySelectorAll('.row-checkbox').forEach(chk => {
            chk.checked = isChecked;
            const id = chk.getAttribute('data-id');
            if (isChecked) selectedItemIds.add(id); else selectedItemIds.delete(id);
            chk.closest('.table-row').classList.toggle('selected', isChecked);
        });
        updateSelectionBar();
    });

    document.getElementById('cancelSelectionBtn').addEventListener('click', () => {
        selectedItemIds.clear();
        document.querySelectorAll('.row-checkbox').forEach(c => c.checked = false);
        document.querySelectorAll('.table-row').forEach(r => r.classList.remove('selected'));
        updateSelectionBar();
    });

    // Bulk Delete
    document.getElementById('bulkDeleteBtn').addEventListener('click', async () => {
        if (confirm(`Delete ${selectedItemIds.size} selected items?`)) {
            for (const id of selectedItemIds) {
                await deleteDoc(doc(db, "Cloud Drive", id));
            }
            showToast("Selected items deleted");
            loadDrive();
        }
    });

    // Bulk Download (Creates ZIP)
    document.getElementById('bulkDownloadBtn').addEventListener('click', async () => {
        showToast("Preparing ZIP archive...");
        const zip = new JSZip();
        for (const id of selectedItemIds) {
            const item = rawItems.find(i => i.id === id);
            if (item && item.File) {
                const res = await fetch(item.File);
                const blob = await res.blob();
                zip.file(item.Name || `file_${id}`, blob);
            }
        }
        zip.generateAsync({ type: "blob" }).then((content) => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(content);
            a.download = "files_export.zip";
            a.click();
            showToast("Download started!");
        });
    });

    function downloadSingle(item) {
        if (!item.File) return showToast("Folders cannot be downloaded directly.");
        const a = document.createElement('a');
        a.href = item.File;
        a.download = item.Name || 'file';
        a.target = '_blank';
        a.click();
    }

    // Password Challenge
    const passModal = document.getElementById('passwordAuthModal');
    let passSuccessCb = null, passExpected = "";
    function promptPassword(pass, cb) {
        passExpected = pass;
        passSuccessCb = cb;
        document.getElementById('authPasswordInput').value = "";
        passModal.classList.add('active');
    }
    document.getElementById('closePassModal').addEventListener('click', () => passModal.classList.remove('active'));
    document.getElementById('btnSubmitAuth').addEventListener('click', () => {
        if (document.getElementById('authPasswordInput').value === passExpected) {
            passModal.classList.remove('active');
            if (passSuccessCb) passSuccessCb();
        } else {
            showToast("Wrong password!");
        }
    });

    // Move to Folder Modal
    const moveModal = document.getElementById('moveModal');
    let moveTargetIds = [];
    function openMoveModal(ids) {
        moveTargetIds = ids;
        const sel = document.getElementById('moveTargetSelect');
        sel.innerHTML = `<option value="root">Knowledge base (Root)</option>`;
        rawItems.filter(i => i.Folder === "True" && !moveTargetIds.includes(i.id)).forEach(f => {
            sel.innerHTML += `<option value="${f.id}">📁 ${f.Name}</option>`;
        });
        moveModal.classList.add('active');
    }
    document.getElementById('closeMoveModal').addEventListener('click', () => moveModal.classList.remove('active'));
    document.getElementById('bulkMoveBtn').addEventListener('click', () => openMoveModal(Array.from(selectedItemIds)));
    document.getElementById('btnSubmitMove').addEventListener('click', async () => {
        const target = document.getElementById('moveTargetSelect').value;
        for (const id of moveTargetIds) {
            if (target === 'root') {
                await updateDoc(doc(db, "Cloud Drive", id), { parentFolder: null });
                if (currentFolderId) {
                    await updateDoc(doc(db, "Cloud Drive", currentFolderId), { Files: arrayRemove(id) });
                }
            } else {
                await updateDoc(doc(db, "Cloud Drive", target), { Files: arrayUnion(id) });
            }
        }
        moveModal.classList.remove('active');
        showToast("Moved successfully");
        loadDrive();
    });

    // Label Modal
    const labelModal = document.getElementById('labelModal');
    let labelTargetIds = [];
    function openLabelModal(ids) {
        labelTargetIds = ids;
        labelModal.classList.add('active');
    }
    document.getElementById('closeLabelModal').addEventListener('click', () => labelModal.classList.remove('active'));
    document.getElementById('bulkLabelBtn').addEventListener('click', () => openLabelModal(Array.from(selectedItemIds)));
    document.getElementById('btnSaveLabel').addEventListener('click', async () => {
        const val = document.getElementById('labelSelect').value;
        for (const id of labelTargetIds) {
            await updateDoc(doc(db, "Cloud Drive", id), { Label: val });
        }
        labelModal.classList.remove('active');
        showToast("Label applied");
        loadDrive();
    });

    // Details Modal
    const detailsModal = document.getElementById('detailsModal');
    function openDetailsModal(item) {
        const c = document.getElementById('detailsContent');
        c.innerHTML = `
            <div><strong>Name:</strong> ${item.Name || 'Untitled'}</div>
            <div><strong>Type:</strong> ${item.Type || (item.Folder === 'True' ? 'Folder' : 'Unknown')}</div>
            <div><strong>Owner:</strong> ${item.Email}</div>
            <div><strong>Direct URL:</strong> <a href="${item.File || '#'}" target="_blank" style="color:var(--accent); word-break:break-all;">${item.File || 'None'}</a></div>
            <div><strong>Security:</strong> ${item.Password ? '🔒 Protected' : 'Open'}</div>
        `;
        detailsModal.classList.add('active');
    }
    document.getElementById('closeDetailsModal').addEventListener('click', () => detailsModal.classList.remove('active'));

    // Rename Modal
    const renameModal = document.getElementById('renameModal');
    let activeRenameItem = null;
    function openRenameModal(item) {
        activeRenameItem = item;
        document.getElementById('renameInput').value = item.Name || item.File?.split('/').pop() || '';
        renameModal.classList.add('active');
    }
    document.getElementById('closeRenameModal').addEventListener('click', () => renameModal.classList.remove('active'));
    document.getElementById('btnSaveRename').addEventListener('click', async () => {
        const name = document.getElementById('renameInput').value.trim();
        if (name && activeRenameItem) {
            await updateDoc(doc(db, "Cloud Drive", activeRenameItem.id), { Name: name });
            renameModal.classList.remove('active');
            showToast("Renamed");
            loadDrive();
        }
    });

    // Share & Access Modal
    const shareModal = document.getElementById('shareAccessModal');
    let activeShareItem = null;
    let accessState = { Viewer: [], Commentator: [], Editor: [] };

    document.getElementById('tabShareBtn').addEventListener('click', () => {
        document.getElementById('tabShareBtn').classList.add('active');
        document.getElementById('tabAccessBtn').classList.remove('active');
        document.getElementById('paneShare').classList.add('active');
        document.getElementById('paneAccess').classList.remove('active');
    });
    document.getElementById('tabAccessBtn').addEventListener('click', () => {
        document.getElementById('tabAccessBtn').classList.add('active');
        document.getElementById('tabShareBtn').classList.remove('active');
        document.getElementById('paneAccess').classList.add('active');
        document.getElementById('paneShare').classList.remove('active');
    });

    function openShareModal(item) {
        activeShareItem = item;
        document.getElementById('sharePasswordInput').value = item.Password || "";
        accessState = {
            Viewer: [...(item.Access?.Viewer || [])],
            Commentator: [...(item.Access?.Commentator || [])],
            Editor: [...(item.Access?.Editor || [])]
        };
        renderAccessList();
        document.getElementById('tabShareBtn').click();
        shareModal.classList.add('active');
    }
    document.getElementById('closeShareModal').addEventListener('click', () => shareModal.classList.remove('active'));

    function renderAccessList() {
        const c = document.getElementById('accessListContainer');
        c.innerHTML = `<div style="display:flex; justify-content:space-between; padding:6px 0; font-size:13px;">
            <span>${activeShareItem.Email} <strong>(Owner)</strong></span>
            <span style="font-size:11px; color:var(--accent); font-weight:600;">Owner</span>
        </div>`;
        ['Editor', 'Commentator', 'Viewer'].forEach(role => {
            accessState[role].forEach((email, idx) => {
                c.innerHTML += `
                    <div style="display:flex; justify-content:space-between; padding:6px 0; font-size:13px;">
                        <span>${email}</span>
                        <div style="display:flex; gap:8px;">
                            <span style="font-size:11px; color:var(--text-secondary);">${role}</span>
                            <span style="cursor:pointer; color:var(--danger);" onclick="window.removeAccess('${role}', ${idx})">&times;</span>
                        </div>
                    </div>
                `;
            });
        });
    }
    window.removeAccess = (role, idx) => {
        accessState[role].splice(idx, 1);
        renderAccessList();
    };

    document.getElementById('btnApplyAccess').addEventListener('click', async () => {
        const email = document.getElementById('inviteEmailInput').value.trim();
        const role = document.getElementById('inviteRoleSelect').value;
        if (!email) return;

        if (role === 'passon') {
            if (confirm(`Pass ownership to ${email}?`)) {
                await updateDoc(doc(db, "Cloud Drive", activeShareItem.id), {
                    Email: email,
                    Access: { Viewer: [], Commentator: [], Editor: [] }
                });
                showToast("Ownership transferred");
                shareModal.classList.remove('active');
                loadDrive();
            }
            return;
        }

        ['Viewer', 'Commentator', 'Editor'].forEach(r => accessState[r] = accessState[r].filter(e => e !== email));
        accessState[role].push(email);
        document.getElementById('inviteEmailInput').value = "";
        renderAccessList();
    });

    document.getElementById('btnSavePermissions').addEventListener('click', async () => {
        await updateDoc(doc(db, "Cloud Drive", activeShareItem.id), { Access: accessState });
        showToast("Saved permissions");
        shareModal.classList.remove('active');
        loadDrive();
    });

    // Native Share / PDF Conversion
    document.getElementById('btnDeviceShare').addEventListener('click', async () => {
        const fmt = document.getElementById('shareFormatSelect').value;
        const pass = document.getElementById('sharePasswordInput').value.trim();
        if (pass !== (activeShareItem.Password || '')) {
            await updateDoc(doc(db, "Cloud Drive", activeShareItem.id), { Password: pass });
        }
        if (fmt === 'pdf' && getFormat(activeShareItem.Type).label === 'Image') {
            showToast("Generating PDF...");
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = activeShareItem.File;
            img.onload = async () => {
                pdf.addImage(img, 'JPEG', 15, 40, 180, 160);
                const file = new File([pdf.output('blob')], `${activeShareItem.Name || 'doc'}.pdf`, { type: 'application/pdf' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: activeShareItem.Name });
                } else {
                    pdf.save(`${activeShareItem.Name || 'doc'}.pdf`);
                }
            };
        } else {
            if (navigator.share) {
                await navigator.share({ title: activeShareItem.Name, url: activeShareItem.File });
            } else {
                navigator.clipboard.writeText(activeShareItem.File).then(() => showToast("Link copied!"));
            }
        }
    });

    document.getElementById('btnCopyLink').addEventListener('click', () => {
        navigator.clipboard.writeText(activeShareItem.File).then(() => showToast("Link copied!"));
    });

    // Create Nested Subfolder
    const folderModal = document.getElementById('folderModal');
    document.getElementById('newFolderTriggerBtn').addEventListener('click', () => {
        document.getElementById('newFolderName').value = "";
        document.getElementById('newFolderPassword').value = "";
        folderModal.classList.add('active');
    });
    document.getElementById('closeFolderModal').addEventListener('click', () => folderModal.classList.remove('active'));
    document.getElementById('btnCreateFolder').addEventListener('click', async () => {
        const name = document.getElementById('newFolderName').value.trim();
        const pass = document.getElementById('newFolderPassword').value.trim();
        if (name) {
            const newDoc = await addDoc(collection(db, "Cloud Drive"), {
                Email: userEmail,
                Folder: "True",
                Name: name,
                Password: pass,
                Files: [],
                parentFolder: currentFolderId || null,
                Access: { Viewer: [], Commentator: [], Editor: [] }
            });
            if (currentFolderId) {
                await updateDoc(doc(db, "Cloud Drive", currentFolderId), { Files: arrayUnion(newDoc.id) });
            }
            folderModal.classList.remove('active');
            showToast("Folder created");
            loadDrive();
        }
    });

    // Upload & Drag Drop to Nested Folder
    const nativeFileInput = document.getElementById('nativeFileInput');
    document.getElementById('uploadTriggerBtn').addEventListener('click', () => nativeFileInput.click());
    nativeFileInput.addEventListener('change', (e) => { if (e.target.files.length) handleBatchUpload(e.target.files); });

    const dragOverlay = document.getElementById('dragOverlay');
    window.addEventListener('dragover', (e) => { e.preventDefault(); dragOverlay.classList.add('active'); });
    window.addEventListener('dragleave', (e) => { if (e.clientX === 0 && e.clientY === 0) dragOverlay.classList.remove('active'); });
    window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragOverlay.classList.remove('active');
        if (e.dataTransfer.files.length) handleBatchUpload(e.dataTransfer.files);
    });

    async function handleBatchUpload(files) {
        showToast(`Uploading ${files.length} file(s)...`);
        for (const file of files) {
            if (file.size > 50 * 1024 * 1024) {
                showToast(`Skipped ${file.name} (exceeds 50MB)`);
                continue;
            }
            try {
                let fileUrl = "", fileType = "";
                if (file.type.startsWith('image/')) {
                    const fd = new FormData();
                    fd.append('image', file);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = j.data.url;
                    fileType = ".img";
                } else {
                    const fd = new FormData();
                    fd.append('UPLOADCARE_PUB_KEY', UPLOADCARE_PUB_KEY);
                    fd.append('UPLOADCARE_STORE', '1');
                    fd.append('file', file);
                    const res = await fetch('https://upload.uploadcare.com/base/', { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = `https://ucarecdn.com/${j.file}/${encodeURIComponent(file.name)}`;
                    const ext = file.name.split('.').pop();
                    fileType = ext ? `.${ext.toLowerCase()}` : '.file';
                }

                const docRef = await addDoc(collection(db, "Cloud Drive"), {
                    Email: userEmail,
                    File: fileUrl,
                    Type: fileType,
                    Name: file.name,
                    Password: "",
                    parentFolder: currentFolderId || null,
                    Access: { Viewer: [], Commentator: [], Editor: [] }
                });

                if (currentFolderId) {
                    await updateDoc(doc(db, "Cloud Drive", currentFolderId), { Files: arrayUnion(docRef.id) });
                }
            } catch(e) {
                console.error(e);
            }
        }
        showToast("Upload completed!");
        loadDrive();
    }

    // Search Filtering
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.table-row').forEach(row => {
            const name = row.querySelector('.file-name').innerText.toLowerCase();
            row.style.display = name.includes(val) ? 'grid' : 'none';
        });
    });

    loadDrive();
</script>
</body>
</html>
