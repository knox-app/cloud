<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Drive</title>
    <!-- jsPDF for Image-to-PDF conversion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #f3f4f6;
            --hover-bg: #f9fafb;
            --btn-dark-bg: #0d0d0d;
            --btn-dark-text: #ffffff;
            --accent: #10a37f;
            --danger: #ef4444;
            --tag-bg: #e5e7eb;
            --tag-text: #374151;
            --chk-bg: #0d0d0d;
            --sidebar-width: 64px;
        }

        body.dark {
            --bg-color: #0d0d0d;
            --surface-color: #171717;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #262626;
            --hover-bg: #1f1f1f;
            --btn-dark-bg: #ffffff;
            --btn-dark-text: #0d0d0d;
            --accent: #10a37f;
            --danger: #f87171;
            --tag-bg: #2d2d2d;
            --tag-text: #d1d5db;
            --chk-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Sidebar */
        aside.sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 16px;
            flex-shrink: 0;
            background: var(--surface-color);
        }

        .side-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .side-icon:hover, .side-icon.active {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }
        .side-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

        /* Main Viewport */
        main.content-area {
            flex-grow: 1;
            padding: 32px 40px;
            max-width: 1240px;
            position: relative;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-pill {
            background-color: var(--btn-dark-bg);
            color: var(--btn-dark-text);
            border: none;
            padding: 9px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: opacity 0.2s;
            user-select: none;
        }
        .btn-pill:hover { opacity: 0.9; }

        .btn-icon-pill {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--hover-bg);
            color: var(--text-primary);
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-icon-pill:hover { opacity: 0.85; transform: scale(1.04); }
        .btn-icon-pill.danger { background: var(--danger); color: #fff; border: none; }
        .btn-icon-pill svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        /* Search input bar */
        .search-container {
            position: relative;
            max-width: 380px;
            margin-bottom: 20px;
        }
        .search-container svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            fill: none;
        }
        .search-input {
            width: 100%;
            padding: 9px 14px 9px 38px;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
        }
        .search-input:focus { border-color: var(--text-secondary); }

        /* Multi-selection Toolbar */
        .selection-toolbar {
            position: sticky;
            top: 10px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 9999px;
            display: none;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            z-index: 10;
        }
        .selection-toolbar.active { display: flex; }

        /* Tags / Labels */
        .label-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 7px;
            background: var(--tag-bg);
            color: var(--tag-text);
            border-radius: 6px;
            font-size: 11px;
            margin-right: 4px;
            margin-top: 2px;
            font-weight: 500;
        }

        /* Custom Circular Black Checkbox */
        .circular-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-secondary);
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: all 0.15s ease-in-out;
            background-color: transparent;
            margin: 0 auto;
        }
        .circular-checkbox:checked {
            background-color: var(--btn-dark-bg);
            border-color: var(--btn-dark-bg);
        }
        .circular-checkbox:checked::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--btn-dark-text);
        }

        /* Drag & Drop Surface */
        .drag-overlay {
            position: fixed;
            inset: 0;
            background: rgba(16, 163, 127, 0.08);
            border: 2px dashed var(--accent);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }
        .drag-overlay.active { display: flex; }
        .drag-overlay-card {
            background: var(--surface-color);
            padding: 24px 36px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Table Dynamic Grid */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .table-head {
            display: grid;
            grid-template-columns: 3.2fr 1.8fr 1.5fr 1.8fr 40px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .table-row {
            display: grid;
            grid-template-columns: 3.2fr 1.8fr 1.5fr 1.8fr 40px;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            transition: background-color 0.15s;
            user-select: none;
        }
        .table-row:hover { background-color: var(--hover-bg); }
        .table-row.selected { background-color: rgba(16, 163, 127, 0.08); }
        .table-row.keyboard-focused { outline: 2px solid var(--accent); outline-offset: -2px; }

        /* When Selection Mode is Activated */
        .selection-active .table-head {
            grid-template-columns: 36px 3.2fr 1.8fr 1.5fr 1.8fr 40px;
        }
        .selection-active .table-row {
            grid-template-columns: 36px 3.2fr 1.8fr 1.5fr 1.8fr 40px;
        }

        .cell-checkbox {
            display: none;
            align-items: center;
            justify-content: center;
        }
        .selection-active .cell-checkbox {
            display: flex;
        }

        .file-title-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-icon-box {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--hover-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--text-secondary);
        }
        .file-icon-box svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; }

        .file-info-col {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .file-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }
        .file-labels {
            display: flex;
            flex-wrap: wrap;
            margin-top: 3px;
        }

        /* 3-Dots Dropdown */
        .actions-cell { position: relative; text-align: right; }
        .btn-dots {
            background: none;
            border: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-dots:hover { color: var(--text-primary); background: var(--border-color); }
        .btn-dots svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        .action-dropdown {
            position: absolute;
            right: 0;
            top: 32px;
            background: var(--surface-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.14);
            border-radius: 12px;
            width: 190px;
            padding: 6px 0;
            z-index: 100;
            display: none;
            border: 1px solid var(--border-color);
        }
        .action-dropdown.active { display: block; }
        .dropdown-item {
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .dropdown-item:hover { background: var(--hover-bg); }
        .dropdown-item.danger { color: var(--danger); }
        .dropdown-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

        /* Empty State */
        .empty-state-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 56px 20px;
            text-align: center;
        }
        .empty-state-img {
            width: 180px;
            max-width: 100%;
            height: auto;
            margin-bottom: 18px;
            opacity: 0.9;
        }
        .empty-state-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 14px;
        }

        /* Modals */
        .modal-shade {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 16px;
        }
        .modal-shade.active { visibility: visible; opacity: 1; }

        .modal-box {
            background: var(--surface-color);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 26px;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .modal-title { font-size: 17px; font-weight: 600; }
        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .modal-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .clean-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--hover-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
        }
        .clean-input:focus { border-color: var(--text-secondary); }

        .user-access-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        /* Toast Feedback */
        .toast-popup {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: #ffffff;
            padding: 9px 20px;
            border-radius: 9999px;
            font-size: 13px;
            display: none;
            z-index: 2000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* Detail List */
        .details-grid { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
        .details-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border-color); }
        .details-label { color: var(--text-secondary); }
        .details-val { font-weight: 500; text-align: right; max-width: 260px; overflow-wrap: break-word; }

        /* Responsive view for Mobile */
        @media (max-width: 768px) {
            aside.sidebar { display: none; }
            main.content-area { padding: 18px 14px; width: 100%; }
            .table-head { display: none; }
            
            .table-row {
                grid-template-columns: 1fr auto 30px;
                gap: 8px;
                padding: 10px 0;
            }
            .selection-active .table-row {
                grid-template-columns: 28px 1fr auto 30px;
            }

            .cell-uploader, .cell-format { display: none; }
            .cell-date { font-size: 11px; color: var(--text-secondary); text-align: right; }
            .modal-box { padding: 20px; border-radius: 16px; }
        }
    </style>
</head>
<body>

<!-- Workspace Sidebar -->
<aside class="sidebar">
    <div class="side-icon active" title="Cloud Drive">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <div class="side-icon" id="themeToggleBtn" title="Toggle Theme (Shift+T then D/L)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </div>
    <div class="side-icon" id="logoutSideBtn" title="Sign Out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </div>
</aside>

<!-- Drag Overlay -->
<div class="drag-overlay" id="dragOverlay">
    <div class="drag-overlay-card">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span>Drop files here to upload</span>
    </div>
</div>

<!-- Main Content Area -->
<main class="content-area" id="mainArea">
    <div class="top-row">
        <div class="page-title" id="breadcrumbArea">
            <span>Cloud Drive</span>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-pill" id="btnSelectModeToggle" style="background: var(--hover-bg); color: var(--text-primary); border: 1px solid var(--border-color);" title="Select Multiple (Shift+S)">
                Select
            </button>
            <button class="btn-pill" id="uploadTriggerBtn" title="Upload (Shift+U)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Upload
            </button>
            <button class="btn-pill" id="newFolderTriggerBtn" style="background: var(--hover-bg); color: var(--text-primary); border: 1px solid var(--border-color);" title="New Folder (Shift+C)">
                + Folder
            </button>
        </div>
    </div>

    <!-- Multi-Selection Action Bar (Icons Only for Actions) -->
    <div class="selection-toolbar" id="selectionToolbar">
        <span id="selectedCountText" style="font-weight: 500; font-size: 13px; margin-left: 6px;">0 Selected</span>
        <div style="display: flex; align-items: center; gap: 8px;">
            <button class="btn-icon-pill" id="btnMultiDownload" title="Download Files">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
            <button class="btn-icon-pill" id="btnMultiMove" title="Move (Shift+M)">
                <svg viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>
            </button>
            <button class="btn-icon-pill danger" id="btnMultiDelete" title="Delete (Shift+D)">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
            <button class="btn-pill" id="btnCancelSelect" style="background: transparent; color: var(--text-secondary); border: none; padding: 6px 12px; font-size: 12px;">Done</button>
        </div>
    </div>

    <!-- Hidden Native File Input -->
    <input type="file" id="nativeFileInput" multiple style="display: none;">

    <div class="search-container">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search entire drive (Shift+F)">
    </div>

    <!-- Table -->
    <div class="data-table" id="dataTable">
        <div class="table-head">
            <div class="cell-checkbox"><input type="checkbox" class="circular-checkbox" id="selectAllCheckbox"></div>
            <div>Name</div>
            <div class="cell-uploader">Owner</div>
            <div class="cell-format">Format</div>
            <div class="cell-date">Updated</div>
            <div></div>
        </div>
        <div id="tableContent">
            <div style="padding: 24px 0; color: var(--text-secondary); font-size: 14px;">Loading Cloud Drive...</div>
        </div>
    </div>
</main>

<!-- Modal: Manage Access (Includes Contributor) -->
<div class="modal-shade" id="accessModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Manage Access</div>
            <button class="modal-close" id="closeAccessModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="input-group" id="inviteSection">
            <label>Invite User</label>
            <div style="display: flex; gap: 8px;">
                <input type="email" id="inviteEmailInput" class="clean-input" placeholder="user@example.com">
                <select id="inviteRoleSelect" class="clean-input" style="width: 170px;">
                    <option value="Editor">Editor</option>
                    <option value="Contributor">Contributor</option>
                    <option value="Viewer">Viewer</option>
                    <option value="Commenter">Commenter</option>
                    <option value="Transfer">Transfer Ownership</option>
                </select>
                <button class="btn-pill" id="btnAddAccess" style="padding: 0 16px;">Add</button>
            </div>
        </div>
        <div class="input-group">
            <label>Collaborators with Access</label>
            <div id="accessListContainer" style="max-height: 180px; overflow-y: auto;"></div>
        </div>
        <div style="display: flex; justify-content: flex-end; margin-top: 18px;">
            <button class="btn-pill" id="btnSaveAccess">Save Changes</button>
        </div>
    </div>
</div>

<!-- Modal: Folder Security (Password Lock) -->
<div class="modal-shade" id="securityModal">
    <div class="modal-box" style="max-width: 400px;">
        <div class="modal-header">
            <div class="modal-title">Folder Security</div>
            <button class="modal-close" id="closeSecurityModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="input-group">
            <label>Folder Password Protection</label>
            <input type="text" id="securityPasswordInput" class="clean-input" placeholder="Enter password to lock (or leave empty to remove)">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px;">
            <button class="btn-pill" id="btnSaveSecurity">Update Security</button>
        </div>
    </div>
</div>

<!-- Modal: Labels / Tags -->
<div class="modal-shade" id="labelModal">
    <div class="modal-box" style="max-width: 400px;">
        <div class="modal-header">
            <div class="modal-title">Manage Labels</div>
            <button class="modal-close" id="closeLabelModal">

<div class="toast-popup" id="toastPopup"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getFirestore, collection, query, where, getDocs, or,
        doc, updateDoc, deleteDoc, addDoc, arrayUnion, arrayRemove 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const IMGBB_API_KEY = "80c452b9a4b80f240ada316f23078d2c";
    const UPLOADCARE_PUB_KEY = "demopublickey";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Auth verification
    let currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('active_user')); } catch(e){}
    if (!currentUser || !currentUser.Email) {
        window.location.href = "1.html";
    }
    const userEmail = currentUser.Email;

    // Theme Management
    function setTheme(dark) {
        if (dark) {
            document.body.classList.add('dark');
            localStorage.setItem('drive_theme', 'dark');
        } else {
            document.body.classList.remove('dark');
            localStorage.setItem('drive_theme', 'light');
        }
    }
    if (localStorage.getItem('drive_theme') === 'dark') setTheme(true);

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
        setTheme(!document.body.classList.contains('dark'));
    });

    document.getElementById('logoutSideBtn').addEventListener('click', () => {
        localStorage.removeItem('active_user');
        window.location.href = "1.html";
    });

    function showToast(msg) {
        const t = document.getElementById('toastPopup');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 2600);
    }

    function formatFirestoreDate() {
        const d = new Date();
        const timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
        const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
        return `${timeStr} , ${d.getDate()}-${months[d.getMonth()]}-${d.getFullYear()}`;
    }

    const SVG_ICONS = {
        folder: `<svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`,
        image: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`,
        pdf: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>`,
        doc: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`,
        video: `<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>`,
        dots: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>`,
        trash: `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`,
        share: `<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>`,
        download: `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`,
        edit: `<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
        users: `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`,
        move: `<svg viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>`,
        info: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`,
        tag: `<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>`,
        lock: `<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`
    };

    function getFormatInfo(typeStr, isFolder) {
        if (isFolder) return { label: "Folder", icon: SVG_ICONS.folder };
        const t = (typeStr || "").toLowerCase();
        if (t.includes("img") || t.includes("png") || t.includes("jpg") || t.includes("jpeg") || t.includes("image")) return { label: "Image", icon: SVG_ICONS.image };
        if (t.includes("pdf")) return { label: "PDF", icon: SVG_ICONS.pdf };
        if (t.includes("mp4") || t.includes("mkv") || t.includes("video")) return { label: "Video", icon: SVG_ICONS.video };
        return { label: "Document", icon: SVG_ICONS.doc };
    }

    // State Variables
    let folderHierarchy = [];
    let allWorkspaceDocs = [];
    let allFolderDocs = [];
    let currentRenderedItems = [];
    let selectedItemIds = new Set();
    let isSelectionMode = false;
    let keyboardFocusedIndex = -1;

    function getCurrentFolderId() {
        return folderHierarchy.length > 0 ? folderHierarchy[folderHierarchy.length - 1].id : null;
    }

    function getCurrentParentFolder() {
        const cid = getCurrentFolderId();
        return cid ? allFolderDocs.find(f => f.id === cid) : null;
    }

    function getUserRole(item) {
        if (item.Email === userEmail) return 'Owner';
        const acc = item.Access || {};
        if (acc.Editor?.includes(userEmail)) return 'Editor';
        if (acc.Contributor?.includes(userEmail)) return 'Contributor';
        if (acc.Commenter?.includes(userEmail) || acc.Commentator?.includes(userEmail)) return 'Commenter';
        if (acc.Viewer?.includes(userEmail)) return 'Viewer';

        // Check Inheritance
        for (const f of folderHierarchy) {
            const pDoc = allFolderDocs.find(x => x.id === f.id);
            if (pDoc) {
                if (pDoc.Email === userEmail) return 'Owner';
                const pAcc = pDoc.Access || {};
                if (pAcc.Editor?.includes(userEmail)) return 'Editor';
                if (pAcc.Contributor?.includes(userEmail)) return 'Contributor';
                if (pAcc.Commenter?.includes(userEmail) || pAcc.Commentator?.includes(userEmail)) return 'Commenter';
                if (pAcc.Viewer?.includes(userEmail)) return 'Viewer';
            }
        }
        return 'Viewer';
    }

    function renderBreadcrumb() {
        const area = document.getElementById('breadcrumbArea');
        if (folderHierarchy.length === 0) {
            area.innerHTML = `<span>Cloud Drive</span>`;
        } else {
            let html = `<span style="color: var(--text-secondary); cursor: pointer;" id="bc-root">Cloud Drive</span>`;
            folderHierarchy.forEach((item, index) => {
                html += ` <span style="color: var(--text-secondary); font-weight: 400;">/</span> `;
                if (index === folderHierarchy.length - 1) {
                    html += `<span>${item.name}</span>`;
                } else {
                    html += `<span style="color: var(--text-secondary); cursor: pointer;" class="bc-crumb" data-idx="${index}">${item.name}</span>`;
                }
            });
            area.innerHTML = html;

            document.getElementById('bc-root')?.addEventListener('click', () => {
                folderHierarchy = [];
                loadDrive();
            });
            document.querySelectorAll('.bc-crumb').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.getAttribute('data-idx'));
                    folderHierarchy = folderHierarchy.slice(0, idx + 1);
                    loadDrive();
                });
            });
        }
    }

    // Database Fetch
    async function loadDrive() {
        renderBreadcrumb();
        exitSelectionMode();
        keyboardFocusedIndex = -1;

        const container = document.getElementById('tableContent');
        container.innerHTML = `<div style="padding: 24px 0; color: var(--text-secondary); font-size: 14px;">Loading items...</div>`;

        try {
            const q = query(
                collection(db, "Cloud Drive"),
                or(
                    where("Email", "==", userEmail),
                    where("Access.Viewer", "array-contains", userEmail),
                    where("Access.Contributor", "array-contains", userEmail),
                    where("Access.Commenter", "array-contains", userEmail),
                    where("Access.Commentator", "array-contains", userEmail),
                    where("Access.Editor", "array-contains", userEmail)
                )
            );

            const snap = await getDocs(q);
            const items = [];
            snap.forEach(docSnap => {
                items.push({ id: docSnap.id, ...docSnap.data() });
            });

            allWorkspaceDocs = items;
            allFolderDocs = items.filter(d => d.Folder === "True");
            container.innerHTML = "";

            const currId = getCurrentFolderId();
            let renderItems = [];

            if (!currId) {
                const assignedChildIds = new Set();
                allFolderDocs.forEach(f => {
                    if (Array.isArray(f.File)) f.File.forEach(id => assignedChildIds.add(id));
                });
                renderItems = items.filter(i => !assignedChildIds.has(i.id));
            } else {
                const activeFolder = allFolderDocs.find(f => f.id === currId);
                const assignedIds = (activeFolder && Array.isArray(activeFolder.File)) ? activeFolder.File : [];
                renderItems = items.filter(i => assignedIds.includes(i.id));
            }

            currentRenderedItems = renderItems;

            if (renderItems.length === 0) {
                renderEmptyState(container);
                return;
            }

            renderItems.sort((a, b) => (b.Folder === "True" ? 1 : 0) - (a.Folder === "True" ? 1 : 0));
            renderItems.forEach((item, idx) => renderRow(item, idx));
        } catch(e) {
            console.error(e);
            container.innerHTML = `<div style="padding: 20px 0; color: var(--danger);">Failed to load Cloud Drive.</div>`;
        }
    }

    // Render Empty State with Asset & Add Files Button
    function renderEmptyState(container) {
        const currFolder = folderHierarchy.length > 0 ? folderHierarchy[folderHierarchy.length - 1].name : null;
        const msg = currFolder ? `No Files In Your ${currFolder}` : "No Files In Your Drive";

        container.innerHTML = `
            <div class="empty-state-container">
                <img src="https://indus.sarvam.ai/studio/assets/empty-table.webp" alt="No files" class="empty-state-img">
                <div class="empty-state-title">${msg}</div>
                <button class="btn-pill" id="emptyStateAddBtn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Files
                </button>
            </div>
        `;
        document.getElementById('emptyStateAddBtn').addEventListener('click', () => {
            document.getElementById('nativeFileInput').click();
        });
    }

    function renderRow(item, index) {
        const container = document.getElementById('tableContent');
        const isFolder = item.Folder === "True";
        const name = item.Name || (item.File ? item.File.split('/').pop() : 'Untitled');
        const format = getFormatInfo(item.Type, isFolder);
        const updated = item.Updated || "Recently";
        const ownerEmail = item.Email || userEmail;
        const role = getUserRole(item);
        const isViewer = (role === 'Viewer');

        let labels = Array.isArray(item.Label) ? [...item.Label] : [];
        if (!isFolder && labels.length === 0 && folderHierarchy.length > 0) {
            const p = getCurrentParentFolder();
            if (p && Array.isArray(p.Label)) labels = [...p.Label];
        }

        const labelsHtml = labels.map(l => `<span class="label-badge">${l}</span>`).join('');

        const row = document.createElement('div');
        row.className = 'table-row';
        row.setAttribute('data-id', item.id);
        row.setAttribute('data-index', index);

        row.innerHTML = `
            <div class="cell-checkbox"><input type="checkbox" class="circular-checkbox row-checkbox" data-id="${item.id}"></div>
            <div class="file-title-cell">
                <div class="file-icon-box">${format.icon}</div>
                <div class="file-info-col">
                    <span class="file-name" title="${name}">${name}</span>
                    <div class="file-labels">${labelsHtml}</div>
                </div>
            </div>
            <div class="cell-uploader" style="font-size: 13px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${ownerEmail}</div>
            <div class="cell-format" style="font-size: 13px; color: var(--text-secondary);">${format.label}</div>
            <div class="cell-date" style="font-size: 13px; color: var(--text-secondary);">${updated}</div>
            <div class="actions-cell">
                <button class="btn-dots">${SVG_ICONS.dots}</button>
                <div class="action-dropdown">
                    ${!isFolder ? `<div class="dropdown-item opt-download">${SVG_ICONS.download} Download</div>` : ''}
                    ${!isViewer ? `<div class="dropdown-item opt-rename">${SVG_ICONS.edit} Rename</div>` : ''}
                    ${!isFolder ? `<div class="dropdown-item opt-share">${SVG_ICONS.share} Share</div>` : ''}
                    ${isFolder && !isViewer ? `<div class="dropdown-item opt-security">${SVG_ICONS.lock} Security</div>` : ''}
                    <div class="dropdown-item opt-access">${SVG_ICONS.users} Manage Access</div>
                    <div class="dropdown-item opt-label">${SVG_ICONS.tag} Label</div>
                    ${!isViewer ? `<div class="dropdown-item opt-move">${SVG_ICONS.move} ${isFolder ? 'Organise' : 'Move'}</div>` : ''}
                    <div class="dropdown-item opt-details">${SVG_ICONS.info} Details</div>
                    ${!isViewer ? `<div class="dropdown-item danger opt-delete">${SVG_ICONS.trash} Delete</div>` : ''}
                </div>
            </div>
        `;

        const chk = row.querySelector('.row-checkbox');
        chk.addEventListener('change', (e) => {
            e.stopPropagation();
            toggleSelectItem(item.id, chk.checked);
        });

        // Mobile touch long-press detection
        let touchTimer = null;
        let touchMoved = false;

        row.addEventListener('touchstart', (e) => {
            touchMoved = false;
            touchTimer = setTimeout(() => {
                if (!touchMoved) {
                    if (navigator.vibrate) navigator.vibrate(40);
                    if (!isSelectionMode) enterSelectionMode();
                    toggleSelectItem(item.id, !selectedItemIds.has(item.id));
                }
            }, 500);
        }, { passive: true });

        row.addEventListener('touchmove', () => { touchMoved = true; clearTimeout(touchTimer); });
        row.addEventListener('touchend', () => clearTimeout(touchTimer));

        const dotsBtn = row.querySelector('.btn-dots');
        const dropdown = row.querySelector('.action-dropdown');

        dotsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.action-dropdown').forEach(d => d !== dropdown && d.classList.remove('active'));
            dropdown.classList.toggle('active');
        });

        row.querySelector('.file-name').addEventListener('click', () => {
            if (isSelectionMode) {
                toggleSelectItem(item.id, !selectedItemIds.has(item.id));
                return;
            }
            if (item.Password) {
                promptPasswordAuth(item.Password, () => openItem(item, isFolder, name));
            } else {
                openItem(item, isFolder, name);
            }
        });

        // Actions
        if (!isFolder) {
            row.querySelector('.opt-download')?.addEventListener('click', () => directDownloadFile(item.File, item.Name));
            row.querySelector('.opt-share')?.addEventListener('click', () => openShareModal(item));
        }
        if (isFolder && !isViewer) {
            row.querySelector('.opt-security')?.addEventListener('click', () => openSecurityModal(item));
        }
        if (!isViewer) {
            row.querySelector('.opt-rename')?.addEventListener('click', () => openRenameModal(item));
            row.querySelector('.opt-move')?.addEventListener('click', () => openMoveModal(item));
            row.querySelector('.opt-delete')?.addEventListener('click', () => handleDelete(item));
        }

    // Direct Browser Download
    async function directDownloadFile(url, fileName) {
        showToast("Starting download...");
        try {
            const res = await fetch(url);
            const blob = await res.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = fileName || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
            showToast("Download complete");
        } catch(e) {
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }

    async function handleBatchUpload(files) {
        showToast(`Uploading ${files.length} file(s)...`);
        for (const file of files) {
            if (file.size > 50 * 1024 * 1024) {
                showToast(`Skipped ${file.name} (exceeds 50MB)`);
                continue;
            }

            try {
                let fileUrl = "";
                let fileType = "Document";

                if (file.type.startsWith('image/')) {
                    const fd = new FormData();
                    fd.append('image', file);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = j.data.url;
                    fileType = "Image";
                } else {
                    const fd = new FormData();
                    fd.append('UPLOADCARE_PUB_KEY', UPLOADCARE_PUB_KEY);
                    fd.append('UPLOADCARE_STORE', '1');
                    fd.append('file', file);
                    const res = await fetch('https://upload.uploadcare.com/base/', { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = `https://ucarecdn.com/${j.file}/${encodeURIComponent(file.name)}`;
                    const ext = file.name.split('.').pop()?.toUpperCase();
                    fileType = ext || "Document";
                }

                let parentLabels = [];
                const p = getCurrentParentFolder();
                if (p && Array.isArray(p.Label)) parentLabels = [...p.Label];

                const newDoc = await addDoc(collection(db, "Cloud Drive"), {
                    Email: userEmail,
                    File: fileUrl,
                    Type: fileType,
                    Name: file.name,
                    Password: "",
                    Label: parentLabels,
                    LastOpened: new Date().toISOString(),
                    LastOpenedBy: userEmail,
                    Updated: formatFirestoreDate(),
                    Access: { Viewer: [], Contributor: [], Commenter: [], Editor: [] }
                });

                const currFolderId = getCurrentFolderId();
                if (currFolderId) {
                    await updateDoc(doc(db, "Cloud Drive", currFolderId), {
                        File: arrayUnion(newDoc.id),
                        Updated: formatFirestoreDate()
                    });
                }
            } catch(err) {
                console.error("Upload error:", err);
            }
        }
        showToast("Upload completed!");
        loadDrive();
    }

    // Keyboard Shortcuts
    let themeKeySequence = [];
    let themeTimer = null;

    window.addEventListener('keydown', (e) => {
        const tag = e.target.tagName.toLowerCase();
        const isTyping = (tag === 'input' || tag === 'textarea' || tag === 'select');

        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-shade').forEach(m => m.classList.remove('active'));
            if (isSelectionMode) exitSelectionMode();
            return;
        }

        if (isTyping) return;

        // Shift + F -> Focus search
        if (e.shiftKey && (e.key === 'F' || e.key === 'f')) {
            e.preventDefault();
            const s = document.getElementById('searchInput');
            s.focus();
            s.select();
            return;
        }

        // Shift + C -> Create Folder
        if (e.shiftKey && (e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
            document.getElementById('newFolderTriggerBtn').click();
            return;
        }

        // Shift + U -> File Upload
        if (e.shiftKey && (e.key === 'U' || e.key === 'u')) {
            e.preventDefault();
            nativeFileInput.click();
            return;
        }

        // Shift + S -> Toggle Multi-select mode
        if (e.shiftKey && (e.key === 'S' || e.key === 's')) {
            e.preventDefault();
            if (!isSelectionMode) {
                enterSelectionMode();
            } else if (selectedItemIds.size > 0) {
                document.getElementById('btnMultiDelete').click();
            } else {
                exitSelectionMode();
            }
            return;
        }

        // Shift + D -> Delete selected items
        if (e.shiftKey && (e.key === 'D' || e.key === 'd')) {
            e.preventDefault();
            if (selectedItemIds.size > 0) {
                document.getElementById('btnMultiDelete').click();
            }
            return;
        }

        // Shift + M -> Move selected
        if (e.shiftKey && (e.key === 'M' || e.key === 'm')) {
            e.preventDefault();
            if (selectedItemIds.size > 0) {
                document.getElementById('btnMultiMove').click();
            }
            return;
        }

        // Theme Switch Sequence
        if (e.shiftKey && (e.key === 'T' || e.key === 't')) {
            themeKeySequence = ['T'];
            clearTimeout(themeTimer);
            themeTimer = setTimeout(() => { themeKeySequence = []; }, 1500);
            return;
        }
        if (themeKeySequence[0] === 'T') {
            if (e.key === 'd' || e.key === 'D') {
                setTheme(true);
                showToast("Dark theme enabled");
                themeKeySequence = [];
                return;
            } else if (e.key === 'l' || e.key === 'L') {
                setTheme(false);
                showToast("Light theme enabled");
                themeKeySequence = [];
                return;
            }
        }

        // Arrow Key Navigation & Space Selection
        const rows = document.querySelectorAll('.table-row');
        if (rows.length === 0) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            keyboardFocusedIndex = Math.min(keyboardFocusedIndex + 1, rows.length - 1);
            updateKeyboardFocus(rows);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            keyboardFocusedIndex = Math.max(keyboardFocusedIndex - 1, 0);
            updateKeyboardFocus(rows);
        } else if (e.key === ' ' || e.code === 'Space') {
            if (keyboardFocusedIndex >= 0 && keyboardFocusedIndex < rows.length) {
                e.preventDefault();
                if (!isSelectionMode) enterSelectionMode();
                const id = rows[keyboardFocusedIndex].getAttribute('data-id');
                const isSelected = selectedItemIds.has(id);
                toggleSelectItem(id, !isSelected);
            }
        }
    });

    function updateKeyboardFocus(rows) {
        rows.forEach(r => r.classList.remove('keyboard-focused'));
        if (keyboardFocusedIndex >= 0 && keyboardFocusedIndex < rows.length) {
            const target = rows[keyboardFocusedIndex];
            target.classList.add('keyboard-focused');
            target.scrollIntoView({ block: 'nearest' });
        }
    }

    // Initial Load
    loadDrive();
</script>
</body>
</html>
