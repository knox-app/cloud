<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Drive</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --btn-bg: #0f172a;
            --btn-text: #ffffff;
            --btn-hover: #334155;
            --accent: #2563eb;
            --card-bg: #ffffff;
            --danger: #ef4444;
            --badge-bg: #f1f5f9;
        }

        body.dark {
            --bg-color: #09090b;
            --surface-color: #121214;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #27272a;
            --btn-bg: #f8fafc;
            --btn-text: #09090b;
            --btn-hover: #e2e8f0;
            --accent: #3b82f6;
            --card-bg: #18181b;
            --danger: #f87171;
            --badge-bg: #27272a;
        }

        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            transition: background 0.2s, color 0.2s;
        }

        /* Top Header */
        header {
            background: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-left { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .user-email { font-size: 13px; color: var(--text-secondary); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .btn-ui {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Controls Bar */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .breadcrumbs {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .breadcrumb-item {
            cursor: pointer;
            color: var(--accent);
        }

        .view-toggles {
            display: flex;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .toggle-btn {
            background: none;
            border: none;
            padding: 6px 12px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .toggle-btn.active {
            background: var(--badge-bg);
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Grid View Layout */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        /* Linear / List View Layout */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Card Styles */
        .drive-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
        }

        .items-grid .drive-item {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .items-list .drive-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            justify-content: space-between;
        }

        .item-preview {
            height: 120px;
            background: var(--badge-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
        }

        .items-list .item-preview {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            flex-shrink: 0;
            margin-right: 14px;
        }

        .item-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-body {
            padding: 12px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .items-list .item-body {
            padding: 0;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }

        .item-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-badge {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--badge-bg);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
            width: fit-content;
        }

        .item-actions {
            display: flex;
            gap: 6px;
            margin-top: auto;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .action-btn.delete { color: var(--danger); border-color: var(--danger); }
        .action-btn:hover { background: var(--badge-bg); }

        /* Custom In-App Modal Dialogs */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
        }

        .modal h3 { margin: 0 0 16px 0; font-size: 18px; }
        .modal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-primary);
            margin-bottom: 16px;
            font-size: 14px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* In-App Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            display: none;
            z-index: 200;
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <span>☁️</span> Cloud Drive
    </div>
    <div class="header-right">
        <span class="user-email" id="userDisplay">Loading...</span>
        <button class="btn-ui" id="logoutBtn">Sign Out</button>
    </div>
</header>

<div class="container">
    <div class="controls-bar">
        <div class="breadcrumbs" id="breadcrumbs">
            <span class="breadcrumb-item" id="navRoot">Drive</span>
        </div>

        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <div class="view-toggles">
                <button class="toggle-btn active" id="gridToggle">⊞ Grid</button>
                <button class="toggle-btn" id="listToggle">☰ List</button>
            </div>
            <button class="btn-ui" id="newFolderBtn">+ New Folder</button>
            <a href="upload.html" class="btn-ui" style="background: var(--accent); color: #fff;">↑ Upload</a>
        </div>
    </div>

    <!-- Items Container -->
    <div class="items-grid" id="itemsContainer">
        <!-- Folders and Files render here -->
    </div>
</div>

<!-- Custom Create Folder Modal -->
<div class="modal-overlay" id="folderModal">
    <div class="modal">
        <h3>Create New Folder</h3>
        <input type="text" id="folderNameInput" class="modal-input" placeholder="Folder Name...">
        <div class="modal-footer">
            <button class="action-btn" id="closeFolderModal">Cancel</button>
            <button class="btn-ui" id="submitCreateFolder">Create</button>
        </div>
    </div>
</div>

<!-- Custom Move to Folder Modal -->
<div class="modal-overlay" id="moveModal">
    <div class="modal">
        <h3>Move to Folder</h3>
        <select id="moveFolderSelect" class="modal-input"></select>
        <div class="modal-footer">
            <button class="action-btn" id="closeMoveModal">Cancel</button>
            <button class="btn-ui" id="submitMoveFile">Save</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getFirestore, collection, query, where, getDocs, 
        doc, getDoc, addDoc, updateDoc, deleteDoc, arrayUnion, arrayRemove 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Dark Mode Theme Setup
    if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.body.classList.add("dark");
    }

    // In-App Toast
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    // Authentication
    let currentUser = null;
    try {
        currentUser = JSON.parse(localStorage.getItem('active_user'));
    } catch(e) {}

    if (!currentUser || !currentUser.Email) {
        window.location.href = "1.html"; // Replace with your login filename
    }
    const userEmail = currentUser.Email;
    document.getElementById('userDisplay').innerText = userEmail;

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('active_user');
        window.location.reload();
    });

    // State
    let currentFolderId = null; // null = Root
    let currentFolderName = "";
    let currentLayout = localStorage.getItem('drive_layout') || 'grid';
    let allUserFolders = [];
    let movingFileId = null;

    // View Toggles (Grid vs Linear)
    const itemsContainer = document.getElementById('itemsContainer');
    const gridToggle = document.getElementById('gridToggle');
    const listToggle = document.getElementById('listToggle');

    function applyLayout(layout) {
        currentLayout = layout;
        localStorage.setItem('drive_layout', layout);
        if (layout === 'list') {
            itemsContainer.className = 'items-list';
            listToggle.classList.add('active');
            gridToggle.classList.remove('active');
        } else {
            itemsContainer.className = 'items-grid';
            gridToggle.classList.add('active');
            listToggle.classList.remove('active');
        }
    }
    applyLayout(currentLayout);

    gridToggle.addEventListener('click', () => applyLayout('grid'));
    listToggle.addEventListener('click', () => applyLayout('list'));

    // Navigation Breadcrumbs
    const breadcrumbs = document.getElementById('breadcrumbs');
    function updateBreadcrumbs() {
        if (!currentFolderId) {
            breadcrumbs.innerHTML = `<span>Drive</span>`;
        } else {
            breadcrumbs.innerHTML = `
                <span class="breadcrumb-item" id="navRoot">Drive</span>
                <span>/</span>
                <span>📁 ${currentFolderName}</span>
            `;
            document.getElementById('navRoot').addEventListener('click', () => {
                currentFolderId = null;
                currentFolderName = "";
                loadDrive();
            });
        }
    }

    // Main Load Function
    async function loadDrive() {
        updateBreadcrumbs();
        itemsContainer.innerHTML = '<p style="color:var(--text-secondary)">Loading contents...</p>';

        try {
            // Fetch all entries for user
            const q = query(collection(db, "Cloud Drive"), where("Email", "==", userEmail));
            const snapshot = await getDocs(q);

            const folders = [];
            const files = [];

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (data.Folder === "True") {
                    folders.push({ id: docSnap.id, ...data });
                } else {
                    files.push({ id: docSnap.id, ...data });
                }
            });

            allUserFolders = folders;
            itemsContainer.innerHTML = '';

            if (currentFolderId === null) {
                // Root view: Render all folders
                folders.forEach(f => renderFolderCard(f));

                // Find files that are assigned to ANY folder
                const folderFileIds = new Set();
                folders.forEach(f => {
                    if (Array.isArray(f.Files)) {
                        f.Files.forEach(id => folderFileIds.add(id));
                    }
                });

                // Render standalone (root) files
                const rootFiles = files.filter(file => !folderFileIds.has(file.id));
                rootFiles.forEach(file => renderFileCard(file, false));

                if (folders.length === 0 && rootFiles.length === 0) {
                    itemsContainer.innerHTML = '<p style="color:var(--text-secondary)">No items in your Cloud Drive.</p>';
                }
            } else {
                // Subfolder View
                const activeFolder = folders.find(f => f.id === currentFolderId);
                const fileIdsInFolder = (activeFolder && Array.isArray(activeFolder.Files)) ? activeFolder.Files : [];
                const folderFiles = files.filter(f => fileIdsInFolder.includes(f.id));

                folderFiles.forEach(file => renderFileCard(file, true));

                if (folderFiles.length === 0) {
                    itemsContainer.innerHTML = '<p style="color:var(--text-secondary)">This folder is empty.</p>';
                }
            }
        } catch(err) {
            console.error("Load drive failed:", err);
            itemsContainer.innerHTML = '<p style="color:var(--danger)">Failed to load data.</p>';
        }
    }

    // Render Folder
    function renderFolderCard(folder) {
        const fileCount = Array.isArray(folder.Files) ? folder.Files.length : 0;
        const div = document.createElement('div');
        div.className = 'drive-item';
        div.innerHTML = `
            <div class="item-preview" style="background: var(--badge-bg); font-size: 38px;">📁</div>
            <div class="item-body">
                <div class="item-title">${folder.Name || 'Untitled'}</div>
                <div class="item-badge">${fileCount} item${fileCount === 1 ? '' : 's'}</div>
                <div class="item-actions">
                    <button class="action-btn open-folder">Open</button>
                    <button class="action-btn delete delete-folder">Delete</button>
                </div>
            </div>
        `;

        div.querySelector('.open-folder').addEventListener('click', () => {
            currentFolderId = folder.id;
            currentFolderName = folder.Name;
            loadDrive();
        });

        div.querySelector('.item-preview').addEventListener('click', () => {
            currentFolderId = folder.id;
            currentFolderName = folder.Name;
            loadDrive();
        });

        div.querySelector('.delete-folder').addEventListener('click', async () => {
            if (confirm(`Delete folder "${folder.Name}"? Files inside will move to root.`)) {
                await deleteDoc(doc(db, "Cloud Drive", folder.id));
                showToast("Folder deleted");
                loadDrive();
            }
        });

        itemsContainer.appendChild(div);
    }

    // Render File
    function renderFileCard(file, insideFolder) {
        const fileUrl = file.File || '#';
        const type = (file.Type || '.file').toLowerCase();
        const isImg = type === '.img' || ['.png', '.jpg', '.jpeg', '.gif', '.webp'].includes(type);

        const div = document.createElement('div');
        div.className = 'drive-item';

        const previewContent = isImg 
            ? `<img src="${fileUrl}" alt="Preview" loading="lazy">`
            : `<span style="font-weight: bold; font-size: 16px;">${type.replace('.', '').toUpperCase()}</span>`;

        div.innerHTML = `
            <div class="item-preview">${previewContent}</div>
            <div class="item-body">
                <span class="item-badge">${type}</span>
                <div class="item-title" title="${fileUrl}">${fileUrl.split('/').pop() || fileUrl}</div>
                <div class="item-actions">
                    <a href="${fileUrl}" target="_blank" class="action-btn">View</a>
                    <button class="action-btn move-btn">${insideFolder ? 'Remove from Folder' : 'Move to Folder'}</button>
                    <button class="action-btn delete delete-file">Delete</button>
                </div>
            </div>
        `;

        // Move/Folder handling
        div.querySelector('.move-btn').addEventListener('click', async () => {
            if (insideFolder) {
                // Remove file from current folder
                await updateDoc(doc(db, "Cloud Drive", currentFolderId), {
                    Files: arrayRemove(file.id)
                });
                showToast("Removed from folder");
                loadDrive();
            } else {
                // Open Move Modal
                openMoveModal(file.id);
            }
        });

        // Delete File
        div.querySelector('.delete-file').addEventListener('click', async () => {
            if (confirm("Delete this file permanently?")) {
                await deleteDoc(doc(db, "Cloud Drive", file.id));
                // Remove references from any folders containing it
                for (const f of allUserFolders) {
                    if (f.Files && f.Files.includes(file.id)) {
                        await updateDoc(doc(db, "Cloud Drive", f.id), {
                            Files: arrayRemove(file.id)
                        });
                    }
                }
                showToast("File deleted");
                loadDrive();
            }
        });

        itemsContainer.appendChild(div);
    }

    // Create Folder Modal Logic
    const folderModal = document.getElementById('folderModal');
    const folderNameInput = document.getElementById('folderNameInput');

    document.getElementById('newFolderBtn').addEventListener('click', () => {
        folderNameInput.value = "";
        folderModal.classList.add('active');
    });

    document.getElementById('closeFolderModal').addEventListener('click', () => {
        folderModal.classList.remove('active');
    });

    document.getElementById('submitCreateFolder').addEventListener('click', async () => {
        const name = folderNameInput.value.trim();
        if (!name) return;
        await addDoc(collection(db, "Cloud Drive"), {
            Email: userEmail,
            Folder: "True",
            Name: name,
            Files: []
        });
        folderModal.classList.remove('active');
        showToast(`Folder "${name}" created`);
        loadDrive();
    });

    // Move File Modal Logic
    const moveModal = document.getElementById('moveModal');
    const moveFolderSelect = document.getElementById('moveFolderSelect');

    function openMoveModal(fileId) {
        movingFileId = fileId;
        moveFolderSelect.innerHTML = "";
        if (allUserFolders.length === 0) {
            showToast("Please create a folder first.");
            return;
        }
        allUserFolders.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f.id;
            opt.innerText = f.Name;
            moveFolderSelect.appendChild(opt);
        });
        moveModal.classList.add('active');
    }

    document.getElementById('closeMoveModal').addEventListener('click', () => {
        moveModal.classList.remove('active');
    });

    document.getElementById('submitMoveFile').addEventListener('click', async () => {
        const targetFolderId = moveFolderSelect.value;
        if (targetFolderId && movingFileId) {
            await updateDoc(doc(db, "Cloud Drive", targetFolderId), {
                Files: arrayUnion(movingFileId)
            });
            moveModal.classList.remove('active');
            showToast("File moved to folder");
            loadDrive();
        }
    });

    // Initialize
    loadDrive();
</script>
</body>
</html>
