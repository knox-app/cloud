<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Drive - My Files</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #f8f9fa;
            --text-primary: #111111;
            --text-secondary: #666666;
            --border-color: #e5e7eb;
            --card-bg: #ffffff;
            --btn-bg: #111111;
            --btn-text: #ffffff;
            --btn-hover: #333333;
            --danger-bg: #ef4444;
            --danger-hover: #dc2626;
            --badge-bg: #f3f4f6;
            --badge-text: #374151;
        }

        body.dark {
            --bg-color: #000000;
            --surface-color: #111111;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --border-color: #27272a;
            --card-bg: #18181b;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover: #e4e4e7;
            --danger-bg: #dc2626;
            --danger-hover: #b91c1c;
            --badge-bg: #27272a;
            --badge-text: #d4d4d8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--surface-color);
        }

        .header-left h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 700;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-pill {
            font-size: 13px;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 500;
        }

        .btn-action {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background-color 0.2s;
        }

        .btn-action:hover {
            background-color: var(--btn-hover);
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .actions-bar h2 {
            font-size: 18px;
            margin: 0;
        }

        /* Files Grid */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .file-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .file-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .preview-area {
            width: 100%;
            height: 140px;
            background-color: var(--surface-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .preview-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-area .file-icon {
            font-size: 32px;
            font-weight: bold;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .file-details {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .file-type-badge {
            align-self: flex-start;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .file-url-link {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 14px;
            text-decoration: none;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .btn-small {
            flex: 1;
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-weight: 500;
        }

        .btn-small:hover {
            background-color: var(--badge-bg);
        }

        .btn-delete {
            border: 1px solid var(--danger-bg);
            color: var(--danger-bg);
        }

        .btn-delete:hover {
            background-color: var(--danger-bg);
            color: #ffffff;
        }

        .empty-state {
            text-align: center;
            padding: 60px 0;
            color: var(--text-secondary);
        }

        .empty-state p {
            font-size: 15px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <h1>Cloud Drive</h1>
    </div>
    <div class="header-right">
        <span class="user-pill" id="userEmailDisplay">Checking login...</span>
        <button class="btn-action" id="logoutBtn">Sign Out</button>
    </div>
</header>

<div class="container">
    <div class="actions-bar">
        <h2>Your Files</h2>
        <a href="upload.html" class="btn-action">+ Upload New</a>
    </div>

    <div class="file-grid" id="fileGrid">
        <!-- Rendered File Cards will appear here -->
    </div>

    <div class="empty-state" id="emptyState" style="display: none;">
        <p>No files found in your Cloud Drive.</p>
        <a href="upload.html" class="btn-action">Upload your first file</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        query, 
        where, 
        getDocs, 
        doc, 
        deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 1. Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
        measurementId: "G-QE17C33TMN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 2. Theme Detection
    const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
    function applyTheme() {
        if (mediaQuery.matches) {
            document.body.classList.add("dark");
        } else {
            document.body.classList.remove("dark");
        }
    }
    applyTheme();
    mediaQuery.addEventListener("change", applyTheme);

    // 3. User Authentication State Check
    let currentUser = null;
    try {
        currentUser = JSON.parse(localStorage.getItem('active_user'));
    } catch (e) {
        currentUser = null;
    }

    if (!currentUser || !currentUser.Email) {
        // Redirect to Sign In if no active user exists
        window.location.href = '1.html'; // Or your login screen path
    }

    const userEmail = currentUser.Email;
    document.getElementById('userEmailDisplay').innerText = userEmail;

    // Logout Handler
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('active_user');
        window.location.reload();
    });

    // 4. Fetch & Display User Files from Firestore
    const fileGrid = document.getElementById('fileGrid');
    const emptyState = document.getElementById('emptyState');

    async function loadUserFiles() {
        fileGrid.innerHTML = '<p style="color: var(--text-secondary)">Loading your files...</p>';
        emptyState.style.display = 'none';

        try {
            const q = query(collection(db, "Cloud Drive"), where("Email", "==", userEmail));
            const querySnapshot = await getDocs(q);

            fileGrid.innerHTML = '';

            if (querySnapshot.empty) {
                emptyState.style.display = 'block';
                return;
            }

            querySnapshot.forEach((docSnapshot) => {
                const data = docSnapshot.data();
                const docId = docSnapshot.id;
                renderFileCard(docId, data);
            });
        } catch (error) {
            console.error("Error fetching files:", error);
            fileGrid.innerHTML = '<p style="color: red">Failed to load files from database.</p>';
        }
    }

    function renderFileCard(id, data) {
        const fileUrl = data.File || "#";
        const fileType = (data.Type || ".file").toLowerCase();
        const isImage = fileType === ".img" || [".jpg", ".jpeg", ".png", ".gif", ".webp"].includes(fileType);

        const card = document.createElement('div');
        card.className = 'file-card';
        card.id = `file-${id}`;

        // Preview thumbnail or icon
        const previewHtml = isImage
            ? `<img src="${fileUrl}" alt="File Preview" loading="lazy" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'file-icon\\'>IMG</div>';">`
            : `<div class="file-icon">${fileType.replace('.', '')}</div>`;

        card.innerHTML = `
            <div class="preview-area">
                ${previewHtml}
            </div>
            <div class="file-details">
                <span class="file-type-badge">${fileType}</span>
                <a href="${fileUrl}" target="_blank" class="file-url-link" title="${fileUrl}">${fileUrl}</a>
                <div class="card-actions">
                    <a href="${fileUrl}" target="_blank" class="btn-small">Open</a>
                    <button class="btn-small copy-btn" data-url="${fileUrl}">Copy</button>
                    <button class="btn-small btn-delete" data-id="${id}">Delete</button>
                </div>
            </div>
        `;

        // Event listener: Copy link
        card.querySelector('.copy-btn').addEventListener('click', function() {
            navigator.clipboard.writeText(fileUrl).then(() => {
                const originalText = this.innerText;
                this.innerText = "Copied!";
                setTimeout(() => this.innerText = originalText, 1500);
            });
        });

        // Event listener: Delete file entry
        card.querySelector('.btn-delete').addEventListener('click', async function() {
            if (confirm("Are you sure you want to remove this file entry?")) {
                this.disabled = true;
                this.innerText = "...";
                try {
                    await deleteDoc(doc(db, "Cloud Drive", id));
                    card.remove();
                    if (fileGrid.children.length === 0) {
                        emptyState.style.display = 'block';
                    }
                } catch (err) {
                    console.error("Delete failed:", err);
                    alert("Failed to delete record.");
                    this.disabled = false;
                    this.innerText = "Delete";
                }
            }
        });

        fileGrid.appendChild(card);
    }

    loadUserFiles();
</script>

</body>
</html>
