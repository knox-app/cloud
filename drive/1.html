<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Drive - Knowledge Base</title>
    <style>
        :root {
            --bg-color: #f9fafb;
            --surface-color: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --hover-color: #f3f4f6;
            --btn-bg: #111827;
            --btn-text: #ffffff;
            --accent: #2563eb;
            --badge-gray-bg: #f3f4f6;
            --badge-gray-text: #4b5563;
            --badge-blue-bg: #eff6ff;
            --badge-blue-text: #1d4ed8;
            --danger: #ef4444;
            --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        body.dark {
            --bg-color: #09090b;
            --surface-color: #121214;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #27272a;
            --hover-color: #18181b;
            --btn-bg: #fafafa;
            --btn-text: #09090b;
            --accent: #3b82f6;
            --badge-gray-bg: #27272a;
            --badge-gray-text: #d4d4d8;
            --badge-blue-bg: #1e293b;
            --badge-blue-text: #93c5fd;
            --danger: #f87171;
            --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
        }

        /* Header */
        header {
            background: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .user-info { font-size: 13px; color: var(--text-secondary); }

        .btn-ui {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .container {
            max-width: 1050px;
            margin: 24px auto;
            padding: 0 16px;
        }

        /* Nav & Search */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .breadcrumbs {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .breadcrumb-link { cursor: pointer; color: var(--text-secondary); }
        .breadcrumb-link:hover { color: var(--text-primary); }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        /* Table */
        .files-table-container {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: visible;
        }

        .table-header {
            display: grid;
            grid-template-columns: 3fr 1.2fr 1.2fr 1fr 40px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .file-row {
            display: grid;
            grid-template-columns: 3fr 1.2fr 1.2fr 1fr 40px;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            transition: background 0.15s;
        }

        .file-row:last-child { border-bottom: none; }
        .file-row:hover { background: var(--hover-color); }

        .col-name {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            font-weight: 500;
            font-size: 14px;
        }

        .file-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
            overflow: hidden;
        }

        .file-icon img { width: 100%; height: 100%; object-fit: cover; }

        .name-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            width: fit-content;
        }

        .badge-personal { background: var(--badge-gray-bg); color: var(--badge-gray-text); }
        .badge-shared { background: var(--badge-blue-bg); color: var(--badge-blue-text); }

        .col-format {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* 3-Dots Dropdown */
        .col-actions { position: relative; text-align: right; }
        .dots-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 6px;
        }
        .dots-btn:hover { background: var(--border-color); color: var(--text-primary); }

        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 32px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-modal);
            width: 170px;
            z-index: 100;
            display: none;
            padding: 6px 0;
        }

        .dropdown-menu.active { display: block; }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            font-size: 13px;
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s;
        }

        .dropdown-item:hover { background: var(--hover-color); }
        .dropdown-item.danger { color: var(--danger); }

        /* Modern Bottom/Floating Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 16px;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .modal-overlay.active { visibility: visible; opacity: 1; }

        .modal-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-modal);
        }

        .modal-card h3 { margin: 0 0 16px 0; font-size: 18px; }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .modal-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-color);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .viewers-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
            max-height: 80px;
            overflow-y: auto;
        }

        .viewer-tag {
            background: var(--badge-blue-bg);
            color: var(--badge-blue-text);
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .viewer-tag span { cursor: pointer; font-weight: bold; }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            display: none;
            z-index: 300;
        }

        @media (max-width: 640px) {
            .table-header { display: none; }
            .file-row { grid-template-columns: 1fr auto 40px; gap: 8px; }
            .col-format { display: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-title"><span>⚙️</span> Knowledge Base</div>
    <div style="display: flex; align-items: center; gap: 12px;">
        <span class="user-info" id="userDisplay">Loading...</span>
        <button class="btn-ui" id="logoutBtn" style="background: transparent; color: var(--text-primary); border: 1px solid var(--border-color);">Sign Out</button>
    </div>
</header>

<div class="container">
    <div class="nav-bar">
        <div class="breadcrumbs" id="breadcrumbs">
            <span class="breadcrumb-link" id="navHome">Knowledge base</span>
        </div>

        <div style="display: flex; gap: 8px;">
            <button class="btn-ui" id="newFolderBtn" style="background: transparent; color: var(--text-primary); border: 1px solid var(--border-color);">+ New Folder</button>
            <a href="upload.html" class="btn-ui">↑ Upload</a>
        </div>
    </div>

    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search files...">
    </div>

    <div class="files-table-container">
        <div class="table-header">
            <div>Name</div>
            <div>Access</div>
            <div>Format</div>
            <div>Password</div>
            <div></div>
        </div>
        <div id="tableBody"></div>
    </div>
</div>

<!-- Modal: Share & Access Management -->
<div class="modal-overlay" id="shareModal">
    <div class="modal-card">
        <h3>Share & Access Management</h3>
        
        <div class="form-group">
            <label>File Format</label>
            <div id="shareFileFormat" style="font-weight: 600; font-size: 14px;">Image</div>
        </div>

        <div class="form-group">
            <label>Access Password</label>
            <input type="text" id="sharePasswordInput" class="modal-input" placeholder="No Password set (optional)">
        </div>

        <div class="form-group">
            <label>Add Viewer (Email)</label>
            <div style="display: flex; gap: 6px;">
                <input type="email" id="shareEmailInput" class="modal-input" placeholder="user@perplexity.com" style="margin-bottom: 0;">
                <button class="btn-ui" id="addViewerBtn" style="flex-shrink: 0;">+ Add</button>
            </div>
            <div class="viewers-list" id="viewersList"></div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
            <button class="btn-ui" id="copyShareLinkBtn" style="background: transparent; color: var(--text-primary); border: 1px solid var(--border-color);">🔗 Copy Link</button>
            <div style="display: flex; gap: 8px;">
                <button class="btn-ui" id="closeShareModal" style="background: transparent; color: var(--text-primary); border: 1px solid var(--border-color);">Cancel</button>
                <button class="btn-ui" id="saveShareSettings">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Rename -->
<div class="modal-overlay" id="renameModal">
    <div class="modal-card">
        <h3>Rename</h3>
        <input type="text" id="renameInput" class="modal-input">
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-ui" id="closeRenameModal" style="background: transparent; color: var(--text-primary); border: 1px solid var(--border-color);">Cancel</button>
            <button class="btn-ui" id="submitRename">Save</button>
        </div>
    </div>
</div>

<!-- Modal: Shift Folder -->
<div class="modal-overlay" id="shiftModal">
    <div class="modal-card">
        <h3>Shift to Folder</h3>
        <select id="shiftFolderSelect" class="modal-input"></select>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-ui" id="closeShiftModal" style="background: transparent; color: var(--text-primary); border: 1px solid var(--border-color);">Cancel</button>
            <button class="btn-ui" id="submitShift">Shift</button>
        </div>
    </div>
</div>

<!-- Modal: New Folder -->
<div class="modal-overlay" id="folderModal">
    <div class="modal-card">
        <h3>Create New Folder</h3>
        <input type="text" id="newFolderNameInput" class="modal-input" placeholder="Folder Name...">
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-ui" id="closeFolderModal" style="background: transparent; color: var(--text-primary); border: 1px solid var(--border-color);">Cancel</button>
            <button class="btn-ui" id="submitNewFolder">Create</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getFirestore, collection, query, where, getDocs, 
        doc, updateDoc, deleteDoc, addDoc, arrayUnion, arrayRemove 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.body.classList.add("dark");
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2500);
    }

    // Helper: Map extension/Type to Format Name
    function getFriendlyFormat(typeStr, isFolder) {
        if (isFolder) return "Folder";
        const t = (typeStr || "").toLowerCase();
        if (t.includes("img") || t.includes("png") || t.includes("jpg") || t.includes("jpeg")) return "Image";
        if (t.includes("pdf")) return "PDF";
        if (t.includes("mp4") || t.includes("mkv") || t.includes("video")) return "Video";
        if (t.includes("xls") || t.includes("csv") || t.includes("sheet")) return "Sheets";
        if (t.includes("ppt") || t.includes("pptx")) return "PPT";
        if (t.includes("doc") || t.includes("docx") || t.includes("txt")) return "Document";
        return "Document";
    }

    // Auth verification
    let currentUser = null;
    try {
        currentUser = JSON.parse(localStorage.getItem('active_user'));
    } catch(e) {}

    if (!currentUser || !currentUser.Email) {
        window.location.href = "1.html";
    }
    const userEmail = currentUser.Email;
    document.getElementById('userDisplay').innerText = userEmail;

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('active_user');
        window.location.reload();
    });

    window.addEventListener('click', (e) => {
        if (!e.target.classList.contains('dots-btn')) {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('active'));
        }
    });

    let currentFolderId = null;
    let currentFolderName = "";
    let allFolders = [];

    function updateBreadcrumbs() {
        if (!currentFolderId) {
            breadcrumbs.innerHTML = `<span>Knowledge base</span>`;
        } else {
            breadcrumbs.innerHTML = `
                <span class="breadcrumb-link" id="navHome">Knowledge base</span>
                <span style="color: var(--text-secondary)">/</span>
                <span>${currentFolderName}</span>
            `;
            document.getElementById('navHome').addEventListener('click', () => {
                currentFolderId = null;
                currentFolderName = "";
                loadDrive();
            });
        }
    }

    async function loadDrive() {
        updateBreadcrumbs();
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = `<div style="padding: 20px; color: var(--text-secondary);">Loading records...</div>`;

        try {
            // Load items owned by or accessible to user
            const q = query(collection(db, "Cloud Drive"), where("Email", "==", userEmail));
            const snapshot = await getDocs(q);

            const folders = [];
            const files = [];

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (data.Folder === "True") {
                    folders.push({ id: docSnap.id, ...data });
                } else {
                    files.push({ id: docSnap.id, ...data });
                }
            });

            allFolders = folders;
            tableBody.innerHTML = '';

            let itemsToRender = [];

            if (currentFolderId === null) {
                const folderAssignedFiles = new Set();
                folders.forEach(f => {
                    if (Array.isArray(f.Files)) f.Files.forEach(id => folderAssignedFiles.add(id));
                });
                
                itemsToRender = [
                    ...folders.map(f => ({ ...f, isFolder: true })),
                    ...files.filter(file => !folderAssignedFiles.has(file.id)).map(f => ({ ...f, isFolder: false }))
                ];
            } else {
                const activeFolder = folders.find(f => f.id === currentFolderId);
                const fileIds = (activeFolder && Array.isArray(activeFolder.Files)) ? activeFolder.Files : [];
                itemsToRender = files.filter(f => fileIds.includes(f.id)).map(f => ({ ...f, isFolder: false, insideFolder: true }));
            }

            if (itemsToRender.length === 0) {
                tableBody.innerHTML = `<div style="padding: 24px; text-align: center; color: var(--text-secondary);">No items available</div>`;
                return;
            }

            itemsToRender.forEach(item => renderRow(item));
        } catch (err) {
            console.error(err);
            tableBody.innerHTML = `<div style="padding: 20px; color: var(--danger);">Failed to load data</div>`;
        }
    }

    function renderRow(item) {
        const tableBody = document.getElementById('tableBody');
        const isFolder = item.isFolder;
        const displayName = item.Name || (item.File ? item.File.split('/').pop() : "Untitled");
        const formatLabel = getFriendlyFormat(item.Type, isFolder);
        const isImg = formatLabel === "Image";

        // Calculate Access badge
        const viewers = (item.Access && Array.isArray(item.Access.Viewer)) ? item.Access.Viewer : [];
        let accessBadgeHtml = `<span class="badge-pill badge-personal">Personal</span>`;
        if (viewers.length > 0) {
            accessBadgeHtml = `<span class="badge-pill badge-shared">You & ${viewers.length} other${viewers.length > 1 ? 's' : ''}</span>`;
        }

        const iconHtml = isFolder ? '📁' : (isImg ? `<img src="${item.File}" alt="thumb">` : '📄');

        const row = document.createElement('div');
        row.className = 'file-row';
        row.innerHTML = `
            <div class="col-name">
                <div class="file-icon">${iconHtml}</div>
                <div class="name-text" title="${displayName}">${displayName}</div>
            </div>
            <div class="col-access">${accessBadgeHtml}</div>
            <div class="col-format">${formatLabel}</div>
            <div class="col-password" style="font-size: 13px; color: var(--text-secondary);">${item.Password ? '🔒 Protected' : 'None'}</div>
            <div class="col-actions">
                <button class="dots-btn">···</button>
                <div class="dropdown-menu">
                    ${!isFolder ? `<div class="dropdown-item opt-download">📥 Download</div>` : ''}
                    <div class="dropdown-item opt-rename">✏️ Rename</div>
                    ${!isFolder ? `<div class="dropdown-item opt-shift">📁 ${item.insideFolder ? 'Remove from Folder' : 'Shift to folder'}</div>` : ''}
                    <div class="dropdown-item opt-share">🔗 Share & Access</div>
                    <div class="dropdown-item danger opt-delete">🗑️ Delete</div>
                </div>
            </div>
        `;

        const dotsBtn = row.querySelector('.dots-btn');
        const menu = row.querySelector('.dropdown-menu');

        dotsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.dropdown-menu').forEach(m => m !== menu && m.classList.remove('active'));
            menu.classList.toggle('active');
        });

        if (isFolder) {
            row.querySelector('.col-name').addEventListener('click', () => {
                currentFolderId = item.id;
                currentFolderName = item.Name;
                loadDrive();
            });
        }

        // Action Handlers
        if (!isFolder) {
            row.querySelector('.opt-download').addEventListener('click', () => {
                if (item.Password) {
                    const passPrompt = prompt("Enter Password to Download:");
                    if (passPrompt !== item.Password) return showToast("Incorrect Password!");
                }
                window.open(item.File, '_blank');
            });
        }

        row.querySelector('.opt-rename').addEventListener('click', () => openRenameModal(item));

        if (!isFolder) {
            row.querySelector('.opt-shift').addEventListener('click', async () => {
                if (item.insideFolder) {
                    await updateDoc(doc(db, "Cloud Drive", currentFolderId), { Files: arrayRemove(item.id) });
                    showToast("Removed from folder");
                    loadDrive();
                } else {
                    openShiftModal(item.id);
                }
            });
        }

        row.querySelector('.opt-share').addEventListener('click', () => openShareModal(item));

        row.querySelector('.opt-delete').addEventListener('click', async () => {
            if (confirm(`Delete permanently?`)) {
                await deleteDoc(doc(db, "Cloud Drive", item.id));
                showToast("Deleted");
                loadDrive();
            }
        });

        tableBody.appendChild(row);
    }

    // Modal: Share & Access
    let activeShareItem = null;
    let localViewers = [];
    const shareModal = document.getElementById('shareModal');
    const shareFileFormat = document.getElementById('shareFileFormat');
    const sharePasswordInput = document.getElementById('sharePasswordInput');
    const shareEmailInput = document.getElementById('shareEmailInput');
    const viewersList = document.getElementById('viewersList');

    function openShareModal(item) {
        activeShareItem = item;
        shareFileFormat.innerText = getFriendlyFormat(item.Type, item.isFolder);
        sharePasswordInput.value = item.Password || "";
        localViewers = (item.Access && Array.isArray(item.Access.Viewer)) ? [...item.Access.Viewer] : [];
        renderViewers();
        shareModal.classList.add('active');
    }

    function renderViewers() {
        viewersList.innerHTML = '';
        localViewers.forEach((email, idx) => {
            const tag = document.createElement('div');
            tag.className = 'viewer-tag';
            tag.innerHTML = `${email} <span data-idx="${idx}">&times;</span>`;
            tag.querySelector('span').addEventListener('click', () => {
                localViewers.splice(idx, 1);
                renderViewers();
            });
            viewersList.appendChild(tag);
        });
    }

    document.getElementById('addViewerBtn').addEventListener('click', () => {
        const val = shareEmailInput.value.trim();
        if (val && !localViewers.includes(val)) {
            localViewers.push(val);
            shareEmailInput.value = '';
            renderViewers();
        }
    });

    document.getElementById('copyShareLinkBtn').addEventListener('click', () => {
        if (activeShareItem && activeShareItem.File) {
            navigator.clipboard.writeText(activeShareItem.File).then(() => showToast("File link copied!"));
        }
    });

    document.getElementById('closeShareModal').addEventListener('click', () => shareModal.classList.remove('active'));

    document.getElementById('saveShareSettings').addEventListener('click', async () => {
        if (!activeShareItem) return;
        const newPassword = sharePasswordInput.value.trim();
        await updateDoc(doc(db, "Cloud Drive", activeShareItem.id), {
            Password: newPassword,
            Access: { Viewer: localViewers }
        });
        shareModal.classList.remove('active');
        showToast("Access settings updated!");
        loadDrive();
    });

    // Rename Modal
    let activeRenameItem = null;
    const renameModal = document.getElementById('renameModal');
    const renameInput = document.getElementById('renameInput');

    function openRenameModal(item) {
        activeRenameItem = item;
        renameInput.value = item.Name || item.File.split('/').pop();
        renameModal.classList.add('active');
    }
    document.getElementById('closeRenameModal').addEventListener('click', () => renameModal.classList.remove('active'));
    document.getElementById('submitRename').addEventListener('click', async () => {
        const newName = renameInput.value.trim();
        if (newName && activeRenameItem) {
            await updateDoc(doc(db, "Cloud Drive", activeRenameItem.id), { Name: newName });
            renameModal.classList.remove('active');
            showToast("Renamed successfully");
            loadDrive();
        }
    });

    // Shift Modal
    let activeShiftFileId = null;
    const shiftModal = document.getElementById('shiftModal');
    const shiftFolderSelect = document.getElementById('shiftFolderSelect');

    function openShiftModal(fileId) {
        activeShiftFileId = fileId;
        shiftFolderSelect.innerHTML = "";
        allFolders.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f.id;
            opt.innerText = f.Name;
            shiftFolderSelect.appendChild(opt);
        });
        shiftModal.classList.add('active');
    }
    document.getElementById('closeShiftModal').addEventListener('click', () => shiftModal.classList.remove('active'));
    document.getElementById('submitShift').addEventListener('click', async () => {
        const targetId = shiftFolderSelect.value;
        if (targetId && activeShiftFileId) {
            await updateDoc(doc(db, "Cloud Drive", targetId), { Files: arrayUnion(activeShiftFileId) });
            shiftModal.classList.remove('active');
            showToast("Shifted to folder");
            loadDrive();
        }
    });

    // Create Folder Modal
    const folderModal = document.getElementById('folderModal');
    const newFolderNameInput = document.getElementById('newFolderNameInput');

    document.getElementById('newFolderBtn').addEventListener('click', () => {
        newFolderNameInput.value = "";
        folderModal.classList.add('active');
    });
    document.getElementById('closeFolderModal').addEventListener('click', () => folderModal.classList.remove('active'));
    document.getElementById('submitNewFolder').addEventListener('click', async () => {
        const name = newFolderNameInput.value.trim();
        if (name) {
            await addDoc(collection(db, "Cloud Drive"), {
                Email: userEmail,
                Folder: "True",
                Name: name,
                Files: [],
                Access: { Viewer: [] },
                Password: ""
            });
            folderModal.classList.remove('active');
            showToast(`Folder created: ${name}`);
            loadDrive();
        }
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.file-row').forEach(row => {
            const text = row.querySelector('.name-text').innerText.toLowerCase();
            row.style.display = text.includes(val) ? 'grid' : 'none';
        });
    });

    loadDrive();
</script>
</body>
</html>
