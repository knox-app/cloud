
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Drive</title>
    <!-- jsPDF for Image-to-PDF conversion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --surface-card: #f9fafb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --hover-bg: #f3f4f6;
            --btn-dark-bg: #0d0d0d;
            --btn-dark-text: #ffffff;
            --accent: #111827;
            --accent-check: #000000;
            --danger: #ef4444;
            --tag-bg: #e5e7eb;
            --tag-text: #374151;
            --sidebar-width: 64px;
            --selection-bg: rgba(0, 0, 0, 0.04);
            --selection-border: #111827;
        }

        body.dark {
            --bg-color: #0d0d0d;
            --surface-color: #171717;
            --surface-card: #1f1f1f;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #262626;
            --hover-bg: #262626;
            --btn-dark-bg: #ffffff;
            --btn-dark-text: #0d0d0d;
            --accent: #ffffff;
            --accent-check: #ffffff;
            --danger: #f87171;
            --tag-bg: #2d2d2d;
            --tag-text: #d1d5db;
            --selection-bg: rgba(255, 255, 255, 0.06);
            --selection-border: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Sidebar */
        aside.sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 16px;
            flex-shrink: 0;
            background: var(--surface-color);
        }

        .side-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .side-icon:hover, .side-icon.active {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }
        .side-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

        /* Main Viewport */
        main.content-area {
            flex-grow: 1;
            padding: 28px 36px;
            max-width: 1300px;
            position: relative;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-pill {
            background-color: var(--btn-dark-bg);
            color: var(--btn-dark-text);
            border: none;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: opacity 0.2s;
            user-select: none;
        }
        .btn-pill:hover { opacity: 0.9; }

        .search-container {
            position: relative;
            max-width: 380px;
            margin-bottom: 20px;
        }
        .search-container svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            fill: none;
        }
        .search-input {
            width: 100%;
            padding: 9px 14px 9px 38px;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
        }
        .search-input:focus { border-color: var(--text-secondary); }

        /* Floating Pill Selection Bar (matching exact design from image) */
        .selection-toolbar {
            position: sticky;
            top: 14px;
            background: #111111;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 9999px;
            display: none;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 200;
        }
        .selection-toolbar.active { display: flex; }
        .selection-toolbar span { font-weight: 600; font-size: 14px; }
        .selection-actions { display: flex; align-items: center; gap: 16px; }
        .selection-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #d1d5db;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.15s;
        }
        .selection-btn:hover { color: #ffffff; }
        .selection-btn.danger { color: #f87171; }
        .selection-btn.danger:hover { color: #ef4444; }
        .selection-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; }
        .selection-done-btn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding-left: 8px;
        }

        /* Tags / Labels */
        .label-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 7px;
            background: var(--tag-bg);
            color: var(--tag-text);
            border-radius: 6px;
            font-size: 11px;
            margin-right: 4px;
            margin-top: 2px;
            font-weight: 500;
        }

        /* Custom Circular Checkbox */
        .custom-check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
        }
        .custom-check.checked {
            background-color: var(--accent-check);
            border-color: var(--accent-check);
        }
        .custom-check.checked::after {
            content: '';
            width: 5px;
            height: 9px;
            border: solid var(--btn-dark-text);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-top: -2px;
        }

        /* Table List View Layout */
        .data-table { width: 100%; border-collapse: collapse; }
        .table-head {
            display: grid;
            grid-template-columns: 3.2fr 1.8fr 1.5fr 1.8fr 40px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .table-row {
            display: grid;
            grid-template-columns: 3.2fr 1.8fr 1.5fr 1.8fr 40px;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            transition: background-color 0.15s;
            user-select: none;
            cursor: pointer;
        }
        .table-row:hover { background-color: var(--hover-bg); }
        .table-row.selected { background-color: var(--selection-bg); }
        .table-row.keyboard-focused { outline: 2px solid var(--accent); outline-offset: -2px; }

        .selection-active .table-head { grid-template-columns: 36px 3.2fr 1.8fr 1.5fr 1.8fr 40px; }
        .selection-active .table-row { grid-template-columns: 36px 3.2fr 1.8fr 1.5fr 1.8fr 40px; }

        .cell-checkbox { display: none; align-items: center; justify-content: center; }
        .selection-active .cell-checkbox { display: flex; }

        .file-title-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-icon-box {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--hover-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--text-secondary);
            position: relative;
        }
        .file-icon-box svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; }

        .file-info-col { display: flex; flex-direction: column; overflow: hidden; }
        .file-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-labels { display: flex; flex-wrap: wrap; margin-top: 3px; }

        /* Google Drive Style Grid View */
        .grid-container {
            display: none;
            flex-direction: column;
            gap: 24px;
        }
        .grid-container.active { display: flex; }
        .data-table.hidden { display: none; }

        .grid-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .folder-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
        }
        .folder-card:hover { border-color: var(--text-secondary); }
        .folder-card.selected { border: 2px solid var(--selection-border); background: var(--selection-bg); }
        .folder-card-left { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .folder-card-icon { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .folder-card-icon svg { width: 22px; height: 22px; }

        .file-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
            position: relative;
        }
        .file-card:hover { border-color: var(--text-secondary); }
        .file-card.selected { border: 2px solid var(--selection-border); background: var(--selection-bg); }
        .file-card-preview {
            height: 120px;
            background: var(--hover-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .file-card-preview img { width: 100%; height: 100%; object-fit: cover; }
        .file-card-preview svg { width: 42px; height: 42px; color: var(--text-secondary); stroke-width: 1.5; }
        .file-card-body {
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .grid-check-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            display: none;
        }
        .selection-active .grid-check-overlay { display: block; }

        /* 3-Dots Dropdown */
        .actions-cell { position: relative; text-align: right; }
        .btn-dots {
            background: none;
            border: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-dots:hover { color: var(--text-primary); background: var(--border-color); }
        .btn-dots svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        .action-dropdown {
            position: absolute;
            right: 0;
            top: 32px;
            background: var(--surface-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.18);
            border-radius: 12px;
            width: 190px;
            padding: 6px 0;
            z-index: 150;
            display: none;
            border: 1px solid var(--border-color);
        }
        .action-dropdown.active { display: block; }
        .dropdown-item {
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .dropdown-item:hover { background: var(--hover-bg); }
        .dropdown-item.danger { color: var(--danger); }
        .dropdown-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

        /* Empty State */
        .empty-state-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }
        .empty-state-img {
            width: 240px;
            max-width: 80%;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        .empty-state-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Color & Icon Customizer Grid (from image 3) */
        .color-palette-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s, border-color 0.15s;
        }
        .color-dot:hover { transform: scale(1.1); }
        .color-dot.active { border-color: var(--text-primary); box-shadow: 0 0 0 2px var(--surface-color); }

        .icon-palette-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .icon-choice {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid transparent;
            color: var(--text-primary);
            transition: background-color 0.15s;
        }
        .icon-choice:hover { background-color: var(--hover-bg); }
        .icon-choice.active { background-color: var(--hover-bg); border-color: var(--text-secondary); }
        .icon-choice svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none; }

        /* Modals */
        .modal-shade {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 16px;
        }
        .modal-shade.active { visibility: visible; opacity: 1; }
        .modal-box {
            background: var(--surface-color);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 26px;
            position: relative;
            border: 1px solid var(--border-color);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .modal-title { font-size: 17px; font-weight: 600; }
        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .modal-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .clean-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--hover-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
        }
        .clean-input:focus { border-color: var(--text-secondary); }

        .user-access-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        .toast-popup {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: #ffffff;
            padding: 9px 20px;
            border-radius: 9999px;
            font-size: 13px;
            display: none;
            z-index: 2000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .details-grid { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
        .details-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border-color); }
        .details-label { color: var(--text-secondary); }
        .details-val { font-weight: 500; text-align: right; max-width: 260px; overflow-wrap: break-word; }

        @media (max-width: 768px) {
            aside.sidebar { display: none; }
            main.content-area { padding: 18px 14px; width: 100%; }
            .table-head { display: none; }
            .table-row { grid-template-columns: 1fr auto 30px; gap: 8px; padding: 10px 0; }
            .selection-active .table-row { grid-template-columns: 28px 1fr auto 30px; }
            .cell-uploader, .cell-format { display: none; }
            .cell-date { font-size: 11px; color: var(--text-secondary); text-align: right; }
            .grid-cards { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
    <div class="side-icon active" title="Cloud Drive">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <div class="side-icon" id="themeToggleBtn" title="Toggle Theme (Shift+T then D/L)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </div>
    <div class="side-icon" id="logoutSideBtn" title="Sign Out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </div>
</aside>

<!-- Drag Overlay -->
<div class="drag-overlay" id="dragOverlay">
    <div class="drag-overlay-card">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span>Drop files here to upload</span>
    </div>
</div>

<!-- Main Workspace -->
<main class="content-area" id="mainArea">
    <div class="top-row">
        <div class="page-title" id="breadcrumbArea">
            <span>Cloud Drive</span>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button class="btn-pill" id="viewToggleBtn" style="background: var(--hover-bg); color: var(--text-primary); border: 1px solid var(--border-color);" title="Switch View">
                <svg id="viewIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </button>
            <button class="btn-pill" id="btnSelectModeToggle" style="background: var(--hover-bg); color: var(--text-primary); border: 1px solid var(--border-color);" title="Select Multiple (Shift+S)">
                Select
            </button>
            <button class="btn-pill" id="uploadTriggerBtn" title="Upload (Shift+U)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Upload
            </button>
            <button class="btn-pill" id="newFolderTriggerBtn" style="background: var(--hover-bg); color: var(--text-primary); border: 1px solid var(--border-color);" title="New Folder (Shift+C)">
                + Folder
            </button>
        </div>
    </div>

    <!-- Floating Pill Selection Bar (image 1) -->
    <div class="selection-toolbar" id="selectionToolbar">
        <span id="selectedCountText">0 Selected</span>
        <div class="selection-actions">
            <button class="selection-btn" id="btnMultiDownload" title="Download Files">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
            <button class="selection-btn" id="btnMultiMove" title="Move (Shift+M)">
                <svg viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>
            </button>
            <button class="selection-btn danger" id="btnMultiDelete" title="Delete (Shift+D)">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
            <button class="selection-done-btn" id="btnCancelSelect">Done</button>
        </div>
    </div>

    <!-- Hidden Native File Input -->
    <input type="file" id="nativeFileInput" multiple style="display: none;">

    <div class="search-container">

        users: `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`,
        move: `<svg viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>`,
        info: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`,
        tag: `<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>`,
        lock: `<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`,
        palette: ICON_PALETTE.palette
    };

    function getFormatInfo(typeStr, isFolder, customize) {
        if (isFolder) {
            const iconSvg = (customize && customize.Icon && ICON_PALETTE[customize.Icon]) ? ICON_PALETTE[customize.Icon] : SVG_ICONS.folder;
            return { label: "Folder", icon: iconSvg };
        }
        const t = (typeStr || "").toLowerCase();
        if (t.includes("img") || t.includes("png") || t.includes("jpg") || t.includes("jpeg") || t.includes("image")) return { label: "Image", icon: SVG_ICONS.image };
        if (t.includes("pdf")) return { label: "PDF", icon: SVG_ICONS.pdf };
        if (t.includes("mp4") || t.includes("mkv") || t.includes("video")) return { label: "Video", icon: SVG_ICONS.video };
        return { label: "Document", icon: SVG_ICONS.doc };
    }

    // State Variables
    let folderHierarchy = [];
    let allWorkspaceDocs = [];
    let allFolderDocs = [];
    let currentRenderedItems = [];
    let selectedItemIds = new Set();
    let isSelectionMode = false;
    let isGridView = (localStorage.getItem('drive_view') === 'grid');
    let keyboardFocusedIndex = -1;

    function getCurrentFolderId() {
        return folderHierarchy.length > 0 ? folderHierarchy[folderHierarchy.length - 1].id : null;
    }

    function getCurrentFolderName() {
        return folderHierarchy.length > 0 ? folderHierarchy[folderHierarchy.length - 1].name : "";
    }

    function getCurrentParentFolder() {
        const cid = getCurrentFolderId();
        return cid ? allFolderDocs.find(f => f.id === cid) : null;
    }

    function getUserRole(item) {
        if (item.Email === userEmail) return 'Owner';
        const acc = item.Access || {};
        if (acc.Editor?.includes(userEmail)) return 'Editor';
        if (acc.Contributor?.includes(userEmail)) return 'Contributor';
        if (acc.Commenter?.includes(userEmail) || acc.Commentator?.includes(userEmail)) return 'Commenter';
        if (acc.Viewer?.includes(userEmail)) return 'Viewer';

        for (const f of folderHierarchy) {
            const pDoc = allFolderDocs.find(x => x.id === f.id);
            if (pDoc) {
                if (pDoc.Email === userEmail) return 'Owner';
                const pAcc = pDoc.Access || {};
                if (pAcc.Editor?.includes(userEmail)) return 'Editor';
                if (pAcc.Contributor?.includes(userEmail)) return 'Contributor';
                if (pAcc.Commenter?.includes(userEmail) || pAcc.Commentator?.includes(userEmail)) return 'Commenter';
                if (pAcc.Viewer?.includes(userEmail)) return 'Viewer';
            }
        }
        return 'Viewer';
    }

    // View Switcher Setup
    function updateViewLayout() {
        const dt = document.getElementById('dataTable');
        const gc = document.getElementById('gridContainer');
        const icon = document.getElementById('viewIcon');

        if (isGridView) {
            dt.classList.add('hidden');
            gc.classList.add('active');
            icon.innerHTML = `<line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line>`;
            localStorage.setItem('drive_view', 'grid');
        } else {
            dt.classList.remove('hidden');
            gc.classList.remove('active');
            icon.innerHTML = `<rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>`;
            localStorage.setItem('drive_view', 'table');
        }
    }

    document.getElementById('viewToggleBtn').addEventListener('click', () => {
        isGridView = !isGridView;
        updateViewLayout();
    });

    function renderBreadcrumb() {
        const area = document.getElementById('breadcrumbArea');
        if (folderHierarchy.length === 0) {
            area.innerHTML = `<span>Cloud Drive</span>`;
        } else {
            let html = `<span style="color: var(--text-secondary); cursor: pointer;" id="bc-root">Cloud Drive</span>`;
            folderHierarchy.forEach((item, index) => {
                html += ` <span style="color: var(--text-secondary); font-weight: 400;">/</span> `;
                if (index === folderHierarchy.length - 1) {
                    html += `<span>${item.name}</span>`;
                } else {
                    html += `<span style="color: var(--text-secondary); cursor: pointer;" class="bc-crumb" data-idx="${index}">${item.name}</span>`;
                }
            });
            area.innerHTML = html;

            document.getElementById('bc-root')?.addEventListener('click', () => {
                folderHierarchy = [];
                loadDrive();
            });
            document.querySelectorAll('.bc-crumb').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.getAttribute('data-idx'));
                    folderHierarchy = folderHierarchy.slice(0, idx + 1);
                    loadDrive();
                });
            });
        }
    }

    // Main Drive Loader
    async function loadDrive() {
        renderBreadcrumb();
        exitSelectionMode();
        updateViewLayout();
        keyboardFocusedIndex = -1;

        const container = document.getElementById('tableContent');
        const gridFolders = document.getElementById('gridFolders');
        const gridFiles = document.getElementById('gridFiles');

        container.innerHTML = `<div style="padding: 24px 0; color: var(--text-secondary); font-size: 14px;">Loading items...</div>`;
        gridFolders.innerHTML = "";
        gridFiles.innerHTML = "";

        try {
            const q = query(
                collection(db, "Cloud Drive"),
                or(
                    where("Email", "==", userEmail),
                    where("Access.Viewer", "array-contains", userEmail),
                    where("Access.Commenter", "array-contains", userEmail),
                    where("Access.Contributor", "array-contains", userEmail),
                    where("Access.Commentator", "array-contains", userEmail),
                    where("Access.Editor", "array-contains", userEmail)
                )
            );

            const snap = await getDocs(q);
            const items = [];
            snap.forEach(docSnap => {
                items.push({ id: docSnap.id, ...docSnap.data() });
            });

            allWorkspaceDocs = items;
            allFolderDocs = items.filter(d => d.Folder === "True");
            container.innerHTML = "";

            const currId = getCurrentFolderId();
            let renderItems = [];

            if (!currId) {
                const assignedChildIds = new Set();
                allFolderDocs.forEach(f => {
                    if (Array.isArray(f.File)) f.File.forEach(id => assignedChildIds.add(id));
                });
                renderItems = items.filter(i => !assignedChildIds.has(i.id));
            } else {
                const activeFolder = allFolderDocs.find(f => f.id === currId);
                const assignedIds = (activeFolder && Array.isArray(activeFolder.File)) ? activeFolder.File : [];
                renderItems = items.filter(i => assignedIds.includes(i.id));
            }

            currentRenderedItems = renderItems;

            if (renderItems.length === 0) {
                const folderName = getCurrentFolderName();
                const emptyMsg = folderName ? `No Files In Your ${folderName}` : "No Files In Your Drive";
                const emptyHtml = `
                    <div class="empty-state-box">
                        <img class="empty-state-img" src="https://indus.sarvam.ai/studio/assets/empty-table.webp" alt="No Files">
                        <div class="empty-state-text">${emptyMsg}</div>
                    </div>
                `;
                container.innerHTML = emptyHtml;
                gridFolders.innerHTML = emptyHtml;
                gridFiles.innerHTML = "";
                return;
            }

            renderItems.sort((a, b) => (b.Folder === "True" ? 1 : 0) - (a.Folder === "True" ? 1 : 0));
            renderItems.forEach((item, idx) => {
                renderTableRow(item, idx);
                renderGridCard(item);
            });
        } catch(e) {
            console.error(e);
            container.innerHTML = `<div style="padding: 20px 0; color: var(--danger);">Failed to load Cloud Drive.</div>`;
        }
    }

    // Render Table Row
    function renderTableRow(item, index) {
        const container = document.getElementById('tableContent');
        const isFolder = item.Folder === "True";
        const name = item.Name || (item.File ? item.File.split('/').pop() : 'Untitled');
        const format = getFormatInfo(item.Type, isFolder, item.Customize);
        const updated = item.Updated || "Recently";
        const ownerEmail = item.Email || userEmail;
        const role = getUserRole(item);
        const isViewer = (role === 'Viewer');
        const folderColor = (isFolder && item.Customize && item.Customize.Colour) ? item.Customize.Colour : "inherit";

        let labels = Array.isArray(item.Label) ? [...item.Label] : [];
        if (!isFolder && labels.length === 0 && folderHierarchy.length > 0) {
            const p = getCurrentParentFolder();
            if (p && Array.isArray(p.Label)) labels = [...p.Label];
        }

        const labelsHtml = labels.map(l => `<span class="label-badge">${l}</span>`).join('');

        const row = document.createElement('div');
        row.className = 'table-row';
        row.setAttribute('data-id', item.id);
        row.setAttribute('data-index', index);

        row.innerHTML = `
            <div class="cell-checkbox"><div class="custom-check" data-id="${item.id}"></div></div>
            <div class="file-title-cell">
                <div class="file-icon-box" style="color: ${folderColor};">${format.icon}</div>
                <div class="file-info-col">
                    <span class="file-name" title="${name}">${name}</span>
                    <div class="file-labels">${labelsHtml}</div>
                </div>
            </div>
            <div class="cell-uploader" style="font-size: 13px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${ownerEmail}</div>
            <div class="cell-format" style="font-size: 13px; color: var(--text-secondary);">${format.label}</div>
            <div class="cell-date" style="font-size: 13px; color: var(--text-secondary);">${updated}</div>
            <div class="actions-cell">
                <button class="btn-dots">${SVG_ICONS.dots}</button>
                <div class="action-dropdown">
                    ${!isFolder && !isViewer ? `<div class="dropdown-item opt-download">${SVG_ICONS.download} Download</div>` : ''}
                    ${!isViewer ? `<div class="dropdown-item opt-rename">${SVG_ICONS.edit} Rename</div>` : ''}
                    ${!isFolder && !isViewer ? `<div class="dropdown-item opt-share">${SVG_ICONS.share} Share</div>` : ''}
                    ${!isViewer ? `<div class="dropdown-item opt-access">${SVG_ICONS.users} Manage Access</div>` : ''}
                    ${isFolder && !isViewer ? `<div class="dropdown-item opt-security">${SVG_ICONS.lock} Security</div>` : ''}
                    ${isFolder && !isViewer ? `<div class="dropdown-item opt-customize">${SVG_ICONS.palette} Customize</div>` : ''}
                    ${!isViewer ? `<div class="dropdown-item opt-label">${SVG_ICONS.tag} Label</div>` : ''}
                    ${!isViewer ? `<div class="dropdown-item opt-move">${SVG_ICONS.move} ${isFolder ? 'Organise' : 'Move'}</div>` : ''}
                    <div class="dropdown-item opt-details">${SVG_ICONS.info} Details</div>
                    <div class="dropdown-item danger opt-delete">${SVG_ICONS.trash} ${isViewer ? 'Remove' : 'Delete'}</div>
                </div>
            </div>
        `;

        setupRowEvents(row, item, isFolder, name, isViewer);
        container.appendChild(row);
    }

    // Render Grid Card (Google Drive Style)
    function renderGridCard(item) {
        const isFolder = item.Folder === "True";
        const name = item.Name || (item.File ? item.File.split('/').pop() : 'Untitled');
        const format = getFormatInfo(item.Type, isFolder, item.Customize);
        const role = getUserRole(item);
        const isViewer = (role === 'Viewer');
        const folderColor = (isFolder && item.Customize && item.Customize.Colour) ? item.Customize.Colour : "inherit";

        if (isFolder) {
            const card = document.createElement('div');

                <div class="grid-check-overlay"><div class="custom-check" data-id="${item.id}"></div></div>
                <div class="folder-card-left">
                    <div class="folder-card-icon" style="color: ${folderColor};">${format.icon}</div>
                    <span class="file-name" title="${name}">${name}</span>
                </div>
                <div class="actions-cell">
                    <button class="btn-dots">${SVG_ICONS.dots}</button>
                    <div class="action-dropdown">
                        ${!isViewer ? `<div class="dropdown-item opt-rename">${SVG_ICONS.edit} Rename</div>` : ''}
                        ${!isViewer ? `<div class="dropdown-item opt-access">${SVG_ICONS.users} Manage Access</div>` : ''}
                        ${!isViewer ? `<div class="dropdown-item opt-security">${SVG_ICONS.lock} Security</div>` : ''}
                        ${!isViewer ? `<div class="dropdown-item opt-customize">${SVG_ICONS.palette} Customize</div>` : ''}
                        ${!isViewer ? `<div class="dropdown-item opt-label">${SVG_ICONS.tag} Label</div>` : ''}
                        ${!isViewer ? `<div class="dropdown-item opt-move">${SVG_ICONS.move} Organise</div>` : ''}
                        <div class="dropdown-item opt-details">${SVG_ICONS.info} Details</div>
                        <div class="dropdown-item danger opt-delete">${SVG_ICONS.trash} ${isViewer ? 'Remove' : 'Delete'}</div>

                <div class="grid-check-overlay"><div class="custom-check" data-id="${item.id}"></div></div>

                        <button class="btn-dots">${SVG_ICONS.dots}</button>

                            ${!isViewer ? `<div class="dropdown-item opt-rename">${SVG_ICONS.edit} Rename</div>` : ''}
                            ${!isViewer ? `<div class="dropdown-item opt-share">${SVG_ICONS.share} Share</div>` : ''}

                            ${!isViewer ? `<div class="dropdown-item opt-label">${SVG_ICONS.tag} Label</div>` : ''}

    // Unified Event Binder
    function setupRowEvents(el, item, isFolder, name, isViewer) {
        const dotsBtn = el.querySelector('.btn-dots');
        const dropdown = el.querySelector('.action-dropdown');

        dotsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.action-dropdown').forEach(d => d !== dropdown && d.classList.remove('active'));
            dropdown.classList.toggle('active');
        });

        // Click anywhere in selection mode toggles selection
        el.addEventListener('click', (e) => {
            if (e.target.closest('.actions-cell') || e.target.closest('.action-dropdown')) return;
            if (isSelectionMode) {
                toggleSelectItem(item.id, !selectedItemIds.has(item.id));
            } else {
                if (item.Password) {
                    promptPasswordAuth(item.Password, () => openItem(item, isFolder, name));
                } else {
                    openItem(item, isFolder, name);
                }
            }
        });

        // Long press for touch devices
        let touchTimer = null;
        let touchMoved = false;
        el.addEventListener('touchstart', (e) => {
            touchMoved = false;
            touchTimer = setTimeout(() => {
                if (!touchMoved) {
                    if (navigator.vibrate) navigator.vibrate(40);
                    if (!isSelectionMode) enterSelectionMode();
                    toggleSelectItem(item.id, !selectedItemIds.has(item.id));
                }
            }, 500);
        }, { passive: true });
        el.addEventListener('touchmove', () => { touchMoved = true; clearTimeout(touchTimer); });
        el.addEventListener('touchend', () => clearTimeout(touchTimer));

        // Options
        if (!isFolder && !isViewer) {
            el.querySelector('.opt-download')?.addEventListener('click', () => directDownloadFile(item.File, item.Name));
            el.querySelector('.opt-share')?.addEventListener('click', () => openShareModal(item));
        }
        if (!isViewer) {
            el.querySelector('.opt-rename')?.addEventListener('click', () => openRenameModal(item));
            el.querySelector('.opt-access')?.addEventListener('click', () => openAccessModal(item));
            el.querySelector('.opt-label')?.addEventListener('click', () => openLabelModal(item));
            el.querySelector('.opt-move')?.addEventListener('click', () => openMoveModal(item));
            if (isFolder) {
                el.querySelector('.opt-security')?.addEventListener('click', () => openSecurityModal(item));
                el.querySelector('.opt-customize')?.addEventListener('click', () => openCustomizeModal(item));
            }
        }
        el.querySelector('.opt-details')?.addEventListener('click', () => openDetailsModal(item));
        el.querySelector('.opt-delete')?.addEventListener('click', () => handleDelete(item, isViewer));
    }

    function openItem(item, isFolder, name) {
        if (isFolder) {
            folderHierarchy.push({ id: item.id, name: name });
            loadDrive();
        } else {
            updateDoc(doc(db, "Cloud Drive", item.id), {
                LastOpened: new Date().toISOString(),
                LastOpenedBy: userEmail
            }).catch(() => {});
            window.open(item.File, '_blank');
        }
    }

    // Direct Browser File Download
    async function directDownloadFile(url, fileName) {
        showToast("Downloading...");
        try {
            const res = await fetch(url);
            const blob = await res.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = fileName || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
            showToast("Download completed");
        } catch(e) {
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }

    window.addEventListener('click', () => {
        document.querySelectorAll('.action-dropdown').forEach(d => d.classList.remove('active'));
    });

    // Password Challenge Modal
    const passModal = document.getElementById('passwordAuthModal');
    let passSuccessCallback = null;
    let expectedPass = "";

    function promptPasswordAuth(password, onSuccess) {
        expectedPass = password;
        passSuccessCallback = onSuccess;
        document.getElementById('authPasswordInput').value = "";
        passModal.classList.add('active');
    }
    document.getElementById('closePassModal').addEventListener('click', () => passModal.classList.remove('active'));
    document.getElementById('btnSubmitAuth').addEventListener('click', () => {
        const val = document.getElementById('authPasswordInput').value;
        if (val === expectedPass) {
            passModal.classList.remove('active');
            if (passSuccessCallback) passSuccessCallback();
        } else {
            showToast("Incorrect password!");
        }
    });

    // Folder Security Modal
    const securityModal = document.getElementById('securityModal');
    let targetSecurityFolder = null;
    function openSecurityModal(item) {
        targetSecurityFolder = item;
        document.getElementById('folderSecurityPassInput').value = item.Password || "";
        securityModal.classList.add('active');
    }
    document.getElementById('closeSecurityModal').addEventListener('click', () => securityModal.classList.remove('active'));
    document.getElementById('btnSaveSecurity').addEventListener('click', async () => {
        if (!targetSecurityFolder) return;
        const pass = document.getElementById('folderSecurityPassInput').value.trim();
        await updateDoc(doc(db, "Cloud Drive", targetSecurityFolder.id), {
            Password: pass,
            Updated: formatFirestoreDate()
        });
        showToast(pass ? "Password enabled" : "Password removed");
        securityModal.classList.remove('active');
        loadDrive();
    });

    // Folder Customize Modal (Colors & Icons)
    const customizeModal = document.getElementById('customizeModal');
    let targetCustomizeFolder = null;
    let selectedColor = "";
    let selectedIcon = "";

    function openCustomizeModal(item) {
        targetCustomizeFolder = item;
        selectedColor = (item.Customize && item.Customize.Colour) || "#ffffff";
        selectedIcon = (item.Customize && item.Customize.Icon) || "folder";

        // Build Color Palette
        const cp = document.getElementById('colorPalette');
        cp.innerHTML = "";
        COLOR_CHOICES.forEach(c => {
            const dot = document.createElement('div');
            dot.className = `color-dot ${selectedColor === c.hex || selectedColor.toLowerCase() === c.name.toLowerCase() ? 'active' : ''}`;
            dot.style.backgroundColor = c.hex;
            dot.title = c.name;
            dot.addEventListener('click', () => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                selectedColor = c.hex;
            });
            cp.appendChild(dot);
        });

        // Build Icon Palette
        const ip = document.getElementById('iconPalette');
        ip.innerHTML = "";
        Object.keys(ICON_PALETTE).forEach(k => {
            const btn = document.createElement('div');
            btn.className = `icon-choice ${selectedIcon === k ? 'active' : ''}`;
            btn.innerHTML = ICON_PALETTE[k];
            btn.addEventListener('click', () => {
                document.querySelectorAll('.icon-choice').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedIcon = k;
            });
            ip.appendChild(btn);
        });

        customizeModal.classList.add('active');
    }
    document.getElementById('closeCustomizeModal').addEventListener('click', () => customizeModal.classList.remove('active'));
    document.getElementById('btnSaveCustomize').addEventListener('click', async () => {
        if (!targetCustomizeFolder) return;
        await updateDoc(doc(db, "Cloud Drive", targetCustomizeFolder.id), {
            Customize: { Colour: selectedColor, Icon: selectedIcon },
            Updated: formatFirestoreDate()
        });
        showToast("Folder customized");
        customizeModal.classList.remove('active');
        loadDrive();
    });

    // Multi-Selection System
    function enterSelectionMode() {
        isSelectionMode = true;
        document.getElementById('dataTable').classList.add('selection-active');
        document.getElementById('gridContainer').classList.add('selection-active');
        document.getElementById('selectionToolbar').classList.add('active');
        document.getElementById('btnSelectModeToggle').innerText = "Cancel";
        updateSelectionToolbar();
    }

    function exitSelectionMode() {
        isSelectionMode = false;
        selectedItemIds.clear();
        document.getElementById('dataTable').classList.remove('selection-active');
        document.getElementById('gridContainer').classList.remove('selection-active');
        document.getElementById('selectionToolbar').classList.remove('active');
        document.getElementById('btnSelectModeToggle').innerText = "Select";
        document.querySelectorAll('.custom-check').forEach(c => c.classList.remove('checked'));
        document.querySelectorAll('.table-row, .folder-card, .file-card').forEach(r => r.classList.remove('selected'));
    }

    document.getElementById('btnSelectModeToggle').addEventListener('click', () => {
        if (isSelectionMode) exitSelectionMode();
        else enterSelectionMode();
    });

    function toggleSelectItem(id, isSelected) {
        if (!isSelectionMode) enterSelectionMode();

        if (isSelected) selectedItemIds.add(id);
        else selectedItemIds.delete(id);
        
        document.querySelectorAll(`[data-id="${id}"]`).forEach(el => {
            if (el.classList.contains('custom-check')) {
                el.classList.toggle('checked', isSelected);
            } else {
                el.classList.toggle('selected', isSelected);
                el.querySelector('.custom-check')?.classList.toggle('checked', isSelected);
            }
        });
        updateSelectionToolbar();
    }

    function updateSelectionToolbar() {
        const countText = document.getElementById('selectedCountText');
        countText.innerText = `${selectedItemIds.size} Selected`;
        const selAll = document.getElementById('selectAllCheckbox');
        if (selAll && currentRenderedItems.length > 0) {
            selAll.classList.toggle('checked', selectedItemIds.size === currentRenderedItems.length);
        }
    }

    document.getElementById('selectAllCheckbox').addEventListener('click', () => {
        const allSelected = (selectedItemIds.size === currentRenderedItems.length);
        currentRenderedItems.forEach(item => toggleSelectItem(item.id, !allSelected));
    });

    document.getElementById('btnCancelSelect').addEventListener('click', () => exitSelectionMode());

    // Multi Delete
    document.getElementById('btnMultiDelete').addEventListener('click', async () => {
        if (selectedItemIds.size === 0) return;
        if (confirm(`Delete ${selectedItemIds.size} selected item(s)?`)) {
            for (const id of selectedItemIds) {
                const item = allWorkspaceDocs.find(d => d.id === id);
                if (item && getUserRole(item) !== 'Viewer') {
                    for (const f of allFolderDocs) {
                        if (Array.isArray(f.File) && f.File.includes(id)) {
                            await updateDoc(doc(db, "Cloud Drive", f.id), { File: arrayRemove(id) });
                        }
                    }
                    await deleteDoc(doc(db, "Cloud Drive", id));
                }
            }
            showToast("Selected items deleted");
            loadDrive();
        }
    });

    // Multi Download
    document.getElementById('btnMultiDownload').addEventListener('click', async () => {
        const filesToDownload = currentRenderedItems.filter(i => selectedItemIds.has(i.id) && i.Folder !== "True");
        if (filesToDownload.length === 0) {
            showToast("No files selected to download");
            return;
        }
        showToast(`Downloading ${filesToDownload.length} files...`);
        for (const f of filesToDownload) {
            await directDownloadFile(f.File, f.Name);
        }
    });

    // Multi Move
    document.getElementById('btnMultiMove').addEventListener('click', () => {
        if (selectedItemIds.size === 0) return;
        openMoveModal(null, true);
    });

    // Rename Modal
    let targetRenameItem = null;
    const renameModal = document.getElementById('renameModal');
    function openRenameModal(item) {
        targetRenameItem = item;
        document.getElementById('renameInput').value = item.Name || '';
        renameModal.classList.add('active');
    }
    document.getElementById('closeRenameModal').addEventListener('click', () => renameModal.classList.remove('active'));
    document.getElementById('btnSubmitRename').addEventListener('click', async () => {
        const newName = document.getElementById('renameInput').value.trim();
        if (newName && targetRenameItem) {
            await updateDoc(doc(db, "Cloud Drive", targetRenameItem.id), {
                Name: newName,
                Updated: formatFirestoreDate()
            });
            showToast("Renamed successfully");
            renameModal.classList.remove('active');
            loadDrive();
        }
    });

    // Details Modal
    const detailsModal = document.getElementById('detailsModal');
    function openDetailsModal(item) {
        const isFolder = item.Folder === "True";
        const format = getFormatInfo(item.Type, isFolder, item.Customize);
        const locationPath = folderHierarchy.length > 0 ? folderHierarchy.map(h => h.name).join(' / ') : 'Root Directory';

        const content = document.getElementById('detailsContent');
        content.innerHTML = `
            <div class="details-item"><span class="details-label">Name</span><span class="details-val">${item.Name || 'Untitled'}</span></div>
            <div class="details-item"><span class="details-label">Type</span><span class="details-val">${format.label}</span></div>
            <div class="details-item"><span class="details-label">Date (Updated)</span><span class="details-val">${item.Updated || 'N/A'}</span></div>
            <div class="details-item"><span class="details-label">Location</span><span class="details-val">${locationPath}</span></div>
            <div class="details-item"><span class="details-label">Owner</span><span class="details-val">${item.Email || userEmail}</span></div>
            <div class="details-item"><span class="details-label">Labels</span><span class="details-val">${(item.Label || []).join(', ') || 'None'}</span></div>
        `;
        detailsModal.classList.add('active');
    }
    document.getElementById('closeDetailsModal').addEventListener('click', () => detailsModal.classList.remove('active'));

    // Labels Modal
    const labelModal = document.getElementById('labelModal');
    let targetLabelItem = null;
    let localLabels = [];

    function openLabelModal(item) {
        targetLabelItem = item;
        localLabels = Array.isArray(item.Label) ? [...item.Label] : [];
        renderLabelBadges();
        labelModal.classList.add('active');
    }
    document.getElementById('closeLabelModal').addEventListener('click', () => labelModal.classList.remove('active'));

    function renderLabelBadges() {
        const list = document.getElementById('currentLabelsList');
        list.innerHTML = "";
        if (localLabels.length === 0) {
            list.innerHTML = `<span style="color:var(--text-secondary); font-size:12px;">No labels added.</span>`;
            return;
        }
        localLabels.forEach((l, idx) => {
            const badge = document.createElement('span');
            badge.className = 'label-badge';
            badge.style.padding = '4px 8px';
            badge.innerHTML = `${l} <span style="cursor:pointer; margin-left:4px; color:var(--danger);" data-idx="${idx}">&times;</span>`;
            badge.querySelector('span')?.addEventListener('click', () => {
                localLabels.splice(idx, 1);
                renderLabelBadges();
            });
            list.appendChild(badge);
        });
    }

    document.getElementById('btnAddLabel').addEventListener('click', () => {
        const txt = document.getElementById('newLabelInput').value.trim();
        if (txt && !localLabels.includes(txt)) {
            localLabels.push(txt);
            document.getElementById('newLabelInput').value = "";
            renderLabelBadges();
        }
    });

    document.getElementById('btnSaveLabels').addEventListener('click', async () => {
        if (!targetLabelItem) return;
        await updateDoc(doc(db, "Cloud Drive", targetLabelItem.id), {
            Label: localLabels,
            Updated: formatFirestoreDate()
        });
        showToast("Labels updated");
        labelModal.classList.remove('active');
        loadDrive();
    });

    // Manage Access Modal
    const accessModal = document.getElementById('accessModal');
    let targetAccessItem = null;
    let localAccessState = { Viewer: [], Contributor: [], Commenter: [], Editor: [] };

    function openAccessModal(item) {
        targetAccessItem = item;
        const access = item.Access || {};
        localAccessState = {
            Viewer: [...(access.Viewer || [])],
            Contributor: [...(access.Contributor || [])],
            Commenter: [...(access.Commenter || access.Commentator || [])],
            Editor: [...(access.Editor || [])]
        };
        renderAccessList();
        accessModal.classList.add('active');
    }
    document.getElementById('closeAccessModal').addEventListener('click', () => accessModal.classList.remove('active'));

    function renderAccessList() {
        const c = document.getElementById('accessListContainer');
        c.innerHTML = `
            <div class="user-access-row">
                <span>${targetAccessItem.Email || userEmail} <strong>(Owner)</strong></span>
                <span style="font-size: 11px; color: var(--accent); font-weight:600;">Owner</span>
            </div>
        `;
        ['Editor', 'Contributor', 'Viewer', 'Commenter'].forEach(role => {
            (localAccessState[role] || []).forEach((email, idx) => {
                const div = document.createElement('div');
                div.className = 'user-access-row';
                div.innerHTML = `
                    <span>${email}</span>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span style="font-size: 11px; color: var(--text-secondary);">${role}</span>
                        <span style="cursor: pointer; color: var(--danger); font-size:16px;" data-role="${role}" data-idx="${idx}">&times;</span>
                    </div>
                `;
                div.querySelector('span[data-role]')?.addEventListener('click', () => {
                    localAccessState[role].splice(idx, 1);
                    renderAccessList();
                });
                c.appendChild(div);
            });
        });
    }

    document.getElementById('btnAddAccess').addEventListener('click', async () => {
        const email = document.getElementById('inviteEmailInput').value.trim();
        const role = document.getElementById('inviteRoleSelect').value;
        if (!email) return;

        if (role === 'Transfer') {
            if (confirm(`Transfer ownership to ${email}? You will lose owner access.`)) {
                await updateDoc(doc(db, "Cloud Drive", targetAccessItem.id), {
                    Email: email,
                    Access: { Viewer: [], Contributor: [], Commenter: [], Editor: [] },
                    Updated: formatFirestoreDate()
                });
                showToast("Ownership transferred");
                accessModal.classList.remove('active');
                loadDrive();
            }
            return;
        }

        ['Viewer', 'Contributor', 'Commenter', 'Editor'].forEach(r => {
            if (localAccessState[r]) localAccessState[r] = localAccessState[r].filter(e => e !== email);
        });
        if (!localAccessState[role]) localAccessState[role] = [];
        localAccessState[role].push(email);
        document.getElementById('inviteEmailInput').value = "";
        renderAccessList();
    });

    document.getElementById('btnSaveAccess').addEventListener('click', async () => {
        if (!targetAccessItem) return;
        await updateDoc(doc(db, "Cloud Drive", targetAccessItem.id), { 
            Access: localAccessState,
            Updated: formatFirestoreDate()
        });
        showToast("Permissions updated");
        accessModal.classList.remove('active');
        loadDrive();
    });

    // Share Modal
    const shareModal = document.getElementById('shareModal');
    let targetShareItem = null;

    function openShareModal(item) {
        targetShareItem = item;
        shareModal.classList.add('active');
    }
    document.getElementById('closeShareModal').addEventListener('click', () => shareModal.classList.remove('active'));

    document.getElementById('btnExecuteShare').addEventListener('click', async () => {
        if (!targetShareItem) return;
        const choice = document.getElementById('shareFormatChoice').value;

        if (choice === 'pdf') {
            showToast("Converting to PDF...");
            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF();
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = targetShareItem.File;
                img.onload = async () => {
                    pdf.addImage(img, 'JPEG', 15, 20, 180, 160);
                    const blob = pdf.output('blob');
                    const file = new File([blob], `${targetShareItem.Name || 'Document'}.pdf`, { type: 'application/pdf' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: targetShareItem.Name });
                    } else {
                        pdf.save(`${targetShareItem.Name || 'Document'}.pdf`);
                        showToast("PDF saved");
                    }
                };
            } catch(e) {
                navigator.share ? navigator.share({ title: targetShareItem.Name, url: targetShareItem.File }) : null;
            }
        } else if (choice === 'image' && navigator.canShare) {
            try {
                const res = await fetch(targetShareItem.File);
                const blob = await res.blob();
                const file = new File([blob], targetShareItem.Name || "image.png", { type: blob.type });
                await navigator.share({ files: [file], title: targetShareItem.Name });
            } catch(e) {
                if (navigator.share) await navigator.share({ title: targetShareItem.Name, url: targetShareItem.File });
            }
        } else {
            if (navigator.share) {
                await navigator.share({ title: targetShareItem.Name, url: targetShareItem.File });
            } else {
                navigator.clipboard.writeText(targetShareItem.File);
                showToast("Link copied to clipboard");
            }
        }
    });

    document.getElementById('btnCopyShareLink').addEventListener('click', () => {
        if (targetShareItem && targetShareItem.File) {
            navigator.clipboard.writeText(targetShareItem.File).then(() => showToast("Link copied"));
        }
    });

    // Move Modal
    const moveModal = document.getElementById('moveModal');
    let targetMoveItem = null;
    let isBatchMove = false;

    function openMoveModal(item, batch = false) {
        targetMoveItem = item;
        isBatchMove = batch;
        const select = document.getElementById('moveDestinationSelect');
        document.getElementById('moveModalTitle').innerText = batch ? "Move Selected Items" : (item.Folder === "True" ? "Organise Folder" : "Move File");
        select.innerHTML = `<option value="root">Root Directory</option>`;
        
        allFolderDocs.forEach(f => {
            if (!batch && f.id === item?.id) return;
            select.innerHTML += `<option value="${f.id}">${f.Name || 'Untitled Folder'}</option>`;
        });
        moveModal.classList.add('active');
    }
    document.getElementById('closeMoveModal').addEventListener('click', () => moveModal.classList.remove('active'));

    document.getElementById('btnConfirmMove').addEventListener('click', async () => {
        const destFolderId = document.getElementById('moveDestinationSelect').value;
        const moveIds = isBatchMove ? Array.from(selectedItemIds) : [targetMoveItem.id];

        for (const id of moveIds) {
            for (const f of allFolderDocs) {
                if (Array.isArray(f.File) && f.File.includes(id)) {
                    await updateDoc(doc(db, "Cloud Drive", f.id), {
                        File: arrayRemove(id),
                        Updated: formatFirestoreDate()
                    });
                }
            }
            if (destFolderId !== "root") {
                await updateDoc(doc(db, "Cloud Drive", destFolderId), {
                    File: arrayUnion(id),
                    Updated: formatFirestoreDate()
                });
            }
        }

        showToast("Moved successfully");
        moveModal.classList.remove('active');
        loadDrive();
    });

    // Delete / Remove Action
    async function handleDelete(item, isViewer) {
        if (isViewer) {
            if (confirm(`Remove "${item.Name || 'item'}" from your drive view?`)) {
                await updateDoc(doc(db, "Cloud Drive", item.id), {
                    "Access.Viewer": arrayRemove(userEmail)
                });
                showToast("Removed from your drive");
                loadDrive();
            }
            return;
        }

        if (confirm(`Permanently delete "${item.Name || 'item'}"?`)) {
            for (const f of allFolderDocs) {
                if (Array.isArray(f.File) && f.File.includes(item.id)) {
                    await updateDoc(doc(db, "Cloud Drive", f.id), { File: arrayRemove(item.id) });
                }
            }
            await deleteDoc(doc(db, "Cloud Drive", item.id));
            showToast("Item deleted");
            loadDrive();
        }
    }

    // Create Folder
    const folderModal = document.getElementById('folderModal');
    document.getElementById('newFolderTriggerBtn').addEventListener('click', () => {
        document.getElementById('newFolderName').value = "";
        document.getElementById('newFolderPassword').value = "";
        folderModal.classList.add('active');
    });
    document.getElementById('closeFolderModal').addEventListener('click', () => folderModal.classList.remove('active'));

    document.getElementById('btnCreateFolder').addEventListener('click', async () => {
        const name = document.getElementById('newFolderName').value.trim();
        const pass = document.getElementById('newFolderPassword').value.trim();
        if (name) {
            const newDoc = await addDoc(collection(db, "Cloud Drive"), {
                Email: userEmail,
                Folder: "True",
                Name: name,
                Password: pass,
                File: [],
                Label: [],
                Customize: { Colour: "#ffffff", Icon: "folder" },
                Updated: formatFirestoreDate(),
                Access: { Viewer: [], Contributor: [], Commenter: [], Editor: [] }
            });

            const currFolderId = getCurrentFolderId();
            if (currFolderId) {
                await updateDoc(doc(db, "Cloud Drive", currFolderId), {
                    File: arrayUnion(newDoc.id),
                    Updated: formatFirestoreDate()
                });
            }

            folderModal.classList.remove('active');
            showToast("Folder created");
            loadDrive();
        }
    });

    // Batch File Upload
    const nativeFileInput = document.getElementById('nativeFileInput');
    document.getElementById('uploadTriggerBtn').addEventListener('click', () => nativeFileInput.click());
    nativeFileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleBatchUpload(e.target.files);
    });

    const dragOverlay = document.getElementById('dragOverlay');
    window.addEventListener('dragover', (e) => {
        e.preventDefault();
        dragOverlay.classList.add('active');
    });
    window.addEventListener('dragleave', (e) => {
        if (e.clientX === 0 && e.clientY === 0) dragOverlay.classList.remove('active');
    });
    window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragOverlay.classList.remove('active');
        if (e.dataTransfer.files.length) handleBatchUpload(e.dataTransfer.files);
    });

    async function handleBatchUpload(files) {
        showToast(`Uploading ${files.length} file(s)...`);
        for (const file of files) {
            if (file.size > 50 * 1024 * 1024) {
                showToast(`Skipped ${file.name} (exceeds 50MB)`);
                continue;
            }

            try {
                let fileUrl = "";
                let fileType = "Document";

                if (file.type.startsWith('image/')) {
                    const fd = new FormData();
                    fd.append('image', file);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = j.data.url;
                    fileType = "Image";
                } else {
                    const fd = new FormData();
                    fd.append('UPLOADCARE_PUB_KEY', UPLOADCARE_PUB_KEY);
                    fd.append('UPLOADCARE_STORE', '1');
                    fd.append('file', file);
                    const res = await fetch('https://upload.uploadcare.com/base/', { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = `https://ucarecdn.com/${j.file}/${encodeURIComponent(file.name)}`;
                    const ext = file.name.split('.').pop()?.toUpperCase();
                    fileType = ext || "Document";
                }

                let parentLabels = [];
                const p = getCurrentParentFolder();
                if (p && Array.isArray(p.Label)) parentLabels = [...p.Label];

                const newDoc = await addDoc(collection(db, "Cloud Drive"), {
                    Email: userEmail,
                    File: fileUrl,
                    Type: fileType,
                    Name: file.name,
                    Password: "",
                    Label: parentLabels,
                    LastOpened: new Date().toISOString(),
                    LastOpenedBy: userEmail,
                    Updated: formatFirestoreDate(),
                    Access: { Viewer: [], Contributor: [], Commenter: [], Editor: [] }
                });

                const currFolderId = getCurrentFolderId();
                if (currFolderId) {
                    await updateDoc(doc(db, "Cloud Drive", currFolderId), {
                        File: arrayUnion(newDoc.id),
                        Updated: formatFirestoreDate()
                    });
                }
            } catch(err) {
                console.error("Upload error:", err);
            }
        }
        showToast("Upload completed!");
        loadDrive();
    }

    // Search Filter (Full search across names & labels)
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase().trim();
        document.querySelectorAll('.table-row, .folder-card, .file-card').forEach(el => {
            const name = el.querySelector('.file-name')?.innerText.toLowerCase() || "";
            const labels = el.querySelector('.file-labels')?.innerText.toLowerCase() || "";
            const match = name.includes(val) || labels.includes(val);
            el.style.display = match ? (el.classList.contains('table-row') ? 'grid' : 'flex') : 'none';
        });
    });

    // Keyboard Shortcuts
    let themeKeySequence = [];
    let themeTimer = null;

    window.addEventListener('keydown', (e) => {
        const tag = e.target.tagName.toLowerCase();
        const isTyping = (tag === 'input' || tag === 'textarea' || tag === 'select');

        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-shade').forEach(m => m.classList.remove('active'));
            if (isSelectionMode) exitSelectionMode();
            return;
        }

        if (isTyping) return;

        if (e.shiftKey && (e.key === 'F' || e.key === 'f')) {
            e.preventDefault();
            const s = document.getElementById('searchInput');
            s.focus();
            s.select();
            return;
        }

        if (e.shiftKey && (e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
            document.getElementById('newFolderTriggerBtn').click();
            return;
        }

        if (e.shiftKey && (e.key === 'U' || e.key === 'u')) {
            e.preventDefault();
            nativeFileInput.click();
            return;
        }

        if (e.shiftKey && (e.key === 'S' || e.key === 's')) {
            e.preventDefault();
            if (!isSelectionMode) enterSelectionMode();
            else if (selectedItemIds.size > 0) document.getElementById('btnMultiDelete').click();
            else exitSelectionMode();
            return;
        }

        if (e.shiftKey && (e.key === 'D' || e.key === 'd')) {
            e.preventDefault();
            if (selectedItemIds.size > 0) document.getElementById('btnMultiDelete').click();
            return;
        }

        if (e.shiftKey && (e.key === 'M' || e.key === 'm')) {
            e.preventDefault();
            if (selectedItemIds.size > 0) document.getElementById('btnMultiMove').click();
            return;
        }

        if (e.shiftKey && (e.key === 'T' || e.key === 't')) {
            themeKeySequence = ['T'];
            clearTimeout(themeTimer);
            themeTimer = setTimeout(() => { themeKeySequence = []; }, 1500);
            return;
        }
        if (themeKeySequence[0] === 'T') {
            if (e.key === 'd' || e.key === 'D') {
                setTheme(true);
                showToast("Dark theme enabled");
                themeKeySequence = [];
                return;
            } else if (e.key === 'l' || e.key === 'L') {
                setTheme(false);
                showToast("Light theme enabled");
                themeKeySequence = [];
                return;
            }
        }

        const rows = document.querySelectorAll('.table-row');
        if (rows.length === 0) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            keyboardFocusedIndex = Math.min(keyboardFocusedIndex + 1, rows.length - 1);
            updateKeyboardFocus(rows);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            keyboardFocusedIndex = Math.max(keyboardFocusedIndex - 1, 0);
            updateKeyboardFocus(rows);
        } else if (e.key === ' ' || e.code === 'Space') {
            if (keyboardFocusedIndex >= 0 && keyboardFocusedIndex < rows.length) {
                e.preventDefault();
                if (!isSelectionMode) enterSelectionMode();
                const id = rows[keyboardFocusedIndex].getAttribute('data-id');
                toggleSelectItem(id, !selectedItemIds.has(id));
            }
        }
    });

    function updateKeyboardFocus(rows) {
        rows.forEach(r => r.classList.remove('keyboard-focused'));
        if (keyboardFocusedIndex >= 0 && keyboardFocusedIndex < rows.length) {
            const target = rows[keyboardFocusedIndex];
            target.classList.add('keyboard-focused');
            target.scrollIntoView({ block: 'nearest' });
        }
    }

    loadDrive();
</script>
</body>
</html>
