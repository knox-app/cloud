<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Drive</title>
    <!-- jsPDF & JSZip for image conversions and folder downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #f3f4f6;
            --hover-bg: #f9fafb;
            --btn-dark-bg: #0d0d0d;
            --btn-dark-text: #ffffff;
            --accent: #10a37f;
            --danger: #ef4444;
            --sidebar-width: 64px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar */
        aside.sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            flex-shrink: 0;
            background: var(--surface-color);
        }

        .side-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .side-icon:hover, .side-icon.active {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }
        .side-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

        /* Main Viewport */
        main.content-area {
            flex-grow: 1;
            padding: 36px 48px;
            max-width: 1200px;
            position: relative;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.15s;
        }
        .breadcrumb-item:hover { color: var(--text-primary); }
        .breadcrumb-item.active { color: var(--text-primary); font-weight: 600; cursor: default; }

        .btn-pill {
            background-color: var(--btn-dark-bg);
            color: var(--btn-dark-text);
            border: 1px solid transparent;
            padding: 9px 16px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: opacity 0.2s, background-color 0.2s;
        }
        .btn-pill:hover { opacity: 0.9; }
        .btn-pill.secondary {
            background: var(--hover-bg);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        /* Search input */
        .search-container {
            position: relative;
            max-width: 360px;
            margin-bottom: 24px;
        }
        .search-container svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            fill: none;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
        }
        .search-input:focus { border-color: var(--text-secondary); }

        /* Drag & Drop Overlay */
        .drag-overlay {
            position: fixed;
            inset: 0;
            background: rgba(16, 163, 127, 0.08);
            border: 2px dashed var(--accent);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }
        .drag-overlay.active { display: flex; }
        .drag-overlay-card {
            background: var(--surface-color);
            padding: 24px 36px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Data Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .table-head {
            display: grid;
            grid-template-columns: 3.5fr 2fr 1.5fr 1fr 40px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .table-row {
            display: grid;
            grid-template-columns: 3.5fr 2fr 1.5fr 1fr 40px;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            transition: background-color 0.15s;
        }
        .table-row:hover { background-color: var(--hover-bg); }

        .file-title-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }
        .file-icon-box {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--hover-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--text-secondary);
        }
        .file-icon-box svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; }

        .file-info-col {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .file-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }
        .file-name:hover { text-decoration: underline; }
        .file-subtext {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* 3-Dots Dropdown */
        .actions-cell { position: relative; text-align: right; }
        .btn-dots {
            background: none;
            border: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-dots:hover { color: var(--text-primary); background: var(--border-color); }
        .btn-dots svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        .action-dropdown {
            position: absolute;
            right: 0;
            top: 32px;
            background: var(--surface-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 190px;
            padding: 6px 0;
            z-index: 100;
            display: none;
            text-align: left;
        }
        .action-dropdown.active { display: block; }
        .dropdown-item {
            padding: 9px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .dropdown-item:hover { background: var(--hover-bg); }
        .dropdown-item.danger { color: var(--danger); }
        .dropdown-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

        /* Modals */
        .modal-shade {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 16px;
        }
        .modal-shade.active { visibility: visible; opacity: 1; }

        .modal-box {
            background: var(--surface-color);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 28px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title { font-size: 17px; font-weight: 600; }
        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .modal-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

        .tab-bar {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .tab-link {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            cursor: pointer;
            background: none;
            border-top: none; border-left: none; border-right: none;
        }
        .tab-link.active {
            color: var(--text-primary);
            border-bottom-color: var(--text-primary);
        }

        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .clean-input {
            width: 100%;
            padding: 11px 14px;
            background: var(--hover-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        .clean-input:focus { border-color: var(--text-secondary); }

        .user-access-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13.5px;
        }
        .detail-label { color: var(--text-secondary); }
        .detail-val { font-weight: 500; text-align: right; max-width: 60%; word-break: break-all; }

        /* Toast Popup */
        .toast-popup {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 9999px;
            font-size: 13px;
            display: none;
            z-index: 2000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* Mobile Version Styling */
        @media (max-width: 768px) {
            aside.sidebar { display: none; }
            main.content-area { padding: 20px 16px; width: 100%; }
            .table-head { display: none; }
            .table-row {
                grid-template-columns: 1fr 100px 30px;
                gap: 8px;
                padding: 12px 0;
            }
            .cell-owner, .cell-password { display: none; }
            .file-subtext { display: none; }
            .cell-date { font-size: 12px; color: var(--text-secondary); text-align: right; }
            .modal-box { padding: 22px; border-radius: 16px; }
        }
        @media (min-width: 769px) {
            .cell-date-mobile { display: none; }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
    <div class="side-icon active" title="Cloud Drive">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <div class="side-icon" id="logoutSideBtn" title="Sign Out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </div>
</aside>

<!-- Drag & Drop Surface -->
<div class="drag-overlay" id="dragOverlay">
    <div class="drag-overlay-card">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span>Drop files here to upload</span>
    </div>
</div>

<!-- Main Content Area -->
<main class="content-area">
    <div class="top-row">
        <div class="page-title" id="breadcrumbArea">
            <span class="breadcrumb-item active">Cloud Drive</span>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-pill" id="uploadTriggerBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Upload
            </button>
            <button class="btn-pill secondary" id="newFolderTriggerBtn">
                + Folder
            </button>
        </div>
    </div>

    <input type="file" id="nativeFileInput" multiple style="display: none;">

    <div class="search-container">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search files and folders">
    </div>

    <div class="data-table">
        <div class="table-head">
            <div>Name</div>
            <div class="cell-owner">Updated</div>
            <div>Format / Type</div>
            <div class="cell-password">Password</div>
            <div></div>
        </div>
        <div id="tableContent">
            <div style="padding: 24px 0; color: var(--text-secondary); font-size: 14px;">Loading workspace...</div>
        </div>
    </div>
</main>

<!-- Modal: Share & Manage Access -->
<div class="modal-shade" id="shareAccessModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title" id="shareModalTitle">Share & Access</div>
            <button class="modal-close" id="closeShareModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <div class="tab-bar">
            <button class="tab-link active" id="tabShareBtn">Share</button>
            <button class="tab-link" id="tabAccessBtn">Manage Access</button>
        </div>

        <!-- Share Pane -->
        <div class="tab-pane active" id="paneShare">
            <div class="input-group" id="shareFormatGroup">
                <label>Export & Share Format</label>
                <select id="shareFormatSelect" class="clean-input">
                    <option value="original">Original Image / File</option>
                    <option value="pdf">Convert Image to PDF (.pdf)</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 24px;">
                <button class="btn-pill" id="btnDeviceShare" style="flex: 1; justify-content: center;">Share Direct</button>
                <button class="btn-pill secondary" id="btnCopyLink">Copy Link</button>
            </div>
        </div>

        <!-- Manage Access Pane -->
        <div class="tab-pane" id="paneAccess">
            <div class="input-group">
                <label>Ask for Email ID & Role</label>
                <div style="display: flex; gap: 8px;">
                    <input type="email" id="inviteEmailInput" class="clean-input" placeholder="user@perplexity.com">
                    <select id="inviteRoleSelect" class="clean-input" style="width: 140px;">
                        <option value="Viewer">Viewer</option>
                        <option value="Commentator">Commenter</option>
                        <option value="Editor">Editor</option>
                        <option value="Transfer Ownership">Transfer Ownership</option>
                    </select>
                    <button class="btn-pill" id="btnApplyAccess" style="padding: 0 16px;">Add</button>
                </div>
            </div>
            <div class="input-group">
                <label>People with access</label>
                <div id="accessListContainer" style="max-height: 160px; overflow-y: auto;"></div>
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                <button class="btn-pill" id="btnSavePermissions">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Move / Organise -->
<div class="modal-shade" id="moveModal">
    <div class="modal-box" style="max-width: 400px;">
        <div class="modal-header">
            <div class="modal-title" id="moveModalTitle">Move / Organise</div>
            <button class="modal-close" id="closeMoveModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="input-group">
            <label>Select Destination Folder</label>
            <select id="destinationFolderSelect" class="clean-input"></select>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
            <button class="btn-pill" id="btnSubmitMove">Move Here</button>
        </div>
    </div>
</div>

<!-- Modal: Rename -->
<div class="modal-shade" id="renameModal">
    <div class="modal-box" style="max-width: 380px;">
        <div class="modal-header">
            <div class="modal-title">Rename</div>
            <button class="modal-close" id="closeRenameModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="input-group">
            <label>New Name</label>
            <input type="text" id="renameInput" class="clean-input">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-pill" id="btnSubmitRename">Save</button>
        </div>
    </div>
</div>

<!-- Modal: Details -->
<div class="modal-shade" id="detailsModal">
    <div class="modal-box" style="max-width: 420px;">
        <div class="modal-header">
            <div class="modal-title">Details</div>
            <button class="modal-close" id="closeDetailsModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div id="detailsContent"></div>
        <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
            <button class="btn-pill secondary" id="btnCloseDetailsBtn">Close</button>
        </div>
    </div>
</div>

<!-- Modal: Folder Creation -->
<div class="modal-shade" id="folderModal">
    <div class="modal-box" style="max-width: 400px;">
        <div class="modal-header">
            <div class="modal-title">New Folder</div>
            <button class="modal-close" id="closeFolderModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="input-group">
            <label>Folder Name</label>
            <input type="text" id="newFolderName" class="clean-input" placeholder="e.g. My First Folder">
        </div>
        <div class="input-group">
            <label>Folder Password (Optional)</label>
            <input type="text" id="newFolderPassword" class="clean-input" placeholder="Lock this folder">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-pill" id="btnCreateFolder">Create</button>
        </div>
    </div>
</div>

<!-- Modal: Password Auth -->
<div class="modal-shade" id="passwordAuthModal">
    <div class="modal-box" style="max-width: 360px;">
        <div class="modal-header">
            <div class="modal-title">Enter Password</div>
            <button class="modal-close" id="closePassModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="input-group">
            <input type="password" id="authPasswordInput" class="clean-input" placeholder="Password required">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-pill" id="btnSubmitAuth">Unlock</button>
        </div>
    </div>
</div>

<div class="toast-popup" id="toastPopup"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getFirestore, collection, query, where, getDocs, or,
        doc, updateDoc, deleteDoc, addDoc, arrayUnion, arrayRemove 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 1. Firebase Initialization
    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const IMGBB_API_KEY = "80c452b9a4b80f240ada316f23078d2c";
    const UPLOADCARE_PUB_KEY = "demopublickey";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Authentication Verification
    let currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('active_user')); } catch(e){}
    if (!currentUser || !currentUser.Email) {
        window.location.href = "1.html";
    }
    const userEmail = currentUser.Email;

    document.getElementById('logoutSideBtn').addEventListener('click', () => {
        localStorage.removeItem('active_user');
        window.location.href = "1.html";
    });

    function showToast(msg) {
        const t = document.getElementById('toastPopup');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 2800);
    }

    function getFormattedTimestamp() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
        const dateStr = `${now.getDate()}-${months[now.getMonth()]}-${now.getFullYear()}`;
        return `${timeStr} , ${dateStr}`;
    }

    const SVG_ICONS = {
        folder: `<svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`,

        doc: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`,

        edit: `<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
        share: `<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>`,
        lock: `<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`,
        move: `<svg viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>`,
        info: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`,
        trash: `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`
    };

    function getFormatInfo(typeStr, isFolder) {
        if (isFolder) return { label: "Folder", icon: SVG_ICONS.folder };
        const t = (typeStr || "").toLowerCase();
        if (t.includes("img") || t.includes("png") || t.includes("jpg") || t.includes("jpeg")) return { label: "Image", icon: SVG_ICONS.image };
        if (t.includes("pdf")) return { label: "PDF", icon: SVG_ICONS.pdf };
        if (t.includes("mp4") || t.includes("mkv") || t.includes("video")) return { label: "Video", icon: SVG_ICONS.video };
        return { label: "Document", icon: SVG_ICONS.doc };
    }

    // State Variables
    let folderHierarchy = []; // Stack of { id, name }
    let rawItems = [];

    function getCurrentFolderId() {
        return folderHierarchy.length > 0 ? folderHierarchy[folderHierarchy.length - 1].id : null;
    }

    function renderBreadcrumbs() {
        const area = document.getElementById('breadcrumbArea');
        if (folderHierarchy.length === 0) {
            area.innerHTML = `<span class="breadcrumb-item active">Cloud Drive</span>`;
        } else {
            let html = `<span class="breadcrumb-item" data-index="-1">Cloud Drive</span>`;
            folderHierarchy.forEach((item, index) => {
                const isLast = index === folderHierarchy.length - 1;
                html += ` <span style="color: var(--text-secondary);">/</span> `;
                if (isLast) {
                    html += `<span class="breadcrumb-item active">${item.name}</span>`;
                } else {
                    html += `<span class="breadcrumb-item" data-index="${index}">${item.name}</span>`;
                }
            });
            area.innerHTML = html;
            area.querySelectorAll('.breadcrumb-item[data-index]').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.getAttribute('data-index'));
                    if (idx === -1) {
                        folderHierarchy = [];
                    } else {
                        folderHierarchy = folderHierarchy.slice(0, idx + 1);
                    }
                    loadDrive();
                });
            });
        }
    }

    async function loadDrive() {
        renderBreadcrumbs();
        const container = document.getElementById('tableContent');
        container.innerHTML = `<div style="padding: 24px 0; color: var(--text-secondary); font-size: 14px;">Loading workspace...</div>`;

        try {
            const q = query(
                collection(db, "Cloud Drive"),
                or(
                    where("Email", "==", userEmail),
                    where("Access.Viewer", "array-contains", userEmail),
                    where("Access.Commentator", "array-contains", userEmail),
                    where("Access.Editor", "array-contains", userEmail)
                )
            );

            const snap = await getDocs(q);
            rawItems = [];
            snap.forEach(docSnap => {
                rawItems.push({ id: docSnap.id, ...docSnap.data() });
            });

            container.innerHTML = "";
            const currentFolderId = getCurrentFolderId();

            let visibleItems = [];

            if (!currentFolderId) {
                // Find IDs contained inside other folders
                const childIds = new Set();
                rawItems.forEach(item => {
                    if (item.Folder === "True" && Array.isArray(item.File)) {
                        item.File.forEach(id => childIds.add(id));
                    }
                });
                // Visible at root: not inside any folder's File array
                visibleItems = rawItems.filter(item => !childIds.has(item.id));
            } else {
                const activeFolder = rawItems.find(i => i.id === currentFolderId);
                const assignedIds = (activeFolder && Array.isArray(activeFolder.File)) ? activeFolder.File : [];
                visibleItems = rawItems.filter(i => assignedIds.includes(i.id));
            }

            if (visibleItems.length === 0) {
                container.innerHTML = `<div style="padding: 32px 0; color: var(--text-secondary); font-size: 14px;">No files or folders here.</div>`;
                return;
            }

            // Folders first, then files
            visibleItems.sort((a, b) => (b.Folder === "True" ? 1 : 0) - (a.Folder === "True" ? 1 : 0));
            visibleItems.forEach(item => renderTableRow(item));
        } catch(err) {
            console.error(err);
            container.innerHTML = `<div style="padding: 20px 0; color: var(--danger);">Failed to load workspace.</div>`;
        }
    }

    function renderTableRow(item) {
        const container = document.getElementById('tableContent');
        const isFolder = item.Folder === "True";
        const name = item.Name || 'Untitled';
        const format = getFormatInfo(item.Type, isFolder);
        const updatedDate = item.Updated || 'N/A';

        const row = document.createElement('div');
        row.className = 'table-row';
        row.innerHTML = `
            <div class="file-title-cell">
                <div class="file-icon-box">${format.icon}</div>
                <div class="file-info-col">
                    <span class="file-name" title="${name}">${name}</span>
                    <span class="file-subtext">${item.Email}</span>
                </div>
            </div>
            <div class="cell-owner" style="font-size: 13px; color: var(--text-secondary);">${updatedDate}</div>
            <div style="font-size: 13px; color: var(--text-secondary);">${format.label}</div>
            <div class="cell-password" style="font-size: 13px; color: var(--text-secondary);">${item.Password ? '🔒 Locked' : 'None'}</div>
            <div class="actions-cell">
                <button class="btn-dots">${SVG_ICONS.dots}</button>
                <div class="action-dropdown">
                    <div class="dropdown-item opt-download">${SVG_ICONS.download} Download</div>
                    <div class="dropdown-item opt-rename">${SVG_ICONS.edit} Rename</div>
                    <div class="dropdown-item opt-share">${SVG_ICONS.share} Share</div>
                    <div class="dropdown-item opt-manage-access">${SVG_ICONS.lock} Manage Access</div>
                    <div class="dropdown-item opt-move">${SVG_ICONS.move} ${isFolder ? 'Organise' : 'Move'}</div>
                    <div class="dropdown-item opt-details">${SVG_ICONS.info} Details</div>
                    <div class="dropdown-item danger opt-delete">${SVG_ICONS.trash} Delete</div>
                </div>
            </div>
        `;

        const dotsBtn = row.querySelector('.btn-dots');
        const dropdown = row.querySelector('.action-dropdown');

        dotsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.action-dropdown').forEach(d => d !== dropdown && d.classList.remove('active'));
            dropdown.classList.toggle('active');
        });

        // Open item handler (with password check & LastOpened tracking)
        row.querySelector('.file-name').addEventListener('click', () => {
            handleItemOpen(item);
        });

        // Dropdown actions
        row.querySelector('.opt-download').addEventListener('click', () => handleDownload(item));
        row.querySelector('.opt-rename').addEventListener('click', () => openRenameModal(item));
        row.querySelector('.opt-share').addEventListener('click', () => openShareModal(item, 'share'));
        row.querySelector('.opt-manage-access').addEventListener('click', () => openShareModal(item, 'access'));
        row.querySelector('.opt-move').addEventListener('click', () => openMoveModal(item));
        row.querySelector('.opt-details').addEventListener('click', () => openDetailsModal(item));
        row.querySelector('.opt-delete').addEventListener('click', () => handleDelete(item));

        container.appendChild(row);
    }

    async function handleItemOpen(item) {
        const isFolder = item.Folder === "True";
        const proceed = async () => {
            if (!isFolder) {
                try {
                    await updateDoc(doc(db, "Cloud Drive", item.id), {
                        LastOpened: new Date().toISOString(),
                        LastOpenedBy: userEmail
                    });
                } catch(e) {}
                if (item.File && typeof item.File === "string") {
                    window.open(item.File, '_blank');
                }
            } else {
                folderHierarchy.push({ id: item.id, name: item.Name });
                loadDrive();
            }
        };

        if (item.Password) {
            promptPasswordAuth(item.Password, proceed);
        } else {
            proceed();
        }
    }

    // Password Challenge
    const passModal = document.getElementById('passwordAuthModal');
    let passSuccessCallback = null;
    let expectedPass = "";

    function promptPasswordAuth(password, onSuccess) {
        expectedPass = password;
        passSuccessCallback = onSuccess;
        document.getElementById('authPasswordInput').value = "";
        passModal.classList.add('active');
    }
    document.getElementById('closePassModal').addEventListener('click', () => passModal.classList.remove('active'));
    document.getElementById('btnSubmitAuth').addEventListener('click', () => {
        const val = document.getElementById('authPasswordInput').value;
        if (val === expectedPass) {
            passModal.classList.remove('active');
            if (passSuccessCallback) passSuccessCallback();
        } else {
            showToast("Incorrect password!");
        }
    });

    // Download Handler
    async function handleDownload(item) {
        const isFolder = item.Folder === "True";
        if (isFolder) {
            showToast("Packaging folder into ZIP...");
            try {
                const zip = new JSZip();
                const assignedIds = Array.isArray(item.File) ? item.File : [];
                const childFiles = rawItems.filter(f => assignedIds.includes(f.id) && f.Folder !== "True");

                for (const cf of childFiles) {
                    if (cf.File) {
                        const response = await fetch(cf.File);
                        const blob = await response.blob();
                        zip.file(cf.Name || 'file', blob);
                    }
                }
                const content = await zip.generateAsync({ type: "blob" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(content);
                a.download = `${item.Name || 'folder'}.zip`;
                a.click();
            } catch(e) {
                showToast("Download failed");
            }
        } else {
            if (!item.File) return;
            try {
                const response = await fetch(item.File);
                const blob = await response.blob();
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = item.Name || "download";
                a.click();
            } catch(e) {
                window.open(item.File, '_blank');
            }
        }
    }

    // Rename Handler
    const renameModal = document.getElementById('renameModal');
    let itemToRename = null;
    function openRenameModal(item) {
        itemToRename = item;
        document.getElementById('renameInput').value = item.Name || "";
        renameModal.classList.add('active');
    }
    document.getElementById('closeRenameModal').addEventListener('click', () => renameModal.classList.remove('active'));
    document.getElementById('btnSubmitRename').addEventListener('click', async () => {
        const newName = document.getElementById('renameInput').value.trim();
        if (newName && itemToRename) {
            await updateDoc(doc(db, "Cloud Drive", itemToRename.id), {
                Name: newName,
                Updated: getFormattedTimestamp()
            });
            renameModal.classList.remove('active');
            showToast("Renamed successfully");
            loadDrive();
        }
    });

    // Move / Organise Handler
    const moveModal = document.getElementById('moveModal');
    let itemToMove = null;
    function openMoveModal(item) {
        itemToMove = item;
        const select = document.getElementById('destinationFolderSelect');
        select.innerHTML = `<option value="__root__">Cloud Drive (Root)</option>`;

        // Populate available folders (excluding self and children if folder)
        const availableFolders = rawItems.filter(i => i.Folder === "True" && i.id !== item.id);
        availableFolders.forEach(f => {
            select.innerHTML += `<option value="${f.id}">${f.Name}</option>`;
        });

        document.getElementById('moveModalTitle').innerText = item.Folder === "True" ? "Organise Folder" : "Move File";
        moveModal.classList.add('active');
    }
    document.getElementById('closeMoveModal').addEventListener('click', () => moveModal.classList.remove('active'));
    document.getElementById('btnSubmitMove').addEventListener('click', async () => {
        if (!itemToMove) return;
        const targetFolderId = document.getElementById('destinationFolderSelect').value;

        // 1. Remove from all existing parent folders
        for (const f of rawItems.filter(i => i.Folder === "True")) {
            if (Array.isArray(f.File) && f.File.includes(itemToMove.id)) {
                await updateDoc(doc(db, "Cloud Drive", f.id), {
                    File: arrayRemove(itemToMove.id)
                });
            }
        }

        // 2. Add to new target folder if not root
        if (targetFolderId !== "__root__") {
            await updateDoc(doc(db, "Cloud Drive", targetFolderId), {
                File: arrayUnion(itemToMove.id)
            });
        }

        moveModal.classList.remove('active');
        showToast("Moved successfully");
        loadDrive();
    });

    // Details Modal
    const detailsModal = document.getElementById('detailsModal');
    function openDetailsModal(item) {
        const isFolder = item.Folder === "True";
        const format = getFormatInfo(item.Type, isFolder);
        
        let locationName = "Cloud Drive (Root)";
        const parentFolder = rawItems.find(f => f.Folder === "True" && Array.isArray(f.File) && f.File.includes(item.id));
        if (parentFolder) locationName = parentFolder.Name;

        const html = `
            <div class="detail-row"><span class="detail-label">Name</span><span class="detail-val">${item.Name || 'Untitled'}</span></div>
            <div class="detail-row"><span class="detail-label">Type</span><span class="detail-val">${format.label}</span></div>
            <div class="detail-row"><span class="detail-label">Owner</span><span class="detail-val">${item.Email}</span></div>
            <div class="detail-row"><span class="detail-label">Location</span><span class="detail-val">${locationName}</span></div>
            <div class="detail-row"><span class="detail-label">Updated</span><span class="detail-val">${item.Updated || 'N/A'}</span></div>
            <div class="detail-row"><span class="detail-label">Last Opened</span><span class="detail-val">${item.LastOpened ? new Date(item.LastOpened).toLocaleString() : 'N/A'}</span></div>
            <div class="detail-row"><span class="detail-label">Password Protected</span><span class="detail-val">${item.Password ? 'Yes' : 'No'}</span></div>
        `;
        document.getElementById('detailsContent').innerHTML = html;
        detailsModal.classList.add('active');
    }
    document.getElementById('closeDetailsModal').addEventListener('click', () => detailsModal.classList.remove('active'));
    document.getElementById('btnCloseDetailsBtn').addEventListener('click', () => detailsModal.classList.remove('active'));

    // Share & Manage Access
    const shareModal = document.getElementById('shareAccessModal');
    const tabShareBtn = document.getElementById('tabShareBtn');
    const tabAccessBtn = document.getElementById('tabAccessBtn');
    const paneShare = document.getElementById('paneShare');
    const paneAccess = document.getElementById('paneAccess');
    let activeItem = null;
    let accessState = { Viewer: [], Commentator: [], Editor: [] };

    tabShareBtn.addEventListener('click', () => {
        tabShareBtn.classList.add('active');
        tabAccessBtn.classList.remove('active');
        paneShare.classList.add('active');
        paneAccess.classList.remove('active');
    });
    tabAccessBtn.addEventListener('click', () => {
        tabAccessBtn.classList.add('active');
        tabShareBtn.classList.remove('active');
        paneAccess.classList.add('active');
        paneShare.classList.remove('active');
    });

    function openShareModal(item, initialTab = 'share') {
        activeItem = item;
        accessState = {
            Viewer: [...(item.Access?.Viewer || [])],
            Commentator: [...(item.Access?.Commentator || [])],
            Editor: [...(item.Access?.Editor || [])]
        };
        renderAccessList();

        if (initialTab === 'access') {
            tabAccessBtn.click();
        } else {
            tabShareBtn.click();
        }
        shareModal.classList.add('active');
    }
    document.getElementById('closeShareModal').addEventListener('click', () => shareModal.classList.remove('active'));

    function renderAccessList() {
        const c = document.getElementById('accessListContainer');
        c.innerHTML = `
            <div class="user-access-row">
                <span>${activeItem.Email} (Owner)</span>
                <span style="font-size: 11px; color: var(--accent); font-weight: 600;">Owner</span>
            </div>
        `;
        ['Editor', 'Commentator', 'Viewer'].forEach(role => {
            (accessState[role] || []).forEach((email, idx) => {
                const div = document.createElement('div');
                div.className = 'user-access-row';
                div.innerHTML = `
                    <span>${email}</span>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span style="font-size: 11px; color: var(--text-secondary);">${role === 'Commentator' ? 'Commenter' : role}</span>
                        <span style="cursor: pointer; color: var(--danger); font-size: 16px;" data-role="${role}" data-idx="${idx}">&times;</span>
                    </div>
                `;
                div.querySelector('span[data-role]').addEventListener('click', () => {
                    accessState[role].splice(idx, 1);
                    renderAccessList();
                });
                c.appendChild(div);
            });
        });
    }

    // Add Collaborator & Transfer Ownership
    document.getElementById('btnApplyAccess').addEventListener('click', async () => {
        const email = document.getElementById('inviteEmailInput').value.trim();
        const role = document.getElementById('inviteRoleSelect').value;
        if (!email) return;

        if (role === 'Transfer Ownership') {
            if (confirm(`Transfer ownership to ${email}? You will lose owner privileges.`)) {
                await updateDoc(doc(db, "Cloud Drive", activeItem.id), {
                    Email: email,
                    Updated: getFormattedTimestamp()
                });
                showToast("Ownership transferred");
                shareModal.classList.remove('active');
                loadDrive();
            }
            return;
        }

        ['Viewer', 'Commentator', 'Editor'].forEach(r => {
            accessState[r] = accessState[r].filter(e => e !== email);
        });
        accessState[role].push(email);
        document.getElementById('inviteEmailInput').value = "";
        renderAccessList();
    });

    document.getElementById('btnSavePermissions').addEventListener('click', async () => {
        if (!activeItem) return;
        await updateDoc(doc(db, "Cloud Drive", activeItem.id), { 
            Access: accessState,
            Updated: getFormattedTimestamp()
        });
        showToast("Access permissions updated");
        shareModal.classList.remove('active');
        loadDrive();
    });

    // Direct Image / File Sharing
    document.getElementById('btnDeviceShare').addEventListener('click', async () => {
        if (!activeItem) return;
        const fmt = document.getElementById('shareFormatSelect').value;

        if (activeItem.File && typeof activeItem.File === 'string') {
            try {
                if (fmt === 'pdf' && getFormatInfo(activeItem.Type).label === 'Image') {
                    showToast("Converting image to PDF...");
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF();
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = activeItem.File;
                    img.onload = async () => {
                        pdf.addImage(img, 'JPEG', 15, 30, 180, 160);
                        const blob = pdf.output('blob');
                        const file = new File([blob], `${activeItem.Name || 'Document'}.pdf`, { type: 'application/pdf' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({ files: [file], title: activeItem.Name });
                        } else {
                            pdf.save(`${activeItem.Name || 'Document'}.pdf`);
                        }
                    };
                } else {
                    const res = await fetch(activeItem.File);
                    const blob = await res.blob();
                    const file = new File([blob], activeItem.Name || 'share_file', { type: blob.type });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: activeItem.Name });
                    } else if (navigator.share) {
                        await navigator.share({ title: activeItem.Name, url: activeItem.File });
                    } else {
                        navigator.clipboard.writeText(activeItem.File);
                        showToast("Link copied to clipboard");
                    }
                }
            } catch(e) {
                if (navigator.share) {
                    navigator.share({ title: activeItem.Name, url: activeItem.File });
                } else {
                    navigator.clipboard.writeText(activeItem.File);
                    showToast("Link copied");
                }
            }
        }
    });

    document.getElementById('btnCopyLink').addEventListener('click', () => {
        if (activeItem && activeItem.File && typeof activeItem.File === 'string') {
            navigator.clipboard.writeText(activeItem.File).then(() => showToast("Link copied"));
        } else {
            showToast("Direct link unavailable for this item");
        }
    });

    // Delete Handler
    async function handleDelete(item) {
        if (confirm(`Delete "${item.Name}" permanently?`)) {
            await deleteDoc(doc(db, "Cloud Drive", item.id));
            // Also clean up from parent folders
            for (const f of rawItems.filter(i => i.Folder === "True")) {
                if (Array.isArray(f.File) && f.File.includes(item.id)) {
                    await updateDoc(doc(db, "Cloud Drive", f.id), {
                        File: arrayRemove(item.id)
                    });
                }
            }
            showToast("Item deleted");
            loadDrive();
        }
    }

    // Folder Creation
    const folderModal = document.getElementById('folderModal');
    document.getElementById('newFolderTriggerBtn').addEventListener('click', () => {
        document.getElementById('newFolderName').value = "";
        document.getElementById('newFolderPassword').value = "";
        folderModal.classList.add('active');
    });
    document.getElementById('closeFolderModal').addEventListener('click', () => folderModal.classList.remove('active'));
    document.getElementById('btnCreateFolder').addEventListener('click', async () => {
        const name = document.getElementById('newFolderName').value.trim();
        const pass = document.getElementById('newFolderPassword').value.trim();
        if (name) {
            const currentFolderId = getCurrentFolderId();
            const newDoc = await addDoc(collection(db, "Cloud Drive"), {
                Email: userEmail,
                Folder: "True",
                Name: name,
                Password: pass,
                File: [],
                Customize: { Colour: "Red" },
                Updated: getFormattedTimestamp(),
                Access: { Viewer: [], Commentator: [], Editor: [] }
            });

            if (currentFolderId) {
                await updateDoc(doc(db, "Cloud Drive", currentFolderId), {
                    File: arrayUnion(newDoc.id),
                    Updated: getFormattedTimestamp()
                });
            }

            folderModal.classList.remove('active');
            showToast("Folder created");
            loadDrive();
        }
    });

    // Batch File Upload (ImgBB for images, Uploadcare for other documents)
    const nativeFileInput = document.getElementById('nativeFileInput');
    document.getElementById('uploadTriggerBtn').addEventListener('click', () => nativeFileInput.click());
    nativeFileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleBatchUpload(e.target.files);
    });

    const dragOverlay = document.getElementById('dragOverlay');
    window.addEventListener('dragover', (e) => {
        e.preventDefault();
        dragOverlay.classList.add('active');
    });
    window.addEventListener('dragleave', (e) => {
        if (e.clientX === 0 && e.clientY === 0) dragOverlay.classList.remove('active');
    });
    window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragOverlay.classList.remove('active');
        if (e.dataTransfer.files.length) handleBatchUpload(e.dataTransfer.files);
    });

    async function handleBatchUpload(files) {
        showToast(`Uploading ${files.length} file(s)...`);
        const currentFolderId = getCurrentFolderId();

        for (const file of files) {
            if (file.size > 50 * 1024 * 1024) {
                showToast(`Skipped ${file.name} (exceeds 50MB)`);
                continue;
            }

            try {
                let fileUrl = "";
                let fileType = "Document";
                if (file.type.startsWith('image/')) {
                    const fd = new FormData();
                    fd.append('image', file);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = j.data.url;
                    fileType = "Image";
                } else {
                    const fd = new FormData();
                    fd.append('UPLOADCARE_PUB_KEY', UPLOADCARE_PUB_KEY);
                    fd.append('UPLOADCARE_STORE', '1');
                    fd.append('file', file);
                    const res = await fetch('https://upload.uploadcare.com/base/', { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = `https://ucarecdn.com/${j.file}/${encodeURIComponent(file.name)}`;
                    fileType = file.type.includes('pdf') ? 'PDF' : 'Document';
                }

                const newDoc = await addDoc(collection(db, "Cloud Drive"), {
                    Email: userEmail,
                    File: fileUrl,
                    Type: fileType,
                    Name: file.name,
                    Password: "",
                    Folder: "False",
                    Updated: getFormattedTimestamp(),
                    LastOpened: new Date().toISOString(),
                    LastOpenedBy: userEmail,
                    Access: { Viewer: [], Commentator: [], Editor: [] }
                });

                if (currentFolderId) {
                    await updateDoc(doc(db, "Cloud Drive", currentFolderId), {
                        File: arrayUnion(newDoc.id),
                        Updated: getFormattedTimestamp()
                    });
                }
            } catch(err) {
                console.error("Upload error:", err);
            }
        }
        showToast("Upload completed!");
        loadDrive();
    }

    // Search Filter
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.table-row').forEach(row => {
            const name = row.querySelector('.file-name').innerText.toLowerCase();
            row.style.display = name.includes(val) ? 'grid' : 'none';
        });
    });

    window.addEventListener('click', () => {
        document.querySelectorAll('.action-dropdown').forEach(d => d.classList.remove('active'));
    });

    loadDrive();
</script>
</body>
</html>
