<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Drive</title>
    <!-- jsPDF for Image-to-PDF conversion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #f3f4f6;
            --hover-bg: #f9fafb;
            --btn-dark-bg: #0d0d0d;
            --btn-dark-text: #ffffff;
            --accent: #10a37f;
            --danger: #ef4444;
            --sidebar-width: 64px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar */
        aside.sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            flex-shrink: 0;
            background: var(--surface-color);
        }

        .side-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .side-icon:hover, .side-icon.active {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }
        .side-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

        /* Main Viewport */
        main.content-area {
            flex-grow: 1;
            padding: 36px 48px;
            max-width: 1200px;
            position: relative;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-pill {
            background-color: var(--btn-dark-bg);
            color: var(--btn-dark-text);
            border: none;
            padding: 10px 18px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn-pill:hover { opacity: 0.9; }

        /* Search input bar */
        .search-container {
            position: relative;
            max-width: 360px;
            margin-bottom: 24px;
        }
        .search-container svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            fill: none;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
        }
        .search-input:focus { border-color: var(--text-secondary); }

        /* Drag & Drop Surface */
        .drag-overlay {
            position: fixed;
            inset: 0;
            background: rgba(16, 163, 127, 0.08);
            border: 2px dashed var(--accent);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }
        .drag-overlay.active { display: flex; }
        .drag-overlay-card {
            background: var(--surface-color);
            padding: 24px 36px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Table Layout */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .table-head {
            display: grid;
            grid-template-columns: 3.2fr 1.8fr 1.5fr 1.8fr 40px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .table-row {
            display: grid;
            grid-template-columns: 3.2fr 1.8fr 1.5fr 1.8fr 40px;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            transition: background-color 0.15s;
        }
        .table-row:hover { background-color: var(--hover-bg); }

        .file-title-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-icon-box {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--hover-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--text-secondary);
        }
        .file-icon-box svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; }

        .file-info-col {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .file-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }
        .file-subtext {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .badge-access {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 3-Dots Dropdown */
        .actions-cell { position: relative; text-align: right; }
        .btn-dots {
            background: none;
            border: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-dots:hover { color: var(--text-primary); background: var(--border-color); }
        .btn-dots svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        .action-dropdown {
            position: absolute;
            right: 0;
            top: 32px;
            background: var(--surface-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            border-radius: 12px;
            width: 180px;
            padding: 6px 0;
            z-index: 100;
            display: none;
        }
        .action-dropdown.active { display: block; }
        .dropdown-item {
            padding: 9px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .dropdown-item:hover { background: var(--hover-bg); }
        .dropdown-item.danger { color: var(--danger); }
        .dropdown-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

        /* Modals */
        .modal-shade {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 16px;
        }
        .modal-shade.active { visibility: visible; opacity: 1; }

        .modal-box {
            background: var(--surface-color);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 28px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .modal-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .clean-input {
            width: 100%;
            padding: 11px 14px;
            background: var(--hover-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        .clean-input:focus { border-color: var(--text-secondary); }

        .user-access-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        /* Toast Feedback */
        .toast-popup {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 9999px;
            font-size: 13px;
            display: none;
            z-index: 2000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* Detail List styling */
        .details-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
        }
        .details-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .details-label { color: var(--text-secondary); }
        .details-val { font-weight: 500; text-align: right; max-width: 260px; overflow-wrap: break-word; }

        /* Responsive view for Mobile */
        @media (max-width: 768px) {
            aside.sidebar { display: none; }
            main.content-area { padding: 20px 16px; width: 100%; }
            .table-head { display: none; }
            /* Mobile: Only Icon/Name, Update Date and 3 dots */
            .table-row {
                grid-template-columns: 1fr auto 32px;
                gap: 12px;
                padding: 12px 0;
            }
            .cell-uploader, .cell-format { display: none; }
            .cell-date { font-size: 12px; color: var(--text-secondary); }
            .modal-box { padding: 20px; border-radius: 16px; }
        }
    </style>
</head>
<body>

<!-- Workspace Sidebar -->
<aside class="sidebar">
    <div class="side-icon active" title="Cloud Drive">
        <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <div class="side-icon" id="logoutSideBtn" title="Sign Out">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </div>
</aside>

<!-- Drag Overlay -->
<div class="drag-overlay" id="dragOverlay">
    <div class="drag-overlay-card">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span>Drop files here to upload</span>
    </div>
</div>

<!-- Main Area -->
<main class="content-area">
    <div class="top-row">
        <div class="page-title" id="breadcrumbArea">
            <span>Cloud Drive</span>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-pill" id="uploadTriggerBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Upload
            </button>
            <button class="btn-pill" id="newFolderTriggerBtn" style="background: var(--hover-bg); color: var(--text-primary);">
                + Folder
            </button>
        </div>
    </div>

    <!-- Hidden Native Multiple File Input -->
    <input type="file" id="nativeFileInput" multiple style="display: none;">

    <div class="search-container">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search Cloud Drive">
    </div>

    <!-- Files & Folders Table -->
    <div class="data-table">
        <div class="table-head">
            <div>Name</div>
            <div class="cell-uploader">Owner</div>
            <div class="cell-format">Format</div>
            <div class="cell-date">Updated</div>
            <div></div>
        </div>
        <div id="tableContent">
            <div style="padding: 24px 0; color: var(--text-secondary); font-size: 14px;">Loading Cloud Drive...</div>
        </div>
    </div>
</main>

<!-- Modal: Manage Access -->
<div class="modal-shade" id="accessModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Manage Access</div>
            <button class="modal-close" id="closeAccessModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="input-group">
            <label>Invite User</label>
            <div style="display: flex; gap: 8px;">
                <input type="email" id="inviteEmailInput" class="clean-input" placeholder="user@example.com">
                <select id="inviteRoleSelect" class="clean-input" style="width: 170px;">
                    <option value="Editor">Editor</option>
                    <option value="Viewer">Viewer</option>
                    <option value="Commenter">Commenter</option>
                    <option value="Transfer">Transfer Ownership</option>
                </select>
                <button class="btn-pill" id="btnAddAccess" style="padding: 0 16px;">Add</button>
            </div>
        </div>
        <div class="input-group">
            <label>Collaborators with Access</label>
            <div id="accessListContainer" style="max-height: 180px; overflow-y: auto;"></div>
        </div>
        <div style="display: flex; justify-content: flex-end; margin-top: 18px;">
            <button class="btn-pill" id="btnSaveAccess">Save Changes</button>
        </div>
    </div>
</div>

<!-- Modal: Share & Format Conversion -->
<div class="modal-shade" id="shareModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">Share Item</div>
            <button class="modal-close" id="closeShareModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="input-group">
            <label>Choose Share Format</label>
            <select id="shareFormatChoice" class="clean-input">
                <option value="url">Share as Web Link (URL)</option>
                <option value="image">Share as Image File</option>
                <option value="pdf">Convert Image to PDF & Share (.pdf)</option>
            </select>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn-pill" id="btnExecuteShare" style="flex: 1; justify-content: center;">Share via Device</button>
            <button class="btn-pill" id="btnCopyShareLink" style="background: var(--hover-bg); color: var(--text-primary);">Copy Link</button>
        </div>
    </div>
</div>

<!-- Modal: Details -->
<div class="modal-shade" id="detailsModal">
    <div class="modal-box" style="max-width: 420px;">
        <div class="modal-header">
            <div class="modal-title">Item Details</div>
            <button class="modal-close" id="closeDetailsModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="details-grid" id="detailsContent"></div>
    </div>
</div>

<!-- Modal: Move / Organise -->
<div class="modal-shade" id="moveModal">
    <div class="modal-box" style="max-width: 420px;">
        <div class="modal-header">
            <div class="modal-title" id="moveModalTitle">Move Item</div>
            <button class="modal-close" id="closeMoveModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="input-group">
            <label>Select Destination Folder</label>
            <select id="moveDestinationSelect" class="clean-input"></select>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
            <button class="btn-pill" id="btnConfirmMove">Move Here</button>
        </div>
    </div>
</div>

<!-- Modal: Rename -->
<div class="modal-shade" id="renameModal">
    <div class="modal-box" style="max-width: 400px;">
        <div class="modal-header">
            <div class="modal-title">Rename</div>
            <button class="modal-close" id="closeRenameModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="input-group">
            <label>New Name</label>
            <input type="text" id="renameInput" class="clean-input">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-pill" id="btnSubmitRename">Rename</button>
        </div>
    </div>
</div>

<!-- Modal: Create Folder -->
<div class="modal-shade" id="folderModal">
    <div class="modal-box" style="max-width: 400px;">
        <div class="modal-header">
            <div class="modal-title">New Folder</div>
            <button class="modal-close" id="closeFolderModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="input-group">
            <label>Folder Name</label>
            <input type="text" id="newFolderName" class="clean-input" placeholder="e.g. Finance, Projects">
        </div>
        <div class="input-group">
            <label>Folder Password (Optional)</label>
            <input type="text" id="newFolderPassword" class="clean-input" placeholder="Optional protection">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-pill" id="btnCreateFolder">Create</button>
        </div>
    </div>
</div>

<!-- Modal: Password Auth -->
<div class="modal-shade" id="passwordAuthModal">
    <div class="modal-box" style="max-width: 360px;">
        <div class="modal-header">
            <div class="modal-title">Password Required</div>
            <button class="modal-close" id="closePassModal">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="input-group">
            <input type="password" id="authPasswordInput" class="clean-input" placeholder="Enter password to open">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn-pill" id="btnSubmitAuth">Unlock</button>
        </div>
    </div>
</div>

<div class="toast-popup" id="toastPopup"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getFirestore, collection, query, where, getDocs, or,
        doc, updateDoc, deleteDoc, addDoc, arrayUnion, arrayRemove 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // Firebase Configuration matching Cloud-Computer project
    const firebaseConfig = {
        apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
        authDomain: "cloud-computer-4891a.firebaseapp.com",
        projectId: "cloud-computer-4891a",
        storageBucket: "cloud-computer-4891a.firebasestorage.app",
        messagingSenderId: "744203234287",
        appId: "1:744203234287:web:81d943ae9b75fd77dce41a"
    };

    const IMGBB_API_KEY = "80c452b9a4b80f240ada316f23078d2c";
    const UPLOADCARE_PUB_KEY = "demopublickey";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Auth verification
    let currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('active_user')); } catch(e){}
    if (!currentUser || !currentUser.Email) {
        window.location.href = "1.html";
    }
    const userEmail = currentUser.Email;

    document.getElementById('logoutSideBtn').addEventListener('click', () => {
        localStorage.removeItem('active_user');
        window.location.href = "1.html";
    });

    // Helper: Toast
    function showToast(msg) {
        const t = document.getElementById('toastPopup');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 2600);
    }

    // Helper: Formatted Date/Time e.g., "12:40:00 PM , 1-OCT-2026"
    function formatFirestoreDate() {
        const d = new Date();
        const timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
        const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
        return `${timeStr} , ${d.getDate()}-${months[d.getMonth()]}-${d.getFullYear()}`;
    }

    // SVG Registry
    const SVG_ICONS = {
        folder: `<svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`,
        image: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`,
        pdf: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>`,
        doc: `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`,
        video: `<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>`,
        dots: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>`,
        trash: `<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`,
        share: `<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>`,
        download: `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`,
        edit: `<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
        users: `<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`,
        move: `<svg viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>`,
        info: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`
    };

    function getFormatInfo(typeStr, isFolder) {
        if (isFolder) return { label: "Folder", icon: SVG_ICONS.folder };
        const t = (typeStr || "").toLowerCase();
        if (t.includes("img") || t.includes("png") || t.includes("jpg") || t.includes("jpeg") || t.includes("image")) return { label: "Image", icon: SVG_ICONS.image };
        if (t.includes("pdf")) return { label: "PDF", icon: SVG_ICONS.pdf };
        if (t.includes("mp4") || t.includes("mkv") || t.includes("video")) return { label: "Video", icon: SVG_ICONS.video };
        return { label: "Document", icon: SVG_ICONS.doc };
    }

    // State Variables for Nested Folders
    let folderHierarchy = []; // Stack of { id, name }
    let allWorkspaceDocs = [];
    let allFolderDocs = [];

    function getCurrentFolderId() {
        return folderHierarchy.length > 0 ? folderHierarchy[folderHierarchy.length - 1].id : null;
    }

    function renderBreadcrumb() {
        const area = document.getElementById('breadcrumbArea');
        if (folderHierarchy.length === 0) {
            area.innerHTML = `<span>Cloud Drive</span>`;
        } else {
            let html = `<span style="color: var(--text-secondary); cursor: pointer;" id="bc-root">Cloud Drive</span>`;
            folderHierarchy.forEach((item, index) => {
                html += ` <span style="color: var(--text-secondary); font-weight: 400;">/</span> `;
                if (index === folderHierarchy.length - 1) {
                    html += `<span>${item.name}</span>`;
                } else {
                    html += `<span style="color: var(--text-secondary); cursor: pointer;" class="bc-crumb" data-idx="${index}">${item.name}</span>`;
                }
            });
            area.innerHTML = html;

            document.getElementById('bc-root')?.addEventListener('click', () => {
                folderHierarchy = [];
                loadDrive();
            });
            document.querySelectorAll('.bc-crumb').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.getAttribute('data-idx'));
                    folderHierarchy = folderHierarchy.slice(0, idx + 1);
                    loadDrive();
                });
            });
        }
    }

    // Primary Database Fetch
    async function loadDrive() {
        renderBreadcrumb();
        const container = document.getElementById('tableContent');
        container.innerHTML = `<div style="padding: 24px 0; color: var(--text-secondary); font-size: 14px;">Loading items...</div>`;

        try {
            const q = query(
                collection(db, "Cloud Drive"),
                or(
                    where("Email", "==", userEmail),
                    where("Access.Viewer", "array-contains", userEmail),
                    where("Access.Commenter", "array-contains", userEmail),
                    where("Access.Editor", "array-contains", userEmail)
                )
            );

            const snap = await getDocs(q);
            const items = [];
            snap.forEach(docSnap => {
                items.push({ id: docSnap.id, ...docSnap.data() });
            });

            allWorkspaceDocs = items;
            allFolderDocs = items.filter(d => d.Folder === "True");
            container.innerHTML = "";

            const currId = getCurrentFolderId();
            let renderItems = [];

            if (!currId) {
                // Root: items not nested in any folder's File array
                const assignedChildIds = new Set();
                allFolderDocs.forEach(f => {
                    if (Array.isArray(f.File)) f.File.forEach(id => assignedChildIds.add(id));
                });
                renderItems = items.filter(i => !assignedChildIds.has(i.id));
            } else {
                // Nested Folder: items specified in active folder's File array
                const activeFolder = allFolderDocs.find(f => f.id === currId);
                const assignedIds = (activeFolder && Array.isArray(activeFolder.File)) ? activeFolder.File : [];
                renderItems = items.filter(i => assignedIds.includes(i.id));
            }

            if (renderItems.length === 0) {
                container.innerHTML = `<div style="padding: 32px 0; color: var(--text-secondary); font-size: 14px;">No files or folders found here.</div>`;
                return;
            }

            // Render folders first, then files
            renderItems.sort((a, b) => (b.Folder === "True" ? 1 : 0) - (a.Folder === "True" ? 1 : 0));
            renderItems.forEach(item => renderRow(item));
        } catch(e) {
            console.error(e);
            container.innerHTML = `<div style="padding: 20px 0; color: var(--danger);">Failed to load Cloud Drive.</div>`;
        }
    }

    function renderRow(item) {
        const container = document.getElementById('tableContent');
        const isFolder = item.Folder === "True";
        const name = item.Name || (item.File ? item.File.split('/').pop() : 'Untitled');
        const format = getFormatInfo(item.Type, isFolder);
        const updated = item.Updated || "Recently";
        const ownerEmail = item.Email || userEmail;

        const row = document.createElement('div');
        row.className = 'table-row';
        row.innerHTML = `
            <div class="file-title-cell">
                <div class="file-icon-box">${format.icon}</div>
                <div class="file-info-col">
                    <span class="file-name" title="${name}">${name}</span>
                    <span class="file-subtext">${item.Password ? '🔒 Protected' : ''}</span>
                </div>
            </div>
            <div class="cell-uploader" style="font-size: 13px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${ownerEmail}</div>
            <div class="cell-format" style="font-size: 13px; color: var(--text-secondary);">${format.label}</div>
            <div class="cell-date" style="font-size: 13px; color: var(--text-secondary);">${updated}</div>
            <div class="actions-cell">
                <button class="btn-dots">${SVG_ICONS.dots}</button>
                <div class="action-dropdown">
                    <div class="dropdown-item opt-download">${SVG_ICONS.download} Download</div>
                    <div class="dropdown-item opt-rename">${SVG_ICONS.edit} Rename</div>
                    ${!isFolder ? `<div class="dropdown-item opt-share">${SVG_ICONS.share} Share</div>` : ''}
                    <div class="dropdown-item opt-access">${SVG_ICONS.users} Manage Access</div>
                    <div class="dropdown-item opt-move">${SVG_ICONS.move} ${isFolder ? 'Organise' : 'Move'}</div>
                    <div class="dropdown-item opt-details">${SVG_ICONS.info} Details</div>
                    <div class="dropdown-item danger opt-delete">${SVG_ICONS.trash} Delete</div>
                </div>
            </div>
        `;

        const dotsBtn = row.querySelector('.btn-dots');
        const dropdown = row.querySelector('.action-dropdown');

        dotsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.action-dropdown').forEach(d => d !== dropdown && d.classList.remove('active'));
            dropdown.classList.toggle('active');
        });

        // Open item
        row.querySelector('.file-name').addEventListener('click', () => {
            if (item.Password) {
                promptPasswordAuth(item.Password, () => openItem(item, isFolder, name));
            } else {
                openItem(item, isFolder, name);
            }
        });

        // Action Handlers
        row.querySelector('.opt-download').addEventListener('click', () => handleDownload(item));
        row.querySelector('.opt-rename').addEventListener('click', () => openRenameModal(item));
        if (!isFolder) {
            row.querySelector('.opt-share').addEventListener('click', () => openShareModal(item));
        }
        row.querySelector('.opt-access').addEventListener('click', () => openAccessModal(item));
        row.querySelector('.opt-move').addEventListener('click', () => openMoveModal(item));
        row.querySelector('.opt-details').addEventListener('click', () => openDetailsModal(item));
        row.querySelector('.opt-delete').addEventListener('click', () => handleDelete(item));

        container.appendChild(row);
    }

    function openItem(item, isFolder, name) {
        if (isFolder) {
            folderHierarchy.push({ id: item.id, name: name });
            loadDrive();
        } else {
            // Update LastOpened
            updateDoc(doc(db, "Cloud Drive", item.id), {
                LastOpened: new Date().toISOString(),
                LastOpenedBy: userEmail
            }).catch(() => {});
            window.open(item.File, '_blank');
        }
    }

    // Dismiss Dropdowns
    window.addEventListener('click', () => {
        document.querySelectorAll('.action-dropdown').forEach(d => d.classList.remove('active'));
    });

    // 1. Password Prompt Modal
    const passModal = document.getElementById('passwordAuthModal');
    let passSuccessCallback = null;
    let expectedPass = "";

    function promptPasswordAuth(password, onSuccess) {
        expectedPass = password;
        passSuccessCallback = onSuccess;
        document.getElementById('authPasswordInput').value = "";
        passModal.classList.add('active');
    }
    document.getElementById('closePassModal').addEventListener('click', () => passModal.classList.remove('active'));
    document.getElementById('btnSubmitAuth').addEventListener('click', () => {
        const val = document.getElementById('authPasswordInput').value;
        if (val === expectedPass) {
            passModal.classList.remove('active');
            if (passSuccessCallback) passSuccessCallback();
        } else {
            showToast("Incorrect password!");
        }
    });

    // 2. Download Action
    function handleDownload(item) {
        if (item.Folder === "True") {
            showToast("Preparing folder metadata...");
            const folderInfo = JSON.stringify(item, null, 2);
            const blob = new Blob([folderInfo], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `${item.Name || 'Folder'}_data.json`;
            a.click();
        } else {
            const a = document.createElement("a");
            a.href = item.File;
            a.download = item.Name || "download";
            a.target = "_blank";
            a.click();
            showToast("Download started");
        }
    }

    // 3. Rename Modal
    let targetRenameItem = null;
    const renameModal = document.getElementById('renameModal');
    function openRenameModal(item) {
        targetRenameItem = item;
        document.getElementById('renameInput').value = item.Name || '';
        renameModal.classList.add('active');
    }
    document.getElementById('closeRenameModal').addEventListener('click', () => renameModal.classList.remove('active'));
    document.getElementById('btnSubmitRename').addEventListener('click', async () => {
        const newName = document.getElementById('renameInput').value.trim();
        if (newName && targetRenameItem) {
            await updateDoc(doc(db, "Cloud Drive", targetRenameItem.id), {
                Name: newName,
                Updated: formatFirestoreDate()
            });
            showToast("Renamed successfully");
            renameModal.classList.remove('active');
            loadDrive();
        }
    });

    // 4. Details Modal
    const detailsModal = document.getElementById('detailsModal');
    function openDetailsModal(item) {
        const isFolder = item.Folder === "True";
        const format = getFormatInfo(item.Type, isFolder);
        const locationPath = folderHierarchy.length > 0 ? folderHierarchy.map(h => h.name).join(' / ') : 'Root Directory';

        const content = document.getElementById('detailsContent');
        content.innerHTML = `
            <div class="details-item"><span class="details-label">Name</span><span class="details-val">${item.Name || 'Untitled'}</span></div>
            <div class="details-item"><span class="details-label">Type</span><span class="details-val">${format.label}</span></div>
            <div class="details-item"><span class="details-label">Date (Updated)</span><span class="details-val">${item.Updated || 'N/A'}</span></div>
            <div class="details-item"><span class="details-label">Location</span><span class="details-val">${locationPath}</span></div>
            <div class="details-item"><span class="details-label">Owner</span><span class="details-val">${item.Email || userEmail}</span></div>
        `;
        detailsModal.classList.add('active');
    }
    document.getElementById('closeDetailsModal').addEventListener('click', () => detailsModal.classList.remove('active'));

    // 5. Manage Access Modal
    const accessModal = document.getElementById('accessModal');
    let targetAccessItem = null;
    let localAccessState = { Viewer: [], Commenter: [], Editor: [] };

    function openAccessModal(item) {
        targetAccessItem = item;
        const access = item.Access || {};
        localAccessState = {
            Viewer: [...(access.Viewer || [])],
            Commenter: [...(access.Commenter || access.Commentator || [])],
            Editor: [...(access.Editor || [])]
        };
        renderAccessList();
        accessModal.classList.add('active');
    }

    document.getElementById('closeAccessModal').addEventListener('click', () => accessModal.classList.remove('active'));

    function renderAccessList() {
        const c = document.getElementById('accessListContainer');
        c.innerHTML = `
            <div class="user-access-row">
                <span>${targetAccessItem.Email || userEmail} <strong>(Owner)</strong></span>
                <span style="font-size: 12px; color: var(--accent); font-weight:600;">Owner</span>
            </div>
        `;
        ['Editor', 'Viewer', 'Commenter'].forEach(role => {
            localAccessState[role].forEach((email, idx) => {
                const div = document.createElement('div');
                div.className = 'user-access-row';
                div.innerHTML = `
                    <span>${email}</span>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span style="font-size: 11px; color: var(--text-secondary);">${role}</span>
                        <span style="cursor: pointer; color: var(--danger); font-size:16px;" data-role="${role}" data-idx="${idx}">&times;</span>
                    </div>
                `;
                div.querySelector('span[data-role]').addEventListener('click', () => {
                    localAccessState[role].splice(idx, 1);
                    renderAccessList();
                });
                c.appendChild(div);
            });
        });
    }

    document.getElementById('btnAddAccess').addEventListener('click', async () => {
        const email = document.getElementById('inviteEmailInput').value.trim();
        const role = document.getElementById('inviteRoleSelect').value;
        if (!email) return;

        if (role === 'Transfer') {
            if (confirm(`Transfer full ownership to ${email}? You will no longer be the owner.`)) {
                await updateDoc(doc(db, "Cloud Drive", targetAccessItem.id), {
                    Email: email,
                    Access: { Viewer: [], Commenter: [], Editor: [] },
                    Updated: formatFirestoreDate()
                });
                showToast("Ownership transferred");
                accessModal.classList.remove('active');
                loadDrive();
            }
            return;
        }

        ['Viewer', 'Commenter', 'Editor'].forEach(r => {
            localAccessState[r] = localAccessState[r].filter(e => e !== email);
        });
        localAccessState[role].push(email);
        document.getElementById('inviteEmailInput').value = "";
        renderAccessList();
    });

    document.getElementById('btnSaveAccess').addEventListener('click', async () => {
        if (!targetAccessItem) return;
        await updateDoc(doc(db, "Cloud Drive", targetAccessItem.id), { 
            Access: localAccessState,
            Updated: formatFirestoreDate()
        });
        showToast("Permissions updated");
        accessModal.classList.remove('active');
        loadDrive();
    });

    // 6. Share & Convert to PDF
    const shareModal = document.getElementById('shareModal');
    let targetShareItem = null;

    function openShareModal(item) {
        targetShareItem = item;
        shareModal.classList.add('active');
    }
    document.getElementById('closeShareModal').addEventListener('click', () => shareModal.classList.remove('active'));

    document.getElementById('btnExecuteShare').addEventListener('click', async () => {
        if (!targetShareItem) return;
        const choice = document.getElementById('shareFormatChoice').value;

        if (choice === 'pdf') {
            showToast("Converting to PDF...");
            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF();
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = targetShareItem.File;
                img.onload = async () => {
                    pdf.addImage(img, 'JPEG', 15, 20, 180, 160);
                    const blob = pdf.output('blob');
                    const file = new File([blob], `${targetShareItem.Name || 'Document'}.pdf`, { type: 'application/pdf' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: targetShareItem.Name });
                    } else {
                        pdf.save(`${targetShareItem.Name || 'Document'}.pdf`);
                        showToast("PDF downloaded");
                    }
                };
            } catch(e) {
                showToast("Conversion failed, sharing URL");
                navigator.share ? navigator.share({ title: targetShareItem.Name, url: targetShareItem.File }) : null;
            }
        } else if (choice === 'image' && navigator.canShare) {
            try {
                const res = await fetch(targetShareItem.File);
                const blob = await res.blob();
                const file = new File([blob], targetShareItem.Name || "image.png", { type: blob.type });
                await navigator.share({ files: [file], title: targetShareItem.Name });
            } catch(e) {
                if (navigator.share) await navigator.share({ title: targetShareItem.Name, url: targetShareItem.File });
            }
        } else {
            if (navigator.share) {
                await navigator.share({ title: targetShareItem.Name, url: targetShareItem.File });
            } else {
                navigator.clipboard.writeText(targetShareItem.File);
                showToast("Link copied to clipboard");
            }
        }
    });

    document.getElementById('btnCopyShareLink').addEventListener('click', () => {
        if (targetShareItem && targetShareItem.File) {
            navigator.clipboard.writeText(targetShareItem.File).then(() => showToast("Link copied"));
        }
    });

    // 7. Move / Organise Modal
    const moveModal = document.getElementById('moveModal');
    let targetMoveItem = null;

    function openMoveModal(item) {
        targetMoveItem = item;
        const select = document.getElementById('moveDestinationSelect');
        document.getElementById('moveModalTitle').innerText = item.Folder === "True" ? "Organise Folder" : "Move File";
        select.innerHTML = `<option value="root">Root Directory</option>`;
        
        // Exclude current item if it's a folder to prevent moving into itself
        allFolderDocs.forEach(f => {
            if (f.id !== item.id) {
                select.innerHTML += `<option value="${f.id}">${f.Name || 'Untitled Folder'}</option>`;
            }
        });
        moveModal.classList.add('active');
    }
    document.getElementById('closeMoveModal').addEventListener('click', () => moveModal.classList.remove('active'));

    document.getElementById('btnConfirmMove').addEventListener('click', async () => {
        if (!targetMoveItem) return;
        const destFolderId = document.getElementById('moveDestinationSelect').value;

        // Remove from any current parent folder
        for (const f of allFolderDocs) {
            if (Array.isArray(f.File) && f.File.includes(targetMoveItem.id)) {
                await updateDoc(doc(db, "Cloud Drive", f.id), {
                    File: arrayRemove(targetMoveItem.id),
                    Updated: formatFirestoreDate()
                });
            }
        }

        // Add to new folder if not root
        if (destFolderId !== "root") {
            await updateDoc(doc(db, "Cloud Drive", destFolderId), {
                File: arrayUnion(targetMoveItem.id),
                Updated: formatFirestoreDate()
            });
        }

        showToast("Item moved successfully");
        moveModal.classList.remove('active');
        loadDrive();
    });

    // 8. Delete Action
    async function handleDelete(item) {
        if (confirm(`Permanently delete "${item.Name || 'item'}"?`)) {
            // Remove from parent folders' File list if any
            for (const f of allFolderDocs) {
                if (Array.isArray(f.File) && f.File.includes(item.id)) {
                    await updateDoc(doc(db, "Cloud Drive", f.id), {
                        File: arrayRemove(item.id)
                    });
                }
            }
            await deleteDoc(doc(db, "Cloud Drive", item.id));
            showToast("Item deleted");
            loadDrive();
        }
    }

    // 9. Create Folder Modal (supports nested folders)
    const folderModal = document.getElementById('folderModal');
    document.getElementById('newFolderTriggerBtn').addEventListener('click', () => {
        document.getElementById('newFolderName').value = "";
        document.getElementById('newFolderPassword').value = "";
        folderModal.classList.add('active');
    });
    document.getElementById('closeFolderModal').addEventListener('click', () => folderModal.classList.remove('active'));

    document.getElementById('btnCreateFolder').addEventListener('click', async () => {
        const name = document.getElementById('newFolderName').value.trim();
        const pass = document.getElementById('newFolderPassword').value.trim();
        if (name) {
            const newDoc = await addDoc(collection(db, "Cloud Drive"), {
                Email: userEmail,
                Folder: "True",
                Name: name,
                Password: pass,
                File: [],
                Customize: { Colour: "Red" },
                Updated: formatFirestoreDate(),
                Access: { Viewer: [], Commenter: [], Editor: [] }
            });

            const currFolderId = getCurrentFolderId();
            if (currFolderId) {
                await updateDoc(doc(db, "Cloud Drive", currFolderId), {
                    File: arrayUnion(newDoc.id),
                    Updated: formatFirestoreDate()
                });
            }

            folderModal.classList.remove('active');
            showToast("Folder created");
            loadDrive();
        }
    });

    // 10. File Upload (Native & Drag/Drop)
    const nativeFileInput = document.getElementById('nativeFileInput');
    document.getElementById('uploadTriggerBtn').addEventListener('click', () => nativeFileInput.click());
    nativeFileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleBatchUpload(e.target.files);
    });

    const dragOverlay = document.getElementById('dragOverlay');
    window.addEventListener('dragover', (e) => {
        e.preventDefault();
        dragOverlay.classList.add('active');
    });
    window.addEventListener('dragleave', (e) => {
        if (e.clientX === 0 && e.clientY === 0) dragOverlay.classList.remove('active');
    });
    window.addEventListener('drop', (e) => {
        e.preventDefault();
        dragOverlay.classList.remove('active');
        if (e.dataTransfer.files.length) handleBatchUpload(e.dataTransfer.files);
    });

    async function handleBatchUpload(files) {
        showToast(`Uploading ${files.length} file(s)...`);
        for (const file of files) {
            if (file.size > 50 * 1024 * 1024) {
                showToast(`Skipped ${file.name} (exceeds 50MB)`);
                continue;
            }

            try {
                let fileUrl = "";
                let fileType = "Document";

                if (file.type.startsWith('image/')) {
                    const fd = new FormData();
                    fd.append('image', file);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = j.data.url;
                    fileType = "Image";
                } else {
                    const fd = new FormData();
                    fd.append('UPLOADCARE_PUB_KEY', UPLOADCARE_PUB_KEY);
                    fd.append('UPLOADCARE_STORE', '1');
                    fd.append('file', file);
                    const res = await fetch('https://upload.uploadcare.com/base/', { method: 'POST', body: fd });
                    const j = await res.json();
                    fileUrl = `https://ucarecdn.com/${j.file}/${encodeURIComponent(file.name)}`;
                    const ext = file.name.split('.').pop()?.toUpperCase();
                    fileType = ext || "Document";
                }

                const newDoc = await addDoc(collection(db, "Cloud Drive"), {
                    Email: userEmail,
                    File: fileUrl,
                    Type: fileType,
                    Name: file.name,
                    Password: "",
                    LastOpened: new Date().toISOString(),
                    LastOpenedBy: userEmail,
                    Updated: formatFirestoreDate(),
                    Access: { Viewer: [], Commenter: [], Editor: [] }
                });

                const currFolderId = getCurrentFolderId();
                if (currFolderId) {
                    await updateDoc(doc(db, "Cloud Drive", currFolderId), {
                        File: arrayUnion(newDoc.id),
                        Updated: formatFirestoreDate()
                    });
                }
            } catch(err) {
                console.error("Upload error:", err);
            }
        }
        showToast("Upload completed!");
        loadDrive();
    }

    // Search Filter
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.table-row').forEach(row => {
            const name = row.querySelector('.file-name').innerText.toLowerCase();
            row.style.display = name.includes(val) ? 'grid' : 'none';
        });
    });

    // Initial Load
    loadDrive();
</script>
</body>
</html>
