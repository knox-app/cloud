<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cloud Drive — Media Editor & Viewer</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase v10 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glassmorphism {
      background: rgba(18, 18, 20, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
    }
    .crop-handle {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #6366f1;
      border: 2px solid white;
      border-radius: 50%;
    }
  </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col justify-between">

  <!-- ================= TOP BAR ================= -->
  <header class="fixed top-0 inset-x-0 z-30 flex items-center justify-between px-4 py-3 glassmorphism border-b border-white/10 transition-all">
    <div class="flex items-center gap-3">
      <button onclick="window.history.back()" class="p-2 rounded-full hover:bg-white/10 active:scale-95 transition">
        <i data-lucide="arrow-left" class="w-5 h-5 text-white"></i>
      </button>
      <div>
        <h1 id="doc-id-title" class="text-sm font-semibold tracking-wide truncate max-w-[180px] sm:max-w-xs">Loading...</h1>
        <p id="doc-email" class="text-xs text-zinc-400 truncate max-w-[180px] sm:max-w-xs"></p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span id="save-status" class="hidden text-xs bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-full animate-pulse">Syncing...</span>
    </div>
  </header>

  <!-- ================= MAIN IMAGE DISPLAY ================= -->
  <main class="relative flex-1 flex items-center justify-center p-2 sm:p-6 overflow-hidden">
    <div id="loader" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-black/80 gap-3">
      <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs text-zinc-400 font-medium">Fetching Image...</p>
    </div>
    <div id="image-container" class="relative max-h-full max-w-full flex items-center justify-center">
      <img id="main-image" src="" alt="Viewer" class="max-h-[70vh] sm:max-h-[75vh] w-auto max-w-full object-contain rounded-xl shadow-2xl transition duration-200" />
    </div>
  </main>

  <!-- ================= SAMSUNG THUMBNAIL BAR & CONTROLS ================= -->
  <footer class="fixed bottom-0 inset-x-0 z-30 flex flex-col glassmorphism border-t border-white/10">
    <div class="px-3 pt-2 pb-1 border-b border-white/5">
      <div id="thumbnails-container" class="flex gap-2 overflow-x-auto hide-scrollbar py-1 items-center"></div>
    </div>
    <div class="flex items-center justify-around py-3 px-6 max-w-lg mx-auto w-full">
      <button id="btn-heart" class="flex flex-col items-center gap-1 group active:scale-90 transition">
        <i id="heart-icon" data-lucide="heart" class="w-6 h-6 text-zinc-400 group-hover:text-rose-500 transition"></i>
        <span class="text-[10px] text-zinc-400">Favorite</span>
      </button>
      <button id="btn-edit" class="flex flex-col items-center gap-1 group active:scale-90 transition">
        <div class="p-2 rounded-full bg-white/10 group-hover:bg-indigo-600 transition">
          <i data-lucide="sliders" class="w-5 h-5 text-white"></i>
        </div>
        <span class="text-[10px] text-zinc-300 font-medium">Edit Studio</span>
      </button>
      <button id="btn-share" class="flex flex-col items-center gap-1 group active:scale-90 transition">
        <i data-lucide="share-2" class="w-6 h-6 text-zinc-400 group-hover:text-blue-400 transition"></i>
        <span class="text-[10px] text-zinc-400">Share</span>
      </button>
      <button id="btn-delete" class="flex flex-col items-center gap-1 group active:scale-90 transition">
        <i data-lucide="trash-2" class="w-6 h-6 text-zinc-400 group-hover:text-red-500 transition"></i>
        <span class="text-[10px] text-zinc-400">Delete</span>
      </button>
    </div>
  </footer>

  <!-- ================= ADVANCED STUDIO / EDIT MODAL ================= -->
  <div id="edit-modal" class="fixed inset-0 z-50 bg-black/95 flex flex-col justify-between hidden">
    <!-- Top Action Bar -->
    <div class="flex items-center justify-between p-4 glassmorphism border-b border-white/10">
      <button id="btn-cancel-edit" class="text-sm font-medium text-zinc-400 hover:text-white px-3 py-1.5 rounded-lg">Cancel</button>
      <div class="flex items-center gap-3">
        <button id="btn-undo" title="Undo" class="p-2 text-zinc-400 hover:text-white active:scale-90"><i data-lucide="undo" class="w-5 h-5"></i></button>
        <button id="btn-delete-item" title="Delete Selected Layer" class="p-2 text-red-400 hover:text-red-300 hidden active:scale-90"><i data-lucide="trash" class="w-5 h-5"></i></button>
        <button id="btn-save-edit" class="text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-1.5 rounded-full shadow-lg active:scale-95 transition">Save & Overwrite</button>
      </div>
    </div>

    <!-- Canvas Workspace -->
    <div id="canvas-container" class="relative flex-1 flex items-center justify-center p-4 overflow-hidden select-none">
      <canvas id="editor-canvas" class="max-h-[62vh] max-w-full rounded-lg shadow-2xl bg-zinc-950 border border-white/10 touch-none cursor-crosshair"></canvas>
      
      <!-- Interactive Crop Box Overlay -->
      <div id="crop-box" class="absolute border-2 border-dashed border-indigo-400 bg-indigo-500/10 hidden pointer-events-none">
        <div class="crop-handle top-[-7px] left-[-7px]"></div>
        <div class="crop-handle top-[-7px] right-[-7px]"></div>
        <div class="crop-handle bottom-[-7px] left-[-7px]"></div>
        <div class="crop-handle bottom-[-7px] right-[-7px]"></div>
      </div>
    </div>

    <!-- Sub Controls Tray -->
    <div class="glassmorphism border-t border-white/10 p-3 flex flex-col gap-3">
      <div id="sub-tool-bar" class="flex items-center justify-center gap-3 min-h-[44px] overflow-x-auto hide-scrollbar"></div>

      <!-- Main Edit Tabs -->
      <div class="flex items-center justify-around border-t border-white/10 pt-2">
        <button class="edit-tab-btn flex flex-col items-center text-indigo-400 text-xs gap-1" data-tool="select">
          <i data-lucide="move" class="w-5 h-5"></i><span>Transform</span>
        </button>
        <button class="edit-tab-btn flex flex-col items-center text-zinc-400 hover:text-white text-xs gap-1" data-tool="crop">
          <i data-lucide="crop" class="w-5 h-5"></i><span>Crop</span>
        </button>
        <button class="edit-tab-btn flex flex-col items-center text-zinc-400 hover:text-white text-xs gap-1" data-tool="draw">
          <i data-lucide="pencil" class="w-5 h-5"></i><span>Draw</span>
        </button>
        <button class="edit-tab-btn flex flex-col items-center text-zinc-400 hover:text-white text-xs gap-1" data-tool="text">
          <i data-lucide="type" class="w-5 h-5"></i><span>Text</span>
        </button>
        <button class="edit-tab-btn flex flex-col items-center text-zinc-400 hover:text-white text-xs gap-1" data-tool="stickers">
          <i data-lucide="smile" class="w-5 h-5"></i><span>Stickers</span>
        </button>
        <button class="edit-tab-btn flex flex-col items-center text-zinc-400 hover:text-white text-xs gap-1" data-tool="filters">
          <i data-lucide="sparkles" class="w-5 h-5"></i><span>Filters</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ================= FIREBASE & APP LOGIC ================= -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
      authDomain: "cloud-computer-4891a.firebaseapp.com",
      projectId: "cloud-computer-4891a",
      storageBucket: "cloud-computer-4891a.firebasestorage.app",
      messagingSenderId: "744203234287",
      appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
      measurementId: "G-QE17C33TMN"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const COLLECTION = "Cloud Drive";

    let currentDocId = "";
    let currentData = null;
    let allDocuments = [];
    let isFavorite = false;

    const mainImg = document.getElementById("main-image");
    const loader = document.getElementById("loader");
    const docIdTitle = document.getElementById("doc-id-title");
    const docEmail = document.getElementById("doc-email");
    const thumbContainer = document.getElementById("thumbnails-container");
    const saveStatus = document.getElementById("save-status");
    const btnDeleteLayer = document.getElementById("btn-delete-item");

    lucide.createIcons();

    function getDocIdFromURL() {
      const hash = window.location.hash.replace("#", "").trim();
      return hash || "p7543LtVQA49lB6L3mvO";
    }

    async function loadAllDocuments() {
      try {
        const snap = await db.collection(COLLECTION).get();
        allDocuments = [];
        snap.forEach(doc => allDocuments.push({ id: doc.id, ...doc.data() }));
        renderThumbnails();
      } catch (err) { console.error("Error loading thumbs:", err); }
    }

    async function loadDocument(id) {
      loader.classList.remove("hidden");
      currentDocId = id;
      window.location.hash = id;

      try {
        const docRef = await db.collection(COLLECTION).doc(id).get();
        if (docRef.exists) {
          currentData = docRef.data();
          docIdTitle.textContent = id;
          docEmail.textContent = currentData.Email || "Cloud Storage";
          mainImg.src = currentData.File;
          mainImg.onload = () => loader.classList.add("hidden");
        } else {
          alert("Document not found!");
          loader.classList.add("hidden");
        }
      } catch (err) {
        console.error(err);
        loader.classList.add("hidden");
      }
      renderThumbnails();
    }

    function renderThumbnails() {
      thumbContainer.innerHTML = "";
      allDocuments.forEach(item => {
        const isActive = item.id === currentDocId;
        const thumb = document.createElement("div");
        thumb.className = `w-12 h-12 rounded-lg flex-shrink-0 overflow-hidden cursor-pointer transition-all duration-200 border ${isActive ? 'ring-2 ring-indigo-500 scale-105 opacity-100 border-indigo-400' : 'opacity-60 border-white/10 hover:opacity-100'}`;
        thumb.innerHTML = `<img src="${item.File}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/60?text=IMG'"/>`;
        thumb.onclick = () => loadDocument(item.id);
        thumbContainer.appendChild(thumb);
      });
    }

    // Favorite / Delete / Share handlers
    document.getElementById("btn-heart").onclick = () => {
      isFavorite = !isFavorite;
      document.getElementById("heart-icon").classList.toggle("text-rose-500", isFavorite);
      document.getElementById("heart-icon").classList.toggle("fill-rose-500", isFavorite);
    };

    document.getElementById("btn-delete").onclick = async () => {
      if (confirm(`Permanently delete document: ${currentDocId}?`)) {
        await db.collection(COLLECTION).doc(currentDocId).delete();
        alert("Deleted.");
        location.reload();
      }
    };

    document.getElementById("btn-share").onclick = () => {
      if (navigator.share) {
        navigator.share({ title: currentDocId, url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("URL copied to clipboard!");
      }
    };

    // ==========================================
    // ADVANCED CANVAS ENGINE WITH LAYERS & CROP
    // ==========================================
    const editModal = document.getElementById("edit-modal");
    const canvas = document.getElementById("editor-canvas");
    const ctx = canvas.getContext("2d");
    const subToolBar = document.getElementById("sub-tool-bar");

    let baseImage = new Image();
    let currentTool = "select";
    let layers = []; // Array of text & sticker items {type, text, x, y, size, color}
    let selectedLayer = null;
    let isDragging = false;
    let isDrawing = false;
    let drawColor = "#ef4444";
    let drawSize = 6;
    let activeFilter = "none";
    let cropBox = { x: 0.1, y: 0.1, w: 0.8, h: 0.8 }; // Percentages

    document.getElementById("btn-edit").onclick = () => {
      if (!currentData || !currentData.File) return;
      editModal.classList.remove("hidden");
      baseImage.crossOrigin = "anonymous";
      baseImage.src = currentData.File;
      baseImage.onload = () => {
        canvas.width = baseImage.naturalWidth;
        canvas.height = baseImage.naturalHeight;
        layers = [];
        selectedLayer = null;
        redrawCanvas();
        switchTool("select");
      };
    };

    document.getElementById("btn-cancel-edit").onclick = () => editModal.classList.add("hidden");

    function switchTool(tool) {
      currentTool = tool;
      subToolBar.innerHTML = "";
      btnDeleteLayer.classList.toggle("hidden", !selectedLayer);

      if (tool === "select") {
        subToolBar.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="text-xs text-zinc-400">Drag to move, click layer to select.</span>
            ${selectedLayer ? `<label class="text-xs text-zinc-400 flex items-center gap-1.5">Size: <input type="range" min="15" max="150" value="${selectedLayer.size}" id="layer-size-slider" class="w-24 accent-indigo-500 cursor-pointer"/></label>` : ''}
          </div>`;
        if (selectedLayer) {
          document.getElementById("layer-size-slider").oninput = (e) => {
            selectedLayer.size = parseInt(e.target.value);
            redrawCanvas();
          };
        }
      } else if (tool === "crop") {
        subToolBar.innerHTML = `
          <div class="flex items-center gap-3">
            <button onclick="applyCropBox()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-lg shadow">Apply Crop</button>
            <button onclick="resetCrop()" class="px-3 py-1.5 bg-white/10 rounded-lg text-xs">Reset</button>
          </div>`;
      } else if (tool === "draw") {
        subToolBar.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="color" id="draw-color-picker" value="${drawColor}" class="w-8 h-8 rounded-full border-none cursor-pointer bg-transparent" />
            <input type="range" id="draw-size-picker" min="2" max="50" value="${drawSize}" class="w-28 accent-indigo-500 cursor-pointer" />
          </div>`;
        document.getElementById("draw-color-picker").onchange = (e) => drawColor = e.target.value;
        document.getElementById("draw-size-picker").oninput = (e) => drawSize = parseInt(e.target.value);
      } else if (tool === "text") {
        subToolBar.innerHTML = `
          <div class="flex items-center gap-2">
            <input type="text" id="text-input-field" placeholder="Add text..." class="px-3 py-1.5 text-sm bg-white/10 rounded-lg text-white border border-white/20 outline-none w-44" />
            <input type="color" id="text-color-field" value="#ffffff" class="w-8 h-8 rounded-full cursor-pointer bg-transparent border-none"/>
            <button id="btn-create-text" class="px-3 py-1.5 bg-indigo-600 rounded-lg text-xs font-semibold">Add</button>
          </div>`;
        document.getElementById("btn-create-text").onclick = () => {
          const val = document.getElementById("text-input-field").value;
          if (val) {
            const newLayer = {
              type: "text",
              text: val,
              color: document.getElementById("text-color-field").value,
              size: 50,
              x: canvas.width / 2,
              y: canvas.height / 2
            };
            layers.push(newLayer);
            selectedLayer = newLayer;
            redrawCanvas();
            switchTool("select");
          }
        };
      } else if (tool === "stickers") {
        const stickers = ["🔥", "❤️", "✨", "👑", "🚀", "🕶️", "💯", "⭐", "🎉", "👍", "💥", "🥳"];
        subToolBar.innerHTML = stickers.map(s => `<button class="text-2xl p-1 hover:scale-125 transition sticker-btn">${s}</button>`).join("");
        document.querySelectorAll(".sticker-btn").forEach(btn => {
          btn.onclick = () => {
            const newLayer = {
              type: "emoji",
              text: btn.innerText,
              size: 80,
              x: canvas.width / 2,
              y: canvas.height / 2
            };
            layers.push(newLayer);
            selectedLayer = newLayer;
            redrawCanvas();
            switchTool("select");
          };
        });
      } else if (tool === "filters") {
        subToolBar.innerHTML = `
          <div class="flex items-center gap-2">
            <button onclick="setFilter('none')" class="px-3 py-1.5 bg-white/10 rounded-lg text-xs">Normal</button>
            <button onclick="setFilter('grayscale')" class="px-3 py-1.5 bg-white/10 rounded-lg text-xs">B&W</button>
            <button onclick="setFilter('sepia')" class="px-3 py-1.5 bg-white/10 rounded-lg text-xs">Sepia</button>
            <button onclick="setFilter('invert')" class="px-3 py-1.5 bg-white/10 rounded-lg text-xs">Invert</button>
            <button onclick="rotateImage()" class="px-3 py-1.5 bg-indigo-600/60 rounded-lg text-xs flex items-center gap-1">Rotate 90°</button>
          </div>`;
      }
      lucide.createIcons();
    }

    document.querySelectorAll(".edit-tab-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".edit-tab-btn").forEach(b => {
          b.classList.remove("text-indigo-400");
          b.classList.add("text-zinc-400");
        });
        btn.classList.remove("text-zinc-400");
        btn.classList.add("text-indigo-400");
        switchTool(btn.dataset.tool);
      };
    });

    btnDeleteLayer.onclick = () => {
      if (selectedLayer) {
        layers = layers.filter(l => l !== selectedLayer);
        selectedLayer = null;
        redrawCanvas();
        switchTool("select");
      }
    };

    function setFilter(f) {
      activeFilter = f;
      redrawCanvas();
    }

    function rotateImage() {
      const temp = document.createElement("canvas");
      temp.width = canvas.height;
      temp.height = canvas.width;
      const tCtx = temp.getContext("2d");
      tCtx.translate(temp.width / 2, temp.height / 2);
      tCtx.rotate((90 * Math.PI) / 180);
      tCtx.drawImage(baseImage, -canvas.width / 2, -canvas.height / 2);

      const rotatedImg = new Image();
      rotatedImg.onload = () => {
        baseImage = rotatedImg;
        canvas.width = baseImage.width;
        canvas.height = baseImage.height;
        redrawCanvas();
      };
      rotatedImg.src = temp.toDataURL();
    }

    // Interactive Crop Implementation
    window.applyCropBox = function() {
      const cropW = canvas.width * 0.8;
      const cropH = canvas.height * 0.8;
      const cropX = canvas.width * 0.1;
      const cropY = canvas.height * 0.1;

      const temp = document.createElement("canvas");
      temp.width = cropW;
      temp.height = cropH;
      const tCtx = temp.getContext("2d");
      tCtx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      const cropped = new Image();
      cropped.onload = () => {
        baseImage = cropped;
        canvas.width = cropW;
        canvas.height = cropH;
        layers = [];
        selectedLayer = null;
        redrawCanvas();
        switchTool("select");
      };
      cropped.src = temp.toDataURL();
    };

    window.resetCrop = () => redrawCanvas();

    function redrawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.filter = activeFilter === "grayscale" ? "grayscale(100%)" :
                   activeFilter === "sepia" ? "sepia(100%)" :
                   activeFilter === "invert" ? "invert(100%)" : "none";
      ctx.drawImage(baseImage, 0, 0, canvas.width, canvas.height);
      ctx.filter = "none";

      // Draw active layers (Text / Emoji)
      layers.forEach(l => {
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        if (l.type === "text") {
          ctx.font = `bold ${l.size}px 'Plus Jakarta Sans', sans-serif`;
          ctx.fillStyle = l.color;
          ctx.shadowColor = "rgba(0,0,0,0.8)";
          ctx.shadowBlur = 6;
          ctx.fillText(l.text, l.x, l.y);
        } else if (l.type === "emoji") {
          ctx.font = `${l.size}px sans-serif`;
          ctx.fillText(l.text, l.x, l.y);
        }

        // Bounding Selection Box for Active Element
        if (l === selectedLayer) {
          ctx.strokeStyle = "#6366f1";
          ctx.lineWidth = 3;
          ctx.setLineDash([6, 6]);
          const metric = ctx.measureText(l.text);
          const w = metric.width + 20;
          const h = l.size + 20;
          ctx.strokeRect(l.x - w / 2, l.y - h / 2, w, h);
        }
        ctx.restore();
      });
    }

    // Coordinate conversion
    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
    }

    // Drag, Move, Selection & Drawing Listeners
    canvas.addEventListener("mousedown", handleStart);
    canvas.addEventListener("mousemove", handleMove);
    canvas.addEventListener("mouseup", handleEnd);
    canvas.addEventListener("touchstart", handleStart);
    canvas.addEventListener("touchmove", handleMove);
    canvas.addEventListener("touchend", handleEnd);

    function handleStart(e) {
      const pos = getMousePos(e);

      if (currentTool === "draw") {
        isDrawing = true;
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      } else {
        // Selection detection
        let found = null;
        for (let i = layers.length - 1; i >= 0; i--) {
          const l = layers[i];
          const dist = Math.hypot(l.x - pos.x, l.y - pos.y);
          if (dist < l.size) {
            found = l;
            break;
          }
        }
        selectedLayer = found;
        if (selectedLayer) {
          isDragging = true;
          switchTool("select");
        }
        redrawCanvas();
      }
    }

    function handleMove(e) {
      const pos = getMousePos(e);
      if (isDrawing && currentTool === "draw") {
        ctx.strokeStyle = drawColor;
        ctx.lineWidth = drawSize;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (isDragging && selectedLayer) {
        selectedLayer.x = pos.x;
        selectedLayer.y = pos.y;
        redrawCanvas();
      }
    }

    function handleEnd() {
      isDrawing = false;
      isDragging = false;
    }

    // ========================================================
    // SAVE & OVERWRITE OLD VERSION DIRECTLY IN FIRESTORE
    // ========================================================
    document.getElementById("btn-save-edit").onclick = async () => {
      try {
        selectedLayer = null;
        redrawCanvas();

        saveStatus.classList.remove("hidden");
        const newImageData = canvas.toDataURL("image/jpeg", 0.92);

        // Overwrites the document field in Firestore with the new version
        await db.collection(COLLECTION).doc(currentDocId).update({
          File: newImageData,
          UpdatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Update local views
        mainImg.src = newImageData;
        currentData.File = newImageData;
        
        // Refresh thumbnail cache
        const target = allDocuments.find(d => d.id === currentDocId);
        if (target) target.File = newImageData;
        renderThumbnails();

        editModal.classList.add("hidden");
        saveStatus.classList.add("hidden");
        alert("Success: Old image replaced with new edited version!");
      } catch (err) {
        saveStatus.classList.add("hidden");
        alert("Failed to overwrite database: " + err.message);
      }
    };

    window.addEventListener("hashchange", () => loadDocument(getDocIdFromURL()));
    window.addEventListener("DOMContentLoaded", () => {
      loadAllDocuments();
      loadDocument(getDocIdFromURL());
    });
  </script>
</body>
</html>
