<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Drive Viewer</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0b0b0d;
            --surface-color: rgba(26, 26, 30, 0.85);
            --text-primary: #ffffff;
            --text-secondary: #9e9ea7;
            --accent-color: #2196f3;
            --danger-color: #ff5252;
            --overlay-bg: rgba(0, 0, 0, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            z-index: 50;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .top-bar .info-group {
            display: flex;
            flex-direction: column;
            margin-left: 12px;
            overflow: hidden;
        }

        .info-group .title {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .info-group .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .icon-btn:active { background: rgba(255, 255, 255, 0.15); }
        .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Main Viewport */
        .viewer-container {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: pan-y;
        }

        /* View Media Elements */
        .media-content {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        video.media-content {
            outline: none;
            border-radius: 8px;
            max-height: 80vh;
            width: 90vw;
            max-width: 1000px;
        }

        iframe.media-content {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* Generic File Card (EXE, DOCX Fallback, Zip, etc.) */
        .file-card-preview {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .file-card-preview .file-icon {
            width: 72px;
            height: 72px;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .file-card-preview h2 {
            font-size: 18px;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .file-card-preview p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        /* Bottom Controls Bar (Samsung Gallery style) */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 70%, rgba(0,0,0,0) 100%);
            padding-bottom: env(safe-area-inset-bottom, 16px);
            z-index: 50;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Filmstrip */
        .filmstrip-container {
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .filmstrip-container::-webkit-scrollbar { display: none; }

        .thumb {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
            transition: opacity 0.2s, transform 0.2s, border 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
            flex-shrink: 0;
            overflow: hidden;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb.active {
            opacity: 1;
            transform: scale(1.08);
            border-color: var(--accent-color);
        }

        .actions-group {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 480px;
            padding: 8px 0;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-primary);
            font-size: 11px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .action-item span { color: var(--text-secondary); }

        /* Hidden UI State */
        .ui-hidden .top-bar {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }

        .ui-hidden .bottom-bar {
            opacity: 0;
            transform: translateY(100%);
            pointer-events: none;
        }

        /* Modals & Dialogs */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: #1e1e24;
            width: 90%;
            max-width: 380px;
            border-radius: 24px;
            padding: 24px;
            color: #fff;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        .modal-card h2 { font-size: 20px; margin-bottom: 8px; }
        .modal-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }

        .modal-card input {
            width: 100%;
            padding: 14px;
            background: #2b2b32;
            border: 1px solid #444;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-card input:focus { border-color: var(--accent-color); }

        .modal-buttons { display: flex; gap: 12px; }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-confirm { background: var(--accent-color); color: #fff; }
        .btn-cancel { background: #333; color: #bbb; }

        /* Sheet */
        .sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1c1c21;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 24px;
            z-index: 101;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            max-width: 500px;
            margin: 0 auto;
        }

        .sheet.active { transform: translateY(0); }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .sheet-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .sheet-row span:first-child { color: var(--text-secondary); }

        /* Loader */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            position: absolute;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar" id="topBar">
        <div style="display: flex; align-items: center;">
            <button class="icon-btn" id="btnBack">
                <i data-lucide="arrow-left"></i>
            </button>
            <div class="info-group">
                <span class="title" id="fileTitle">Loading...</span>
                <span class="subtitle" id="fileSubtitle">Perplexity Drive</span>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 4px;">
            <button class="icon-btn" id="btnInfo" title="Details">
                <i data-lucide="info"></i>
            </button>
        </div>
    </div>

    <!-- MAIN VIEW CONTAINER -->
    <div class="viewer-container" id="viewerContainer">
        <div class="spinner" id="loader"></div>
        
        <!-- 1. Image Viewer -->
        <img class="media-content" id="imageViewer" alt="Image File">

        <!-- 2. Video Player -->
        <video class="media-content" id="videoViewer" controls playsinline></video>

        <!-- 3. Document / PDF / Office Iframe Viewer -->
        <iframe class="media-content" id="docViewer" src="" allowfullscreen></iframe>

        <!-- 4. Binary/Executable/Unknown File Card -->
        <div class="file-card-preview" id="binaryViewer">
            <div class="file-icon" id="binaryIcon"><i data-lucide="file-box" style="width:100%;height:100%;"></i></div>
            <h2 id="binaryFileName">File.exe</h2>
            <p id="binaryFileSize">Executable / Binary File</p>
            <button class="btn-confirm" id="btnDirectDownload" style="padding: 12px 24px; border-radius: 20px; border:none; cursor:pointer;">
                Download File
            </button>
        </div>
    </div>

    <!-- BOTTOM BAR & FILMSTRIP -->
    <div class="bottom-bar" id="bottomBar">
        <div class="filmstrip-container" id="filmstrip"></div>
        <div class="actions-group">
            <button class="action-item" id="btnShare">
                <i data-lucide="share-2"></i>
                <span>Share</span>
            </button>
            <button class="action-item" id="btnDownload">
                <i data-lucide="download"></i>
                <span>Download</span>
            </button>
            <button class="action-item" id="btnDelete">
                <i data-lucide="trash-2" style="color: var(--danger-color);"></i>
                <span style="color: var(--danger-color);">Delete</span>
            </button>
        </div>
    </div>

    <!-- PASSWORD MODAL -->
    <div class="modal" id="passwordModal">
        <div class="modal-card">
            <h2>Protected File</h2>
            <p>This file is protected. Enter the password to unlock.</p>
            <input type="password" id="passwordInput" placeholder="Password">
            <div class="modal-buttons">
                <button class="btn-cancel" id="btnCancelPass">Go Back</button>
                <button class="btn-confirm" id="btnUnlock">Unlock</button>
            </div>
        </div>
    </div>

    <!-- DETAILS INFO SHEET -->
    <div class="sheet" id="infoSheet">
        <div class="sheet-header">
            <h3>File Details</h3>
            <button class="icon-btn" id="btnCloseSheet"><i data-lucide="x"></i></button>
        </div>
        <div class="sheet-row"><span>Name</span><span id="detailName">-</span></div>
        <div class="sheet-row"><span>Owner</span><span id="detailOwner">-</span></div>
        <div class="sheet-row"><span>Role</span><span id="detailRole">-</span></div>
        <div class="sheet-row"><span>Type</span><span id="detailType">-</span></div>
    </div>

    <!-- FIREBASE & CORE CONTROLLER -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            deleteDoc, 
            updateDoc, 
            arrayRemove 
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Provided Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
            authDomain: "cloud-computer-4891a.firebaseapp.com",
            projectId: "cloud-computer-4891a",
            storageBucket: "cloud-computer-4891a.firebasestorage.app",
            messagingSenderId: "744203234287",
            appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
            measurementId: "G-QE17C33TMN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        /* 1. AUTHENTICATION & SESSION VERIFICATION */
        const activeUserRaw = localStorage.getItem('active_user');
        if (!activeUserRaw) {
            window.location.href = `1.html?continue=${encodeURIComponent(window.location.href)}`;
        }
        const activeUser = JSON.parse(activeUserRaw || '{}');
        const userEmail = (activeUser.Email || "").toLowerCase();

        /* 2. URL PARAMETERS */
        const urlParams = new URLSearchParams(window.location.search);
        let currentDocId = urlParams.get('id');
        let folderDocId = urlParams.get('folder');

        /* 3. APPLICATION STATE */
        let currentDocData = null;
        let galleryItems = [];
        let currentIndex = 0;
        let userRole = 'None';

        // DOM Elements
        const topBar = document.getElementById('topBar');
        const bottomBar = document.getElementById('bottomBar');
        const loader = document.getElementById('loader');
        const filmstrip = document.getElementById('filmstrip');
        const fileTitle = document.getElementById('fileTitle');
        const fileSubtitle = document.getElementById('fileSubtitle');
        const passwordModal = document.getElementById('passwordModal');
        const infoSheet = document.getElementById('infoSheet');

        // Viewers
        const imageViewer = document.getElementById('imageViewer');
        const videoViewer = document.getElementById('videoViewer');
        const docViewer = document.getElementById('docViewer');
        const binaryViewer = document.getElementById('binaryViewer');
        const binaryFileName = document.getElementById('binaryFileName');
        const binaryFileSize = document.getElementById('binaryFileSize');
        const btnDirectDownload = document.getElementById('btnDirectDownload');

        // Actions
        const btnDownload = document.getElementById('btnDownload');
        const btnDelete = document.getElementById('btnDelete');
        const btnShare = document.getElementById('btnShare');

        /* 4. INIT FLOW */
        async function init() {
            lucide.createIcons();
            if (!currentDocId) {
                alert("No Document ID specified.");
                return;
            }

            try {
                const docRef = doc(db, "Cloud Drive", currentDocId);
                const snapshot = await getDoc(docRef);

                if (!snapshot.exists()) {
                    alert("File not found.");
                    return;
                }

                const docData = snapshot.data();

                if (docData.Folder === "True" || docData.Folder === true) {
                    folderDocId = currentDocId;
                    const fileIds = docData.Files || [];
                    if (fileIds.length === 0) {
                        alert("The folder is empty.");
                        return;
                    }
                    await loadFolderGallery(fileIds, fileIds[0]);
                } else {
                    if (folderDocId) {
                        const folderRef = doc(db, "Cloud Drive", folderDocId);
                        const folderSnap = await getDoc(folderRef);
                        if (folderSnap.exists()) {
                            await loadFolderGallery(folderSnap.data().Files || [], currentDocId);
                            return;
                        }
                    }
                    galleryItems = [{ id: currentDocId, data: docData }];
                    currentIndex = 0;
                    renderFilmstrip();
                    loadCurrentItem();
                }
            } catch (err) {
                console.error("Error loading document:", err);
                alert("Failed to load file.");
            }
        }

        async function loadFolderGallery(fileIds, selectId) {
            galleryItems = [];
            for (let id of fileIds) {
                try {
                    const snap = await getDoc(doc(db, "Cloud Drive", id));
                    if (snap.exists()) {
                        galleryItems.push({ id: snap.id, data: snap.data() });
                    }
                } catch (e) {
                    console.error("Failed loading item:", id);
                }
            }

            if (galleryItems.length === 0) {
                alert("No accessible files found in this collection.");
                return;
            }

            currentIndex = galleryItems.findIndex(item => item.id === selectId);
            if (currentIndex === -1) currentIndex = 0;

            renderFilmstrip();
            loadCurrentItem();
        }

        /* 5. ROLE & PERMISSIONS CHECK */
        function evaluateAccess(data) {
            const ownerEmail = (data.Email || "").toLowerCase();
            const accessObj = data.Access || {};
            const editors = (accessObj.Editor || []).map(e => (e || "").toLowerCase());
            const viewers = (accessObj.Viewer || []).map(e => (e || "").toLowerCase());
            const commentators = (accessObj.Commentator || []).map(e => (e || "").toLowerCase());

            if (userEmail === ownerEmail) return 'Owner';
            if (editors.includes(userEmail)) return 'Editor';
            if (viewers.includes(userEmail) || commentators.includes(userEmail)) return 'Viewer';
            return 'None';
        }

        /* 6. MIME & EXTENSION CLASSIFIER */
        function getFileType(docData) {
            const explicitType = (docData.Type || "").toLowerCase();
            const fileName = (docData.Name || "").toLowerCase();
            const fileUrl = (docData.File || "").toLowerCase();

            if (explicitType.includes('img') || explicitType.includes('image') || fileName.match(/\.(jpg|jpeg|png|webp|gif|svg)$/)) {
                return 'image';
            }
            if (explicitType.includes('video') || fileName.match(/\.(mp4|webm|ogg|mov|mkv)$/)) {
                return 'video';
            }
            if (explicitType.includes('pdf') || fileName.endsWith('.pdf')) {
                return 'pdf';
            }
            if (fileName.match(/\.(docx|doc|pptx|ppt|xlsx|xls)$/)) {
                return 'office';
            }
            if (fileName.endsWith('.exe') || explicitType.includes('exe')) {
                return 'exe';
            }
            return 'binary';
        }

        /* 7. DYNAMIC CONTENT RENDERING */
        function loadCurrentItem() {
            const current = galleryItems[currentIndex];
            currentDocId = current.id;
            currentDocData = current.data;

            userRole = evaluateAccess(currentDocData);
            if (userRole === 'None') {
                alert("Access Denied: You do not have permission to view this file.");
                return;
            }

            // Password Protection
            if (currentDocData.Password && currentDocData.Password.trim() !== "" && userRole !== 'Owner') {
                if (sessionStorage.getItem(`auth_${currentDocId}`) !== 'true') {
                    showPasswordModal();
                    return;
                }
            }

            // Access Control Rules on Buttons
            if (userRole === 'Viewer') {
                btnDownload.style.display = 'none';
                btnDelete.style.display = 'none';
                btnDirectDownload.style.display = 'none';
            } else {
                btnDownload.style.display = 'flex';
                btnDelete.style.display = 'flex';
                btnDirectDownload.style.display = 'block';
            }

            // Set Top Information
            fileTitle.innerText = currentDocData.Name || "Unnamed File";
            fileSubtitle.innerText = `${currentIndex + 1} of ${galleryItems.length}`;

            // Reset Viewers
            hideAllViewers();
            loader.style.display = 'block';

            const fileType = getFileType(currentDocData);
            const fileUrl = currentDocData.File;

            // Render view depending on file type
            switch (fileType) {
                case 'image':
                    imageViewer.src = fileUrl;
                    imageViewer.onload = () => {
                        loader.style.display = 'none';
                        imageViewer.style.display = 'block';
                    };
                    break;

                case 'video':
                    videoViewer.src = fileUrl;
                    videoViewer.onloadeddata = () => {
                        loader.style.display = 'none';
                        videoViewer.style.display = 'block';
                    };
                    break;

                case 'pdf':
                    docViewer.src = fileUrl;
                    docViewer.onload = () => {
                        loader.style.display = 'none';
                        docViewer.style.display = 'block';
                    };
                    break;

                case 'office': // .docx, .xlsx, .pptx rendered via Microsoft Office Online Viewer
                    docViewer.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(fileUrl)}`;
                    docViewer.onload = () => {
                        loader.style.display = 'none';
                        docViewer.style.display = 'block';
                    };
                    break;

                case 'exe':
                case 'binary':
                default:
                    loader.style.display = 'none';
                    binaryViewer.style.display = 'flex';
                    binaryFileName.innerText = currentDocData.Name || "Executable File";
                    binaryFileSize.innerText = currentDocData.Type ? `Type: ${currentDocData.Type}` : "Binary Executable";
                    break;
            }

            updateActiveThumb();
            lucide.createIcons();
        }

        function hideAllViewers() {
            imageViewer.style.display = 'none';
            imageViewer.src = '';
            videoViewer.style.display = 'none';
            videoViewer.pause();
            videoViewer.src = '';
            docViewer.style.display = 'none';
            docViewer.src = '';
            binaryViewer.style.display = 'none';
        }

        /* 8. THUMBNAIL FILMSTRIP */
        function renderFilmstrip() {
            filmstrip.innerHTML = '';
            if (galleryItems.length <= 1) {
                filmstrip.style.display = 'none';
                return;
            }
            filmstrip.style.display = 'flex';

            galleryItems.forEach((item, index) => {
                const thumb = document.createElement('div');
                thumb.className = `thumb ${index === currentIndex ? 'active' : ''}`;
                
                const type = getFileType(item.data);
                if (type === 'image') {
                    thumb.innerHTML = `<img src="${item.data.File}" alt="${item.data.Name}">`;
                } else if (type === 'video') {
                    thumb.innerHTML = `<i data-lucide="video" style="width:20px;height:20px;"></i>`;
                } else if (type === 'pdf' || type === 'office') {
                    thumb.innerHTML = `<i data-lucide="file-text" style="width:20px;height:20px;"></i>`;
                } else {
                    thumb.innerHTML = `<i data-lucide="terminal" style="width:20px;height:20px;"></i>`;
                }

                thumb.onclick = (e) => {
                    e.stopPropagation();
                    currentIndex = index;
                    loadCurrentItem();
                };
                filmstrip.appendChild(thumb);
            });
            lucide.createIcons();
        }

        function updateActiveThumb() {
            const thumbs = filmstrip.querySelectorAll('.thumb');
            thumbs.forEach((t, i) => {
                if (i === currentIndex) {
                    t.classList.add('active');
                    t.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                } else {
                    t.classList.remove('active');
                }
            });
        }

        /* 9. PASSWORD UNLOCK */
        function showPasswordModal() {
            passwordModal.classList.add('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').focus();
        }

        document.getElementById('btnUnlock').onclick = () => {
            if (document.getElementById('passwordInput').value === currentDocData.Password) {
                sessionStorage.setItem(`auth_${currentDocId}`, 'true');
                passwordModal.classList.remove('active');
                loadCurrentItem();
            } else {
                alert("Incorrect password.");
            }
        };

        document.getElementById('btnCancelPass').onclick = () => {
            if (window.history.length > 1) window.history.back();
            else window.location.href = '1.html';
        };

        /* 10. DOWNLOAD, DELETE, SHARE ACTIONS */
        async function triggerDownload() {
            if (userRole !== 'Owner' && userRole !== 'Editor') return;
            try {
                const response = await fetch(currentDocData.File);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = currentDocData.Name || `download_${Date.now()}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                window.open(currentDocData.File, '_blank');
            }
        }

        btnDownload.onclick = triggerDownload;
        btnDirectDownload.onclick = triggerDownload;

        btnDelete.onclick = async (e) => {
            e.stopPropagation();
            if (userRole !== 'Owner' && userRole !== 'Editor') return;
            if (!confirm(`Delete "${currentDocData.Name}"?`)) return;

            try {
                await deleteDoc(doc(db, "Cloud Drive", currentDocId));
                if (folderDocId) {
                    await updateDoc(doc(db, "Cloud Drive", folderDocId), {
                        Files: arrayRemove(currentDocId)
                    });
                }
                alert("Deleted successfully.");
                galleryItems.splice(currentIndex, 1);
                if (galleryItems.length === 0) {
                    window.history.back();
                } else {
                    if (currentIndex >= galleryItems.length) currentIndex = galleryItems.length - 1;
                    renderFilmstrip();
                    loadCurrentItem();
                }
            } catch (err) {
                console.error("Delete failed:", err);
                alert("Could not delete file.");
            }
        };

        btnShare.onclick = async (e) => {
            e.stopPropagation();
            const shareUrl = window.location.href;
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: currentDocData.Name || 'Shared File',
                        text: 'Shared file from Perplexity Drive',
                        url: shareUrl
                    });
                } catch(e) {}
            } else {
                navigator.clipboard.writeText(shareUrl);
                alert("Link copied to clipboard!");
            }
        };

        /* 11. DETAILS SHEET & UI CONTROLS */
        document.getElementById('btnInfo').onclick = (e) => {
            e.stopPropagation();
            document.getElementById('detailName').innerText = currentDocData.Name || '-';
            document.getElementById('detailOwner').innerText = currentDocData.Email || '-';
            document.getElementById('detailRole').innerText = userRole;
            document.getElementById('detailType').innerText = currentDocData.Type || getFileType(currentDocData).toUpperCase();
            infoSheet.classList.add('active');
        };

        document.getElementById('btnCloseSheet').onclick = () => infoSheet.classList.remove('active');
        document.getElementById('btnBack').onclick = () => {
            if (window.history.length > 1) window.history.back();
            else window.location.href = '1.html';
        };

        // Tap screen to toggle clean immersive UI
        document.getElementById('viewerContainer').addEventListener('click', (e) => {
            if (e.target.tagName !== 'VIDEO' && e.target.tagName !== 'BUTTON') {
                document.body.classList.toggle('ui-hidden');
                infoSheet.classList.remove('active');
            }
        });

        // Swipe Navigation
        let startX = 0;
        document.getElementById('viewerContainer').addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        }, { passive: true });

        document.getElementById('viewerContainer').addEventListener('touchend', (e) => {
            let endX = e.changedTouches[0].clientX;
            if (startX - endX > 60 && currentIndex < galleryItems.length - 1) {
                currentIndex++;
                loadCurrentItem();
            } else if (endX - startX > 60 && currentIndex > 0) {
                currentIndex--;
                loadCurrentItem();
            }
        }, { passive: true });

        // Start Viewer
        init();
    </script>
</body>
</html>
