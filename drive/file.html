<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gallery Viewer</title>
    <style>
        :root {
            --bg-color: #0b0c0e;
            --surface-color: rgba(22, 24, 29, 0.85);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f5f6f8;
            --text-secondary: #9aa0a6;
            --accent-color: #3b82f6;
            --accent-danger: #ef4444;
            --badge-bg: rgba(255, 255, 255, 0.12);
            --bottom-bar-bg: rgba(18, 20, 24, 0.9);
            --icon-color: #e5e7eb;
            --icon-hover: #ffffff;
        }

        body.light {
            --bg-color: #f4f5f8;
            --surface-color: rgba(255, 255, 255, 0.9);
            --surface-border: rgba(0, 0, 0, 0.08);
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --accent-color: #2563eb;
            --accent-danger: #dc2626;
            --badge-bg: rgba(0, 0, 0, 0.06);
            --bottom-bar-bg: rgba(255, 255, 255, 0.92);
            --icon-color: #374151;
            --icon-hover: #111827;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Top Navigation Header */
        header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        body.light header {
            background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, transparent 100%);
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title-box {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
            max-width: 240px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .folder-badge {
            background: var(--badge-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            text-transform: uppercase;
        }

        .icon-btn {
            background: transparent;
            border: none;
            outline: none;
            color: var(--icon-color);
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s, transform 0.1s;
        }

        .icon-btn:hover {
            background-color: var(--badge-bg);
            color: var(--icon-hover);
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Main Image Stage */
        main {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        .image-wrapper {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }

        #mainImage {
            max-width: 100vw;
            max-height: calc(100vh - 170px);
            object-fit: contain;
            border-radius: 8px;
            transition: transform 0.25s cubic-bezier(0.2, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Chevrons */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(12px);
            transition: opacity 0.2s, background 0.2s;
            opacity: 0.7;
        }

        .nav-btn:hover {
            opacity: 1;
            background: var(--badge-bg);
        }

        .nav-prev { left: 16px; }
        .nav-next { right: 16px; }

        /* Bottom Controls & Carousel */
        .bottom-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
            padding-bottom: 16px;
            transition: opacity 0.3s ease;
        }

        body.light .bottom-container {
            background: linear-gradient(0deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.6) 70%, transparent 100%);
        }

        /* Filmstrip Thumbnails */
        .filmstrip-wrapper {
            width: 100%;
            max-width: 650px;
            overflow-x: auto;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .filmstrip-wrapper::-webkit-scrollbar {
            display: none;
        }

        .thumb-item {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.55;
            transition: transform 0.2s, opacity 0.2s, border-color 0.2s;
            background: #1e2025;
        }

        .thumb-item.active {
            opacity: 1;
            border-color: var(--accent-color);
            transform: scale(1.08);
        }

        .thumb-item:hover {
            opacity: 0.9;
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Action Dock */
        .action-dock {
            display: flex;
            align-items: center;
            gap: 24px;
            background: var(--bottom-bar-bg);
            border: 1px solid var(--surface-border);
            padding: 8px 26px;
            border-radius: 35px;
            backdrop-filter: blur(15px);
            margin-top: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
        }

        .action-dock .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--icon-color);
            font-size: 11px;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }

        .action-dock .action-btn:hover {
            color: var(--accent-color);
        }

        .action-dock .action-btn.delete-btn:hover {
            color: var(--accent-danger);
        }

        .action-dock .action-btn:active {
            transform: scale(0.9);
        }

        .action-dock .action-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .hide-ui header,
        .hide-ui .bottom-container,
        .hide-ui .nav-btn {
            opacity: 0;
            pointer-events: none;
        }

        /* Modals & Dialogs */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            backdrop-filter: blur(5px);
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
            padding: 24px;
            color: var(--text-primary);
            text-align: center;
            transform: scale(0.95);
            transition: transform 0.25s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-backdrop.active .modal-box {
            transform: scale(1);
        }

        .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .modal-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.4; }
        .modal-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--surface-border);
            background: var(--badge-bg);
            color: var(--text-primary);
            outline: none;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-actions { display: flex; gap: 10px; }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-cancel { background: var(--badge-bg); color: var(--text-primary); }
        .btn-primary { background: var(--accent-color); color: #ffffff; }
        .btn-danger { background: var(--accent-danger); color: #ffffff; }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--surface-border);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.25s ease, opacity 0.25s ease;
            backdrop-filter: blur(10px);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
            border-bottom: 1px solid var(--surface-border);
            text-align: left;
        }
        .info-label { color: var(--text-secondary); }
        .info-val { font-weight: 500; word-break: break-all; max-width: 60%; text-align: right; }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--surface-border);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #loaderContainer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 30;
            background: var(--bg-color);
        }
    </style>
</head>
<body>

    <div id="loaderContainer">
        <div class="spinner"></div>
        <p style="font-size: 13px; color: var(--text-secondary);" id="loaderText">Loading...</p>
    </div>

    <!-- Header -->
    <header>
        <div class="header-left">
            <button class="icon-btn" id="backBtn" title="Back">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <div class="header-title-box">
                <span class="header-title" id="imageTitle">Image</span>
                <span class="header-subtitle">
                    <span id="folderTag" class="folder-badge" style="display:none;">Folder</span>
                    <span id="imageOwner">Perplexity Cloud</span>
                </span>
            </div>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="infoBtn" title="Details">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            </button>
            <button class="icon-btn" id="fullscreenBtn" title="Toggle Fullscreen">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Viewport -->
    <main id="mainContainer">
        <button class="nav-btn nav-prev" id="prevBtn" title="Previous Image">
            <svg style="width:24px;height:24px;fill:currentColor;" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>

        <div class="image-wrapper" id="imageWrapper">
            <img id="mainImage" src="" alt="" style="display: none;">
        </div>

        <button class="nav-btn nav-next" id="nextBtn" title="Next Image">
            <svg style="width:24px;height:24px;fill:currentColor;" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
    </main>

    <!-- Bottom Controls & Carousel -->
    <div class="bottom-container">
        <!-- Filmstrip thumbnails -->
        <div class="filmstrip-wrapper" id="filmstripWrapper"></div>

        <!-- Action dock -->
        <div class="action-dock" id="actionDock">
            <button class="action-btn" id="shareBtn">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                <span>Share</span>
            </button>

            <!-- Download Button: Visible for Owner & Editor, Hidden for Viewer -->
            <button class="action-btn" id="downloadBtn" style="display: none;">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
                <span>Download</span>
            </button>

            <!-- Delete Button: Visible for Owner & Editor -->
            <button class="action-btn delete-btn" id="deleteBtn" style="display: none;">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                <span>Delete</span>
            </button>
        </div>
    </div>

    <!-- Password Modal -->
    <div class="modal-backdrop" id="passwordModal">
        <div class="modal-box">
            <h3 class="modal-title">Protected Content</h3>
            <p class="modal-desc">This item requires a password to unlock and view.</p>
            <input type="password" id="passwordInput" class="modal-input" placeholder="Enter password">
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" id="pwdCancelBtn">Cancel</button>
                <button class="modal-btn btn-primary" id="pwdSubmitBtn">Unlock</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-backdrop" id="deleteModal">
        <div class="modal-box">
            <h3 class="modal-title">Delete Item?</h3>
            <p class="modal-desc">Are you sure you want to permanently delete this from your Cloud Drive?</p>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" id="cancelDeleteBtn">Cancel</button>
                <button class="modal-btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Info / Details Modal -->
    <div class="modal-backdrop" id="infoModal">
        <div class="modal-box">
            <h3 class="modal-title">Details</h3>
            <div id="infoContent" style="margin: 15px 0;"></div>
            <div class="modal-actions">
                <button class="modal-btn btn-primary" id="closeInfoBtn">Close</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Notice message</div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs, deleteDoc, updateDoc, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
            authDomain: "cloud-computer-4891a.firebaseapp.com",
            projectId: "cloud-computer-4891a",
            storageBucket: "cloud-computer-4891a.firebasestorage.app",
            messagingSenderId: "744203234287",
            appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
            measurementId: "G-QE17C33TMN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State
        const urlParams = new URLSearchParams(window.location.search);
        let requestedId = urlParams.get('id');
        const theme = urlParams.get('theme') ? urlParams.get('theme').toLowerCase() : null;

        let activeUser = null;
        let parentFolderDoc = null; // Stored if requested ID is a folder
        let galleryList = [];
        let currentIndex = -1;
        let currentImageDoc = null;
        let isZoomed = false;

        /* ================= THEME HANDLER ================= */
        const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
        function applyTheme() {
            if (theme === "light" || theme === "l") {
                document.body.classList.add("light");
            } else if (theme === "dark" || theme === "d") {
                document.body.classList.remove("light");
            } else {
                if (!mediaQuery.matches) {
                    document.body.classList.add("light");
                } else {
                    document.body.classList.remove("light");
                }
            }
        }
        applyTheme();
        mediaQuery.addEventListener("change", () => { if (!theme) applyTheme(); });

        /* ================= AUTH CHECK ================= */
        try {
            const rawUser = localStorage.getItem('active_user');
            if (rawUser) {
                activeUser = JSON.parse(rawUser);
            }
        } catch (e) {
            console.error("Failed to parse active user", e);
        }

        if (!activeUser || !activeUser.Email) {
            window.location.href = `1.html?continue=${encodeURIComponent(window.location.href)}`;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2800);
        }

        /* ================= PERMISSION CHECKER ================= */
        function checkPermissions(docData) {
            if (!docData) return { isOwner: false, isEditor: false, isViewer: false };

            const userEmail = (activeUser.Email || "").toLowerCase().trim();
            const ownerEmail = (docData.Email || "").toLowerCase().trim();

            const isOwner = userEmail === ownerEmail;
            let isEditor = isOwner;
            let isViewer = isOwner;

            if (docData.Access) {
                if (Array.isArray(docData.Access.Editor)) {
                    if (docData.Access.Editor.map(e => (e||'').toLowerCase().trim()).includes(userEmail)) {
                        isEditor = true;
                    }
                }
                if (Array.isArray(docData.Access.Viewer)) {
                    if (docData.Access.Viewer.map(e => (e||'').toLowerCase().trim()).includes(userEmail)) {
                        isViewer = true;
                    }
                }
                if (Array.isArray(docData.Access.Commentator)) {
                    if (docData.Access.Commentator.map(e => (e||'').toLowerCase().trim()).includes(userEmail)) {
                        isViewer = true;
                    }
                }
            }

            if (isEditor) isViewer = true;
            return { isOwner, isEditor, isViewer };
        }

        /* ================= CHECK IF DOCUMENT IS FOLDER ================= */
        function isFolder(data) {
            return data && (data.Folder === "True" || data.Folder === "true" || data.Folder === true || Array.isArray(data.Files));
        }

        /* ================= LOAD TARGET BY ID ================= */
        async function loadTarget() {
            if (!requestedId) {
                document.getElementById('loaderText').innerText = "No item specified in URL (?id=...)";
                return;
            }

            document.getElementById('loaderContainer').style.display = 'flex';

            try {
                const targetRef = doc(db, "Cloud Drive", requestedId);
                const targetSnap = await getDoc(targetRef);

                if (!targetSnap.exists()) {
                    alert("Requested item not found.");
                    document.getElementById('loaderContainer').style.display = 'none';
                    return;
                }

                const targetData = targetSnap.data();
                const perms = checkPermissions(targetData);

                if (!perms.isViewer) {
                    alert("Access Denied: You do not have permission to view this item.");
                    document.getElementById('loaderContainer').style.display = 'none';
                    return;
                }

                // Password Check for Target
                if (targetData.Password && targetData.Password.trim() !== "" && !perms.isOwner) {
                    await promptPassword(targetData.Password);
                }

                // CHECK: Is this target a Folder?
                if (isFolder(targetData)) {
                    parentFolderDoc = { id: targetSnap.id, ...targetData };
                    document.getElementById('folderTag').style.display = 'inline-block';
                    document.getElementById('folderTag').innerText = targetData.Name || "Folder";
                    
                    const fileIds = Array.isArray(targetData.Files) ? targetData.Files : [];
                    await loadFolderFiles(fileIds, perms);
                } else {
                    // Single File Target
                    parentFolderDoc = null;
                    document.getElementById('folderTag').style.display = 'none';
                    await loadSingleFileAndSiblings(targetSnap.id, targetData);
                }

            } catch (err) {
                console.error("Initialization error:", err);
                alert("Error connecting to database.");
            } finally {
                document.getElementById('loaderContainer').style.display = 'none';
            }
        }

        /* ================= LOAD FOLDER FILES ================= */
        async function loadFolderFiles(fileIds, folderPerms) {
            galleryList = [];
            
            for (const fId of fileIds) {
                try {
                    const fSnap = await getDoc(doc(db, "Cloud Drive", fId));
                    if (fSnap.exists()) {
                        const fData = fSnap.data();
                        // If file is inside an accessible folder, inherit viewing
                        galleryList.push({ id: fSnap.id, ...fData, folderInheritedPerms: folderPerms });
                    }
                } catch (e) {
                    console.error("Error fetching file in folder:", fId, e);
                }
            }

            if (galleryList.length > 0) {
                renderFilmstrip();
                selectImage(0);
            } else {
                document.getElementById('imageTitle').innerText = parentFolderDoc.Name || "Folder Empty";
                document.getElementById('imageOwner').innerText = parentFolderDoc.Email || "";
                document.getElementById('mainImage').style.display = 'none';
                showToast("Folder contains no images.");
            }
        }

        /* ================= LOAD SINGLE FILE & ITS CONTEXT ================= */
        async function loadSingleFileAndSiblings(fileId, fileData) {
            galleryList = [{ id: fileId, ...fileData }];

            // Search for other accessible files to populate gallery strip
            try {
                const querySnap = await getDocs(collection(db, "Cloud Drive"));
                galleryList = [];
                querySnap.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (!isFolder(data)) {
                        const p = checkPermissions(data);
                        if (p.isViewer) {
                            galleryList.push({ id: docSnap.id, ...data });
                        }
                    }
                });
            } catch (e) {
                console.error("Error loading siblings:", e);
            }

            renderFilmstrip();
            const targetIdx = galleryList.findIndex(item => item.id === fileId);
            selectImage(targetIdx >= 0 ? targetIdx : 0);
        }

        /* ================= RENDER FILMSTRIP ================= */
        function renderFilmstrip() {
            const filmstrip = document.getElementById('filmstripWrapper');
            filmstrip.innerHTML = '';

            galleryList.forEach((item, index) => {
                const thumb = document.createElement('div');
                thumb.className = `thumb-item ${index === currentIndex ? 'active' : ''}`;
                thumb.innerHTML = `<img src="${item.File || ''}" alt="${item.Name || ''}" loading="lazy">`;
                
                thumb.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectImage(index);
                });
                filmstrip.appendChild(thumb);
            });

            // Scroll active into view
            const activeThumb = filmstrip.querySelector('.thumb-item.active');
            if (activeThumb) {
                activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }

        /* ================= SELECT & DISPLAY IMAGE ================= */
        function selectImage(index) {
            if (index < 0 || index >= galleryList.length) return;
            currentIndex = index;
            currentImageDoc = galleryList[index];

            // Permissions: Combine image's own permissions or folder-inherited permissions
            const docPerms = checkPermissions(currentImageDoc);
            const folderPerms = currentImageDoc.folderInheritedPerms || (parentFolderDoc ? checkPermissions(parentFolderDoc) : null);
            
            const effectiveOwner = docPerms.isOwner || (folderPerms && folderPerms.isOwner);
            const effectiveEditor = docPerms.isEditor || (folderPerms && folderPerms.isEditor);

            // Display Info
            document.getElementById('imageTitle').innerText = currentImageDoc.Name || 'Untitled';
            document.getElementById('imageOwner').innerText = currentImageDoc.Email || (parentFolderDoc ? parentFolderDoc.Email : 'Cloud Drive');

            const img = document.getElementById('mainImage');
            img.style.display = 'block';
            img.src = currentImageDoc.File || '';
            img.alt = currentImageDoc.Name || 'Image';

            // Role based actions
            const downloadBtn = document.getElementById('downloadBtn');
            const deleteBtn = document.getElementById('deleteBtn');

            if (effectiveOwner || effectiveEditor) {
                downloadBtn.style.display = 'flex';
                deleteBtn.style.display = 'flex';
            } else {
                downloadBtn.style.display = 'none';
                deleteBtn.style.display = 'none';
            }

            // Reset zoom
            isZoomed = false;
            img.style.transform = 'scale(1)';

            // Update active state in thumbnail strip
            document.querySelectorAll('.thumb-item').forEach((el, idx) => {
                el.classList.toggle('active', idx === currentIndex);
            });
        }

        /* ================= PASSWORD PROMPT ================= */
        function promptPassword(expectedPassword) {
            return new Promise((resolve) => {
                const modal = document.getElementById('passwordModal');
                const input = document.getElementById('passwordInput');
                input.value = '';
                modal.classList.add('active');
                input.focus();

                const submitBtn = document.getElementById('pwdSubmitBtn');
                const cancelBtn = document.getElementById('pwdCancelBtn');

                const onSubmit = () => {
                    if (input.value === expectedPassword) {
                        modal.classList.remove('active');
                        cleanup();
                        resolve(true);
                    } else {
                        alert("Incorrect password!");
                    }
                };

                const onCancel = () => {
                    modal.classList.remove('active');
                    cleanup();
                    history.back();
                };

                function cleanup() {
                    submitBtn.removeEventListener('click', onSubmit);
                    cancelBtn.removeEventListener('click', onCancel);
                }

                submitBtn.addEventListener('click', onSubmit);
                cancelBtn.addEventListener('click', onCancel);
            });
        }

        /* ================= GALLERY CHEVRONS ================= */
        document.getElementById('prevBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (galleryList.length <= 1) return;
            let idx = currentIndex - 1;
            if (idx < 0) idx = galleryList.length - 1;
            selectImage(idx);
        });

        document.getElementById('nextBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (galleryList.length <= 1) return;
            let idx = (currentIndex + 1) % galleryList.length;
            selectImage(idx);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
            if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('active'));
            }
        });

        /* ================= ZOOM & TOGGLE UI ================= */
        document.getElementById('mainContainer').addEventListener('click', (e) => {
            if (e.target.closest('.nav-btn') || e.target.closest('.action-dock')) return;
            document.body.classList.toggle('hide-ui');
        });

        document.getElementById('mainImage').addEventListener('dblclick', (e) => {
            e.stopPropagation();
            isZoomed = !isZoomed;
            document.getElementById('mainImage').style.transform = isZoomed ? 'scale(2)' : 'scale(1)';
        });

        /* ================= ACTIONS: DOWNLOAD ================= */
        document.getElementById('downloadBtn').addEventListener('click', async (e) => {
            e.stopPropagation();
            if (!currentImageDoc || !currentImageDoc.File) return;

            showToast("Downloading image...");
            try {
                const response = await fetch(currentImageDoc.File);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = (currentImageDoc.Name || 'image') + (currentImageDoc.Type || '.jpg');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
                showToast("Download started");
            } catch (err) {
                console.error("Direct fetch download failed:", err);
                window.open(currentImageDoc.File, '_blank');
            }
        });

        /* ================= ACTIONS: SHARE ================= */
        document.getElementById('shareBtn').addEventListener('click', async (e) => {
            e.stopPropagation();
            const shareUrl = window.location.href;
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: currentImageDoc?.Name || 'Shared Image',
                        text: 'View image in Cloud Drive',
                        url: shareUrl
                    });
                } catch (e) {}
            } else {
                navigator.clipboard.writeText(shareUrl);
                showToast("Link copied to clipboard!");
            }
        });

        /* ================= ACTIONS: DELETE ================= */
        const deleteModal = document.getElementById('deleteModal');
        document.getElementById('deleteBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            deleteModal.classList.add('active');
        });

        document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
            deleteModal.classList.remove('active');
        });

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!currentImageDoc) return;
            try {
                const docIdToDelete = currentImageDoc.id;

                // 1. Delete document from Firestore
                await deleteDoc(doc(db, "Cloud Drive", docIdToDelete));

                // 2. If it is part of a parent folder, remove reference from parent's Files array
                if (parentFolderDoc && parentFolderDoc.id) {
                    try {
                        await updateDoc(doc(db, "Cloud Drive", parentFolderDoc.id), {
                            Files: arrayRemove(docIdToDelete)
                        });
                    } catch (err) {
                        console.error("Could not remove file ID from parent folder:", err);
                    }
                }

                deleteModal.classList.remove('active');
                showToast("Item deleted");

                // Update gallery
                galleryList.splice(currentIndex, 1);
                if (galleryList.length > 0) {
                    renderFilmstrip();
                    selectImage(Math.min(currentIndex, galleryList.length - 1));
                } else {
                    document.getElementById('mainImage').style.display = 'none';
                    document.getElementById('imageTitle').innerText = "Empty";
                    renderFilmstrip();
                    showToast("No files remaining.");
                }
            } catch (err) {
                console.error("Delete failed:", err);
                alert("Failed to delete item.");
            }
        });

        /* ================= ACTIONS: DETAILS ================= */
        const infoModal = document.getElementById('infoModal');
        document.getElementById('infoBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (!currentImageDoc) return;

            const targetData = parentFolderDoc || currentImageDoc;
            const viewers = targetData.Access?.Viewer ? targetData.Access.Viewer.join(', ') : 'None';
            const editors = targetData.Access?.Editor ? targetData.Access.Editor.join(', ') : 'Owner only';

            document.getElementById('infoContent').innerHTML = `
                <div class="info-row"><span class="info-label">Title</span><span class="info-val">${currentImageDoc.Name || 'Untitled'}</span></div>
                ${parentFolderDoc ? `<div class="info-row"><span class="info-label">Folder</span><span class="info-val">${parentFolderDoc.Name || 'Folder'}</span></div>` : ''}
                <div class="info-row"><span class="info-label">Type</span><span class="info-val">${currentImageDoc.Type || (parentFolderDoc ? 'Folder Image' : 'Image')}</span></div>
                <div class="info-row"><span class="info-label">Owner</span><span class="info-val">${targetData.Email || 'Unknown'}</span></div>
                <div class="info-row"><span class="info-label">Editors</span><span class="info-val">${editors}</span></div>
                <div class="info-row"><span class="info-label">Viewers</span><span class="info-val">${viewers}</span></div>
            `;
            infoModal.classList.add('active');
        });

        document.getElementById('closeInfoBtn').addEventListener('click', () => {
            infoModal.classList.remove('active');
        });

        /* ================= FULLSCREEN & BACK ================= */
        document.getElementById('fullscreenBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            if (window.history.length > 1) {
                history.back();
            } else {
                window.location.href = 'index.html';
            }
        });

        // Start
        loadTarget();
    </script>
</body>
</html>
