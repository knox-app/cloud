<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Cloud Viewer</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0c0c0d;
            --surface-color: rgba(26, 26, 26, 0.85);
            --text-primary: #ffffff;
            --text-secondary: #9e9e9e;
            --accent-color: #2196f3;
            --danger-color: #ff5252;
            --overlay-bg: rgba(0, 0, 0, 0.75);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            z-index: 50;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .top-bar .info-group {
            display: flex;
            flex-direction: column;
            margin-left: 12px;
            overflow: hidden;
        }

        .info-group .title {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .info-group .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .icon-btn:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Main Viewport */
        .viewer-container {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .main-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        /* Document / IFrame Viewer for PDF & DOCX */
        .doc-iframe {
            width: 100%;
            height: 100%;
            border: none;
            padding-top: 60px;
            padding-bottom: 120px;
            box-sizing: border-box;
            background: #fff;
        }

        /* Generic Executable & Binary File Card */
        .file-card-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #18181b;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid #2e2e33;
            max-width: 340px;
            width: 85%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .file-card-icon {
            width: 72px;
            height: 72px;
            background: #27272a;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            color: var(--accent-color);
        }

        .file-card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            word-break: break-all;
        }

        .file-card-type {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .file-card-btn {
            background: var(--accent-color);
            color: #fff;
            padding: 12px 24px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .file-card-btn:active {
            opacity: 0.8;
        }

        /* Bottom Controls Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 70%, rgba(0,0,0,0) 100%);
            padding-bottom: env(safe-area-inset-bottom, 16px);
            z-index: 50;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Thumbnail Strip */
        .filmstrip-container {
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .filmstrip-container::-webkit-scrollbar {
            display: none;
        }

        .thumb-box {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            overflow: hidden;
            opacity: 0.5;
            transition: opacity 0.2s, transform 0.2s, border 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #222;
        }

        .thumb-box.active {
            opacity: 1;
            transform: scale(1.08);
            border-color: var(--accent-color);
        }

        .thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-box .thumb-badge {
            font-size: 10px;
            font-weight: 700;
            color: #ddd;
            text-transform: uppercase;
        }

        .actions-group {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 450px;
            padding: 8px 0;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-primary);
            font-size: 11px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .action-item span {
            color: var(--text-secondary);
        }

        /* Hidden UI State */
        .ui-hidden .top-bar {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }

        .ui-hidden .bottom-bar {
            opacity: 0;
            transform: translateY(100%);
            pointer-events: none;
        }

        /* Password Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #1e1e1e;
            width: 90%;
            max-width: 380px;
            border-radius: 24px;
            padding: 24px;
            color: #fff;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .modal-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .modal-card p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .modal-card input {
            width: 100%;
            padding: 14px;
            background: #2b2b2b;
            border: 1px solid #444;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-card input:focus {
            border-color: var(--accent-color);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-confirm { background: var(--accent-color); color: #fff; }
        .btn-cancel { background: #333; color: #bbb; }

        /* Details Sheet */
        .sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1c1c1e;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 24px;
            z-index: 101;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            max-width: 500px;
            margin: 0 auto;
        }

        .sheet.active { transform: translateY(0); }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .sheet-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 14px;
        }

        .sheet-row span:first-child { color: var(--text-secondary); }

        /* Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            position: absolute;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar" id="topBar">
        <div style="display: flex; align-items: center;">
            <button class="icon-btn" id="btnBack">
                <i data-lucide="arrow-left"></i>
            </button>
            <div class="info-group">
                <span class="title" id="fileTitle">Loading...</span>
                <span class="subtitle" id="fileSubtitle">Perplexity Cloud</span>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 4px;">
            <button class="icon-btn" id="btnInfo" title="Details">
                <i data-lucide="info"></i>
            </button>
        </div>
    </div>

    <!-- MAIN VIEWER CONTAINER -->
    <div class="viewer-container" id="viewerContainer">
        <div class="spinner" id="loader"></div>
        <!-- Dynamic content: img, iframe, or binary card injected via JavaScript -->
        <div id="mediaSlot" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;"></div>
    </div>

    <!-- BOTTOM CONTROLS & FILMSTRIP -->
    <div class="bottom-bar" id="bottomBar">
        <div class="filmstrip-container" id="filmstrip"></div>
        <div class="actions-group">
            <button class="action-item" id="btnShare">
                <i data-lucide="share-2"></i>
                <span>Share</span>
            </button>
            <button class="action-item" id="btnDownload">
                <i data-lucide="download"></i>
                <span>Download</span>
            </button>
            <button class="action-item" id="btnDelete">
                <i data-lucide="trash-2" style="color: var(--danger-color);"></i>
                <span style="color: var(--danger-color);">Delete</span>
            </button>
        </div>
    </div>

    <!-- PASSWORD MODAL -->
    <div class="modal" id="passwordModal">
        <div class="modal-card">
            <h2>Protected File</h2>
            <p>This file is password protected. Enter the password to unlock.</p>
            <input type="password" id="passwordInput" placeholder="Password">
            <div class="modal-buttons">
                <button class="btn-cancel" id="btnCancelPass">Go Back</button>
                <button class="btn-confirm" id="btnUnlock">Unlock</button>
            </div>
        </div>
    </div>

    <!-- INFO SHEET -->
    <div class="sheet" id="infoSheet">
        <div class="sheet-header">
            <h3>File Details</h3>
            <button class="icon-btn" id="btnCloseSheet"><i data-lucide="x"></i></button>
        </div>
        <div class="sheet-row"><span>Name</span><span id="detailName">-</span></div>
        <div class="sheet-row"><span>Owner</span><span id="detailOwner">-</span></div>
        <div class="sheet-row"><span>Access Role</span><span id="detailRole">-</span></div>
        <div class="sheet-row"><span>Type</span><span id="detailType">-</span></div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            deleteDoc, 
            updateDoc, 
            arrayRemove 
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
            authDomain: "cloud-computer-4891a.firebaseapp.com",
            projectId: "cloud-computer-4891a",
            storageBucket: "cloud-computer-4891a.firebasestorage.app",
            messagingSenderId: "744203234287",
            appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
            measurementId: "G-QE17C33TMN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. Session Validation
        const activeUserRaw = localStorage.getItem('active_user');
        if (!activeUserRaw) {
            window.location.href = `1.html?continue=${encodeURIComponent(window.location.href)}`;
        }
        const activeUser = JSON.parse(activeUserRaw || '{}');
        const userEmail = (activeUser.Email || "").toLowerCase();

        // 2. Query Parameters
        const urlParams = new URLSearchParams(window.location.search);
        let currentDocId = urlParams.get('id');
        let folderDocId = urlParams.get('folder');

        // State Variables
        let currentDocData = null;
        let galleryItems = [];
        let currentIndex = 0;
        let userRole = 'None';

        // DOM elements
        const loader = document.getElementById('loader');
        const mediaSlot = document.getElementById('mediaSlot');
        const filmstrip = document.getElementById('filmstrip');
        const fileTitle = document.getElementById('fileTitle');
        const fileSubtitle = document.getElementById('fileSubtitle');
        const passwordModal = document.getElementById('passwordModal');
        const infoSheet = document.getElementById('infoSheet');

        const btnDownload = document.getElementById('btnDownload');
        const btnDelete = document.getElementById('btnDelete');
        const btnShare = document.getElementById('btnShare');

        /* Initialize */
        async function init() {
            lucide.createIcons();
            if (!currentDocId) {
                alert("No Document ID specified in URL.");
                return;
            }

            try {
                const docRef = doc(db, "Cloud Drive", currentDocId);
                const snapshot = await getDoc(docRef);

                if (!snapshot.exists()) {
                    alert("File does not exist.");
                    return;
                }

                const docData = snapshot.data();

                if (docData.Folder === "True" || docData.Folder === true) {
                    folderDocId = currentDocId;
                    const fileIds = docData.Files || [];
                    if (fileIds.length === 0) {
                        alert("Folder is empty.");
                        return;
                    }
                    await loadFolderCollection(fileIds, fileIds[0]);
                } else {
                    if (folderDocId) {
                        const folderRef = doc(db, "Cloud Drive", folderDocId);
                        const folderSnap = await getDoc(folderRef);
                        if (folderSnap.exists()) {
                            await loadFolderCollection(folderSnap.data().Files || [], currentDocId);
                            return;
                        }
                    }
                    await displaySingleItem(currentDocId, docData);
                }
            } catch (err) {
                console.error("Fetch error:", err);
                alert("Failed to load cloud drive items.");
            }
        }

        async function loadFolderCollection(fileIds, selectId) {
            galleryItems = [];
            for (let id of fileIds) {
                try {
                    const snap = await getDoc(doc(db, "Cloud Drive", id));
                    if (snap.exists()) {
                        galleryItems.push({ id: snap.id, data: snap.data() });
                    }
                } catch (e) {
                    console.error("Child read error:", id);
                }
            }

            if (galleryItems.length === 0) {
                alert("No files accessible in this collection.");
                return;
            }

            currentIndex = galleryItems.findIndex(i => i.id === selectId);
            if (currentIndex === -1) currentIndex = 0;

            renderFilmstrip();
            renderActiveFile();
        }

        async function displaySingleItem(id, data) {
            galleryItems = [{ id, data }];
            currentIndex = 0;
            renderFilmstrip();
            renderActiveFile();
        }

        function evaluateRole(data) {
            const owner = (data.Email || "").toLowerCase();
            const access = data.Access || {};
            const editors = (access.Editor || []).map(e => (e || "").toLowerCase());
            const viewers = (access.Viewer || []).map(e => (e || "").toLowerCase());
            const commentators = (access.Commentator || []).map(e => (e || "").toLowerCase());

            if (userEmail === owner) return 'Owner';
            if (editors.includes(userEmail)) return 'Editor';
            if (viewers.includes(userEmail) || commentators.includes(userEmail)) return 'Viewer';
            return 'None';
        }

        function getFileExtension(name = '', type = '') {
            if (type.startsWith('.')) return type.toLowerCase().replace('.', '');
            const extFromName = name.split('.').pop();
            return extFromName ? extFromName.toLowerCase() : 'unknown';
        }

        /* Main File Renderer */
        function renderActiveFile() {
            const item = galleryItems[currentIndex];
            currentDocId = item.id;
            currentDocData = item.data;

            userRole = evaluateRole(currentDocData);
            if (userRole === 'None') {
                alert("Access Denied: You do not have permission to access this resource.");
                return;
            }

            // Password Protection check
            if (currentDocData.Password && currentDocData.Password.trim() !== "" && userRole !== 'Owner') {
                if (sessionStorage.getItem(`auth_${currentDocId}`) !== 'true') {
                    showPasswordPrompt();
                    return;
                }
            }

            // Permissions
            if (userRole === 'Viewer') {
                btnDownload.style.display = 'none';
                btnDelete.style.display = 'none';
            } else {
                btnDownload.style.display = 'flex';
                btnDelete.style.display = 'flex';
            }

            fileTitle.innerText = currentDocData.Name || "File Viewer";
            fileSubtitle.innerText = `${currentIndex + 1} of ${galleryItems.length}`;

            // Reset media slot
            mediaSlot.innerHTML = '';
            loader.style.display = 'block';

            const fileUrl = currentDocData.File;
            const ext = getFileExtension(currentDocData.Name, currentDocData.Type);

            // 1. PDF Handling
            if (ext === 'pdf') {
                const iframe = document.createElement('iframe');
                iframe.className = 'doc-iframe';
                iframe.src = `${fileUrl}#toolbar=0&navpanes=0`;
                iframe.onload = () => { loader.style.display = 'none'; };
                mediaSlot.appendChild(iframe);
            }
            // 2. Word / DOCX Handling
            else if (ext === 'docx' || ext === 'doc') {
                const iframe = document.createElement('iframe');
                iframe.className = 'doc-iframe';
                // Render via Microsoft Office Web Viewer
                iframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(fileUrl)}`;
                iframe.onload = () => { loader.style.display = 'none'; };
                mediaSlot.appendChild(iframe);
            }
            // 3. Executable (.EXE, .MSI, .BAT, .ZIP, etc.)
            else if (['exe', 'msi', 'apk', 'zip', 'rar', 'bin'].includes(ext)) {
                loader.style.display = 'none';
                const card = document.createElement('div');
                card.className = 'file-card-preview';
                card.innerHTML = `
                    <div class="file-card-icon">
                        <i data-lucide="terminal" style="width: 36px; height: 36px;"></i>
                    </div>
                    <div class="file-card-title">${currentDocData.Name || 'Executable Application'}</div>
                    <div class="file-card-type">Binary Executable (${ext})</div>
                    ${(userRole === 'Owner' || userRole === 'Editor') ? `
                        <button class="file-card-btn" id="btnCardDownload">
                            <i data-lucide="download"></i> Download & Run
                        </button>
                    ` : '<div style="font-size: 13px; color: var(--text-secondary);">View Only Mode</div>'}
                `;
                mediaSlot.appendChild(card);
                lucide.createIcons();

                const cardBtn = document.getElementById('btnCardDownload');
                if (cardBtn) cardBtn.onclick = () => btnDownload.click();
            }
            // 4. Default: Image Handling
            else {
                const img = document.createElement('img');
                img.className = 'main-image';
                img.src = fileUrl;
                img.onload = () => {
                    loader.style.display = 'none';
                };
                img.onerror = () => {
                    loader.style.display = 'none';
                    alert("Error displaying image.");
                };
                mediaSlot.appendChild(img);
            }

            updateActiveThumb();
        }

        /* Filmstrip Renderer */
        function renderFilmstrip() {
            filmstrip.innerHTML = '';
            if (galleryItems.length <= 1) {
                filmstrip.style.display = 'none';
                return;
            }
            filmstrip.style.display = 'flex';

            galleryItems.forEach((item, index) => {
                const box = document.createElement('div');
                box.className = `thumb-box ${index === currentIndex ? 'active' : ''}`;

                const ext = getFileExtension(item.data.Name, item.data.Type);

                if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'img'].includes(ext)) {
                    box.innerHTML = `<img src="${item.data.File}" alt="">`;
                } else {
                    box.innerHTML = `<span class="thumb-badge">${ext}</span>`;
                }

                box.onclick = (e) => {
                    e.stopPropagation();
                    currentIndex = index;
                    renderActiveFile();
                };
                filmstrip.appendChild(box);
            });
        }

        function updateActiveThumb() {
            const thumbs = filmstrip.querySelectorAll('.thumb-box');
            thumbs.forEach((t, i) => {
                if (i === currentIndex) {
                    t.classList.add('active');
                    t.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                } else {
                    t.classList.remove('active');
                }
            });
        }

        /* Password Modal */
        function showPasswordPrompt() {
            passwordModal.classList.add('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').focus();
        }

        document.getElementById('btnUnlock').onclick = () => {
            const val = document.getElementById('passwordInput').value;
            if (val === currentDocData.Password) {
                sessionStorage.setItem(`auth_${currentDocId}`, 'true');
                passwordModal.classList.remove('active');
                renderActiveFile();
            } else {
                alert("Incorrect password.");
            }
        };

        document.getElementById('btnCancelPass').onclick = () => {
            if (window.history.length > 1) window.history.back();
            else window.location.href = '1.html';
        };

        /* Actions */
        btnDownload.onclick = async (e) => {
            e.stopPropagation();
            if (userRole !== 'Owner' && userRole !== 'Editor') return;

            try {
                const res = await fetch(currentDocData.File);
                const blob = await res.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = currentDocData.Name || `download_${Date.now()}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(blobUrl);
            } catch (err) {
                // Fallback for CORS restricted origins
                window.open(currentDocData.File, '_blank');
            }
        };

        btnDelete.onclick = async (e) => {
            e.stopPropagation();
            if (userRole !== 'Owner' && userRole !== 'Editor') return;
            if (!confirm(`Are you sure you want to permanently delete "${currentDocData.Name}"?`)) return;

            try {
                await deleteDoc(doc(db, "Cloud Drive", currentDocId));

                if (folderDocId) {
                    await updateDoc(doc(db, "Cloud Drive", folderDocId), {
                        Files: arrayRemove(currentDocId)
                    });
                }

                alert("File successfully deleted.");
                galleryItems.splice(currentIndex, 1);

                if (galleryItems.length === 0) {
                    if (window.history.length > 1) window.history.back();
                    else window.location.href = "1.html";
                } else {
                    if (currentIndex >= galleryItems.length) currentIndex = galleryItems.length - 1;
                    renderFilmstrip();
                    renderActiveFile();
                }
            } catch (err) {
                console.error("Delete failed:", err);
                alert("Failed to delete file.");
            }
        };

        btnShare.onclick = async (e) => {
            e.stopPropagation();
            const shareUrl = window.location.href;
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: currentDocData.Name || 'Shared Resource',
                        text: 'Access file on Perplexity Drive',
                        url: shareUrl
                    });
                } catch (err) {}
            } else {
                navigator.clipboard.writeText(shareUrl);
                alert("Link copied to clipboard!");
            }
        };

        /* Details Modal */
        document.getElementById('btnInfo').onclick = (e) => {
            e.stopPropagation();
            document.getElementById('detailName').innerText = currentDocData.Name || '-';
            document.getElementById('detailOwner').innerText = currentDocData.Email || '-';
            document.getElementById('detailRole').innerText = userRole;
            document.getElementById('detailType').innerText = currentDocData.Type || getFileExtension(currentDocData.Name);
            infoSheet.classList.add('active');
        };

        document.getElementById('btnCloseSheet').onclick = () => {
            infoSheet.classList.remove('active');
        };

        document.getElementById('btnBack').onclick = () => {
            if (window.history.length > 1) window.history.back();
            else window.location.href = '1.html';
        };

        // Tap on viewport toggles UI overlay
        document.getElementById('viewerContainer').addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                document.body.classList.toggle('ui-hidden');
                infoSheet.classList.remove('active');
            }
        });

        // Initialize Application
        init();
    </script>
</body>
</html>
