<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gallery Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0b0f;
            --surface-color: rgba(22, 22, 28, 0.85);
            --text-primary: #ffffff;
            --text-secondary: #9e9ea7;
            --accent-blue: #2f80ed;
            --danger-color: #eb5757;
            --glass-border: rgba(255, 255, 255, 0.08);
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
            transition: var(--transition-smooth);
        }

        .meta-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .file-name {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-role {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: var(--transition-smooth);
        }

        .icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        /* Main Image Stage */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 70px 10px 120px;
            overflow: hidden;
        }

        .image-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .main-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease-out;
        }

        /* Filmstrip / Thumbnail Dock */
        .bottom-dock {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 16px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            transition: var(--transition-smooth);
        }

        .dock-title {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            padding-left: 4px;
        }

        .filmstrip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding-bottom: 4px;
        }

        .filmstrip::-webkit-scrollbar {
            height: 4px;
        }

        .filmstrip::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .thumb-item {
            flex: 0 0 60px;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            transition: var(--transition-smooth);
            background: #1e1e24;
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-item.active {
            border-color: var(--accent-blue);
            transform: scale(1.05);
        }

        /* UI Overlays & Loaders */
        .loader {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-blue);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-screen {
            position: absolute;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 200;
            gap: 15px;
        }

        .error-screen i {
            font-size: 48px;
            color: var(--danger-color);
        }

        .btn-retry {
            padding: 10px 24px;
            background: #222;
            color: #fff;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header Controls -->
    <header id="topBar">
        <div class="meta-info">
            <span class="file-name" id="fileName">Loading...</span>
            <span class="file-role" id="userRole">Checking Permissions...</span>
        </div>
        <div class="action-btns">
            <button class="icon-btn" id="shareBtn" title="Share"><i class="fa-solid fa-share-nodes"></i></button>
            <button class="icon-btn" id="downloadBtn" style="display: none;" title="Download"><i class="fa-solid fa-download"></i></button>
            <button class="icon-btn" id="deleteBtn" style="display: none; color: var(--danger-color);" title="Delete"><i class="fa-regular fa-trash-can"></i></button>
        </div>
    </header>

    <!-- Main Viewer Stage -->
    <main>
        <div class="loader" id="loader"></div>
        <div class="image-container">
            <img id="activeImage" class="main-img" style="display: none;" alt="Viewer Image" />
        </div>
    </main>

    <!-- Bottom Thumbnail Dock -->
    <div class="bottom-dock" id="bottomDock">
        <div class="dock-title">More Media</div>
        <div class="filmstrip" id="filmstripContainer"></div>
    </div>

    <!-- Error Screen Prompt -->
    <div class="error-screen" id="errorOverlay" style="display: none;">
        <i class="fa-solid fa-circle-exclamation"></i>
        <h2 id="errorMessage">Access Denied</h2>
        <p id="errorSubtitle" style="color: var(--text-secondary); max-width: 320px;">You do not have access to view this file.</p>
        <button class="btn-retry" onclick="window.location.href='1.html'">Sign in with another account</button>
    </div>

    <!-- Firebase SDK Modular Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            collection, 
            getDocs, 
            deleteDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo8Uzs4XZHDHTSTfgx59w5h5NlYuGC8s0",
            authDomain: "cloud-computer-4891a.firebaseapp.com",
            projectId: "cloud-computer-4891a",
            storageBucket: "cloud-computer-4891a.firebasestorage.app",
            messagingSenderId: "744203234287",
            appId: "1:744203234287:web:81d943ae9b75fd77dce41a",
            measurementId: "G-QE17C33TMN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State Store
        let activeUser = null;
        let activeDocData = null;
        let currentDocId = window.location.hash.replace('#', '').trim();
        let galleryFiles = [];

        // 1. Authenticate user from LocalStorage
        function authenticate() {
            try {
                const userJson = localStorage.getItem('active_user');
                if (!userJson) {
                    redirectToLogin();
                    return false;
                }
                activeUser = JSON.parse(userJson);
                if (!activeUser || !activeUser.Email) {
                    redirectToLogin();
                    return false;
                }
                return true;
            } catch (err) {
                redirectToLogin();
                return false;
            }
        }

        function redirectToLogin() {
            const returnUrl = encodeURIComponent(window.location.href);
            window.location.href = `1.html?continue=${returnUrl}`;
        }

        function showFatalError(title, subtitle) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('errorMessage').innerText = title;
            document.getElementById('errorSubtitle').innerText = subtitle;
            document.getElementById('errorOverlay').style.display = 'flex';
        }

        // 2. Fetch Active Document
        async function fetchDocument(docId) {
            if (!docId) {
                showFatalError("No Document Specified", "Please provide a valid document hash in the URL (#docId).");
                return;
            }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('activeImage').style.display = 'none';

            try {
                const docRef = doc(db, "Cloud Drive", docId);
                const snapshot = await getDoc(docRef);

                if (!snapshot.exists()) {
                    showFatalError("File Not Found", "The requested image does not exist or has been deleted.");
                    return;
                }

                activeDocData = snapshot.data();
                evaluatePermissionAndRender(docId);
            } catch (e) {
                console.error("Firestore read error:", e);
                showFatalError("Database Error", e.message);
            }
        }

        // 3. Evaluate Access Permissions
        function evaluatePermissionAndRender(docId) {
            const userEmail = (activeUser.Email || "").toLowerCase().trim();
            const ownerEmail = (activeDocData.Email || "").toLowerCase().trim();
            const accessObj = activeDocData.Access || {};
            
            // Extract Viewer and Editor entries safely
            const viewers = (accessObj.Viewer || []).map(e => e.toLowerCase().trim());
            const editors = (accessObj.Editor || []).map(e => e.toLowerCase().trim());

            const isOwner = userEmail === ownerEmail;
            const isEditor = editors.includes(userEmail);
            const isViewer = viewers.includes(userEmail);

            // Deny if not permitted
            if (!isOwner && !isEditor && !isViewer) {
                showFatalError("Access Denied", `Account (${userEmail}) does not have permission to view this file.`);
                return;
            }

            // Determine Role Level
            let roleLabel = "Viewer";
            const canModifyOrDownload = isOwner || isEditor;

            if (isOwner) roleLabel = "Owner";
            else if (isEditor) roleLabel = "Editor";

            // Update UI Elements
            document.getElementById('fileName').innerText = activeDocData.Name || "Untitled Image";
            document.getElementById('userRole').innerText = roleLabel;

            const downloadBtn = document.getElementById('downloadBtn');
            const deleteBtn = document.getElementById('deleteBtn');

            downloadBtn.style.display = canModifyOrDownload ? "flex" : "none";
            deleteBtn.style.display = isOwner ? "flex" : "none"; // Only Owner can delete

            // Load Main Image
            const imgElement = document.getElementById('activeImage');
            imgElement.src = activeDocData.File;
            imgElement.onload = () => {
                document.getElementById('loader').style.display = 'none';
                imgElement.style.display = 'block';
            };

            // Load Gallery Strip items
            fetchGalleryFiles(ownerEmail, docId);
        }

        // 4. Fetch All Associated Images for the Bottom Dock
        async function fetchGalleryFiles(ownerEmail, currentId) {
            try {
                const querySnapshot = await getDocs(collection(db, "Cloud Drive"));
                const filmstrip = document.getElementById('filmstripContainer');
                filmstrip.innerHTML = '';
                galleryFiles = [];

                querySnapshot.forEach((docItem) => {
                    const data = docItem.data();
                    const docId = docItem.id;
                    const docOwner = (data.Email || "").toLowerCase().trim();
                    const accessObj = data.Access || {};
                    const viewers = (accessObj.Viewer || []).map(e => e.toLowerCase().trim());
                    const editors = (accessObj.Editor || []).map(e => e.toLowerCase().trim());
                    const userEmail = activeUser.Email.toLowerCase().trim();

                    // Show image if it belongs to same folder/owner and current user has rights
                    if ((docOwner === ownerEmail || docOwner === userEmail) && 
                        (docOwner === userEmail || editors.includes(userEmail) || viewers.includes(userEmail))) {
                        
                        galleryFiles.push({ id: docId, ...data });

                        const thumb = document.createElement('div');
                        thumb.className = `thumb-item ${docId === currentId ? 'active' : ''}`;
                        thumb.innerHTML = `<img src="${data.File}" alt="${data.Name || 'thumb'}" loading="lazy"/>`;
                        
                        thumb.onclick = () => {
                            if (window.location.hash !== `#${docId}`) {
                                window.location.hash = `#${docId}`;
                            }
                        };
                        filmstrip.appendChild(thumb);
                    }
                });

                if (galleryFiles.length <= 1) {
                    document.getElementById('bottomDock').style.display = 'none';
                } else {
                    document.getElementById('bottomDock').style.display = 'flex';
                }
            } catch (err) {
                console.error("Filmstrip load error:", err);
            }
        }

        // 5. Action Handlers: Download, Share, Delete
        document.getElementById('downloadBtn').addEventListener('click', async () => {
            if (!activeDocData || !activeDocData.File) return;
            try {
                const response = await fetch(activeDocData.File);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = activeDocData.Name || `image-${Date.now()}`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                // Fallback for CORS blocks
                window.open(activeDocData.File, '_blank');
            }
        });

        document.getElementById('shareBtn').addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: activeDocData?.Name || 'Gallery File',
                        url: window.location.href
                    });
                } catch (err) {
                    console.log('Share dismissed');
                }
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Link copied to clipboard!");
            }
        });

        document.getElementById('deleteBtn').addEventListener('click', async () => {
            const confirmDelete = confirm(`Are you sure you want to delete "${activeDocData.Name}"?`);
            if (confirmDelete && currentDocId) {
                try {
                    await deleteDoc(doc(db, "Cloud Drive", currentDocId));
                    alert("Image deleted successfully.");
                    // Redirect to remaining file or reload
                    const remaining = galleryFiles.filter(f => f.id !== currentDocId);
                    if (remaining.length > 0) {
                        window.location.hash = `#${remaining[0].id}`;
                    } else {
                        window.location.reload();
                    }
                } catch (err) {
                    alert("Failed to delete file: " + err.message);
                }
            }
        });

        // 6. Handle Hash Routing Changes
        window.addEventListener('hashchange', () => {
            currentDocId = window.location.hash.replace('#', '').trim();
            fetchDocument(currentDocId);
        });

        // Init
        if (authenticate()) {
            fetchDocument(currentDocId);
        }
    </script>
</body>
</html>
